# The critics' record for each Spine Topic (spec 2026-11-12 C8, ADR 0004): a Spine Topic ships only when the course
# check and the critics pass. The course check (scripts/check-course.mjs, src/course/critics-log.ts) fails a written
# Spine Topic with no entry here, an entry missing one of the four lenses, or one with confirmed findings still open.
#
# After a critic round: add the round, name the commit that fixed its confirmed findings (quoted: YAML reads an id of
# only digits as a number), and set open to the number of confirmed findings not fixed yet (0 to ship). The findings
# themselves were in the build's branch reports, which the last commit of pull request 616 removed with the
# rest of the handoff folder; they stay in that pull request's history.
# The rubrics are this folder's beginner-persona.md, math-police.md, historian.md and widget-fit.md.
