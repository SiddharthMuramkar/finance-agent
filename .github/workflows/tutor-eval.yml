name: Tutor eval

# The live Tutor tests T1 to T11 (src/behaviour/tutor-eval, npm run tutor:eval), on the real model, capped at
# TUTOR_EVAL_BUDGET_USD (default $5) a run. Not a required check: a noisy model run never blocks a merge, and
# its job name is not in the ruleset on main. It runs only on PRs that change what the Tutor is told.
#
# The repo is public. This workflow uses `pull_request` only, never `pull_request_target` or `workflow_run`, so a
# PR from a fork gets no secret. Without the OPENAI_API_KEY secret the `tutor-eval` job is skipped (grey, not green), and
# `tutor-eval key` says "skipped: no OPENAI_API_KEY" in a notice and in the run's summary. That is intended.
on:
  pull_request:
    paths:
      # The Tutor's instructions, tools and context (the Course Navigator's lines and the step text).
      - src/tutor/instructions.ts
      - src/tutor/tools.ts
      - src/tutor/context.ts
      # The quiz follow-up note and its prefix.
      - src/tutor/check-results.ts
      - src/tutor/turn-status.ts
      # The help chips.
      - src/tutor/chips.ts
      # The Tutor Turn: what it sends, the facts and place it reads, and the Session items it saves.
      - src/tutor/next.ts
      - src/tutor/turn.ts
      - src/tutor/turn-facts.ts
      # The model client: the loop, the request it builds and the transcript it translates.
      - src/tutor/runner.ts
      - src/tutor/model.ts
      - src/tutor/openai.ts
      - src/tutor/openai-items.ts
      - src/tutor/cite-markers.ts
      - src/tutor/coming-back.ts
      - src/tutor/session-items.ts
      # The reply checks every reply must pass.
      - src/tutor/reply-checks.ts
      # The Topic files.
      - course/topics/**
      # The suite itself.
      - src/behaviour/tutor-eval/**
      - vitest.tutor-eval.config.ts
      - .github/workflows/tutor-eval.yml

# Its own group, never cancelled: a paid run that has started always finishes and reports, even after a new push.
concurrency:
  group: tutor-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Is the key here? A job's `if` cannot read secrets, so this job looks and tells the next one.
  key:
    name: tutor-eval key
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      present: ${{ steps.key.outputs.present }}
    steps:
      - id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is set: the live Tutor tests run in the job tutor-eval."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tutor eval skipped::skipped: no OPENAI_API_KEY (a PR from a fork, or the secret is not set). The live Tutor tests did not run."
            {
              echo "### Tutor eval: skipped: no OPENAI_API_KEY"
              echo "The live Tutor tests did not run: this is a PR from a fork, or the repository secret OPENAI_API_KEY is not set."
              echo "The job tutor-eval shows as skipped. Nothing was tested, so this is not a pass."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  tutor-eval:
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The summary is posted as a PR comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the live Tutor tests
        id: eval
        # Only this step gets the key, so no install script from a package can read it.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # npm run tutor:eval reads .env, as on the laptop; here it is empty and the key comes from the secret.
        run: |
          touch .env
          npm run tutor:eval
      - name: Job summary
        if: always()
        run: |
          if [ -f evidence/tutor-eval/summary.md ]; then cat evidence/tutor-eval/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "The live Tutor tests wrote no report: see the run's log." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: PR comment
        if: always() && hashFiles('evidence/tutor-eval/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file evidence/tutor-eval/summary.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tutor-eval
          path: evidence/tutor-eval/
          if-no-files-found: ignore
