name: CI

# The three job names, "check", "build" and "ui", are the required status checks in the ruleset on main.
# Renaming any of them blocks every merge until the ruleset is changed to match.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR or branch cancels the older run. Runs on main are never
# cancelled, so every merge gets its own full result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# No secrets anywhere: tests use PGlite and a scripted model client, and the build reads no env.
jobs:
  check:
    runs-on: ubuntu-latest
    # 25, not 15: on main the job takes 11.8 to 14.3 minutes depending on the runner, and PR #615 was cut off at 15
    # twice with 382 of 396 test files passed and none failed. A passing run is no slower; a hung one is stopped 10 minutes later.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser test bed (PGlite, the scripted Tutor) must never reach a production build.
      - run: node scripts/check-no-e2e-in-build.mjs

  # The browser test bed (spec 2026-11-05, T-00): the whole app in Chromium on an in-memory PGlite with a scripted
  # Tutor. The shards report through the "ui" job below, which is a required check in the ruleset.
  # One run took 10-12 min (#458), so it is split into 6 shards on 6 runners. Each shard starts its own test server
  # and PGlite and still runs its tests one at a time (workers: 1). Playwright splits by test file per project, in
  # config order, and balances by test count, not time. mbp14 comes first and skips almost nothing, so equal shards
  # gave shard 1 about 6 min and the rest about 2.5 (PR #462's first run). PWTEST_SHARD_WEIGHTS (Playwright 1.64's
  # shard weights, read from the env) gives the first shards fewer tests. Tuned on PR #462's second run, each shard
  # holds 2.7 to 3.1 min of tests. Wrong weights only unbalance the shards; every test still runs in exactly one
  # shard. The number of weights must equal the number of shards (Playwright fails loudly otherwise).
  ui-shard:
    name: ui shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      PWTEST_SHARD_WEIGHTS: "2:3:5:5:5:5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No browser cache: Playwright's own guidance is that restoring it takes about as long as downloading.
      # No --with-deps: the runner image already has every library Chromium needs, and the only packages it added were
      # nine extra font packages (CJK, Thai, unifont) fetched from Ubuntu's apt mirror, which ran at 16-37 kB/s on
      # PR #462 and held two shards for 10+ minutes. A missing library makes Chromium fail to start, loudly.
      - run: npx playwright install chromium
      - run: npm run ui:test -- --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The one check named "ui" (the orchestrator, the docs and the ruleset use this name). Green only when every
  # shard passed; it runs even when a shard failed or was cancelled, so a red shard turns it red instead of skipping it.
  ui:
    needs: ui-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.ui-shard.result }}
        run: |
          echo "ui shards: $SHARDS"
          test "$SHARDS" = success
