name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # No secrets: tests use PGlite and a scripted Anthropic client, never live services.
      - run: npm ci
      - run: npm run check
