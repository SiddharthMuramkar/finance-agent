  - id: fr-follow-argument
    kind: conversation
    prompt: >
      You have read Damodaran's "Return on Equity, Earnings Yield and Market Efficiency: Back to
      Basics!" as it stood on 18 February 2025. Explain, in your own words and in order, each step of
      his argument: why he went back to basics, how he sets up the two businesses and what return on
      equity and excess return say about them, what happens when they are priced, and the questions
      he then uses the example to answer. Then say which of his points you find strongest and which
      you would want more evidence for.
    passCriteria: >
      The Learner explains why he wrote it (a reaction to readers confusing return on equity with
      the cost of equity in an efficient market, including a thread about the Indian market) and sets
      out the example: two businesses with the same investment and risk but different net income,
      return on equity of 25% and 5% against a 10% cost of equity, so excess returns of +15 and -5
      points. They explain that return on equity is an accounting measure of business quality, and
      that the narrative behind each number (barriers to entry for A; competition or regulation
      for B) should be made explicit. They explain the pricing step: values of $150 million and $30
      million, price to book of 2.5 and 0.5, and that the earnings yield (earnings divided by market
      value) is a different ratio that equals the cost of equity here because there is no growth.
      They cover the questions he extends to: a good company versus a good investment (depends on
      price versus fair value), why return on equity is the weaker half of excess return (R&D
      expensing, aging assets and inflation, fair value accounting making every return equal the
      cost of equity), what growth does to reading both ratios, and why bad businesses struggle to
      fix or exit. They state his closing point about how these basics are taught. Where they judge
      a point, they give a reason and separate what the post shows from what it leaves out. They do
      not claim to know what the author wrote or what happened after 18 February 2025.
