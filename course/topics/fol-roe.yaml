# Follow Topic: Damodaran's "Return on Equity, Earnings Yield and Market Efficiency: Back to Basics!" (18 Feb 2025),
# a dated piece taught as a Case. The post's text is in the Library (Damodaran's blog); the Tutor quotes it
# only in short passages with credit.
id: fol-roe
title: "Follow: Damodaran, ROE, earnings yield and efficiency (Feb 2025)"
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: fol-roe-back-to-basics
    title: Damodaran goes back to basics on return on equity
    asOf: 2025-02-18
    piece:
      author: Aswath Damodaran
      title: "Return on Equity, Earnings Yield and Market Efficiency: Back to Basics!"
      published: 2025-02-18
      url: https://aswathdamodaran.blogspot.com/2025/02/return-on-equity-earnings-yield-and.html
      from: library
      librarySource: Damodaran
    story: >
      On 18 February 2025 Aswath Damodaran, a valuation professor at NYU Stern, published a blog post
      that he said began as a detour from his annual data updates. Readers had reacted to his update
      on the profitability of businesses, where he set each sector's accounting return on equity
      against its cost of equity to measure excess returns. Separately, he had commented on a
      LinkedIn post that applied his implied equity risk premium method to the Indian market and had
      stalled on an assumption that, in an efficient market, return on equity must equal the cost
      of equity. He found the replies showed deep confusion about what return on equity measures and
      what an efficient market is, so he went back to basics with a stripped-down example: two
      entrepreneurs each put $60 million into a new business, one expected to earn $15 million a
      year for ever and the other $3 million a year for ever, both with the same business risk and a
      10% cost of equity. He then lists ways the accounting return on equity can mislead, and why
      the earnings to price ratio is a different number. The Learner reads the post in full,
      without stopping, and then explains each step of its argument.
    reveal: >
      Damodaran came back to the same ground in a post on 6 October 2025, written about US stocks.
      He reported that the earnings yield (earnings divided by price) was 4% in September 2025,
      0.16 percentage points below the ten-year Treasury bond rate, a gap that some analysts treat as
      a signal that stocks are overpriced. His reply was the post's lesson applied: comparing the
      earnings yield to the bond rate treats shares as if they were bonds and ignores growth and the
      reinvestment growth needs, and he noted that the gap had a spotty record as a timing tool
      (Damodaran, Musings on Markets, 6 October 2025). What the February post settled is a
      definition, not a forecast: return on equity divides profit by the book value of equity and
      measures the quality of a business; the earnings yield divides profit by the market value of
      equity and is a pricing ratio. In the toy example the two companies earn 25% and 5% on book
      but the same 10% on price, so no price-based ratio could have told the good business from the
      bad one. Whether either ratio says anything useful about a whole market remained an argument
      about growth, which the post set aside on purpose.

concept: >
  Return on equity is an accounting measure of business quality: net income divided by the book
  value of equity, which is mostly what was paid in. The earnings yield is a pricing measure: net
  income divided by the market value of equity. The two are different numbers. A good business
  (return on equity above its cost of equity) earns an excess return and trades above book value;
  a poor one earns less than its cost of equity and trades below book. If a market prices both
  fairly, an investor in either earns the cost of equity on what they pay. So a good company is
  not automatically a good investment, and a low price to book ratio does not by itself mean a
  bargain. With no growth and a forever life, the fair earnings yield equals the cost of equity;
  once growth enters, it no longer does. Return on equity is also the weaker half of an excess
  return calculation, because accounting can skew it: expensed research spending, aging assets and
  inflation, and negative book equity all distort it.

principle: >
  Before comparing two ratios, check what each is measured on: book value (what was invested) or
  market value (what it is priced at). Then ask what the comparison leaves out, such as growth,
  reinvestment and accounting treatment, before treating the gap as a signal.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Tell return on equity, a book measure, from the earnings yield, a market measure."
  - "See why a good company is not automatically a good investment."
  - "Ask what growth, reinvestment and accounting leave out of a ratio comparison."

questions:
  - id: fr-q-roe-excess
    prompt: >
      Damodaran's post gives a quick test of a business: set what it earns on its book equity against what investors could expect elsewhere at the same risk. Picture a company earning 15% when investors expect 12%. What does the gap, its "excess return", tell you about it?
    choices:
      - { id: a, text: "It earns more on its book equity than investors could expect elsewhere, so the business looks like a good one" }
      - { id: b, text: "It earns less than investors expect, so it is destroying value", mistake: { tag: gap_sign, fix: "The company's 15% is above the 12%, so the gap is in its favour." } }
      - { id: c, text: "It earns just what investors expect, so its excess return is zero", mistake: { tag: ignored_gap, fix: "The 15% is above the 12%, so the excess return is not zero." } }
      - { id: d, text: "Its excess return is the whole of its return on equity", mistake: { tag: excess_is_roe, fix: "Excess return is what is left after taking off what investors expect." } }
    answer: a
    explanation: >
      Excess return is what the business earns on its book equity above what investors expect from other investments of the same risk. Here it earns more than they expect, so the gap is in its favour.
    source: >
      Arithmetic on the definitions in Damodaran, "Return on Equity, Earnings Yield and Market
      Efficiency: Back to Basics!", Musings on Markets, 18 February 2025.
  - id: fr-q-fair-value
    prompt: >
      Picture a good business, frozen in time: the same profit every year for ever, no growth, and more than its investors require on the money put into it (its book equity). If the market prices it fairly, where does its price sit against its book value?
    choices:
      - { id: a, text: "Above book value, because the business earns more than investors require on the money put in" }
      - { id: b, text: "Equal to book value, because a fair price is always the money put in", mistake: { tag: price_equals_book, fix: "A fair price depends on what the business earns, not only on what was put in." } }
      - { id: c, text: "Below book value, because a business with no growth is worth less than was put in", mistake: { tag: no_growth_discount, fix: "Earning above the required return makes it worth more than was put in, growth or not." } }
      - { id: d, text: "Far below book value, because one year's income is small", mistake: { tag: one_year_only, fix: "The income repeats for ever, so the value counts many years of it." } }
    answer: a
    explanation: >
      A business that earns more than investors require is worth more than the capital put in, so a fair price sits above book value. With steady income for ever, the price comes from what that income is worth to investors, not from the money invested.
    source: >
      Perpetuity value = income / required return, as applied in Damodaran, "Return on Equity,
      Earnings Yield and Market Efficiency: Back to Basics!", 18 February 2025.
  - id: fr-q-yield
    prompt: >
      Damodaran complains that people use "return on equity" and "earnings yield" as if they were one number. A company's shares trade for far more than the equity on its books, and a commentator quotes its earnings yield. What should the headline say that figure measures?
    choices:
      - { id: a, text: "\"Net income set against book equity\"", mistake: { tag: roe_for_yield, fix: "That is return on equity, which uses book value. Earnings yield uses market value." } }
      - { id: b, text: "\"Net income set against what the market values the equity at\"" }
      - { id: c, text: "\"Net income set against the average of book and market values\"", mistake: { tag: averaged_values, fix: "Earnings yield uses market value alone, not an average of book and market." } }
      - { id: d, text: "\"The gap between market value and book value\"", mistake: { tag: wrong_base, fix: "Earnings yield compares income with price. The gap between book and market is a different matter." } }
    answer: b
    explanation: >
      Earnings yield sets net income against the market value of equity, the price. Return on equity sets it against book equity. People who use the two names for one number are mixing book and market value; when the price is far above book, the two figures are far apart.
    source: >
      Definitions in Damodaran, "Return on Equity, Earnings Yield and Market Efficiency: Back to
      Basics!", 18 February 2025 (earnings to price ratio, return on equity).
  - id: fr-q-research
    prompt: >
      Damodaran tells of a business that spends half its start-up money on research and development (R&D), which accountants expense at once, and half on assets that stay on its books as equity. From then on it earns steady profit. How does its reported return on equity compare with what the owners really earn on everything they put in?
    choices:
      - { id: a, text: "The two look the same, because accounting does not change what a business earns", mistake: { tag: accounting_neutral, fix: "Accounting decides what counts as equity, so it changes the ratio." } }
      - { id: b, text: "The reported return looks much higher, because the expensed research never reached book equity" }
      - { id: c, text: "The reported return looks lower, because expensing research is a cost to income", mistake: { tag: expense_lowers, fix: "The expense hit year one only. Later income is unaffected and book equity is smaller." } }
      - { id: d, text: "The reported return is wrong only by a rounding error", mistake: { tag: rounding_only, fix: "Half the money invested is missing from book equity. That is a large gap, not a rounding." } }
    answer: b
    explanation: >
      Expensing the R&D leaves it out of book equity, so the reported return divides profit by a smaller base than the owners actually paid in. The accounting return overstates what the owners earn on what they put in.
    source: >
      Arithmetic on the accounting-inconsistency example in Damodaran, "Return on Equity, Earnings
      Yield and Market Efficiency: Back to Basics!", 18 February 2025.
  - id: fr-q-mark-to-market
    prompt: >
      Damodaran asks what would happen if accountants marked every company's books to market value. Take a company with steady income for ever whose old book equity is higher than the business is now worth, so its return on equity looks poor. Once restated, its book equity is simply the value of the business. What becomes of its return on equity?
    choices:
      - { id: a, text: "It stays where it was", mistake: { tag: old_book_value, fix: "Book equity changes to the new value, so the return on equity changes too." } }
      - { id: b, text: "It moves to the cost of equity, so it no longer separates good businesses from bad ones" }
      - { id: c, text: "It rises well above the cost of equity, since the restated value is higher", mistake: { tag: market_above, fix: "Market value is what the income is worth at the cost of equity, so the two meet." } }
      - { id: d, text: "It falls, because restating always lowers the return", mistake: { tag: restate_lowers, fix: "Here book equity falls to the true value, so the same income gives a higher return." } }
    answer: b
    explanation: >
      Value is what the income is worth to investors at their required return. Once book equity is restated to that value, income against book equity equals the required return. If every firm is marked to market, every firm's return on equity equals its cost of equity, which stops it separating good businesses from bad ones.
    source: >
      Arithmetic on the fair value accounting example in Damodaran, "Return on Equity, Earnings
      Yield and Market Efficiency: Back to Basics!", 18 February 2025.
checks:
  - id: fr-quiz-roe-yield
    kind: quiz
    questions:
      - fr-q-roe-excess
      - fr-q-fair-value
      - fr-q-yield
      - fr-q-research
