# Follow Topic: Damodaran's "Return on Equity, Earnings Yield and Market Efficiency: Back to Basics!" (18 Feb 2025),
# a dated piece taught as a Case. The post's text is in the Library (Damodaran's blog); the Tutor quotes it
# only in short passages with credit.
id: fol-roe
title: "Follow: Damodaran, ROE, earnings yield and efficiency (Feb 2025)"
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: fol-roe-back-to-basics
    title: Damodaran goes back to basics on return on equity
    asOf: 2025-02-18
    piece:
      author: Aswath Damodaran
      title: "Return on Equity, Earnings Yield and Market Efficiency: Back to Basics!"
      published: 2025-02-18
      url: https://aswathdamodaran.blogspot.com/2025/02/return-on-equity-earnings-yield-and.html
      from: library
      librarySource: Damodaran
    story: >
      On 18 February 2025 Aswath Damodaran, a valuation professor at NYU Stern, published a blog post
      that he said began as a detour from his annual data updates. Readers had reacted to his update
      on the profitability of businesses, where he set each sector's accounting return on equity
      against its cost of equity to measure excess returns. Separately, he had commented on a
      LinkedIn post that applied his implied equity risk premium method to the Indian market and had
      stalled on an assumption that, in an efficient market, return on equity must equal the cost
      of equity. He found the replies showed deep confusion about what return on equity measures and
      what an efficient market is, so he went back to basics with a stripped-down example: two
      entrepreneurs each put $60 million into a new business, one expected to earn $15 million a
      year for ever and the other $3 million a year for ever, both with the same business risk and a
      10% cost of equity. He then lists ways the accounting return on equity can mislead, and why
      the earnings to price ratio is a different number. The Learner reads the post in full,
      without stopping, and then explains each step of its argument.
    reveal: >
      Damodaran came back to the same ground in a post on 6 October 2025, written about US stocks.
      He reported that the earnings yield (earnings divided by price) was 4% in September 2025,
      0.16 percentage points below the ten-year Treasury bond rate, a gap that some analysts treat as
      a signal that stocks are overpriced. His reply was the post's lesson applied: comparing the
      earnings yield to the bond rate treats shares as if they were bonds and ignores growth and the
      reinvestment growth needs, and he noted that the gap had a spotty record as a timing tool
      (Damodaran, Musings on Markets, 6 October 2025). What the February post settled is a
      definition, not a forecast: return on equity divides profit by the book value of equity and
      measures the quality of a business; the earnings yield divides profit by the market value of
      equity and is a pricing ratio. In the toy example the two companies earn 25% and 5% on book
      but the same 10% on price, so no price-based ratio could have told the good business from the
      bad one. Whether either ratio says anything useful about a whole market remained an argument
      about growth, which the post set aside on purpose.

concept: >
  Return on equity is an accounting measure of business quality: net income divided by the book
  value of equity, which is mostly what was paid in. The earnings yield is a pricing measure: net
  income divided by the market value of equity. The two are different numbers. A good business
  (return on equity above its cost of equity) earns an excess return and trades above book value;
  a poor one earns less than its cost of equity and trades below book. If a market prices both
  fairly, an investor in either earns the cost of equity on what they pay. So a good company is
  not automatically a good investment, and a low price to book ratio does not by itself mean a
  bargain. With no growth and a forever life, the fair earnings yield equals the cost of equity;
  once growth enters, it no longer does. Return on equity is also the weaker half of an excess
  return calculation, because accounting can skew it: expensed research spending, aging assets and
  inflation, and negative book equity all distort it.

principle: >
  Before comparing two ratios, check what each is measured on: book value (what was invested) or
  market value (what it is priced at). Then ask what the comparison leaves out, such as growth,
  reinvestment and accounting treatment, before treating the gap as a signal.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Tell return on equity, a book measure, from the earnings yield, a market measure."
  - "See why a good company is not automatically a good investment."
  - "Ask what growth, reinvestment and accounting leave out of a ratio comparison."

questions:
  - id: fr-q-roe-excess
    prompt: >
      18 February 2025: Damodaran grades a business by its "excess return", what it earns on book equity beyond what investors expect. Your uncle's firm earns 15% when investors expect 12%. What's the verdict?
    choices:
      - { id: a, text: "A good business: it beats what investors could get elsewhere" }
      - { id: b, text: "A value destroyer: it falls short of what investors expect", mistake: { tag: gap_sign, fix: "The firm's 15% is above the 12% investors expect, so the gap runs in its favour." } }
      - { id: c, text: "Just average: its excess return is zero", mistake: { tag: ignored_gap, fix: "Zero would mean it earns exactly what investors expect. It earns more." } }
      - { id: d, text: "Its excess return is the whole 15%", mistake: { tag: excess_is_roe, fix: "Excess return is only what is left once investors' expected return is taken off." } }
    answer: a
    explanation: >
      Excess return is what a business earns on its book equity above what investors expect from other investments of the same risk. Your uncle's firm earns more than that, so the gap is in its favour: on this test it is a good business.
    source: >
      Arithmetic on the definitions in Damodaran, "Return on Equity, Earnings Yield and Market
      Efficiency: Back to Basics!", Musings on Markets, 18 February 2025.
  - id: fr-q-fair-value
    prompt: >
      Damodaran's February 2025 toy firm earns the same profit every year for ever, more than investors require on the money put in (its book equity). Your cousin asks: priced fairly, where does it trade?
    choices:
      - { id: a, text: "Above book value: it earns more than investors require on that money" }
      - { id: b, text: "Exactly at book value: a fair price is the money put in", mistake: { tag: price_equals_book, fix: "A fair price follows what the business earns, not only what was put in." } }
      - { id: c, text: "Below book value: a business with no growth is worth less", mistake: { tag: no_growth_discount, fix: "Earning above the required return makes it worth more than was put in, growth or not." } }
      - { id: d, text: "Far below book value: one year's profit is small", mistake: { tag: one_year_only, fix: "The profit repeats every year for ever, so the price counts all those years." } }
    answer: a
    explanation: >
      A business that earns more than investors require is worth more than the capital put in, so a fair price sits above book value. With steady profit for ever, the price comes from what that profit is worth to investors, not from the money invested.
    source: >
      Perpetuity value = income / required return, as applied in Damodaran, "Return on Equity,
      Earnings Yield and Market Efficiency: Back to Basics!", 18 February 2025.
  - id: fr-q-yield
    prompt: >
      At dinner in February 2025, your aunt calls a share's "earnings yield" its return on equity. Damodaran's post says those are two different numbers. What does the earnings yield set profit against?
    choices:
      - { id: a, text: "The equity on the company's books", mistake: { tag: roe_for_yield, fix: "That is return on equity, which uses book value. Earnings yield uses the market price." } }
      - { id: b, text: "What the market prices the company's shares at" }
      - { id: c, text: "An average of book value and market price", mistake: { tag: averaged_values, fix: "Earnings yield uses the market price alone, not a blend with book value." } }
      - { id: d, text: "The gap between market price and book value", mistake: { tag: wrong_base, fix: "Earnings yield compares profit with price. The gap between price and book is another idea." } }
    answer: b
    explanation: >
      Earnings yield sets profit against the market value of the equity, its price. Return on equity sets it against book equity, what was paid in. Your aunt is mixing book and market value; when the price is far above book, the two figures are far apart.
    source: >
      Definitions in Damodaran, "Return on Equity, Earnings Yield and Market Efficiency: Back to
      Basics!", 18 February 2025 (earnings to price ratio, return on equity).
  - id: fr-q-research
    prompt: >
      Damodaran's February 2025 warning: accountants expense research spending at once, so it never reaches book equity. Your friend's start-up puts half its money into research. Which headline about its return on equity is right?
    choices:
      - { id: a, text: "\"Return on equity spot on: accounting can't change what a firm earns\"", mistake: { tag: accounting_neutral, fix: "Accounting decides what counts as equity, so it changes the ratio." } }
      - { id: b, text: "\"Return on equity flatters it: the research never reached the books\"" }
      - { id: c, text: "\"Return on equity looks too low: research is a cost\"", mistake: { tag: expense_lowers, fix: "The research cost hit year one only. Later profit is untouched, and book equity is smaller." } }
      - { id: d, text: "\"Return on equity off by a rounding error, nothing more\"", mistake: { tag: rounding_only, fix: "Half the money put in is missing from book equity. That is a big gap, not rounding." } }
    answer: b
    explanation: >
      Expensing the research leaves it out of book equity, so the reported return divides profit by a smaller base than the owners actually paid in. The accounting return overstates what the owners earn on what they put in.
    source: >
      Arithmetic on the accounting-inconsistency example in Damodaran, "Return on Equity, Earnings
      Yield and Market Efficiency: Back to Basics!", 18 February 2025.
  - id: fr-q-mark-to-market
    prompt: >
      In February 2025 Damodaran imagines every company's books "marked to market": restated each year at what the business is now worth. Your uncle ranks firms by return on equity. What happens to his ranking?
    choices:
      - { id: a, text: "Nothing: restating the books leaves return on equity alone", mistake: { tag: old_book_value, fix: "Book equity changes to the new value, so return on equity changes too." } }
      - { id: b, text: "It stops working: every firm's return on equity becomes its cost of equity" }
      - { id: c, text: "Good firms pull further ahead, since their restated equity is bigger", mistake: { tag: market_above, fix: "Bigger equity under the same profit lowers the return. Every firm lands on its cost of equity." } }
      - { id: d, text: "Every firm's return on equity falls to zero", mistake: { tag: restate_to_zero, fix: "The profit is still there. Set against fair value, it gives the cost of equity, not zero." } }
    answer: b
    explanation: >
      A business's value is what its profit is worth to investors at their required return. Restate book equity to that value and profit against book equity equals the required return. If every firm is marked to market, every firm's return on equity equals its cost of equity, so it no longer separates good businesses from bad ones.
    source: >
      Arithmetic on the fair value accounting example in Damodaran, "Return on Equity, Earnings
      Yield and Market Efficiency: Back to Basics!", 18 February 2025.
