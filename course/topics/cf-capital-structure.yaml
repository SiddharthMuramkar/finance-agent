# Capital structure and Modigliani-Miller: a foundation Topic taught through the Coffee Day group's debt.
# Case sources (checked): Hindustan Times/Bloomberg 31 Jul 2019; Business Today 31 Jul 2019 and 17 Aug 2019.
id: cf-capital-structure
title: Capital structure and Modigliani-Miller

cases:
  - id: coffee-day-leverage-2019
    title: The Coffee Day group's debt
    asOf: 2019-07-26
    story: >
      Coffee Day Enterprises runs the Cafe Coffee Day chain, with about 1,700 outlets, and belongs
      to a group founded by V.G. Siddhartha that also holds a logistics company, Sical Logistics,
      and property. It listed on the stock exchanges in 2015, selling shares at Rs 328 each. By late
      July 2019 the founder's family and companies (the promoter group) held 53.93% of Coffee Day
      Enterprises, and exchange filings for June 2019 showed that about 76% of those shares had
      been pledged as security for loans. Bloomberg data showed Coffee Day's loans at Rs 6,550
      crore at the end of March 2019, 29% more than a year earlier, and Sical's debt at Rs 1,100
      crore. The group had been selling assets to repay lenders: in April 2019 it sold a 20% stake in
      the software firm Mindtree to Larsen and Toubro. The company's market value had peaked at Rs
      6,678 crore on 19 September 2018. What does it mean for shareholders and lenders that the
      promoters' shares are pledged? What would Modigliani and Miller say about the mix of debt
      and equity, and what real-world costs of debt do they leave out?
    reveal: >
      The founder wrote a letter dated 27 July 2019 to the board saying he could not take any more
      pressure from one of the company's private equity partners to buy back shares, and referring
      to pressure from lenders and a serious liquidity crunch. He was found dead on 31 July 2019. The
      shares fell by the 20% limit on two successive days. On 17 August the company disclosed that
      the group's debt on 31 July was Rs 4,970 crore, of which Rs 4,796 crore was secured, with Rs
      1,622 crore in the property subsidiary Tanglin Developments, Rs 1,488 crore in Sical and Rs
      1,097 crore in Coffee Day Global, which runs the cafes. It said the sale of the Global Village
      Tech Park in Bengaluru to Blackstone would reduce the debt by about Rs 2,400 crore. The
      promoters' stake fell from 54% in July 2019 to 17% by January 2020 as lenders enforced pledges.
      Borrowing against shares had put the founder's ownership, not only the business's assets,
      at risk.

concept: >
  Capital structure is the mix of debt and equity a firm uses. Modigliani and Miller showed that in
  a perfect market, with no taxes, bankruptcy costs or information gaps, the value of a firm is set
  by its operating cash flows and risk, not by how they are split between lenders and shareholders.
  More debt makes equity riskier, so the cost of equity rises exactly enough to leave the weighted
  average cost of capital unchanged: re = ru + (ru - rd) x D/E. In the real world interest is
  tax-deductible, which makes debt cheaper, but a heavy debt load raises the chance and cost of
  financial distress: lost customers and suppliers, forced asset sales, and conflicts between
  lenders and shareholders. The trade-off theory says a firm should borrow until the extra tax
  benefit equals the extra expected distress cost. Pledging shares as collateral adds another
  risk: if the share price falls, lenders can ask for more security or sell the shares, and the
  borrower can lose control at the worst moment. Measures such as interest cover (EBIT divided by
  interest) and debt to EBITDA show how much room a firm has.

principle: >
  Debt does not create value in itself. It shifts risk to shareholders and adds tax savings that
  must be weighed against the cost of being unable to pay. Ask what happens to the firm, and to its
  owners, in a bad year.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "See why, in a perfect market, the split between debt and equity leaves a firm's value unchanged."
  - "Weigh the tax saving on debt against the cost of being unable to pay."
  - "Ask what heavy debt or pledged shares do to a firm and its owners in a bad year."

# Claude-written quiz questions; each answer was checked against the cited source (see docs/architecture.md).
questions:
  - id: cs-q-tax-shield
    prompt: >
      A firm borrows for good and pays interest every year. Interest is taken off profit before tax, and tax is 25%. Which headline about the tax saving gets it right?
    choices:
      - { id: a, text: "The tax saving is a quarter of the interest paid, a gain for owners that grows as the firm borrows more" }
      - id: b
        text: "The tax saving is all of the interest paid, so debt is free"
        mistake: { tag: debt_is_free, fix: "Only the tax on the interest is saved, a quarter of it here, so debt is not free." }
      - id: c
        text: "The tax saving is a quarter of the debt itself"
        mistake: { tag: saving_on_debt, fix: "The saving comes from the interest, not the debt amount." }
      - id: d
        text: "There is no saving, because tax is charged on earnings before interest"
        mistake: { tag: interest_after_tax, fix: "Interest is deducted before tax, which is why the tax bill falls." }
    answer: a
    explanation: >
      Interest is deducted before tax, so the tax bill falls by a quarter of the interest. For example, debt of 1,000 at 8% costs 80 of interest a year and saves 20 of tax.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 17.5 Optimal Capital Structure: https://openstax.org/books/principles-finance-2e/pages/17-5-optimal-capital-structure

  - id: cs-q-roe
    prompt: >
      You buy a shop partly with a loan. The shop earns more each year than the loan's interest costs. Which headline about your return gets it right?
    choices:
      - { id: a, text: "It rises above what the assets earn: leverage is working in the owners' favour" }
      - id: b
        text: "It stays the same: borrowing changes nothing for owners"
        mistake: { tag: borrowing_neutral, fix: "The assets earn more than the debt costs, so the gap goes to the owners." }
      - id: c
        text: "It falls: interest eats into the owners' return"
        mistake: { tag: interest_always_hurts, fix: "Interest is less than the assets earn, so owners keep the gap." }
      - id: d
        text: "It becomes the lender's rate: owners earn what the lender earns"
        mistake: { tag: owners_get_loan_rate, fix: "Owners keep what the assets earn after interest, not the lender's rate." }
    answer: a
    explanation: >
      Borrowing at less than the assets earn lifts the owners' return, and would lower it if the assets earned less than the interest. For example, assets earning 10 on 100, with 40 borrowed at 6%, leave owners 7.6 on their 60, about 12.7%.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 17.1 The Concept of Capital Structure: https://openstax.org/books/principles-finance-2e/pages/17-1-the-concept-of-capital-structure

  - id: cs-q-cover
    prompt: >
      A firm's yearly earnings are only twice its interest bill. Lenders watch the gap between the two closely. Which headline gets it right?
    choices:
      - { id: a, text: "Interest cover, and a low figure signals a thin margin of safety" }
      - id: b
        text: "Interest cover, and a low figure signals that the firm is very safe"
        mistake: { tag: low_cover_safe, fix: "A low cover means little room for earnings to fall before interest goes unpaid." }
      - id: c
        text: "Debt to equity, and a low figure signals a thin margin of safety"
        mistake: { tag: cover_as_gearing, fix: "Debt to equity compares funding sources. Earnings against interest is interest cover." }
      - id: d
        text: "Return on equity, and a low figure signals a thin margin of safety"
        mistake: { tag: cover_as_roe, fix: "Return on equity is what owners earn. Earnings against interest is interest cover." }
    answer: a
    explanation: >
      Interest cover sets earnings before interest and tax against the interest bill, here 2 times. A fall of half in earnings would leave nothing for shareholders, so a low cover is a thin margin of safety.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 17.5 Optimal Capital Structure: https://openstax.org/books/principles-finance-2e/pages/17-5-optimal-capital-structure

  - id: cs-q-pledge
    prompt: >
      The main shareholder of a listed company borrows by pledging much of his shares as security. What is the key extra risk?
    choices:
      - { id: a, text: "A fall in the share price can force more security or a sale of the pledged shares, costing the owner control" }
      - { id: b, text: "The interest on the loan becomes taxable twice" }
      - { id: c, text: "The company must pay a higher dividend" }
      - { id: d, text: "The shares can no longer be traded" }
    answer: a
    explanation: >
      The lender's security is the share price. If it falls, the lender can demand top-up collateral or sell the shares, which can push the price down further.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 17.5 Optimal Capital Structure (costs of financial distress): https://openstax.org/books/principles-finance-2e/pages/17-5-optimal-capital-structure ; the collateral mechanism is standard secured-loan practice.

