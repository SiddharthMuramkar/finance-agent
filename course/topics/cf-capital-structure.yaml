    perAttempt: 3
    passRule:
      correct: 2
  - id: cs-debt-explain
    kind: conversation
    prompt: >
      A group controlled by one family has borrowed heavily, and about three quarters of the
      family's shares are pledged to lenders. Explain what Modigliani and Miller's result says
      about the choice of debt versus equity, which real-world costs it leaves out, and why the
      pledged shares make the position more fragile.
    passCriteria: >
      The Learner says that in a perfect market the mix of debt and equity does not change firm
      value, because the cost of equity rises as debt rises. They say the result leaves out taxes
      (which favour debt) and costs of financial distress, and name some such costs (forced asset
      sales, lost suppliers or customers, conflicts with lenders). They explain that a share-price
      fall can trigger demands for more security or a sale of pledged shares, so owners can lose
      control and the price can fall further.
