    perAttempt: 3
    passRule:
      correct: 2
  - id: ip-float-and-price
    kind: conversation
    prompt: >
      A company is about to list after an IPO that sells 17 percent of its shares through book
      building at the top of its price band. The owners keep 53 percent, locked in. Explain how
      the price was found, what the float is here, and why the price on the first day of trading
      might differ from the issue price.
    passCriteria: >
      The Learner explains that in book building investors bid within a band and the price is set
      after the bids show demand. They say the float is the part of the company that can trade
      freely, here about 17 percent, because the owners' shares are locked in. They explain that
      the first-day price comes from the balance of buyers and sellers in a thin market: demand
      above the offer pushes the price above the issue price (underpricing), demand below pushes
      it below, and a price at the top of the band means bidders were willing to pay more but
      does not guarantee the market will follow. They may mention lock-in expiry, greenshoe
      stabilisation or uncertainty about value.
