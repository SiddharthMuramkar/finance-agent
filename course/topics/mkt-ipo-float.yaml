# IPOs, book building and float: a foundation Topic taught through Coffee Day's 2015 issue.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
# Case sources (checked): Coffee Day Enterprises prospectus dated 19 Oct 2015 (SEBI-hosted): https://www.sebi.gov.in/sebi_data/attachdocs/1446117779846.pdf ; Reuters in Business Standard, Coffee Day prices IPO at upper end of range (21 Oct 2015): https://www.business-standard.com/article/markets/coffee-day-prices-ipo-at-upper-end-of-range-115102101210_1.html ; Hindustan Times, Bloomberg and Times of India (2 Nov 2015); SEC staff outline on underwriter short sales (2000): https://sec.gov/divisions/corpfin/guidance/ci111400ex_regs-k_sss.htm ; Ritter and Welch, A Review of IPO Activity, Pricing, and Allocations (2002).
id: mkt-ipo-float
title: IPOs, book building and float

cases:
  - id: coffee-day-ipo-structure-2015
    title: How Coffee Day sold its shares to the public
    data:
      - shares-offered
      - post-issue-shares
      - issue-price
      - issue-share-of-company
      - promoter-group-before-issue
      - promoter-group-after-issue
      - money-raised
      - repayment-of-loans-share
    asOf: 2015-10-21
    story: >
      Coffee Day Enterprises, the company behind Cafe Coffee Day, has never had its shares
      traded in public. In October 2015 it sells them for the first time in an initial public
      offering (IPO), run by book building: it announced a price band of Rs 316 to 328 a share,
      investors bid within the band, and the final price is set once the bids are in. Anchor
      investors (large institutions) bid on 13 October, a day before the public, and the public
      bidding ran from 14 to 16 October. On 21 October the company priced the issue at Rs 328, the
      top of the band. It is selling 35,060,975 new shares, worth Rs 1,150 crore, which is 17.02
      percent of the 206,001,719 shares it will have afterwards. Of the issue, 457,316 shares (Rs
      15 crore) are set aside for employees, and the rest, the net issue, is split by rule: 50
      percent for qualified institutional buyers (QIBs, such as mutual funds and insurers), of
      which 60 percent was allotted to the anchors, not less than 15 percent for non-institutional
      bidders and not less than 35 percent for retail individuals. The promoter group, V. G.
      Siddhartha and his family companies, owned 63.34 percent before the issue and will own
      52.56 percent after. Of the net proceeds of Rs 1,082 crore, Rs 633 crore will repay loans.
      Under SEBI's rules the promoters' 20 percent is locked in for three years, and most other
      pre-issue shares for a year; the shares will be listed on the BSE and the NSE. You are asked
      who holds what once trading starts, which shares can be sold, and how the price of Rs 328
      relates to what the open market will pay.
    reveal: >
      The shares began trading on 2 November 2015. They opened at Rs 313 on the BSE and Rs 317 on
      the NSE, below the Rs 328 issue price, and closed at Rs 270.15 and Rs 270.45, down 17.6
      percent. At the NSE close the company was worth about Rs 5,571 crore, against Rs 6,757 crore
      at the issue price. The only shares that could be sold in the days that followed were the
      17.02 percent sold in the issue (and the few exempt from lock-in), and the buyers who had
      been allotted them at Rs 328 had a loss on the first day. Most of the company, including
      the promoters' 52.56 percent, was locked in and could not come to the market. The issue
      price had been set by book building before trading began; the first day of trading showed
      what the open market, with its small float, would pay for the same shares.

concept: >
  An initial public offering (IPO) is the first sale of a company's shares to the public. In
  book building, the company and its bankers publish a price band, invite bids from investors
  within the band and set the issue price after seeing how many shares are demanded at each
  price. Rules often split the shares among investor groups: institutions, non-institutional
  bidders and retail investors, and anchor investors may be allotted shares ahead of the public.
  The issue can be new shares (the company gets the money), existing shares sold by owners (the
  owners get it), or both. The float is the part of the company that can actually trade freely.
  An IPO of 17 percent of the company gives a float of at most 17 percent of the shares even if
  the other 83 percent exist. Lock-ins stop insiders and pre-IPO investors from selling for a
  period, so their shares do not reach the market immediately. Underwriters often over-sell by up
  to 15 percent (the greenshoe): if the price falls they buy shares in the market to cover and
  support the price; if it rises they use the option to buy from the company. On average IPOs are
  priced below their first-day closing price, which is called underpricing, and the discount is
  larger when there is more uncertainty about the company's value; a few close below the issue
  price.

principle: >
  An IPO sets a price in a thin market: only the float trades, locked-in holders wait behind it,
  and book building collects demand before the price is final. Check how much will trade, who
  can sell when, and what the company will do with the money.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Follow how book building collects demand before an issue price is set."
  - "Measure the float: how much of a company can actually trade, and when locked-in holders can sell."
  - "See why new issues tend to be priced below where they first trade."

questions:
  - id: ip-q-float
    prompt: >
      On 21 October Coffee Day prices its first public share sale. The new shares are about 17 percent of the company, and most of the rest is locked in. Asha's broker says the "float" is small. What does he mean?
    choices:
      - { id: a, text: "Only a thin slice of the company can actually be bought and sold" }
      - { id: b, text: "The company is short of cash to stay afloat", mistake: { tag: float_is_cash, fix: "Float here means the shares free to trade, not the company's cash." } }
      - { id: c, text: "The share price floats free, with no band at all", mistake: { tag: float_is_price, fix: "Book building set the price inside a band; float counts tradable shares, not price freedom." } }
      - { id: d, text: "Most investors' bids sank and were thrown out", mistake: { tag: float_is_bids, fix: "Float is about the shares that can trade, not about bids won or lost." } }
    answer: a
    explanation: >
      The float is the part of a company that can trade freely. With about 17 percent sold in the issue and most other shares locked in, only that slice can come to market at first, so a few buyers or sellers can move the price a lot. The prospectus states the issue as a share of the shares after it: 35,060,975 new shares / 206,001,719 = 17.02 percent.
    source: >
      Coffee Day Enterprises prospectus (SEBI-hosted, 19 Oct 2015), cover page: https://www.sebi.gov.in/sebi_data/attachdocs/1446117779846.pdf

  - id: ip-q-proceeds
    prompt: >
      On 21 October Coffee Day's IPO is priced to raise Rs 1,150 crore. Asha's uncle, a banker, grins: "The company won't bank all of that." Why is he right?
    choices:
      - { id: a, text: "The headline counts the money before fees and issue costs come out" }
      - { id: b, text: "The headline is after costs, so the company keeps even more", mistake: { tag: costs_already_out, fix: "The headline is gross: the money before costs. Fees still come out of it." } }
      - { id: c, text: "The headline values the whole company, unsold shares and all", mistake: { tag: mixed_up_terms, fix: "Valuing every share is market capitalisation; the headline counts only money raised from new shares." } }
      - { id: d, text: "The headline counts only the free float", mistake: { tag: mixed_up_terms, fix: "Float is the tradable part of the company, not the money the issue raised." } }
    answer: a
    explanation: >
      Rs 1,150 crore is the gross proceeds: the new shares sold times the issue price. After the costs of the issue, the prospectus counts net proceeds of Rs 1,082 crore, and Rs 633 crore of that will repay loans.
    source: >
      Coffee Day Enterprises prospectus (SEBI-hosted, 19 Oct 2015): 35,060,975 shares at Rs 328 aggregating to Rs 11,500 million, shown as Rs 1,150 crore: https://www.sebi.gov.in/sebi_data/attachdocs/1446117779846.pdf

  - id: ip-q-retail
    prompt: >
      Ravi, a student with Rs 15,000 saved, wants Coffee Day shares but fears the big funds will grab them all. His uncle says SEBI's rules keep a slice of this issue for small bidders. What does that promise Ravi?
    choices:
      - { id: a, text: "A guaranteed minimum slice for small bidders that big funds can't take" }
      - { id: b, text: "A ceiling that stops small bidders getting too much", mistake: { tag: floor_not_ceiling, fix: "The rule sets a minimum for retail bidders, not a maximum." } }
      - { id: c, text: "Shares for sure, as many as he bids for", mistake: { tag: guaranteed_allotment, fix: "The slice is shared among all retail bidders, so a popular issue can leave each with fewer." } }
      - { id: d, text: "Nothing; it is first come, first served for everyone", mistake: { tag: no_reservation, fix: "The rules reserve a minimum share for retail bidders so institutions cannot take it all." } }
    answer: a
    explanation: >
      In the Coffee Day prospectus at least 35 percent of the net issue is kept for retail individuals like Ravi. Half goes to institutions and at least 15 percent to non-institutional bidders. That floor is what gives Ravi a fair shot.
    source: >
      Coffee Day Enterprises prospectus (SEBI-hosted, 19 Oct 2015), the Issue under SEBI ICDR Regulation 26(1): https://www.sebi.gov.in/sebi_data/attachdocs/1446117779846.pdf

  - id: ip-q-book-building
    prompt: >
      From 14 to 16 October, investors bid for Coffee Day shares anywhere between Rs 316 and Rs 328. Asha's flatmate wonders who picks the final price. What does "book building" mean here?
    choices:
      - { id: a, text: "Bids are collected first, then the price is set where demand shows it" }
      - { id: b, text: "SEBI fixes one price before anyone bids", mistake: { tag: regulator_sets, fix: "SEBI checks the rules; the price comes from the bids within the band." } }
      - { id: c, text: "The lowest bid sets the price for everyone", mistake: { tag: lowest_bid, fix: "The price is set from demand across the whole band, not by the lowest bidder." } }
      - { id: d, text: "The first day of trading sets it", mistake: { tag: trading_sets_price, fix: "Trading starts only after the price is fixed; book building comes first." } }
    answer: a
    explanation: >
      The bankers "build a book" of bids at each price within the band, then set the issue price where demand covers the shares on offer. Coffee Day priced at Rs 328, the top of its band, on 21 October, before any trading began.
    source: >
      Coffee Day Enterprises prospectus (SEBI-hosted, 19 Oct 2015), cover page: the Issue is made "through the Book Building Process" within a price band: https://www.sebi.gov.in/sebi_data/attachdocs/1446117779846.pdf

  - id: ip-q-lock-in
    prompt: >
      After Coffee Day's IPO the founder and his family companies will still own just over half of it, and SEBI's rules lock their shares in for a while. Asha asks why they can't sell on day one. What is the lock-in for?
    choices:
      - { id: a, text: "So big holders can't flood a thin new market, and stay committed" }
      - { id: b, text: "Because owners may keep no shares after an IPO", mistake: { tag: owners_banned, fix: "Owners keep their shares; the lock-in only delays when they can sell them." } }
      - { id: c, text: "To promise buyers that the price will rise", mistake: { tag: price_guarantee, fix: "A lock-in keeps shares off the market for a while; it guarantees no price." } }
      - { id: d, text: "Because an exchange can only trade 17 percent of a company", mistake: { tag: float_cap, fix: "No such cap exists; the float is small because the other shares are locked in." } }
    answer: a
    explanation: >
      With a small float, one large sale would hit the price hard. A lock-in keeps those shares off the market for a set time: under SEBI's rules the promoters' 20 percent for three years and most other pre-issue shares for a year. It guarantees no price.
    source: >
      Coffee Day Enterprises prospectus (SEBI-hosted, 19 Oct 2015), lock-in requirements for promoters and pre-issue capital: https://www.sebi.gov.in/sebi_data/attachdocs/1446117779846.pdf

