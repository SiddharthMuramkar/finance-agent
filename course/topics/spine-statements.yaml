        - { who: narrator, says: "Webvan's report for 2000 shows a loss of about $450 million.", emoji: receipt }
        - { who: webvan, says: "Our report: about $210 million left in cash and investments at the end of 2000.", emoji: building-construction }
        - { who: investor, says: "Three pages, and each tells a different part. Which one do I read?", emoji: thinking-face }
        - { who: narrator, says: "Which page says how long that cash lasts?", emoji: hourglass-not-done }
      caption: 2 April 2001, the annual report for 2000
      date: "2001-04-02"
