      steps:
        - { title: Webvan buys machines for a rented warehouse, body: "One event: machines and freezers it will use for many years, paid for in cash.", highlight: src, emoji: building-construction }
        - { title: The cash flow statement, body: "Shows the cash going out this year, as spending on things that last.", highlight: neutral, light: 0 }
        - { title: The balance sheet, body: "Swaps cash for the machines: Webvan owns something else, not more.", highlight: neutral, light: 1 }
        - { title: The income statement, body: "Takes only a slice of the machines' cost, each year they are used.", highlight: neutral, light: 2 }

skills:
  - id: st-three-pages
    rule: "The income statement shows what a period earned, the balance sheet what is owned and owed on one day, and the cash flow statement where the cash went."
    analogy: "A shop's year has three views: what it earned, what it owns and owes on the last day, and the cash that went in and out."
  - id: st-one-event
    rule: "One event moves all three statements: cash spent on warehouse machines goes out on the cash flow statement, becomes machines on the balance sheet, and reaches the income statement a slice at a time."

# The Insight (ADR 0001), found at explore with the Cash waterfall. Words only. The bench is a what-if (review 3 M07), so
# the question supposes it.
insight:
  question: >
    Suppose Webvan's sales doubled with a small profit on each sale (it really lost money on most).
    The income statement would show that profit. What would the cash flow statement show, and where
    would the cash go?
  written: >
    One year can show a profit on the income statement and cash going out on the cash flow
    statement. The gap is what growth costs: the cash goes into machines, vans and goods on the
    shelves, which then sit on the balance sheet. Each page answers a different question, so read all three.
  foundWhen: >
    The Learner sees that the income statement's profit and the cash flow statement's free cash flow
    point opposite ways, names what growth costs as the gap, and says the cash turned into things
    Webvan owns, on the balance sheet. Saying only that the numbers differ is not yet enough.
  # Review 3 L06: the first hint names one word, free cash flow, glossed, as the beginner persona asked of the explore turn.
  hints:
    - >
      Find the profit near the top of the waterfall, then free cash flow, the cash left after paying
      to grow, at the end. Which step pulls one away from the other?
    - >
      The cash spent on what growth costs did not vanish. What did Webvan get for it, and on which
      page would you find that?

explore:
  before: st-check
  requiredWhenPassed: false
  workbench:
    recipe: cash_waterfall
    title: What if Webvan's sales doubled at a profit on each sale?
    # From Webvan's 2000 sales ($178.456m, 10-K 2000) into 2001, a what-if (review 3 M07: Webvan never made a profit and
    # shut in July 2001, so the bench says so on screen): sales double, with a 4% margin, a
    # margin a well-run grocer might keep (as the cash Topic opens), and Webvan's own sales to capital of 0.70 (revenue
    # added over net capital spending plus working capital in 2000). Tax 35%, as the recipe's example; no tax is due while
    # past losses cover the profit: about $470m, its 2000 deferred tax asset for net operating losses ($164.4m, 10-K) at
    # 35%, a derived figure (docs/research/verify-webvan.json). So operating income is a profit and free cash flow is far
    # below zero, and the gap is what growth costs, which becomes warehouses and goods on the balance sheet.
    inputs:
      company:
        name: Webvan
        currency: USD
        unit: millions
        revenue: 178.456
        taxPercent: 35
        lossesCarried: 470
        opening: { growth: 100, margin: 4, salesToCapital: 0.7 }
        # Spine critics round 2 (#90): the bench draws where the cash went, Webvan's van and the buildings growth pays for
        # (the cash Topic's scene, #89), and names the years, 2000's sales into 2001, not "this year" and "next year".
        years: { from: "2000", to: "2001" }
        whatIf: "A what-if: Webvan really lost money on most sales, and it shut down the following July."
        icon: delivery-truck
        source:
          title: "Webvan Group, Form 10-K for 2000 (SEC EDGAR)"
          url: https://www.sec.gov/Archives/edgar/data/1092657/000101287001001485/0001012870-01-001485.txt

# Primer (spec C3): Three statements, one loop (cut from How the three statements link), moved here from the cash Topic.
primers:
  - id: st-primer-loop
    title: Three statements, one loop
    lines:
      - "Net income, from the income statement, is the first line of the cash flow statement."
      - "The cash flow statement then adds back costs that used no cash and takes off cash tied up in goods waiting to be sold."
      - "Its closing cash is the cash on the balance sheet, and a profit or loss also changes what the owners own."
    term: net income
    quickTry:
      id: st-primer-loop-try
      skill: st-one-event
      ask: "Webvan's income statement shows a loss for 2000. Where does that loss turn up next?"
      kind: choice
      answer: cash-first
      choices:
        - { id: cash-first, text: "As the first line of the cash flow statement" }
        - { id: nowhere, text: "Nowhere else: it stays on the income statement", mistake: { tag: one_statement, fix: "The three statements link: net income starts the cash flow statement and changes what the owners own." } }
        - { id: revenue, text: "As a cut in next year's sales", mistake: { tag: one_statement, fix: "A loss does not change sales. It starts the cash flow statement and lowers what the owners own." } }
    elective: fs-links
    at: concept

connections:
  - text: >
      The income statement's lines, sales less running costs, are the top of the cash Topic's waterfall,
      from sales to operating income.
    topics: [fs-income, spine-03-cash]
  - text: >
      What a company owns and owes on one day, and the part left for its owners, is the balance sheet.
    topics: [fs-balance]
  - text: >
      The cash flow statement's three parts, and how net income starts it, are the loop between the pages.
    topics: [fs-cashflow, fs-links]

questions:
  # Direction (D1).
  # Review 3 M02: Webvan owned no real estate (10-K Item 2); it paid for the machines and freezers in the warehouses it
  # rented (Note 6, and construction in progress).
  - id: st-q-warehouse
    kind: direction
    skill: st-one-event
    prompt: >
      2000. Webvan pays cash for machines and freezers for a warehouse it rents, to use for many years.
      On its three statements, what moves this year?
    choices:
      - { id: cash-out, text: "Cash goes out on the cash flow statement, and the balance sheet swaps cash for the machines" }
      - id: whole-cost
        text: "The whole price is a cost on this year's income statement"
        mistake: { tag: cash_for_cost, fix: "The machines last for years, so the income statement shows only a slice of their cost each year." }
      - id: nothing
        text: "Nothing moves until the machines are used"
        mistake: { tag: one_statement, fix: "The cash leaves when it is paid, so the cash flow statement and the balance sheet move at once." }
      - id: owners-up
        text: "What the owners own rises, because the company owns more"
        mistake: { tag: one_statement, fix: "Cash became machines: the company owns something else, not more." }
    answer: cash-out
    explanation: >
      Buying machines is spending on something that lasts. The cash leaves now, on the cash flow
      statement; the balance sheet holds the machines where the cash was; and the income statement takes
      their cost a slice each year.
    source: "Webvan Group, Form 10-K for 2000 (Item 2: it owns no real estate; note 6: machinery, equipment and leasehold improvements): https://www.sec.gov/Archives/edgar/data/1092657/000101287001001485/0001012870-01-001485.txt"
  # Story that cannot hold (D1).
  - id: st-q-cannot-hold
    kind: cannot_hold
    skill: st-three-pages
    prompt: >
      Three analysts describe a grocer's year from its report. Which description contradicts itself?
    choices:
      - { id: more-cash, text: "The cash flow statement shows more cash going out than coming in, no money was raised, and the balance sheet ends the year with more cash" }
      - id: loss-and-cash
        text: "The income statement shows a loss, and the cash flow statement shows cash used in running the business"
        mistake: { tag: one_statement, fix: "That one holds: a loss and cash going out often come together." }
      - id: profit-and-burn
        text: "The income statement shows a profit, and the cash flow statement shows cash going out while sales grow fast"
        mistake: { tag: profit_for_cash, fix: "That one holds: growth is paid for in cash before it shows as profit." }
    answer: more-cash
    explanation: >
      The cash flow statement's closing cash is the balance sheet's cash. If more went out than came in,
      and nobody put money in, the balance sheet cannot end with more. The other two hold together.
    source: "Webvan Group, Form 10-K for 2000 (its three statements): https://www.sec.gov/Archives/edgar/data/1092657/000101287001001485/0001012870-01-001485.txt"
  # Price or value (D1).
  - id: st-q-first-day
    kind: price_or_value
    skill: st-three-pages
    prompt: >
      5 November 1999, Webvan's first day on the stock market. Its shares close at $24.875, which puts
      about $7.9 billion on the whole company, far more than anything its balance sheet holds. Is the
      $7.9 billion a price or a value?
    choices:
      - { id: price, text: "A price: what buyers paid for the shares that day, times the shares" }
      - id: value
        text: "A value: what the balance sheet says Webvan is worth"
        mistake: { tag: price_for_value, fix: "What buyers pay is a price. The balance sheet records what was paid for things, and a value has to be argued from future cash." }
    answer: price
    explanation: >
      The $7.9 billion is what buyers paid, scaled up to all the shares. Neither the balance sheet nor
      the price is a value: a value comes from the cash the business can hand back, and the cash flow
      statement showed little sign of it.
    source: "The New York Times, 6 Nov 1999, Webvan's first day of trading: https://www.nytimes.com/1999/11/06/business/webvan-stock-price-closes-65-above-initial-offering.html"
  # Which lever (D1), computed from Webvan's own plan (an illustration block, borrowed by the Case).
  # Review 3 M08: each change names the statement that really shows it (sales on the income statement, money owed to
  # lenders on the balance sheet, money spent on equipment on the cash flow statement and then the balance sheet), and none
  # repeats the cash Topic's changes. The plan's sales in year 10 are $8.4 billion (28 centres at $300m a year).
  - id: st-q-which-lever
    kind: which_lever
    skill: st-three-pages
    prompt: >
      Take Webvan's own 1999 plan, valued as an illustration. Each change below is one a statement
      would show. Which single change lowers the value of one share most?
    explanation: "Sales are on the income statement. Money invested in equipment goes out on the cash flow statement and then sits on the balance sheet. What is owed to lenders is on the balance sheet. A change on any of the three pages can move the value. These values are an illustration built on Webvan's plan, not anyone's published value."
    computed:
      case: spine-statements-webvan-2001
      changes:
        - { id: sales-half, label: "The income statement shows $4.2 billion of sales in year 10, half the plan's $8.4 billion", levers: { revenueYear10: 4200 } }
        - { id: costly-equipment, label: "The cash flow statement shows $1 invested for each $4 of new sales, not each $10", levers: { salesToCapital: 4 } }
        - { id: more-debt, label: "The balance sheet owes lenders $500 million more", levers: { debt: 518.2 } }
  # Predict, then see (D1), computed from the same illustration: never marked wrong. Review 3 M08: the margin, on the
  # income statement, not the cash Topic's sales for each dollar invested.
  - id: st-q-predict
    kind: predict
    skill: st-three-pages
    prompt: "Webvan's own plan, valued as an illustration, keeps 12 cents of profit from each $1 of sales once mature. If its income statement showed {change}, the value of one share would be:"
    explanation: "The profit on each sale is read off the income statement, and a mature business's cash comes from it. A few cents less on each dollar of sales, every year, can take a large slice off the value."
    computed:
      case: spine-statements-webvan-2001
      changes:
        - { id: eleven, label: "11 cents of profit from each $1 of sales, not 12", levers: { marginTarget: 11 } }
        - { id: eight, label: "8 cents of profit from each $1 of sales, not 12", levers: { marginTarget: 8 } }
      bands:
        - { id: same, label: "About the same", min: 0.9 }
        - { id: some, label: "Lower by a tenth to a third", min: 0.65, max: 0.9 }
        - { id: most, label: "Lower by more than a third", max: 0.65 }
  # Not a judgement kind: which page shows the cash left.
  - id: st-q-cash-left
    skill: st-three-pages
    prompt: >
      An investor in April 2001 wants to see the cash and investments Webvan had left on 31 December
      2000. Which statement shows them?
    choices:
      - { id: balance, text: "The balance sheet, which shows what it owns on that day" }
      - id: income
        text: "The income statement"
        mistake: { tag: one_statement, fix: "The income statement shows what a year earned, not what is left on one day." }
      - id: loss
        text: "None: take the loss away from the cash it raised"
        mistake: { tag: profit_for_cash, fix: "The loss is not the cash used. The balance sheet shows the cash and investments left, about $212 million." }
    answer: balance
    explanation: >
      The balance sheet is a picture on one day: $40.3 million in cash and $171.6 million in investments
      it could quickly sell, about $212 million. The cash flow statement shows how the year's cash got there.
    source: "Webvan Group, Form 10-K for 2000: https://www.sec.gov/Archives/edgar/data/1092657/000101287001001485/0001012870-01-001485.txt"
  # Not a judgement kind: why the loss and the cash used differ.
  - id: st-q-loss-not-cash
    skill: st-one-event
    prompt: >
      Webvan's income statement shows a loss of $453.3 million for 2000, but its cash flow statement
      shows $263.1 million used in running the business. Why is the loss bigger?
    choices:
      - { id: no-cash-costs, text: "The loss counts costs that used no cash, such as paying staff in shares" }
      - id: wrong
        text: "One of the two pages must be wrong"
        mistake: { tag: one_statement, fix: "Both can be right: the pages measure different things." }
      - id: warehouses
        text: "The loss includes the whole cost of its warehouse machines"
        mistake: { tag: cash_for_cost, fix: "Machines reach the income statement a slice at a time. Their cash shows on the cash flow statement." }
    answer: no-cash-costs
    explanation: >
      The income statement counts costs that used no cash, such as paying staff in shares and spreading
      the price paid for HomeGrocer over the years. The cash flow statement adds them back.
    source: "Webvan Group, Form 10-K for 2000: https://www.sec.gov/Archives/edgar/data/1092657/000101287001001485/0001012870-01-001485.txt"

checks:
  - id: st-check
    kind: quiz
    questions: [st-q-warehouse, st-q-cannot-hold, st-q-first-day, st-q-which-lever, st-q-predict, st-q-cash-left, st-q-loss-not-cash]
    perAttempt: 4
    passRule:
      correct: 3
    card:
      title: "Three statements, three questions"
      lines:
        - "The income statement shows what a year earned, from sales down to net income."
        - "The balance sheet shows what is owned and owed on one day."
        - "The cash flow statement shows where the cash came from and where it went."
        - "One event moves all three: warehouse machines bought for cash show on each page."
      writeDown: "Read all three pages: profit, what is owned and owed, and cash."
      skills: [st-three-pages, st-one-event]
    quickTries:
      - id: st-try-profit-page
        skill: st-three-pages
        ask: "You want to know whether a shop made a profit last year. Which statement do you open?"
        kind: choice
        answer: income
        choices:
          - { id: income, text: "The income statement" }
          - { id: balance, text: "The balance sheet", mistake: { tag: one_statement, fix: "The balance sheet shows one day. A year's profit is on the income statement." } }
          - { id: cash, text: "The cash flow statement", mistake: { tag: profit_for_cash, fix: "Cash is not profit. A year's profit is on the income statement." } }
      - id: st-try-owes-page
        skill: st-three-pages
        ask: "Which statement shows what a company owes its lenders on 31 December?"
        halfDone: "First step, done for you: what is owed on one day is a picture of that day, not of a whole year."
        kind: choice
        answer: balance
        choices:
          - { id: balance, text: "The balance sheet" }
          - { id: income, text: "The income statement", mistake: { tag: one_statement, fix: "The income statement covers a period. What is owed on one day is on the balance sheet." } }
          - { id: cash, text: "The cash flow statement", mistake: { tag: one_statement, fix: "It shows cash borrowed or repaid in the year, not what is still owed on the day." } }
      - id: st-try-one-day
        skill: st-three-pages
        ask: "True or false: the balance sheet covers a whole year, as the income statement does."
        kind: truth
        answer: false
        mistakes:
