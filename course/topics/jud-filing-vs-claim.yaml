  - id: jfc-judge-claims
    kind: conversation
    prompt: >
      Choose two statements from the pieces you read, one you expect to hold and one you doubt.
      For each, say which line or sentence of the filing you went to, what you recomputed with the
      Case Data, and what you found: it ties out, a mislabel, a period or unit mismatch, or more
      than the text says. Then say what your finding changes about the writer's point, and what you
      could not check.
    passCriteria: >
      For both statements the Learner names the filing line or sentence it rests on, with its label
      and period, and uses figures from the Case Data or from Library passages, not from memory or
      from the writer. They redo the arithmetic and get it right. They sort each finding correctly
      into ties out, mislabel, period or unit mismatch, or more than the text says, and they can
      say why, in their own words. They separate what the filing says from what the writer adds, and
      they do not call something an error unless they have shown it. They say what the finding does
      and does not change, and name at least one thing they could not verify. They make no forecast
      and no buy, sell or hold call.
