# Judge Topic: two writers' claims about Anthropic's Form S-1 (28 Oct 2026), each taken back to the filing and recomputed.
# Case 1 reads Damodaran's post from the Library (quoted only in short passages with credit); case 2 reads Zitron's article, which the Learner pastes and which is never stored.
# The S-1's figures are Case Data; its wording is in the Library. Stage, place on the default path and prerequisites live in course/outline.yaml.
# Sources (checked 2 Nov 2026): Anthropic, PBC, Form S-1, accession 0001628280-26-067168, filed 26 Oct 2026: https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm ; Damodaran, "The Anthropic Prospectus Arrives: My (but not the) IPO valuation!", Musings on Markets, 28 Oct 2026: https://aswathdamodaran.blogspot.com/2026/10/the-anthropic-prospectus-arrives-ipo.html ; Zitron, "Exit Liquidity", Where's Your Ed At, 28 Oct 2026: https://www.wheresyoured.at/exit-liquidity/
# Not checked: whether either piece was corrected after 28 Oct 2026; the spreadsheet behind Damodaran's post.
id: jud-filing-vs-claim
title: "Judge: claim versus filing"

cases:
  - id: jud-fvc-damodaran-h1-claims
    title: A professor summarises the first six months of a filing
    asOf: 2026-10-28
    data:
      - fvc-d-revenue-quarterly
      - fvc-d-compute-quarterly
      - fvc-d-operating-quarterly
      - fvc-d-h1-revenue
      - fvc-d-h1-operating
      - fvc-d-h1-interest
      - fvc-d-h1-fairvalue
      - fvc-d-h1-other
      - fvc-d-h1-tax
      - fvc-d-h1-netloss
      - fvc-d-cash-equivalents
      - fvc-d-short-term-investments
      - fvc-d-restricted-cash
      - fvc-d-cash-flow-total
    piece:
      author: Aswath Damodaran
      title: "The Anthropic Prospectus Arrives: My (but not the) IPO valuation!"
      published: 2026-10-28
      url: https://aswathdamodaran.blogspot.com/2026/10/the-anthropic-prospectus-arrives-ipo.html
      from: library
      librarySource: Damodaran
    story: >
      On 26 October 2026 Anthropic, PBC filed a preliminary Form S-1 with the US Securities and
      Exchange Commission, the registration statement for a possible public offering. It is a draft:
      the offering price and size are blank, and its figures for 2026 to 30 June are unaudited. On
      28 October 2026 Aswath Damodaran, a valuation professor at NYU Stern, published a post on it
      called "The Anthropic Prospectus Arrives". Part of it summarises the filing, and four of its
      statements can be taken back to the S-1. First, that the company reported "an operating loss,
      corrected for non-cash and one-time charges, of over $ 8 billion" for the first six months of
      2026, with a reported loss of about $80 billion of which about $72 billion was a non-cash charge
      on its convertible notes. Second, that it had an operating profit in its most recent quarter.
      Third, that compute, its biggest cost, fell from more than 250% of revenues to 48% of revenues
      on a quarterly basis. Fourth, that its "cash balance" was "already at $114 billion". The Learner
      judges these statements, not the post's valuation or its view of the future. The S-1's figures
      are in the Case Data and its wording is in the Library (search with the source filter "Anthropic
      PBC, Form S-1" and words from the passage). The Learner reads the post in the Library, goes to
      the filing for each statement, sets it beside the line it rests on, and says what kind of finding it is: it ties out,
      or it is a mislabel, a period or unit mismatch, or more than the text says.
    reveal: >
      Checked against the S-1 on 2 November 2026. Three statements tie out. Operating income was a
      profit of $974 million in the quarter to 30 June 2026 after a loss of $1,667 million in the
      quarter to 31 March. Compute and infrastructure expense was 251% of revenue in the March 2025
      quarter and 48% in the June 2026 quarter. The net loss for the six months was $80,748 million,
      of which $72,388 million was the change in fair value of the convertible notes, derivative
      liabilities and SAFEs. The first statement is a mislabel. The S-1's operating loss for the six
      months is $693 million (the two quarters, -1,667 and +974). The "over $8 billion" is what is
      left of the net loss after taking out the fair-value change: 80,748 - 72,388 = $8,360 million.
      Between the two sit interest income of $1,111 million, tax of $21 million and "other income
      (expense), net" of -$8,757 million, which the S-1 ties mainly to the initial fair value and
      later changes under its note purchase agreements. So the number is real but it is a net loss
      before one item, not an operating loss, and it is about twelve times the operating loss. Even
      as a "corrected for non-cash" figure it is mostly another fair-value item. The trend the post
      describes, losses narrowing and a profit in the second quarter, is not affected. The fourth
      statement does not match the balance sheet. At 30 June 2026 the S-1 shows cash and cash
      equivalents of $112,389 million and short-term investments of $19,262 million. The nearest
      figure is $114,918 million, the total of cash, cash equivalents and restricted cash ($2,529
      million, held mainly as collateral for lease and other obligations) in the cash flow statement.
      The post does not say where $114 billion came from, so what the Learner can show is that it
      equals neither balance-sheet measure and sits close to a different line, rounded down. That is
      a label and definition gap, not necessarily a wrong sum. Not checked: whether the post was
      corrected later, and the spreadsheet behind it.

  - id: jud-fvc-zitron-s1-claims
    title: A newsletter writer reads the same filing
    asOf: 2026-10-28
    data:
      - fvc-z-revenue-annual
      - fvc-z-revenue-h1
      - fvc-z-revenue-quarterly
    piece:
      author: Ed Zitron
      title: "Exit Liquidity"
      published: 2026-10-28
      url: https://www.wheresyoured.at/exit-liquidity/
      from: paste
    story: >
      On 28 October 2026, two days after Anthropic's preliminary S-1 appeared, Ed Zitron, who writes
      the technology newsletter Where's Your Ed At, published "Exit Liquidity", a long article on the
      filing. Four of its statements can be taken back to the S-1. First, that 5% to 7% of revenue
      came from what "appear to be distillation attacks", his gloss on a passage the S-1 gives for
      the nine months to 30 September 2026. Second, that Anthropic is "guaranteed", in its own words,
      to have slower growth, worse margins and higher costs. Third, that the S-1 leaves out anything
      to do with third-quarter numbers. Fourth, a sum on revenue concentration, in which he puts the
      twelve months to 30 June 2026 at $19.708bn and the second half of 2025 at "$3,422bn". The
      article is not in the Library and is never stored: the Learner pastes the passage they want to
      judge, and the Tutor works only from what is pasted. The S-1's figures are in the Case Data and
      its wording is in the Library (search with the source filter "Anthropic PBC, Form S-1" and
      words from the passage). The Learner finds the S-1 sentence each statement rests on, sets the
      writer's version beside it, notes where a figure adds lines together, and says what kind of finding it
      is: it ties out, or it is a mislabel, a period or unit mismatch, or more than the text says.
    reveal: >
      Checked against the S-1 on 2 November 2026. The sum is right and its label is wrong. Revenue
      for 2025 was $4,585 million and for the first half of 2025 $1,163 million, so the second half
      was $3,422 million, not billion, and the twelve months to 30 June 2026 were 4,585 - 1,163 +
      16,286 = $19,708 million, which is the figure he gives. The slip is a unit: the S-1 tables are
      in millions, and "$3,422bn" is a thousand times too large. The distillation statement goes
      beyond the text. The S-1 says it estimates that revenue from customers using its models "in
      violation of our usage policy or commercial terms" was approximately 5% to 7% of revenue for
      the nine months to 30 September 2026. It does not say who those customers are or that they
      were rivals training models, and the S-1 discusses distillation elsewhere only as a risk. The
      "guaranteed" statement drops the hedge. The S-1 does say "we expect our revenue growth rate to
      decline over time", that it expects use of short-term compute "to compress our operating
      margin", and that capital expenditures will rise significantly, so the direction he describes
      has support; but for margins it says "may compress", and it nowhere says any of this is
      guaranteed. The third statement overreaches. The S-1 has no financial statements for the
      quarter to 30 September 2026, but it does contain third-quarter and nine-month facts: top five
      customers about 25% of revenue and the 5% to 7% estimate, both for the nine months to 30
      September, and a statement that operating margin for those nine months expanded significantly
      year over year. His own article quotes two of these. "No third-quarter statements" would have
      held; "anything to do with" the quarter does not. Not checked: whether the article was
      corrected later.

concept: >
  Judging a writer's claim means going back to the filing, not to another writer. A number in a
  claim points at a line in a statement, so first find that line and read its label, its period
  and the unit in the table's header. Then recompute: percentages and sums are redone from the
  filing's own figures. Then sort what you find into one of four outcomes. It ties out. It is a
  mislabel: the number is real but carries the wrong name, such as a revenue figure called profit or
  the sum of two lines called by the name of one. It is a period or unit
  mismatch: figures from different spans are set side by side, or a table in millions is read as
  billions. Or it goes beyond the text: the filing gives a quantity or a hedged expectation ("we
  expect", "may") and the writer adds a cause, a culprit or a certainty. Know the order of an
  income statement: operating income comes before interest, other income and expense, and tax, and
  net income comes after them. Say only what you have shown: a mislabel does not make a piece wrong, a figure you cannot
  trace is not proof of an error, and a claim that ties out should be marked as checked.

principle: >
  A writer's number is a pointer to a line in a filing. Follow it, recompute it, and name what you
  find: ties out, wrong label, wrong period or unit, or more than the text says. Report the
  size of the gap and what it changes, keep the writer's right points as clearly as the wrong ones,
  and do not infer motive from a slip.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Follow a writer's number back to its line in a filing."
  - "Name what you find: ties out, wrong label, wrong period or unit, or more than the text says."
  - "Read an income statement in order, from operating income down to net income."

# Claude-written quiz questions with invented companies and numbers; each answer was checked against the cited source and by recomputation.
questions:
  - id: jfc-q-net-vs-operating
    prompt: >
      Brindle Systems' filing lists revenue, then operating expenses, then interest income, a large change in the fair value of convertible notes, other expense and tax, ending in a net loss. A writer calls that final net loss "an operating loss". What is the right reading?
    choices:
      - { id: a, text: "A mislabel: the figure is real but it is the net loss, which comes after interest, the fair-value change and tax; the operating loss is the earlier line" }
      - { id: b, text: "It ties out: the bottom line of an income statement is the operating loss", mistake: { tag: it_ties_out_the_bottom_line, fix: "The bottom line is net income. Operating income comes earlier, before interest and tax." } }
      - { id: c, text: "A period mismatch: the two figures cover different months", mistake: { tag: a_period_mismatch_the_two_fi, fix: "Both lines sit in the same statement and period. The slip is in the name." } }
      - { id: d, text: "More than the text says: the filing never reports a loss", mistake: { tag: more_than_the_text_says_the, fix: "The filing does report the loss. The writer gave it the wrong name." } }
    answer: a
    explanation: >
      Operating income comes first, from revenue less operating expenses. Interest, the fair-value change, other items and tax then lead to net income, the bottom line. So the writer's figure is a real number carrying the wrong name: a mislabel.
    source: >
      OpenStax, Principles of Accounting, Volume 1 (CC BY-NC-SA 4.0), 6.6 Multi-Step and Simple Income Statements (income from operations comes before other revenue and expenses, which lead to net income): https://openstax.org/books/principles-financial-accounting/pages/6-6-describe-and-prepare-multi-step-and-simple-income-statements-for-merchandising-companies
  - id: jfc-q-two-lines
    prompt: >
      Corvane Ltd's balance sheet lists long-term debt of 300 and, on a separate line, lease
      liabilities of 200. A writer says "Corvane's debt is 500". What is the best judgement?
    choices:
      - { id: a, text: "An arithmetic error: 300 + 200 is not 500" }
      - { id: b, text: "500 is a real sum of two separate lines under the name of one; it is fair only if the writer says what is included, and the balance-sheet debt line is 300" }
      - { id: c, text: "It ties out: lease liabilities are always part of debt" }
      - { id: d, text: "A period mismatch: the two lines cover different years" }
    answer: b
    explanation: >
      The arithmetic is right, but the filing keeps the two items on separate lines, so "debt" alone
      names only the 300. A writer may reasonably add the lease liabilities to get a wider measure of
      what the company owes, but the claim should say so; as written it is a label and definition gap,
      not an error in the sum.
    source: >
      SEC Office of the Advocate for Small Business Capital Formation, "What is a balance sheet?" (liabilities are reported as separate lines): https://www.sec.gov/files/balancesheet-building-blocks.pdf

  - id: jfc-q-ties-out
    prompt: >
      Friday 6 March 2026, an hour before a made-up newsletter reaches 40,000 readers. Fact-checker Meera reads: Corvane's marketing fell "from 90% of revenue to 30%". Both figures match the filing. What does she send back?
    choices:
      - { id: a, text: "\"Checked, it matches the filing. Run it.\"" }
      - { id: b, text: "\"Hold it. Writers always round, so something must be off.\"", mistake: { tag: assumed_rounding_means_error, fix: "Matching figures leave nothing to fix. A line that traces back gets marked checked." } }
      - { id: c, text: "\"Cut it. The filing never prints those percentages.\"", mistake: { tag: ratio_seen_as_invented, fix: "Setting marketing against revenue is a fair reading of two printed lines, not an invention." } }
      - { id: d, text: "\"Hold it until the writer sends me the spreadsheet.\"", mistake: { tag: asked_for_proof_already_held, fix: "The filing's own lines settle it. Once they match, no spreadsheet is needed." } }
    answer: a
    explanation: >
      Each percentage sets Corvane's marketing line against its revenue line for the same period, and both match the filing. A claim that traces back should be marked as checked, and saying so is as much part of fair judging as catching a slip.
    source: >
      SEC Office of the Advocate for Small Business Capital Formation, "What is an income statement?" (revenue and expense lines; a ratio to revenue is expense divided by revenue): https://www.sec.gov/files/income-statement-building-blocks.pdf ; Meera, the newsletter and Corvane are made up.
  - id: jfc-q-ttm
    prompt: >
      Halloran Inc. reports a full year 2025, the first half of 2025 and the first half of 2026. Analysts call revenue for the latest twelve months "trailing twelve months". Which pieces make up Halloran's twelve months to 30 June 2026?
    choices:
      - { id: a, text: "The second half of 2025 together with the first half of 2026" }
      - { id: b, text: "The full year 2025 together with the first half of 2026", mistake: { tag: the_full_year_together_with, fix: "That brings in the first half of 2025, which ended before the twelve months began." } }
      - { id: c, text: "The second half of 2025 on its own", mistake: { tag: the_second_half_of_on_its_ow, fix: "The twelve months also include the latest half, the first half of 2026." } }
      - { id: d, text: "The full year 2025, its first half and the 2026 half, all together", mistake: { tag: the_full_year_its_first_half, fix: "The first half of 2025 is already inside the full year. Count each half once." } }
    answer: a
    explanation: >
      Twelve months to 30 June 2026 are the second half of 2025 plus the first half of 2026. The second half of 2025 is the full year less its first half. Adding the full 2025 year to the first half of 2026 counts the first half of 2025 inside a period that began after it.
    source: >
      Arithmetic on a trailing-twelve-month sum; period conventions as in the SEC's "What is an income statement?" (statements cover a stated period): https://www.sec.gov/files/income-statement-building-blocks.pdf
  - id: jfc-q-unit-slip
    prompt: >
      In the Halloran Inc. filing every table is headed "(in millions)". A writer states that the
      second half of 2025 "brought in $650bn". How does the writer's figure compare with the
      filing?
    choices:
      - { id: a, text: "A unit slip: the filing's 650 is $650 million, so $650bn is a thousand times too large" }
      - { id: b, text: "A period mismatch: the filing has no second-half figure" }
      - { id: c, text: "It ties out: bn and m are interchangeable in a filing" }
      - { id: d, text: "More than the text says: the writer added a cause" }
    answer: a
    explanation: >
      The table header sets the unit. 650 in a table "in millions" is $650 million, or $0.65 billion;
      writing it as 650bn multiplies it by 1,000. The second-half figure itself can be derived from
      the full-year and first-half lines, so it is not a period mismatch.
    source: >
      SEC Office of the Advocate for Small Business Capital Formation, "What is an income statement?" (amounts are stated in the units given on the statement): https://www.sec.gov/files/income-statement-building-blocks.pdf

  - id: jfc-q-inference
    prompt: >
      A filing says: "we estimate that approximately 8% of our sales for the nine months ended 30
      September came from distributors who sold outside their agreed territories." A writer says:
      "8% of sales were grey-market diversion designed to undercut the brand." What is the best
      description of the writer's step?
    choices:
      - { id: a, text: "A mislabel: 8% is the wrong number" }
      - { id: b, text: "A period mismatch: nine months against a year" }
      - { id: c, text: "More than the text says: the filing gives a size and a category, and the writer adds a purpose" }
      - { id: d, text: "An arithmetic slip" }
    answer: c
    explanation: >
      The 8%, the period and the category (sales outside agreed territories) all match the filing.
      "Designed to undercut the brand" is a motive the sentence does not give. The sorted finding is
      an inference beyond the text, and the way to report it is to set the two sentences side by
      side and say which words are the writer's own.
    source: >
      SEC, Beginners' Guide to Financial Statements (read the notes and MD&A for what a figure covers, and what management does and does not say): https://www.sec.gov/about/reports-publications/investorpubsbegfinstmtguide

  - id: jfc-q-hedge
    prompt: >
      A filing says: "we expect our gross margin may narrow as lower-priced contracts renew." A
      writer says the filing "guarantees" the margin will narrow. Which wording of the filing's own
      claim stays inside its text?
    choices:
      - { id: a, text: "The company expects that its gross margin may narrow" }
      - { id: b, text: "The company says its gross margin will narrow" }
      - { id: c, text: "The company guarantees a narrower gross margin" }
      - { id: d, text: "The company says its gross margin cannot narrow" }
    answer: a
    explanation: >
      The filing pairs an expectation with "may": a possibility the company flags, not a certainty.
      Turning it into "will" or "guarantees" drops the hedge. When you judge such a claim, quote the
      filing's own verbs ("expect", "may") and note which direction the writer has right.
    source: >
      SEC, Beginners' Guide to Financial Statements, on MD&A as management's own discussion of trends, events and uncertainties: https://www.sec.gov/about/reports-publications/investorpubsbegfinstmtguide

  - id: jfc-q-ratio-vs-change
    prompt: >
      Thursday 14 May 2026, 8 pm; reporter Tomás files at 9. A made-up firm's filing says revenue rose from $200m to $700m, "3.5 times last year". The headline reads "Revenue grew 350%". What should he say?
    choices:
      - { id: a, text: "\"Make it '3.5 times last year'. 'Grew 350%' claims a bigger jump.\"" }
      - { id: b, text: "\"Run it. 'Times' and 'grew by a percent' mean the same.\"", mistake: { tag: multiple_read_as_growth, fix: "'Times' sets the whole new figure against the old; 'grew' counts only the extra on top." } }
      - { id: c, text: "\"Drop it. Two different years should never be compared.\"", mistake: { tag: year_on_year_seen_as_mismatch, fix: "Comparing this year with last year is what growth means. Only the wording slipped." } }
      - { id: d, text: "\"Cut the figure. The filing never talks about growth.\"", mistake: { tag: growth_seen_as_beyond_text, fix: "Two years of revenue is what growth is read from. Keep the figure, fix the word." } }
    answer: a
    explanation: >
      "3.5 times" sets the whole new revenue against the old. "Grew 350%" would count only the extra on top, so it describes a bigger jump than the filing shows. The safe headline keeps the filing's own comparison: a multiple stays a multiple.
    source: >
      OpenStax, Prealgebra 2e (CC BY 4.0), 6.2 Solve General Applications of Percent, percent increase (the amount of increase as a percent of the original amount): https://openstax.org/books/prealgebra-2e/pages/6-2-solve-general-applications-of-percent ; Tomás, his editor and the firm are made up.

