  - id: jfc-judge-claims
    kind: conversation
    prompt: >
      Pick two statements from the pieces you read: one you trust, one you doubt. Which line of the
      filing did each rest on, and what did you find: ties out, wrong label, wrong period or unit,
      or more than the text says? Does it change the writer's point?
    passCriteria: >
      For both statements the Learner names the filing line or sentence it rests on, with its label
      and period, and works from the Case Data or Library passages, not from memory or from the
      writer. No arithmetic is asked or needed. They sort each finding correctly
      into ties out, mislabel, period or unit mismatch, or more than the text says, and they can
      say why, in their own words. They separate what the filing says from what the writer adds, and
      they do not call something an error unless they have shown it. They say what the finding does
      and does not change, and name at least one thing they could not verify. They make no forecast
      and no buy, sell or hold call.
