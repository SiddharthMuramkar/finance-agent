skills:
  - id: compound-growth
    rule: "Each year, the total grows by the rate, so next year's gain is on a bigger amount."
    analogy: "Interest left in a fixed deposit earns interest of its own."
  - id: fall-and-recover
    rule: "A fall and then a rise of the same percent do not cancel, because the rise works on a smaller amount."
  - id: rule-of-72
    rule: "To find about how many years money takes to double, divide 72 by the yearly rate in percent."
  - id: cagr
    rule: "CAGR is the one steady yearly rate that turns the start into the end over those years."
  - id: log-return
    rule: "Log returns of back-to-back periods add up to the log return of the whole stretch. For a rise they are a little smaller than the ordinary return."
  - id: steady-pace
    rule: "A long-run CAGR can hide an uneven path, so find the CAGR of each stretch and compare them."

templates:
  - id: grow-amount
    skill: compound-growth
    ask: "Asha's ₹{amount} deposit grows {rate}% a year for {years} years. Which line on her statement shows growth on growth?"
    label: "{value}: each year grows on the new, bigger total"
    params:
      amount: { min: 2000, max: 9000, step: 1000 }
      rate: { min: 2, max: 12, step: 2 }
      years: { min: 2, max: 3, step: 1 }
    derived: { r: "times(rate, 0.01)", f: "plus(1, r)", first: "times(amount, f)" }
    answer: compound_value
    unit: inr
    decimals: 0
    sign: magnitude
    mistakes:
      - tag: simple_growth
        fix: "That adds the first year's gain every year. Each year grows on the new, bigger total."
        label: "{value}: the first year's gain added again each year"
    halfDone:
      shows: "First step, done for you: after one year it is ₹{first}."
      asks: compound_value
    avoid: [1000, 10, 1331, 5, 23, 28, 33, 56, 126]
  - id: double-time
    skill: rule-of-72
    ask: "Money grows {rate}% a year. Which wait to double matches the rule of 72?"
    label: "About {value}: seventy-two over the yearly rate"
    params:
      rate: { min: 2, max: 24, step: 1 }
    answer: rule_of_72_years
    unit: years
    decimals: 1
    sign: magnitude
    mistakes:
      - tag: simple_doubling
        fix: "That is 100 divided by the rate, as if growth never compounded. Divide 72 by the rate instead."
        label: "About {value}: a hundred over the yearly rate, as if nothing compounded"
    # 8, 9, 11 and 18 (and the answers 9 and 8) keep a draw apart from the rule-of-72 question and Quick tries (lint L9).
    avoid: [10, 6, 12, 5, 23, 28, 33, 56, 126, 8, 9, 11, 18]
  - id: steady-rate
    skill: cagr
    ask: "A fund goes from {start} to {end} in {years} years. Which figure is its CAGR, the one steady yearly rate?"
    label: "About {value} a year: one steady rate, growing on itself each year"
    params:
      start: { min: 100, max: 500, step: 100 }
      g: { min: 20, max: 90, step: 10 }
      years: { min: 2, max: 2, step: 1 }
    derived: { r: "times(g, 0.01)", f: "plus(1, r)", grew: "times(f, f)", end: "times(start, grew)" }
    answer: cagr_percent
    unit: percent
    decimals: 0
    sign: magnitude
    mistakes:
      - tag: averaged_gain
        fix: "That divides the total gain by the years. Find the one rate that, grown twice, gives the whole rise."
        label: "About {value} a year: the whole gain split evenly across the years"
    halfDone:
      shows: "First step, done for you: the end divided by the start is {grew}."
      asks: cagr_percent
    # 144 keeps a draw apart from the card's worked example (100 became 144).
    avoid: [1000, 10, 1331, 5, 23, 28, 33, 56, 126, 144]

questions:
  - id: cp-q-doubling-rate
    skill: cagr
    prompt: >
      After two years of the same yearly growth, a savings pot ends exactly four times where it started. Which description of that yearly growth fits?
    choices:
      - { id: a, text: "It doubled every year" }
      - id: b
        text: "It grew by half every year"
        mistake: { fix: "Growing by half twice makes the pot about two and a quarter times bigger, not four.", tag: too_small }
      - id: c
        text: "It grew by 150% a year, the 300% gain split across two years"
        mistake: { fix: "That splits the gain evenly across the years, which ignores growth on growth.", tag: averaged_gain }
      - id: d
        text: "It tripled every year"
        mistake: { fix: "Tripling twice would make the pot nine times bigger, not four.", tag: too_big }
    answer: a
    explanation: >
      Doubling twice does it, since two times two is four, and doubling is a gain of 100% a year. Splitting the 300% gain across two years says 150%, the common mistake.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 7.4 Applications of TVM in Finance: https://openstax.org/books/principles-finance-2e/pages/7-4-applications-of-tvm-in-finance

  - id: cp-q-down-up
    skill: fall-and-recover
    prompt: >
      A share price falls by half and then rises by half. Compared with where it started, which one is true?
    choices:
      - { id: a, text: "It ends below where it started" }
      - id: b
        text: "It ends back where it started"
        mistake: { fix: "The rise works on the smaller price the fall left, so it wins back only part of what was lost.", tag: back_where_started }
      - id: c
        text: "It ends above where it started"
        mistake: { fix: "A fall and then an equal rise always ends lower, never higher.", tag: too_big }
      - id: d
        text: "It depends on the share's start price"
        mistake: { fix: "Whatever the start price, a rise of the same percent after a fall ends lower.", tag: depends_on_start }
    answer: a
    explanation: >
      Start at 100. After a 50% fall it is 50. A 50% rise on 50 adds 25, giving 75, which is 25% below the start. Gains and losses apply to different bases, so they do not cancel.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), on compounding returns over time: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-rule-72
    skill: rule-of-72
    prompt: >
      A banker says, "At 8% a year your money doubles in about nine years." Which shortcut is she using?
    choices:
      - { id: a, text: "The rule of 72: seventy-two over the yearly rate" }
      - id: b
        text: "The rule of 100: a hundred over the yearly rate"
        mistake: { fix: "That ignores compounding and gives too long a wait. The rule uses 72.", tag: simple_doubling }
      - id: c
        text: "The rule of 8: eight years for every doubling"
        mistake: { fix: "The wait depends on the yearly rate, so it changes whenever the rate does.", tag: mixed_up_terms }
      - id: d
        text: "The CAGR rule: the steady rate between two values"
        mistake: { fix: "The CAGR starts from two values. The doubling shortcut starts from a rate.", tag: mixed_up_terms }
    answer: a
    explanation: >
      72 divided by 8 is 9, so about 9 years. Worked out exactly, it is just over 9 years.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 7.4 Applications of TVM in Finance: https://openstax.org/books/principles-finance-2e/pages/7-4-applications-of-tvm-in-finance ; Investor.gov (US SEC), What is compound interest: https://www.investor.gov/additional-resources/information/youth/teachers-classroom-resources/what-compound-interest

  - id: cp-q-three-years
    skill: compound-growth
    prompt: >
      Asha's ₹2,000 deposit grows 20% a year for two years. Her friend says the second year adds the same rupees as the first. Is she right?
    choices:
      - { id: a, text: "No: the second year's 20% is earned on a bigger total" }
      - id: b
        text: "Yes: 20% of ₹2,000 is the same both years"
        mistake: { fix: "That adds the first year's gain every year. The second year's gain is on the new, bigger total.", tag: simple_growth }
      - id: c
        text: "No: the second year adds nothing, because growth stops after one year"
        mistake: { fix: "A deposit that grows 20% a year keeps growing each year.", tag: stops_after_one }
      - id: d
        text: "Yes: interest is always the same amount each year"
        mistake: { fix: "That is simple interest. Compound growth earns on the gains too.", tag: simple_growth }
    answer: a
    explanation: >
      Year one: 20% of ₹2,000 is ₹400, giving ₹2,400. Year two: 20% of ₹2,400 is ₹480, giving ₹2,880. Simple growth adds ₹400 twice and says ₹2,800, which misses the growth on the first year's gain.
    source: >
      Investor.gov (US SEC), What is compound interest: https://www.investor.gov/additional-resources/information/youth/teachers-classroom-resources/what-compound-interest

  - id: cp-q-log-return
    skill: log-return
    prompt: >
      Bombay, 31 March 1992. Karan's boss wants each year of the Sensex climb scored by morning, so the yearly scores simply join into one for the whole run. What do analysts call that score?
    choices:
      - { id: a, text: "A log return: back-to-back scores just join up" }
      - id: b
        text: "A CAGR: one steady rate for the whole run"
        mistake: { fix: "A CAGR is one steady yearly rate. It does not join up year by year.", tag: mixed_up_terms }
      - id: c
        text: "A base year: where the index started at 100"
        mistake: { fix: "A base year is where an index starts, not a score for one year's growth.", tag: mixed_up_terms }
      - id: d
        text: "A bull run: a long stretch of rising prices"
        mistake: { fix: "A bull run names a rising market. It does not score each year's growth.", tag: mixed_up_terms }
    answer: a
    explanation: >
      A log return is a score for one stretch of growth, built so that back-to-back scores simply add. That is why Karan reaches for it: ordinary returns have to be compounded, log returns just join up.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), continuously compounded returns: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-index-rate
    skill: cagr
    prompt: >
      An index rises from 100 to 4,285 in 13 years. Which is the best summary of its yearly growth?
    choices:
      - { id: a, text: "About a third a year, as one steady compound rate" }
      - id: b
        text: "About 322% a year, the total gain split across the years"
        mistake: { fix: "That splits the total gain across the years, which ignores growth on growth.", tag: averaged_gain }
      - id: c
        text: "About 4,285% a year"
        mistake: { fix: "That is close to the whole rise over 13 years, not one year's rate.", tag: too_big }
      - id: d
        text: "About 13% a year"
        mistake: { fix: "That is the number of years, not the rate.", tag: mixed_up_terms }
    answer: a
    explanation: >
      The index ended 42.85 times where it started. The steady yearly rate is the one that, grown 13 times over, multiplies the start by 42.85: about 33% a year. Splitting the gain across the years ignores compounding.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 7.4 Applications of TVM in Finance: https://openstax.org/books/principles-finance-2e/pages/7-4-applications-of-tvm-in-finance ; Sensex values: BSE, SENSEX@40 white paper (January 2026), https://bseindia.com/downloads1/SENSEX@40-White-Paper.pdf

  - id: cp-q-fall-rise-20
    skill: fall-and-recover
    prompt: >
      Asha's share falls 20% one month and rises 20% the next. Compared with where it began, it is:
    choices:
      - { id: a, text: "A little lower" }
      - id: b
        text: "Exactly where it began"
        mistake: { fix: "The 20% rise works on the smaller price, so it wins back less than the 20% fall took.", tag: back_where_started }
      - id: c
        text: "A little higher"
        mistake: { fix: "A fall and then an equal rise always ends lower, never higher.", tag: too_big }
      - id: d
        text: "Twice as high"
        mistake: { fix: "Nothing doubles here. The rise is on a smaller amount than the fall was.", tag: too_big }
    answer: a
    explanation: >
      20% of ₹2,000 is ₹400, so the fall leaves ₹1,600. 20% of ₹1,600 is ₹320, so the rise ends at ₹1,920, below the start.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), on compounding returns over time: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-rise-fall
    skill: fall-and-recover
    prompt: >
      A price rises 25% and then falls 25%. Compared with where it started, which one is true?
    choices:
      - { id: a, text: "It ends lower than it started" }
      - id: b
        text: "It ends back where it started"
        mistake: { fix: "The 25% fall works on the bigger, risen price, so it takes away more than the rise added.", tag: back_where_started }
      - id: c
        text: "It ends higher than it started"
        mistake: { fix: "An equal rise and fall end lower in either order, never higher.", tag: too_big }
      - id: d
        text: "It depends on whether the rise or the fall comes first"
        mistake: { fix: "Either order ends in the same place: a little below the start.", tag: depends_on_order }
    answer: a
    explanation: >
      Start at 100. A 25% rise gives 125. A 25% fall on 125 takes away 31.25, leaving 93.75, which is 6.25% below the start. The order does not matter: a fall then an equal rise ends just as low.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), on compounding returns over time: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-recover-half
    skill: fall-and-recover
    prompt: >
      A share halves in price. To get back to where it started, the rise it needs is:
    choices:
      - { id: a, text: "Bigger than the fall: it must double the price" }
      - id: b
        text: "The same size as the fall"
        mistake: { fix: "The rise works on the smaller, halved price, so an equal-sized rise falls short.", tag: back_where_started }
      - id: c
        text: "Smaller than the fall"
        mistake: { fix: "A rise on a smaller price needs to be bigger, not smaller, to win back the same rupees.", tag: too_small }
      - id: d
        text: "Impossible: a fall can never be won back"
        mistake: { fix: "A big enough rise wins it back. It just has to be bigger than the fall.", tag: mixed_up_terms }
    answer: a
    explanation: >
      From half the price it needs the same rupees again. That is a rise of 100%, twice the size of the 50% fall.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), on compounding returns over time: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-recover-quarter
    skill: fall-and-recover
    prompt: >
      A fund falls by a fifth. To win back what it lost, the rise it needs is:
    choices:
      - { id: a, text: "A bit bigger than a fifth" }
      - id: b
        text: "Exactly a fifth"
        mistake: { fix: "The rise works on the smaller amount, so a fifth of it is less than the fifth that was lost.", tag: back_where_started }
      - id: c
        text: "A bit smaller than a fifth"
        mistake: { fix: "A rise on a smaller amount must be bigger, not smaller, to win the same rupees back.", tag: too_small }
      - id: d
        text: "Double a fifth, no matter what"
        mistake: { fix: "Two fifths would go well past the start. The rise only needs to be a little bigger.", tag: too_big }
    answer: a
    explanation: >
      After a 20% fall from ₹4,000 it is ₹3,200. It needs ₹800 more, which is a quarter of ₹3,200, so a 25% rise, bigger than the 20% fall.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), on compounding returns over time: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-fall-truth
    skill: fall-and-recover
    prompt: >
      An amount falls by some percent and then rises by the same percent. Which one is true?
    choices:
      - { id: a, text: "It always ends below where it started" }
      - id: b
        text: "It always ends back where it started"
        mistake: { fix: "The rise works on the smaller amount the fall left, so it wins back less than was lost.", tag: back_where_started }
      - id: c
        text: "It ends above the start when the percent is large"
        mistake: { fix: "It ends below for every percent. The bigger the percent, the further below it ends.", tag: too_big }
      - id: d
        text: "It depends on whether the fall or the rise comes first"
        mistake: { fix: "Either order ends at the same place: down 20% then up 20%, or up then down, both end 4% lower.", tag: depends_on_order }
    answer: a
    explanation: >
      The rise works on the smaller amount the fall left, so the same percent wins back less than was lost. Down 20% then up 20% ends at 96% of the start, and so does up 20% then down 20%.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), on compounding returns over time: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-log-add-three
    skill: log-return
    prompt: >
      Bombay, 31 March 1992. Meera holds a log return for each of the Sensex's last three years. Her biggest client wants one score for all three before lunch. What should she do with them?
    choices:
      - { id: a, text: "Add them: back-to-back log returns simply join up" }
      - id: b
        text: "Multiply them, the way growth factors combine"
        mistake: { fix: "Multiplying is for ordinary growth factors. Log returns of back-to-back years simply add.", tag: mixed_up_terms }
      - id: c
        text: "Average them and send the average"
        mistake: { fix: "An average gives one typical year. The whole stretch is all three years joined together.", tag: averaged_gain }
      - id: d
        text: "Send only the biggest year, since it drove the climb"
        mistake: { fix: "Every year counts. The log returns of all three back-to-back years add up.", tag: mixed_up_terms }
    answer: a
    explanation: >
      Log returns of back-to-back periods add up to the log return of the whole stretch. That is the whole point of them: Meera has no compounding to untangle, so her client gets the answer in one easy step.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), continuously compounded returns: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-log-round-trip
    skill: log-return
    prompt: >
      Ravi bought a share at ₹200 in January 1992. It shot to ₹250, then slid back to ₹200 by 31 March. At dinner he insists he came out ahead. What do his two log returns say?
    choices:
      - { id: a, text: "They cancel out to zero: he ended where he began" }
      - id: b
        text: "They join up to a gain, since the rise looked bigger"
        mistake: { fix: "He ended where he began, so his two log returns add up to zero: no gain.", tag: back_where_started }
      - id: c
        text: "They cannot be joined, since one is up and one is down"
        mistake: { fix: "Back-to-back log returns always join up, rises and falls alike. That is why analysts use them.", tag: mixed_up_terms }
      - id: d
        text: "They join up to a loss, since a fall hurts more"
        mistake: { fix: "He ended where he began, so there is no loss either: his two log returns add to zero.", tag: back_where_started }
    answer: a
    explanation: >
      Ravi's share ends where it began, so the log return of the whole stretch is zero. His two log returns add up to that, so they are the same size with opposite signs. The ordinary returns, up 25% and down 20%, do not add, which is why the round trip fooled him.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), continuously compounded returns: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-log-smaller
    skill: log-return
    prompt: >
      31 March 1992. Asha's family fund rose 20% this year. Her father, who signs the cheques, asks why the log return on her report looks smaller than 20%. What should she tell him?
    choices:
      - { id: a, text: "That is normal: for a rise, the log return is a little smaller" }
      - id: b
        text: "It is a typo: the two should match exactly"
        mistake: { fix: "They match only when nothing changes. For a rise, the log return comes out a little smaller.", tag: too_big }
      - id: c
        text: "It is a typo: the log return should be a bit bigger"
        mistake: { fix: "For a rise, the log return is smaller than the ordinary return, never bigger.", tag: too_big }
      - id: d
        text: "Log returns skip some trading days, so they shrink"
        mistake: { fix: "A log return uses only the start and the end price, never the days between them.", tag: mixed_up_terms }
    answer: a
    explanation: >
      For a rise, a log return always comes out a little below the ordinary return, because it is the score that lets periods add rather than compound. Nothing is missing from Asha's report: both describe the same 20% rise.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), continuously compounded returns: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-log-why
    skill: log-return
    prompt: >
      Bombay, March 1992. Neha starts as a trainee at a broking firm and sees Meera score every share with log returns. Her first client meeting is tomorrow, so she asks why. What should Meera say?
    choices:
      - { id: a, text: "Back-to-back log returns simply add up, so long runs are easy" }
      - id: b
        text: "Log returns always come out bigger, so results look better"
        mistake: { fix: "For a rise, a log return comes out a little smaller than the ordinary return.", tag: too_big }
      - id: c
        text: "Log returns leave compounding out of the picture"
        mistake: { fix: "Log returns keep compounding in. They just turn it into adding.", tag: mixed_up_terms }
      - id: d
        text: "Log returns need only dates, so prices can be skipped"
        mistake: { fix: "A log return needs the price at the start and at the end.", tag: mixed_up_terms }
    answer: a
    explanation: >
      Ordinary returns of back-to-back periods have to be compounded, but log returns simply add up to the log return of the whole stretch. That is why Meera, and analysts like her, use them to score long runs in one step.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), continuously compounded returns: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-log-two-years
    skill: log-return
    prompt: >
      March 1992. The Sensex closes above 4,000 for the first time, but Mr Shah's sleepy share ends the year where it began. Which log return line on his 31 March statement is right?
    choices:
      - { id: a, text: "Zero: no change at all means a log return of zero" }
      - id: b
        text: "A small gain, because the market rose around it"
        mistake: { fix: "His share's own start and end are equal, so its log return is zero, whatever the market did.", tag: too_big }
      - id: c
        text: "A small loss, because he missed the bull run"
        mistake: { fix: "Missing a rally is no loss. Ending where it began gives a log return of zero.", tag: too_small }
      - id: d
        text: "Blank: a flat year has no log return"
        mistake: { fix: "A log return needs only the start and the end, and here they are equal: zero.", tag: mixed_up_terms }
    answer: a
    explanation: >
      No gain and no loss means a log return of zero, whatever the Sensex did that year. That is also why a rise and the fall back to the start cancel out.
    source: >
      CFA Institute, Rates and Returns (refresher reading, 2026), continuously compounded returns: https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/rates-and-returns

  - id: cp-q-lingo-compounding
    skill: compound-growth
    prompt: >
      What do analysts call growth that is earned on earlier growth, so each year's gain joins the total?
    choices:
      - { id: a, text: "Compounding" }
      - id: b
        text: "Simple interest"
        mistake: { fix: "Simple interest pays on the starting amount only. It does not earn on earlier gains.", tag: simple_growth }
      - id: c
        text: "A base year"
        mistake: { fix: "A base year is an index's starting point, not a kind of growth.", tag: mixed_up_terms }
      - id: d
        text: "A bull run"
        mistake: { fix: "A bull run is a stretch of rising prices. It does not say how the growth builds.", tag: mixed_up_terms }
    answer: a
    explanation: >
      Compounding means each year's gain joins the total, and the next year grows on that bigger total.
    source: >
      Investor.gov (US SEC), What is compound interest: https://www.investor.gov/additional-resources/information/youth/teachers-classroom-resources/what-compound-interest

  - id: cp-q-lingo-cagr
    skill: cagr
    prompt: >
      What do analysts call the one steady yearly rate that joins a start value and an end value?
    choices:
      - { id: a, text: "The CAGR, or compound annual growth rate" }
      - id: b
        text: "The base rate"
        mistake: { fix: "A base rate is a central bank's lending rate, not a growth rate between two values.", tag: mixed_up_terms }
      - id: c
        text: "The rule of 72"
        mistake: { fix: "The rule of 72 is a shortcut for doubling time. It does not join two values.", tag: mixed_up_terms }
      - id: d
        text: "A log return"
        mistake: { fix: "A log return scores one stretch so that periods add. It is not a steady yearly rate.", tag: mixed_up_terms }
    answer: a
    explanation: >
      The CAGR is the steady rate that, grown year after year, turns the start into the end.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 7.4 Applications of TVM in Finance: https://openstax.org/books/principles-finance-2e/pages/7-4-applications-of-tvm-in-finance

checks:
  # One idea per Check (spec #229, "The Concept step"; part of #248): each card teaches one Skill and its Check tests it.
  # The three old Check ids keep their place, so this is a content-only restructure; the three new Checks sit between.
  - id: cp-quiz-compounding
    kind: quiz
    questions: [cp-q-three-years, cp-q-lingo-compounding]
    templates: [grow-amount]
    # The fixed question and two typed draws a try.
    perAttempt: 3
    passRule:
      correct: 2
    card:
      title: "Growth on growth"
      lines:
        - "₹1,000 grows 10% a year. After one year it is ₹1,100."
        - "Year two adds 10% of ₹1,100, which is ₹110: ₹1,210."
        - "Year three adds 10% of ₹1,210, which is ₹121: ₹1,331."
        - "Each year's gain is bigger, because it is earned on a bigger total."
      writeDown: "Compounding: each year grows on the new total, not on the start."
      skills: [compound-growth]
      widget:
        recipe: formula
        title: "What ₹1,000 grows to at 10% a year"
        inputs:
          formula: compound-growth
          slider: { symbol: years, label: "Years it grows", min: 1, max: 30, step: 1, start: 3 }
          held: { amount: 1000, ratePercent: 10 }
    quickTries:
      - id: cp-try-grow-half
        skill: compound-growth
        ask: "Asha's ₹2,000 deposit grows 10% a year. Which describes its second year?"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "It adds 10% of ₹2,200, a bigger gain than year one" }
          - { id: b, text: "It adds 10% of ₹2,000 again, the same as year one", mistake: { tag: simple_growth, fix: "The second year's 10% is on ₹2,200, which is bigger than ₹2,000." } }
          - { id: c, text: "It adds nothing, because growth happens only once", mistake: { tag: stops_after_one, fix: "A deposit that grows 10% a year keeps growing every year." } }
        halfDone: "First step, done for you: after one year, ₹2,000 has grown by ₹200 to ₹2,200."
      - { template: grow-amount, halfDone: true }
      - { template: grow-amount }

  - id: cp-quiz-fall-recover
    kind: quiz
    questions: [cp-q-down-up, cp-q-fall-rise-20, cp-q-rise-fall, cp-q-recover-half, cp-q-recover-quarter, cp-q-fall-truth]
    # Two a try from six, so three tries never repeat a question.
    perAttempt: 2
    passRule:
      correct: 2
    card:
      title: "A fall, then a rise"
      lines:
        - "A percent is always a share of the amount you have at that moment."
        - "₹1,000 falls 20%: it loses ₹200 and is now ₹800."
        - "A 20% rise on ₹800 adds only ₹160, so it ends at ₹960."
        - "To get back to ₹1,000 it needs ₹200 more. ₹200 divided by ₹800 is 0.25, so a 25% rise."
      writeDown: "A fall and an equal rise do not cancel: the rise works on a smaller amount."
      skills: [fall-and-recover]
      widget:
        recipe: formula
        title: "₹800 rising for one year"
        inputs:
          formula: compound-growth
          slider: { symbol: ratePercent, label: "The rise after the fall", min: 0, max: 50, step: 1, start: 20 }
          held: { amount: 800, years: 1 }
    quickTries:
      - id: cp-try-fall-half
        skill: fall-and-recover
        ask: "₹500 falls 40%, then rises 40%. Where does it end?"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "Short of ₹500, because the rise works on the smaller ₹300" }
          - { id: b, text: "Back at ₹500, because equal moves cancel", mistake: { tag: back_where_started, fix: "The rise is 40% of ₹300, which is only ₹120, so it ends below the start." } }
          - { id: c, text: "Above ₹500, because a rise beats a fall", mistake: { tag: too_big, fix: "An equal rise after a fall never ends above the start." } }
        halfDone: "First step, done for you: ₹500 down 40% is ₹300."
      - id: cp-try-fall-truth
        skill: fall-and-recover
        ask: "A share falls 10% one day and rises 10% the next. True or false: it is back where it started."
        kind: truth
        answer: false
        mistakes:
          - { answer: true, fix: "The 10% rise is on a smaller price, so it ends 1% below the start.", tag: back_where_started }
      - id: cp-try-recover
        skill: fall-and-recover
        ask: "A price halves, from ₹400 to ₹200. The rise that wins it back is:"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "Bigger than the fall: it must double the price" }
          - { id: b, text: "The same size as the fall", mistake: { tag: back_where_started, fix: "The rise works on ₹200, and ₹200 more on ₹200 is a 100% rise, twice the fall." } }
          - { id: c, text: "Smaller than the fall", mistake: { tag: too_small, fix: "A rise on a smaller price must be bigger to win the same rupees back." } }

  - id: cp-quiz-rule-72
    kind: quiz
    questions: [cp-q-rule-72]
    templates: [double-time]
    perAttempt: 3
    passRule:
      correct: 2
    card:
      title: "Time to double"
      lines:
        - "The rule of 72 is a shortcut for how long money takes to double."
        - "Divide 72 by the yearly rate in percent. The answer is about the number of years."
        - "At 6% a year, 72 divided by 6 is 12, so about 12 years."
        - "Check it: ₹1,000 at 6% for 12 years grows to about ₹2,012, close to double."
      writeDown: "Years to double: about 72 divided by the yearly rate."
      skills: [rule-of-72]
      widget:
        recipe: formula
        title: "What ₹1,000 grows to at 6% a year"
        inputs:
          formula: compound-growth
          slider: { symbol: years, label: "Years it grows", min: 1, max: 30, step: 1, start: 12 }
          held: { amount: 1000, ratePercent: 6 }
    quickTries:
      - id: cp-try-72-half
        skill: rule-of-72
        ask: "Money grows 9% a year. Seventy-two over 9 is 8, and a hundred over 9 is about 11. By the rule of 72, it doubles in about:"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "8 years" }
          - { id: b, text: "11 years", mistake: { tag: simple_doubling, fix: "That is a hundred over the rate. The rule uses 72, and 72 over 9 is 8." } }
          - { id: c, text: "648 years", mistake: { tag: mixed_up_terms, fix: "That multiplies 72 by the rate instead of dividing. A faster rate should mean a shorter wait." } }
        halfDone: "First step, done for you: the rule says seventy-two over the yearly rate."
      - id: cp-try-72-truth
        skill: rule-of-72
        ask: "True or false: by the rule of 72, faster yearly growth means a shorter wait to double."
        kind: truth
        answer: true
        mistakes:
          - { answer: false, fix: "The rule divides 72 by the rate, so a bigger rate gives fewer years.", tag: simple_doubling }
      - { template: double-time }

  - id: cp-quiz-steady-rate
    kind: quiz
    questions: [cp-q-doubling-rate, cp-q-lingo-cagr]
    templates: [steady-rate]
    perAttempt: 3
    passRule:
      correct: 2
    card:
      title: "One steady rate"
      lines:
        - "CAGR, the compound annual growth rate, is the one steady yearly rate that gets from a start to an end."
        - "₹1,000 became ₹1,331 in 3 years. Growing 10% a year does exactly that, so the CAGR is 10%."
        - "Over 2 years, the CAGR is the one rate that, grown on itself twice, gives the whole rise."
        - "100 became 144. 144 divided by 100 is 1.44, and 1.2 times 1.2 is 1.44. 1.2 is 1 plus 20%, so the CAGR is 20% a year."
      writeDown: "CAGR is the one steady rate that joins the start and the end."
      skills: [cagr]
      widget:
        recipe: formula
        title: "The steady rate from 1,000 to 1,331"
        inputs:
          formula: cagr
          slider: { symbol: years, label: "Years it took", min: 1, max: 10, step: 1, start: 3 }
          held: { start: 1000, end: 1331 }
    quickTries:
      - id: cp-try-cagr-half
        skill: cagr
        ask: "An index goes from 100 to 121 in 2 years. A friend says its CAGR is 10.5%, the 21% gain split in two. Is she right?"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "No: growing 10% a year, twice, already gives 21%" }
          - { id: b, text: "Yes: the gain split across the years is the CAGR", mistake: { tag: averaged_gain, fix: "That ignores growth on growth. Growing 10% twice already gives 21%." } }
          - { id: c, text: "No: the CAGR is the whole 21%", mistake: { tag: mixed_up_terms, fix: "The CAGR is one year's steady rate, not the whole rise." } }
        halfDone: "First step, done for you: 121 divided by 100 is 1.21, and 1.1 times 1.1 is 1.21."
      - { template: steady-rate, halfDone: true }
      - { template: steady-rate }

  # No formula recipe shows log returns, so this card has no Widget and the Tutor teaches it in words.
  - id: cp-quiz-log-return
    kind: quiz
    questions: [cp-q-log-return, cp-q-log-add-three, cp-q-log-round-trip, cp-q-log-smaller, cp-q-log-why, cp-q-log-two-years]
    # Two a try from six, so three tries never repeat a question.
    perAttempt: 2
    passRule:
      correct: 2
    card:
      title: "Returns that add up"
      lines:
        - "A log return scores growth another way: divide the end by the start, then press ln on a calculator."
        - "A 20% rise means end divided by start is 1.2. The ln of 1.2 is about 0.18, a little below 0.20."
        - "Its use: the log returns of back-to-back years simply add up. 0.3 one year and 0.1 the next make 0.4 over both."
        - "A price that ends where it began has a log return of zero. So a rise and the fall back to the start add up to zero."
      writeDown: "Log returns of back-to-back years add up to the log return of the whole stretch."
      skills: [log-return]
    quickTries:
      - id: cp-try-log-half
        skill: log-return
        ask: "A fund's log return is 0.1 one year and 0.2 the next. How do they combine for both years?"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "They add, to 0.3" }
          - { id: b, text: "They multiply, to 0.02", mistake: { tag: mixed_up_terms, fix: "Log returns of back-to-back years simply add. Ordinary growth factors multiply." } }
          - { id: c, text: "They average, to 0.15", mistake: { tag: averaged_gain, fix: "An average is one year's typical score. Over both years the log returns add." } }
        halfDone: "First step, done for you: log returns of back-to-back years add together."
      - id: cp-try-log-add
        skill: log-return
        ask: "A share's log return is 0.25 one year and 0.15 the next. How do they combine for both years?"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "They add, to 0.4" }
          - { id: b, text: "They multiply, to about 0.04", mistake: { tag: mixed_up_terms, fix: "Log returns of back-to-back years simply add." } }
          - { id: c, text: "They cancel to zero", mistake: { tag: mixed_up_terms, fix: "Only a rise and an equal fall cancel. Two gains add together." } }
      - id: cp-try-log-truth
        skill: log-return
        ask: "A price doubles, then halves back to where it began. True or false: its two log returns cancel out to zero."
        kind: truth
        answer: true
        mistakes:
          - { answer: false, fix: "It ends where it began, so the whole stretch has a log return of zero, and the two add to that." }

  - id: cp-sensex-rate
    kind: conversation
    skills: [steady-pace, cagr]
    prompt: >
      The Sensex went from 100 to 4,285 in about 13 years. A friend splits the gain evenly and says
      it rose about 322% a year. Explain what is wrong with that, and what kind of yearly rate
      would honestly describe the climb. Then use the July 1990 level of about 1,000 to say
      whether the pace looks steady over those 13 years.
    passCriteria: >
      The Learner explains, in their own words, that growth compounds, so the total gain cannot be
      spread evenly over the years, and that the honest yearly rate is one steady compound rate (a
      CAGR), far lower than the friend's 322%. They note that going from about 1,000 (July 1990) to
      4,285 (March 1992) is more than a four-fold rise in under two years, far faster than the
      long-run pace, so the pace was not steady and the early years must have been slower. The
      Learner does not need to give any rate as a number; the idea is what passes.
    card:
      title: "Is the pace steady?"
      lines:
        - "A long-run CAGR can hide years that grew at very different speeds."
        - "A made-up example: 100 became 600 in 10 years, about 20% a year."
        - "The last 2 years went from 300 to 600, which is 2 times. About 1.41 times 1.41 is 2, so about 41% a year."
        - "When the last stretch is far faster than the whole run, the pace was not steady."
      writeDown: "Find the CAGR of each stretch, not only of the whole run."
      skills: [steady-pace]
      widget:
        recipe: formula
        title: "The steady rate of the last stretch"
        inputs:
          formula: cagr
