    step: concept
    check: fi-wework-read
    recipe: myth_or_fact
    title: "Reading an income statement: myth or fact"
    inputs:
      cards:
        - claim: If revenue grows fast, a company is getting close to profit.
          isFact: false
          why: Profit depends on whether costs grow slower than revenue, not on revenue alone.
          emoji: chart-increasing
        - claim: The bottom line of an income statement is net income, or a net loss.
          isFact: true
          why: It is what is left after costs, interest and tax come off revenue.
          emoji: ledger
        - claim: An income statement shows the cash a company holds today.
          isFact: false
