        outcome: [magnifying-glass-tilted-left, thinking-face]
        outcomeLine: Sees the loss keeping pace with growth.

questions:
  - id: fi-q-net-result
    prompt: >
      WeWork's filing showed revenue of 1.54 billion dollars and a net loss of more than 900 million dollars for six months. What does a net loss tell you?
    choices:
      - { id: a, text: "Costs, interest and tax together were bigger than revenue" }
      - { id: b, text: "Revenue was lower than the year before", mistake: { tag: loss_means_falling_sales, fix: "A net loss says nothing about last year. It means costs beat revenue in this period." } }
      - { id: c, text: "The company has run out of cash", mistake: { tag: loss_means_no_cash, fix: "Cash sits on the balance sheet and cash flow statement. A net loss only says costs beat revenue." } }
      - { id: d, text: "The company paid no tax", mistake: { tag: tax_is_not_a_cost, fix: "Tax is one of the costs. A loss means everything taken off was bigger than revenue." } }
    answer: a
    explanation: >
      Net income is revenue less costs, interest and tax. When those together are bigger than revenue, the bottom line is a net loss.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: fi-q-net-margin
    prompt: >
      What do analysts call the share of each sale that a company keeps as profit?
    choices:
      - { id: a, text: "The net margin" }
      - { id: b, text: "Revenue growth", mistake: { tag: growth_is_not_margin, fix: "Revenue growth is how fast sales rise. It does not say how much of each sale is kept." } }
      - { id: c, text: "The run rate", mistake: { tag: run_rate_is_not_profit, fix: "A run rate scales the latest period's revenue up to a year. It is not a profit measure." } }
      - { id: d, text: "Operating expenses", mistake: { tag: costs_are_not_margin, fix: "Operating expenses are the costs of running the business, not the share of sales kept." } }
    answer: a
    explanation: >
      The net margin is net income set against revenue. For WeWork's first half of 2019 it was negative, about minus 59 per cent: it lost money on every dollar of sales.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 6.6 Profitability Ratios and the DuPont Method (profit margin): https://openstax.org/books/principles-finance-2e/pages/6-6-profitability-ratios-and-the-dupont-method

  - id: fi-q-operating-to-net
    prompt: >
      On an income statement, which two costs come off between operating profit and the bottom line?
    choices:
      - { id: a, text: "Interest and tax" }
      - { id: b, text: "Revenue and sales", mistake: { tag: revenue_is_the_top, fix: "Revenue is the top line, where the statement starts. It does not come off at the end." } }
      - { id: c, text: "Cash on hand and debtors", mistake: { tag: balance_sheet_items, fix: "Those are balance sheet items. The income statement holds revenue, costs and profit." } }
      - { id: d, text: "Dividends and share capital", mistake: { tag: owner_payouts, fix: "Dividends are paid from profit afterwards, and share capital is owners' money. Neither is a cost here." } }
    answer: a
    explanation: >
      An income statement runs from revenue down through the costs of earning it to operating profit, then interest and tax come off to reach net income.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: fi-q-both-doubled
    prompt: >
      Reports put WeWork's revenue and net loss for 2018 each at about double the year before. Was it getting closer to profit?
    choices:
      - { id: a, text: "No: the loss grew as fast as sales, so it was no nearer profit" }
      - { id: b, text: "Yes: doubling revenue always moves a company toward profit", mistake: { tag: growth_means_profit, fix: "Revenue growth helps only if costs grow slower. Here the loss doubled too." } }
      - { id: c, text: "Yes: a bigger loss shows the company is investing well", mistake: { tag: loss_means_investing, fix: "A bigger loss is a bigger gap between costs and revenue. It does not show the money was used well." } }
      - { id: d, text: "Nobody can say without the cash flow statement", mistake: { tag: needs_other_statement, fix: "The income statement alone shows whether the loss kept pace with revenue." } }
    answer: a
    explanation: >
      When revenue and the loss both double, the loss per unit of sales stays about the same. Growth alone did not move the company toward profit.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 6.6 Profitability Ratios and the DuPont Method: https://openstax.org/books/principles-finance-2e/pages/6-6-profitability-ratios-and-the-dupont-method

  - id: fi-q-not-on-statement
    prompt: >
      Which statement about where these items are reported is true?
    choices:
      - { id: a, text: "Revenue for the half-year belongs on the balance sheet", mistake: { tag: revenue_on_balance_sheet, fix: "Revenue covers a period, so it is on the income statement. The balance sheet holds balances at a date." } }
      - { id: b, text: "Interest expense for the half-year belongs on the balance sheet", mistake: { tag: expense_on_balance_sheet, fix: "Interest expense is a cost of the period, so it is on the income statement." } }
      - { id: c, text: "Cash on hand at the end of the half-year belongs on the balance sheet" }
      - { id: d, text: "Income tax for the half-year belongs on the balance sheet", mistake: { tag: tax_on_balance_sheet, fix: "Tax for the period is a cost on the income statement." } }
    answer: c
    explanation: >
      The income statement covers a period and holds revenue, expenses and profit. A balance at a date, such as cash on hand, belongs on the balance sheet.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.1 The Income Statement and 5.2 The Balance Sheet: https://openstax.org/books/principles-finance-2e/pages/5-2-the-balance-sheet

  - id: fi-q-earned
    prompt: >
      A company signs a contract in December but delivers the service in the following March. When does accrual accounting recognise the revenue?
    choices:
      - { id: a, text: "In December, when the contract is signed", mistake: { tag: revenue_at_signing, fix: "Signing is a promise. Revenue is recognised when it is earned, on delivery." } }
      - { id: b, text: "In March, when the service is delivered and the revenue is earned" }
      - { id: c, text: "Whenever the customer's cash arrives, whatever the date", mistake: { tag: revenue_at_cash, fix: "That is cash accounting. Accrual accounting counts revenue when it is earned." } }
      - { id: d, text: "Evenly over the year", mistake: { tag: revenue_spread_evenly, fix: "Revenue follows the delivery of the service, not an even spread." } }
    answer: b
    explanation: >
      Under accrual accounting, revenue is recognised when it is earned, which here is on delivery, not when a contract is signed or cash is received.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 4.3 How Does a Company Recognize a Sale and an Expense: https://openstax.org/books/principles-finance-2e/pages/4-3-how-does-a-company-recognize-a-sale-and-an-expense

  - id: fi-q-top-line
    prompt: >
      What do analysts call a company's revenue?
    choices:
      - { id: a, text: "The top line" }
      - { id: b, text: "The bottom line", mistake: { tag: top_for_bottom, fix: "The bottom line is net income or net loss, at the end of the statement." } }
      - { id: c, text: "The run rate", mistake: { tag: run_rate_is_not_revenue, fix: "A run rate scales the latest period up to a year. It is not revenue earned." } }
      - { id: d, text: "The cash pile", mistake: { tag: cash_for_revenue, fix: "Cash on hand is on the balance sheet. Revenue is the sales earned in a period." } }
    answer: a
    explanation: >
      Revenue sits at the top of the income statement, so analysts call it the top line. The bottom line is what is left at the end.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: fi-q-bottom-line
    prompt: >
      A friend says WeWork's "bottom line" was a loss. What does the friend mean?
    choices:
      - { id: a, text: "Net income came out negative: the last line, after all costs, was a net loss" }
      - { id: b, text: "Its cheapest product lost money", mistake: { tag: bottom_means_cheapest, fix: "The bottom line is the last line of the statement, not a product." } }
      - { id: c, text: "Its lowest month of revenue was weak", mistake: { tag: bottom_means_worst_month, fix: "The bottom line is the result after all costs, not a single weak month." } }
      - { id: d, text: "Its smallest cost was too big", mistake: { tag: bottom_means_smallest_cost, fix: "The bottom line is the final result, after every cost has come off." } }
    answer: a
    explanation: >
      The bottom line is net income, the last line of the income statement. When costs beat revenue it reads as a net loss.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: fi-q-s1
    prompt: >
      What do bankers call the form a company files with the US regulator before it first sells shares to the public?
    choices:
      - { id: a, text: "An S-1" }
      - { id: b, text: "A balance sheet", mistake: { tag: statement_for_filing, fix: "A balance sheet is one statement inside such a filing, not the filing itself." } }
      - { id: c, text: "A dividend", mistake: { tag: dividend_for_filing, fix: "A dividend is a payout to shareholders, not a document." } }
      - { id: d, text: "A run rate", mistake: { tag: run_rate_for_filing, fix: "A run rate is a way of scaling revenue up to a year, not a filing." } }
    answer: a
    explanation: >
      The S-1 is the registration form, or prospectus, filed with the US Securities and Exchange Commission ahead of a first share sale to the public. WeWork's parent made its public on 14 August 2019.
    source: >
      WeWork (The We Company), Form S-1 filed with the US SEC, August 2019: https://www.sec.gov/Archives/edgar/data/1533523/000119312519220499/d781982ds1.htm

checks:
  - id: fi-quiz-statement
    kind: quiz
    questions:
      - fi-q-net-result
      - fi-q-net-margin
      - fi-q-operating-to-net
      - fi-q-both-doubled
      - fi-q-not-on-statement
      - fi-q-earned
      - fi-q-top-line
      - fi-q-bottom-line
      - fi-q-s1
    perAttempt: 3
    passRule:
      correct: 2
  - id: fi-wework-read
    kind: conversation
    prompt: >
      WeWork's filing shows revenue of 1.54 billion dollars and a net loss of more than 900
      million dollars for the first six months of 2019. In your own words, using the terms top
      line and bottom line: is faster revenue growth bringing the company closer to profit, and
      what can an income statement not tell you about whether the company can keep going?
    passCriteria: >
      The Learner says the company spent more than it earned: the bottom line is a net loss of more
      than half of the top line, a net margin of about minus 59% (they need not give a number; in words, it
      loses roughly 60 cents on every dollar of revenue). They explain that growth in revenue (for example,
      revenue and loss both about doubling in 2018) has not narrowed the loss. They note that an income statement covers a period and
      does not show cash on hand, borrowings, or lease commitments, which sit on the balance
      sheet and cash flow statement and decide how long the company can keep losing money.
