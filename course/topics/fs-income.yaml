# The income statement: a foundation Topic taught through a short Case.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
id: fs-income
title: The income statement
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: wework-s1-2019
    title: WeWork's S-1
    data: [revenue-2018, net-loss-2018, revenue-h1-2019, net-loss-h1-2019]
    asOf: 2019-08-14
    story: >
      On 14 August 2019 The We Company, the parent of the office-sharing business WeWork, files
      its prospectus (a form called the S-1) publicly with the US Securities and Exchange
      Commission, as the first step to selling shares to the public. Privately it has been valued at 47 billion
      dollars. The filing shows revenue of 1.54 billion dollars and a net loss of more than 900
      million dollars for the first six months of 2019. For the whole of 2018, reports put its
      revenue at about 1.8 billion dollars and its net loss at about 1.9 billion dollars, both
      about double the year before. The company says it took more than seven years to reach 1
      billion dollars of run-rate revenue, one more year to reach 2 billion, and six months to
      reach 3 billion. A run rate is the latest period's revenue scaled up to a year, not revenue
      that has been earned. As of this date, investors are asking what the income statement
      really says about the business, and nobody knows if the share sale will go ahead.
    reveal: >
      The share sale did not go ahead. After the company's co-founder and chief executive, Adam
      Neumann, stepped down on 24 September, WeWork asked on 30 September 2019 to withdraw its
      prospectus. It never became a profitable company: it listed through a different route in
      2021, and on 6 November 2023 it filed for Chapter 11 bankruptcy protection in the US,
      listing nearly 19 billion dollars of liabilities against about 15 billion dollars of assets.
      The 2019 income statement was already showing the
      problem: for the six months, expenses ran above revenue by more than half of the
      revenue (a net margin of about minus 59 per cent), and rapid revenue growth had not
      narrowed the loss.

concept: >
  The income statement reports a company's performance over a period of time (a quarter, six
  months, a year), not at a date. It starts with revenue (sales) at the top, subtracts the
  costs of earning it to get operating profit, then subtracts interest and taxes to reach net
  income, the bottom line. When expenses exceed revenue the bottom line is a net loss. The net
  margin, net income divided by revenue, says how many cents of each unit of sales is left as
  profit; it is negative for a loss. Revenue growing does not make profit grow: profit depends on
  whether costs grow slower than revenue.

principle: >
  Read the income statement from top to bottom and compare the bottom line with the top. A
  company whose losses keep pace with its revenue growth is not getting closer to profit, and
  a run rate or an adjusted figure is not a substitute for the audited bottom line.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Read an income statement from revenue down to the bottom line."
  - "Judge whether a company is moving toward profit as it grows."
  - "Keep run rates and adjusted figures apart from audited profit."

# Written for the story-first spec (E6b): terms, a Running example and scenes, and questions that ask about the story and the words (ADR 0009).
exampleCurrency: INR
runningExample:
  text: "A chai stall takes in ₹30,000 in a month and spends ₹35,000."
  numbers: [30000, 35000]
  scene:
    cast:
      - { id: meena, emoji: cook, name: Meena, role: chai stall owner }
    beats:
      - { who: narrator, says: "Meena runs a chai stall. This month customers paid her ₹30,000.", emoji: hot-beverage }
      - { who: narrator, says: "Milk, rent and helpers cost her ₹35,000 in the same month.", emoji: receipt }
      - { who: meena, says: "So the month ended in a loss. Sales alone do not tell the story.", emoji: worried-face }

terms:
  - term: revenue (top line)
    means: The money a company earns from selling its product or service, before any cost comes off.
    pro: Analysts call revenue the top line.
    example: "A chai stall takes ₹30,000 in a month, before paying for milk or rent."
    emoji: money-bag
    inStory: WeWork's filing showed revenue of 1.54 billion dollars for the first six months of 2019.
  - term: net loss (bottom line)
    means: What is left after all costs, interest and tax, when those costs are bigger than revenue.
    pro: The bottom line shows a net loss for the period.
    example: "A stall takes ₹30,000 and spends ₹35,000: that month it made a loss."
    emoji: chart-decreasing
    inStory: WeWork's net loss was more than 900 million dollars in the first six months of 2019.
  - term: operating expenses
    means: The everyday costs of running the business, such as pay, rent and marketing.
    pro: Analysts compare operating expenses with revenue.
    example: "Rent, salaries and electricity at a coaching centre, month after month."
    emoji: receipt
    inStory: WeWork's costs were bigger than its sales, which is why its bottom line was a net loss.
  - term: EBITDA
    means: Profit before interest, tax, and the slow write-off of big purchases (depreciation and amortisation).
    pro: Analysts quote EBITDA, but it is not an audited profit.
    example: "A shop counts its month's profit before loan interest, tax and fridge wear."
    emoji: bar-chart
    inStory: The S-1 shows the bottom line; EBITDA is a different, adjusted measure.
  - term: S-1
    means: The form a company files with the US regulator before it first sells shares to the public.
    pro: Bankers call the filing the S-1, or the prospectus.
    example: "Like a school prospectus with fees and results, but filed with the stock-market regulator."
    emoji: scroll
    inStory: On 14 August 2019 WeWork's parent made its S-1 public.

