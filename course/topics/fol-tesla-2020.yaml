# Follow Topic: Damodaran's do-it-yourself valuation of Tesla (6 Feb 2020), a dated piece taught as a Case.
# The post's text is in the Library (Damodaran's blog); the Tutor quotes it only in short passages with credit.
id: fol-tesla-2020
title: "Follow: Damodaran, Tesla valuation (Feb 2020)"
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: fol-tesla-2020-diy
    title: Damodaran lets readers choose their own Tesla story
    asOf: 2020-02-06
    piece:
      author: Aswath Damodaran
      title: "A Do-it-yourself (DIY) Valuation of Tesla: Of Investment Regrets and Disagreements!"
      published: 2020-02-06
      url: https://aswathdamodaran.blogspot.com/2020/02/a-do-it-yourself-diy-valuation-of-tesla.html
      from: library
      librarySource: Damodaran
    story: >
      On 6 February 2020 Aswath Damodaran, a valuation professor at NYU Stern, published a blog post
      about Tesla. A few days earlier he had valued the company at about $427 a share and, on 30
      January, sold his own shares at $640. The stock then climbed to more than $900 within days.
      Readers on both sides, those who thought he was too hopeful and those who thought he was too
      cautious, attacked his valuation. He wrote that his number was "my" valuation of Tesla and not
      "the" valuation, and he expected disagreement. So he redid the exercise as a menu: four levers
      of value (growth, profitability, investment efficiency and risk), with data from the car and
      technology industries beside each, so that readers could choose their own story and see the
      value that follows. His own story had revenue of $125 billion in 2030, five times its 2019
      level, an operating margin of 12% by 2025, $3 of revenue for each dollar invested in the first
      five years, a 7% cost of capital and a 10% chance that the company fails. The Learner reads the
      post in full, without stopping, and then explains each step of its argument.
    reveal: >
      Prices after 2020 cannot be compared with $427 without adjusting for share splits. Tesla split
      its shares 5-for-1 (trading on the new basis from 31 August 2020) and 3-for-1 (from 25 August
      2022), so one share of February 2020 became 15 shares, and his $427 is about $28.47 on today's
      basis (CNBC; Reuters; Tesla Investor Relations). On 25 October 2021, after Hertz announced an
      order for 100,000 cars, Tesla closed at a record $1,024.86, which put its market value just over
      $1 trillion (AP; Reuters). That is about $341.62 on the basis after both splits. The stock then
      lost about 65% in 2022 and closed the year at $123.18, after losing more than $700 billion of
      market value that year (Wall Street Journal). Even that low price was about four times his $427
      on the same basis. Set against the post: its four stories ran from about $106 to $2,106 a share
      before the splits, and the price moved a long way in both directions around his number. The
      lesson of the post stands apart from who was closer: a value follows from a story you can
      name, and a price can sit far from a value for years in either direction.

concept: >
  A value per share comes from a story, and a story can be reduced to four levers. Growth is the
  revenue the company will reach in ten years (the dollar figure is easier to judge than a growth
  rate, because compounding is hard to feel). Profitability is the operating margin it can settle at
  once growth slows (after operating costs, before interest). Investment efficiency is the sales
  to capital ratio: the dollars of extra revenue each dollar of new investment supports, which sets
  how much the company must reinvest. Risk has two parts: the cost of capital that discounts the
  cash flows, and the chance that the company fails and its value as a going concern is lost.
  Industry data gives each lever a range to test a story against, such as the margins of large
  carmakers against those of large technology companies. Disagreement over a price is healthy; the
  useful question is which lever each side is setting differently, and whether the four settings
  are consistent with one another.

principle: >
  Own your valuation and say it is yours. Before arguing about a value, name the story behind it
  and test each lever against the industry data. The most dangerous valuation is the one where each
  assumption is picked on its own, the best case on every lever at once.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Reduce a valuation story to growth, margin, reinvestment and risk."
  - "Test each of those levers against industry data."
  - "Spot the danger of picking the best case on every lever at once."

questions:
  - id: ft-q-compounding
    prompt: >
      Damodaran warns his Tesla readers that compounding is hard to feel. Picture a Tesla fan who expects revenue to grow 40% a year for five years running. What happens to revenue as those years pass?
    choices:
      - { id: a, text: "Each year adds the same dollars, 40% of today's revenue, so the climb is a straight line", mistake: { tag: simple_not_compound, fix: "Growth also grows: each year's 40% applies to a bigger base, so a straight line understates." } }
      - { id: b, text: "Each year's growth builds on the year before, so the climb steepens and ends far above a straight line" }
      - { id: c, text: "Growth fades by itself as revenue gets bigger, so the climb flattens", mistake: { tag: growth_fades, fix: "The rate stays 40%. A bigger base means bigger dollar gains, not smaller." } }
      - { id: d, text: "Revenue only doubles, because 40% a year is a modest rate", mistake: { tag: modest_rate, fix: "Modest-looking rates compound to a lot. Five years at 40% ends several times larger." } }
    answer: b
    explanation: >
      Compounding means each year's growth is earned on a bigger base, so the climb curves upward. At 40% a year, five years take revenue to more than five times today's. That is why the post suggests judging the dollar revenue in ten years rather than the growth rate.
    source: Compound growth, (1 + g)^n; checked with the calculate tool's future value formula.
  - id: ft-q-reinvestment
    prompt: >
      In Damodaran's own Tesla story, each dollar Tesla invests in its first five years brings in $3 of revenue, a sales-to-capital ratio of 3. What does that say about how much Tesla must invest to grow?
    choices:
      - { id: a, text: "It must invest far more than the revenue it adds, because capital is the bigger number", mistake: { tag: ratio_upside_down, fix: "A ratio of 3 means capital is the smaller number, not the bigger." } }
      - { id: b, text: "It must invest less than the revenue it adds, because each dollar of new capital supports several dollars of sales" }
      - { id: c, text: "It must invest about as much as the revenue it adds, one dollar for each dollar", mistake: { tag: ratio_of_one, fix: "That describes a ratio of 1. A ratio of 3 needs less capital." } }
      - { id: d, text: "The ratio does not matter, because growth is paid for by profit alone", mistake: { tag: ratio_ignored, fix: "The ratio sets how much must be reinvested, whatever the profit." } }
    answer: b
    explanation: >
      Sales to capital says how many dollars of extra revenue each dollar of new investment supports. The higher it is, the less the company must reinvest to grow. A low ratio, such as the $1.37 the post gives for the median carmaker, would need far more capital for the same growth.
    source: Sales-to-capital reinvestment, as set out in Damodaran, "A Do-it-yourself (DIY) Valuation of Tesla", Musings on Markets, 6 February 2020.
  - id: ft-q-failure
    prompt: >
      Damodaran's story gives Tesla a 10% chance of failing. If it fails, its assets are sold for far less than the going business is worth. How does he let that chance into his value?
    choices:
      - { id: a, text: "Weigh both outcomes by their chances, so a small chance of failure trims the value a little" }
      - { id: b, text: "Treat failure as worth nothing, since a failed company has no value", mistake: { tag: failure_worth_nothing, fix: "If it fails a share still fetches something from the assets. That has to be counted." } }
      - { id: c, text: "Ignore the 10%, because survival is far more likely", mistake: { tag: ignore_unlikely, fix: "A small chance of a big loss still lowers the value. It has to be counted." } }
      - { id: d, text: "Value the company at the failure price, to be safe", mistake: { tag: worst_case_value, fix: "Valuing at the worst case ignores that survival is far more likely." } }
    answer: a
    explanation: >
      Each outcome counts in proportion to its chance. Survival counts most, failure counts for its 10%, and the failure price is what the assets sell for, not zero. So the value sits a little below the survival value. This is the second part of the risk lever, apart from the cost of capital.
    source: Expected value of two outcomes; the failure-probability adjustment is the second risk input in Damodaran, "A Do-it-yourself (DIY) Valuation of Tesla", 6 February 2020.
  - id: ft-q-rd
    prompt: >
      Tesla spends heavily on research and development (R&D), and its accounts charge all of it against this year's income. Damodaran treats R&D as an investment instead, written off over several years. What does that do to the operating income in his story?
    choices:
      - { id: a, text: "Operating income looks higher, because most of this year's R&D is no longer charged at once" }
      - { id: b, text: "Operating income looks higher by the whole R&D amount, because the R&D is ignored", mistake: { tag: ignored_writeoff, fix: "Nothing is ignored: the R&D still gets charged, just a piece each year." } }
      - { id: c, text: "Operating income looks lower, because the write-off is a new charge on top", mistake: { tag: subtracted_only, fix: "Think of it as swapping a big charge this year for a smaller one, not adding a charge." } }
      - { id: d, text: "Operating income looks the same, because the cost is only relabelled", mistake: { tag: relabel_only, fix: "Spreading the cost changes how much is charged this year, so income changes." } }
    answer: a
    explanation: >
      Treating R&D as an investment adds back the year's R&D expense and charges only the write-off for the year. When R&D is growing, that charge is smaller, so operating income rises. That is how Damodaran's story improves Tesla's margin.
    source: R&D capitalisation, as described in Damodaran, "A Do-it-yourself (DIY) Valuation of Tesla", Musings on Markets, 6 February 2020.
checks:
  - id: ft-quiz-levers
    kind: quiz
    questions: [ft-q-compounding, ft-q-reinvestment, ft-q-failure, ft-q-rd]
    perAttempt: 3
    passRule:
      correct: 2
  - id: ft-follow-argument
    kind: conversation
    prompt: >
      You have read Damodaran's do-it-yourself Tesla valuation as it stood on 6 February 2020. Explain,
      in your own words and in order, each step of his argument: why he redid the valuation, the
      four levers of value, what industry data he sets beside each lever, the four kinds of story he
      builds from the choices, and how he ends. Then choose a setting for each lever yourself and say
      what kind of company your choices describe.
    passCriteria: >
      The Learner explains why he redid it (the earlier value drew criticism from both sides; he says
      it is his valuation, not the valuation, and welcomes disagreement) and names the four levers in
      order: growth (revenue in ten years), profitability (target operating margin), investment
      efficiency (sales to capital) and risk (cost of capital and the chance of failure). They say
      what data he gives for each: the size and slow growth of the world auto industry, the
      warning about compounding, the margins of carmakers against those of large technology
      companies, the spread of sales to capital across carmakers, and the spread of costs of capital.
      They describe his four stories (big auto, techy auto, FAANG-like auto and make-your-best
      company) and his test for each: whether the story is plausible, not merely possible, with the
      warning against picking the best assumption on every lever. They note how he ends, with his
      choice to sell on his own valuation and no regret at selling before the rise he describes. Their own choices are
      internally consistent with the company they describe. They do not claim to know how Tesla's
      price or value later moved.
