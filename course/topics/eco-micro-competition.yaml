  - id: eco-micro-jio-reasoning
    kind: conversation
    prompt: >
      Reliance Jio is entering an Indian mobile market of a few large networks, with free voice calls and
      data at about Rs 50 a gigabyte (free during its welcome offer). Picture yourself as an Airtel manager. In your own words, what gives Airtel
      and Idea their pricing power today, how could an entrant like Jio threaten it, and what would have
      to be true for a price war to stop?
    passCriteria: >
      The Learner names the earlier structure as an oligopoly of a few large networks whose pricing
      power rested on limited competition and high entry barriers (spectrum, network cost). They
      explain that Jio's backing by a large group and willingness to lose money for years removed
      that protection, so incumbents would have to cut prices or lose customers. They identify at least
      one way a price war can end, such as an entrant or incumbent running out of funds, rivals
      accepting a stable split of customers, or consolidation into fewer players.
