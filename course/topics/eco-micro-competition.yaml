# Competition, market structure and pricing power: a foundation Topic taught through the Reliance Jio launch.
# Stage, place on the default path and prerequisites live in course/outline.yaml.
id: eco-micro-competition
title: Competition, market structure and pricing power

cases:
  - id: jio-launch-2016
    title: Reliance Jio's free launch
    asOf: 2016-09-01
    story: >
      On 1 September 2016, at the 42nd annual general meeting of Reliance Industries, chairman
      Mukesh Ambani announced the tariffs of Reliance Jio, a new 4G mobile network that took six
      years to build. Voice calls on Jio would be free. Data would cost about Rs 50 a gigabyte,
      which Ambani called the cheapest in the world. A "free welcome offer" would give every
      customer free voice and data from 5 September to 31 December 2016, after which there would
      be just 10 simple plans, from Rs 19 a day for occasional users to Rs 149 a month for light
      data users and Rs 4,999 a month for heavy users. Jio said it wanted 100 million users as
      fast as possible. The market it was entering had a handful of large networks, led by Bharti
      Airtel, Vodafone and Idea Cellular. India had a very large number of mobile users, and the BBC reported that
      the telecom industry carried a combined debt of over $50 billion. Jio is backed by Reliance, the
      country's largest private company, and is not expected to make a profit for about five
      years. As of the afternoon of 1 September 2016 nobody knew how the existing networks would
      respond or what would happen to their share prices.
    reveal: >
      The market answered within hours. On 1 September the shares of Bharti Airtel and Idea
      Cellular fell by up to 9 per cent: Idea dropped 9 per cent to Rs 85 and Airtel
      fell 8.99 per cent to Rs 302 during the day. By the close Idea was down about 10 per cent and Airtel
      about 6 per cent. The BBC put the fall in Airtel's market value
      at about $1.3 billion and Idea's at more than $500 million. Airtel had already cut its data
      prices twice in anticipation, and Vodafone argued that its cheapest plans beat Jio's. Jio
      launched officially on 5 September 2016 with its free offer. Analysts were split: customers
      were the clear winners of a price war, but one analyst warned that a business group
      controlling networks, content and start-ups could become a monopoly, and said India needed
      three to five players for prices to normalise. The lesson is not that the incumbents were
      foolish. Their pricing power rested on a few rivals who all wanted profits; a new entrant
      with deep pockets and a different goal (customers first, profit in years) took that away.

concept: >
  A market's structure decides how much pricing power a firm has. In perfect competition many
  sellers offer the same product, so each is a price taker. In monopolistic competition many
  sellers offer slightly different products (a gym with its own classes and location) and each has
  a little pricing power. In an oligopoly a few large sellers watch one another, and each price move
  invites a response, which is why such sellers often avoid price wars. A monopoly has no close
  rival. Pricing power comes from barriers to entry (licences, scale, essential inputs), from
  differentiation and from switching costs. A threat to fight an entrant with a price war is
  believable only if fighting really pays the incumbent once the entrant has arrived; a promise
  that costs the promiser nothing to break does not change what a rational entrant does.

principle: >
  Before trusting a firm's margins, ask what protects them: who could enter, what they would charge,
  and whether the incumbent could afford to fight. Pricing power that rests on rivals behaving
  politely lasts only until someone arrives who is playing a different game.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Tell competitive markets from those with a few sellers or only one."
  - "Find where a firm's pricing power comes from."
  - "Judge whether a threat to fight a newcomer is believable."

questions:
  - id: mc-q-studios
    prompt: >
      January 2016. Isha opens a yoga studio in Pune, a city with dozens of gyms and studios, each with its own classes and location. New ones open and close every year. What do economists call a market like this?
    choices:
      - { id: a, text: "Monopolistic competition: many sellers, each a little different" }
      - { id: b, text: "Perfect competition: identical products, so nobody sets a price", mistake: { tag: missed_differentiation, fix: "Studios differ in classes and place, so each has a little pricing power." } }
      - { id: c, text: "Oligopoly: a few big sellers watching each other", mistake: { tag: miscounted_sellers, fix: "Dozens of small studios is many sellers, far from a few giants." } }
      - { id: d, text: "Monopoly: Isha's studio has no close rival", mistake: { tag: overstated_power, fix: "Plenty of nearby studios are close rivals, and easy entry keeps any one from dominating." } }
    answer: a
    explanation: >
      Many sellers, slightly different products and easy entry make monopolistic competition. Isha can charge a bit more for her own style or a handy location, but if she pushes too far, members walk to the studio down the road, and new ones keep opening.
    source: >
      Adapted from the Executive Assessment Bank (geoffsdesk), MBA-ECON-0013, CC-BY-4.0: https://github.com/geoffsdesk/executive-assessment-bank/blob/main/bank/02-mba-core/economics.json ; the scenario is made up.
  - id: mc-q-empty-threat
    prompt: >
      March 2016. A big ice-cream maker's boss vows to "fight any newcomer to the last rupee". Yet once a rival is in, a price war would cost the maker more than sharing. You're the newcomer: which would you pick, and why?
    choices:
      - { id: a, text: "Enter: once you're in, fighting hurts the maker more, so it's a bluff" }
      - { id: b, text: "Stay out: the boss said it in public", mistake: { tag: believed_cheap_talk, fix: "Words cost nothing; ask whether fighting would pay the maker after you arrive." } }
      - { id: c, text: "Enter and expect a price war, because bosses keep promises", mistake: { tag: assumed_follow_through, fix: "After you enter, the maker picks whatever pays best, and sharing pays better." } }
      - { id: d, text: "Toss a coin: there's no way to predict it", mistake: { tag: gave_up_predicting, fix: "Think from the end: after entry, sharing beats fighting for the maker, so expect sharing." } }
    answer: a
    explanation: >
      A threat is credible only if carrying it out pays when the moment comes. After entry, the incumbent does better sharing the market than fighting, so a rational newcomer treats the vow as cheap talk and enters. Economists find this by reasoning backwards from the last move.
    source: >
      Adapted from the Executive Assessment Bank (geoffsdesk), MBA-ECON-0019, CC-BY-4.0: https://github.com/geoffsdesk/executive-assessment-bank/blob/main/bank/02-mba-core/economics.json ; the scenario is made up.
  - id: mc-q-commitment
    prompt: >
      May 2016. The same ice-cream maker's boss wants the next newcomer to believe the threat of a price war this time. Which move would make that threat believable?
    choices:
      - { id: a, text: "Build a costly new plant whose low costs make fighting pay better than sharing" }
      - { id: b, text: "Repeat the threat in a full-page newspaper ad", mistake: { tag: louder_cheap_talk, fix: "An ad changes no costs or profits, so the threat is still cheap talk." } }
      - { id: c, text: "Hire a tougher-sounding boss", mistake: { tag: swapped_the_boss, fix: "Same costs and profits after entry mean the same choice: sharing still pays better." } }
      - { id: d, text: "Sign long fixed-price deals with shops, ruling out price cuts", mistake: { tag: tied_hands_wrong_way, fix: "Locking prices stops it cutting them, which makes a price war less believable." } }
    answer: a
    explanation: >
      A threat becomes credible when the threatener changes its own payoffs so that carrying it out pays. A plant that lowers its costs, built before anyone enters and impossible to undo, makes fighting the better choice after entry, so a newcomer expects a price war and stays out. This is a commitment device.
    source: >
      Adapted from the Executive Assessment Bank (geoffsdesk), MBA-ECON-0020, CC-BY-4.0: https://github.com/geoffsdesk/executive-assessment-bank/blob/main/bank/02-mba-core/economics.json ; the scenario is made up.
  - id: mc-q-charity-price
    prompt: >
      June 2016. A software firm checks that a buyer is a registered charity, then sells it the same licence 40% cheaper than companies pay. What do economists call this kind of pricing?
    choices:
      - { id: a, text: "Group pricing (third-degree price discrimination): different prices for groups you can check" }
      - { id: b, text: "Predatory pricing: cutting prices to drive rivals out", mistake: { tag: confused_with_predatory, fix: "Predatory pricing aims to kill rivals; here the firm splits its buyers into groups." } }
      - { id: c, text: "Perfect price discrimination: each buyer pays their own top price", mistake: { tag: overstated_discrimination, fix: "That charges every buyer a personal price; here a whole group gets one discount." } }
      - { id: d, text: "A two-part tariff: an entry fee plus a charge per use", mistake: { tag: confused_with_tariff, fix: "A two-part tariff splits one price in two; here two groups pay different prices." } }
    answer: a
    explanation: >
      Charging identifiable groups different prices for the same product is third-degree price discrimination. Charities usually have tighter budgets, so a lower price wins sales a single high price would lose, and checking charity status stops companies from claiming the discount. Student and senior discounts work the same way.
    source: >
      Adapted from the Executive Assessment Bank (geoffsdesk), MBA-ECON-0022, CC-BY-4.0: https://github.com/geoffsdesk/executive-assessment-bank/blob/main/bank/02-mba-core/economics.json ; the scenario is made up.

checks:
  - id: eco-micro-quiz-structure
    kind: quiz
    questions:
      - mc-q-studios
      - mc-q-empty-threat
      - mc-q-commitment
      - mc-q-charity-price
    perAttempt: 3
    passRule:
      correct: 2
  - id: eco-micro-jio-reasoning
    kind: conversation
    prompt: >
      Reliance Jio is entering an Indian mobile market of a few large networks, with free voice calls and
      data at about Rs 50 a gigabyte (free during its welcome offer). Picture yourself as an Airtel manager. In your own words, what gives Airtel
      and Idea their pricing power today, how could an entrant like Jio threaten it, and what would have
      to be true for a price war to stop?
    passCriteria: >
      The Learner names the earlier structure as an oligopoly of a few large networks whose pricing
      power rested on limited competition and high entry barriers (spectrum, network cost). They
      explain that Jio's backing by a large group and willingness to lose money for years removed
      that protection, so incumbents would have to cut prices or lose customers. They identify at least
      one way a price war can end, such as an entrant or incumbent running out of funds, rivals
      accepting a stable split of customers, or consolidation into fewer players.
