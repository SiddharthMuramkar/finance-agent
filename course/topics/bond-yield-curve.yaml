# Yield curve and term structure: a foundation Topic taught through the 1994 flattening of the Treasury curve.
# Case Data (the Treasury yield history) lives in the database; see docs/architecture.md.
# Case sources (checked): US Treasury Daily Par Yield Curve Rates 1993-94 (Case Data); FRED FEDFUNDS monthly average as recorded in notes/case-verification.md
id: bond-yield-curve
title: Yield curve and term structure

cases:
  - id: curve-flattening-1994
    title: The 1994 curve flattening
    data: [treasury-3m, treasury-2y, treasury-10y]
    asOf: 1994-02-03
    story: >
      On 3 February 1994 the US Treasury's par yields were 3.20% on 3-month bills, 4.28% on
      2-year notes and 5.81% on 10-year notes. Lined up by maturity, the yields climbed
      steeply: investors were paid 2.6 percentage points more to lend for ten years than for
      three months. The Federal Reserve's overnight rate had averaged about 3.05% in January.
      In January the 10-year monthly average yield had been 1.61 percentage points above the
      2-year average. Suppose the Fed began to raise the short-term rate it controls. What
      would you expect to happen to the shape of the curve over the following year, and why?
    reveal: >
      On 4 February 1994 the Fed began raising the overnight (federal funds) rate, from about
      3.00% to 3.25%, the first of a series (the overnight rate averaged 5.45% in December 1994). Short yields
      followed it up: the 2-year monthly average went from 4.14% in January to 7.59% in
      December, a rise of 3.45 points, and the 3-month yield from 3.04% to 5.76%. The
      10-year average rose less, from 5.75% to 7.81%, so the gap between the 10-year and
      2-year yields shrank from 1.61 points to 0.22. By the end of 1994 the curve was almost
      flat: on 30 December the Treasury par yields were 5.68% for 3 months, 7.69% for 2 years,
      7.84% for 10 years and 7.89% for 30 years.

concept: >
  The yield curve plots the yields of bonds of the same issuer and credit quality against
  their maturity; the relationship is also called the term structure of interest rates. The
  usual shape slopes upward: longer lending is paid more. A flat curve means short and long
  yields are close, and an inverted curve means long yields are below short ones. The short end
  follows the central bank's policy rate closely. A long yield is roughly an average of the
  short rates the market expects over the bond's life, plus extra pay for the risk of holding a
  long bond. So when a central bank raises rates, short yields rise most, long yields rise
  less, and the curve flattens; when investors expect rates to be cut, long yields fall
  below short ones and the curve can invert. An inverted curve has often come before a
  slowdown, though it is a signal, not a certainty.

principle: >
  The curve is a picture of what the market expects short rates to do. Read its slope as
  a forecast the market is making, then ask what would make the forecast wrong.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Read the yield curve and its usual, flat and inverted shapes."
  - "See how a central bank's moves change the curve's slope."
  - "Read the curve as a forecast of short rates, and ask what could make it wrong."

questions:
  - id: yc-q-shape
    prompt: >
      Long-term yields are below short-term yields. What is this shape of the yield curve called?
    choices:
      - { id: a, text: "Inverted" }
      - { id: b, text: "Normal (upward sloping)" }
      - { id: c, text: "Flat" }
      - { id: d, text: "Steep" }
    answer: a
    explanation: >
      A curve that slopes downward, with long-term rates lower than short-term rates, is called inverted. It is considered unusual.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 10.3 Using the Yield Curve: https://openstax.org/books/principles-finance-2e/pages/10-3-using-the-yield-curve

  - id: yc-q-spread
    prompt: >
      On 3 February 1994, lending to the US government for 2 years paid 4.28% a year, and lending for 10 years paid 5.81%. Draw a line between those two points. What would a trader call its shape?
    choices:
      - { id: a, text: "Normal, sloping up: lenders got paid more for tying their money up longer" }
      - { id: b, text: "Inverted: the 2-year paid more than the 10-year", mistake: { tag: slope_backwards, fix: "The 10-year yield was higher, so the curve sloped up, not down." } }
      - { id: c, text: "Flat: the two yields were about the same", mistake: { tag: missed_gap, fix: "5.81% is clearly above 4.28%, so the line climbs. It is not flat." } }
      - { id: d, text: "Humped: the middle of the curve paid the most", mistake: { tag: invented_hump, fix: "Only two maturities are given, and the longer paid more, so the slope is simply upward." } }
    answer: a
    explanation: >
      The 10-year paid 5.81% against 4.28% for the 2-year, a gap of about 153 basis points (1.53 percentage points). Longer bonds paying more is the normal, upward-sloping shape.
    source: >
      US Department of the Treasury, Daily Treasury Par Yield Curve Rates, 3 February 1994: https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/1994/all?type=daily_treasury_yield_curve&field_tdr_date_value=1994&page&_format=csv

  - id: yc-q-flattening
    prompt: >
      A central bank starts raising its policy rate, again and again. Short-term yields jump. Long-term yields rise too, but by less. What do traders say the curve is doing?
    choices:
      - { id: a, text: "Flattening: the gap between long and short yields narrows" }
      - { id: b, text: "Steepening: the gap widens", mistake: { tag: steepen_flatten_swap, fix: "Short yields rose more, so they caught up with long yields. The gap shrank, not grew." } }
      - { id: c, text: "Nothing: both rose, so the shape stays the same", mistake: { tag: both_rose_no_change, fix: "Shape is about the gap. Unequal rises change the gap, so the shape changes." } }
    answer: a
    explanation: >
      The short end moves with the policy rate. The long yield, which averages expected future short rates with other factors, rises by less, so the gap shrinks.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 10.3 Using the Yield Curve: https://openstax.org/books/principles-finance-2e/pages/10-3-using-the-yield-curve

  - id: yc-q-inversion
    prompt: >
      Why is an inverted yield curve often read as a warning of an economic slowdown?
    choices:
      - { id: a, text: "Investors expect the central bank to cut rates later, as it usually does when the economy weakens, so long yields fall below short ones" }
      - { id: b, text: "Long-term borrowing is always more expensive in a recession" }
      - { id: c, text: "Governments stop issuing short-term bills when a recession is near" }
      - { id: d, text: "An inverted curve causes banks to stop lending" }
    answer: a
    explanation: >
      Central banks often lower rates to stimulate a stagnant economy. If investors expect that, long yields, which average expected future short rates, fall below today's short rates. It is a signal, not a cause.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 10.3 Using the Yield Curve: https://openstax.org/books/principles-finance-2e/pages/10-3-using-the-yield-curve

  - id: yc-q-short-end
    prompt: >
      Which part of the yield curve tracks the central bank's policy rate most closely?
    choices:
      - { id: a, text: "The short end, such as 3-month and 2-year yields" }
      - { id: b, text: "The long end, such as 30-year yields" }
      - { id: c, text: "Only the middle of the curve" }
      - { id: d, text: "No part of it: central banks do not affect yields" }
    answer: a
    explanation: >
      Short-term yields are set largely by what the central bank is doing and is expected to do in the next few years. Long yields depend on expectations over many years.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 10.3 Using the Yield Curve: https://openstax.org/books/principles-finance-2e/pages/10-3-using-the-yield-curve

checks:
  - id: yc-quiz-curve-shapes
    kind: quiz
    questions:
      - yc-q-shape
      - yc-q-spread
      - yc-q-flattening
      - yc-q-inversion
      - yc-q-short-end
      - bank:eab:MBA-ECON-0044
    perAttempt: 3
    passRule:
      correct: 2
  - id: yc-flattening-explain
    kind: conversation
    prompt: >
      Suppose the Fed raises short-term rates several times over a year. Explain what you
      would expect to happen to the 2-year yield compared with the 10-year yield, and what an
      inverted curve would tell you instead.
    passCriteria: >
      The Learner says short yields follow the central bank's rate, while long yields reflect
      the average of rates expected over many years, so a series of rises would lift the short
      end most and narrow the gap. They add that an inverted curve would show the market expecting
      short rates to fall later, often as the economy weakens, and that it is a signal, not a
      certainty.
