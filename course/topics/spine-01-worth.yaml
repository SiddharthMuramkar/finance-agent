# Spine Topic 1 (spec 2026-11-12 C4, C5; ADR 0004): what is a business worth? Price against value, and the four levers,
# taught through Aswath Damodaran's valuation of Amazon.com in February 2000. Every number comes from the Case's valuation
# block (Case amazon-dcf-2000 in val-dcf, borrowed with valuationFrom) or from the valuation engine; computed questions
# hold no figures, code works them out (D2). No Primer: C3 gives Topic 1 none.
# Case sources (checked): Damodaran, "The Dark Side of Valuation ... Can Amazon.com be valued?" (HighGrow.pdf, valuation
# done February 2000) and his amazon2000.xls; Amazon.com Form 10-K405 for 2000 (quarterly share prices).
id: spine-01-worth
title: "What is a business worth? Price against value, and the four levers"
# Why it matters (spec A6): how this Topic helps value a company, for the Tutor to say in its own words.
why: "Valuing a company starts with a story about its business; four levers turn that story into a value you can argue for."
# One line in the Topic bar: what the Learner can do by the end. Words only, never the Insight.
goal: Say what a company is worth as a story with four levers, and say what a price assumes.
exampleCurrency: USD

cases:
  - id: spine-01-amazon-2000
    title: Damodaran values Amazon, February 2000
    # 3 February 2000: about $84 was that day's close, after the fourth-quarter results (verify-amazon-risk-erp.json).
    asOf: 2000-02-03
    story: >
      February 2000. Amazon sells books and music online. In the twelve months to September 1999
      it sold $1,117 million and lost $410 million on its operations. Its shares cost $84. A
      professor in New York, Aswath Damodaran, writes down what he thinks its future looks like:
      how big it gets, what it keeps of each sale, what its growth costs and how risky it is.
      What is Amazon worth, and is $84 a fair price for it?
    reveal: >
      His story came to $35.08 a share against the $84 price. The $84 was already below the year's
      high: a month earlier, in early January 2000, the shares had traded as high as $91.50. The price
      fell through 2000: by the fourth quarter the shares had been as low as $14.88. Neither number
      proves the other wrong: a price is what buyers paid that day, and a value is what one story
      about the business is worth.
    # Damodaran's valuation, written once in val-dcf (spec Appendix B.1); the engine gives $35.04 against his $35.08.
    valuationFrom: amazon-dcf-2000

terms:
  - term: price
    means: What buyers pay for one share today.
    pro: The shares closed at $84.
    example: "A used bike sells for $200 on the day, whatever it is worth to you."
    emoji: label
    inStory: In the story, $84 is what buyers pay for an Amazon share.
  - term: value
    means: What the business's future cash is worth today, for one share, argued from a story.
    pro: On my story the shares are worth $35.
    example: "A mango tree is worth the mangoes it will give you, counted in today's money."
    emoji: thinking-face
    inStory: In the story, the professor works out a value from what he thinks Amazon's future holds.
  - term: revenue
    means: What a company sells in a year, before any costs.
    pro: Revenue for the twelve months to September 1999 was $1,117 million.
    example: "A lemonade stand that sells 300 cups a day at $1 a cup has $300 of revenue a day."
    emoji: money-bag
    inStory: In the story, revenue is how big Amazon gets.
  - term: operating margin
    means: The share of each sale a company keeps from its operations, before tax.
    pro: The operating margin settles at 10%.
    example: "A lemonade stand that keeps 10 cents of every $1 cup has a margin of a tenth."
    emoji: bar-chart
    inStory: In the story, the margin is what Amazon keeps of each sale.
  - term: cost of capital
    means: The return investors need on their money, given the risk they take, used to turn future cash into today's.
    pro: The cost of capital starts at 12.84% and falls as the company matures.
    example: "Lending to a new shop needs a higher return than a bank deposit, because the shop may fail."
    emoji: balance-scale
    inStory: In the story, the cost of capital is how risky Amazon is.

skills:
  - id: price-value
    rule: A price is what buyers pay today; a value is argued from the business's future.
  - id: levers
    rule: "A value is a story set as four levers: how big it gets, what it keeps, what growth costs and how risky it is."
    analogy: Four dials on one machine; the value is what the machine reads.

insight:
  question: Find a story worth the price, and say what you had to change to get there.
  written: The price needed a much bigger or richer Amazon than the professor's story, such as far more sales with a fatter margin; a cheaper cost of capital alone could not get there.
  foundWhen: The Learner reaches a story worth the price and names the levers they changed to get there.
  hints:
    - Move one lever at a time and watch which one moves the value most.
    - Try how big it gets and what it keeps together.

explore:
  before: worth-check
  workbench:
    recipe: value_levers
    case: spine-01-amazon-2000
    title: "Amazon, February 2000: your story"
    inputs:
      caseStory: Damodaran's story
      priceStory: { revenue: 60, margin: 12.5 }

connections:
  - text: Discounted cash flow puts each lever into a value one year at a time, and is where this story's figures come from.
    topics: [val-dcf]
  - text: Damodaran set out the same four levers for Tesla and let his readers move them.
    topics: [fol-tesla-2020]
  - text: A share sale is where a price is first set, before anyone knows what the business will become.
    topics: [fol-twitter-ipo]

concept: >
  A price is what buyers pay for a share today. A value is what the business's future cash is worth
  today. The two can differ for years. A value starts as a story about the business: how big the
  company gets, what it keeps of each sale, what its growth costs, and how risky it is. Each part
  of the story is one lever. Set the four levers and code works out a value. Damodaran's story for
  Amazon had about $39 billion of sales in ten years, a 10% operating margin (10 cents kept from each $1 of sales),
  and $3 of sales for each $1 invested in warehouses and systems.

principle: >
  A value is a story set as four levers. When a price and your value differ, ask what the price
  assumes before you call it wrong.

# You'll learn: shown on the Topic Start card and the Welcome.
youllLearn:
  - "Tell a price, which buyers pay today, from a value, which is argued from the business's future."
  - "Set a company's story as four levers: how big it gets, what it keeps, what growth costs and how risky it is."
  - "Read a price back as the story it needs."

questions:
  - id: worth-q-lever
    kind: which_lever
    prompt: From his story, which change lifts the value most?
    skill: levers
    explanation: Each choice moves one lever a little from his story; the figures below show which one moves the value most. Whenever two more points of margin are on offer, they win.
    computed:
      case: spine-01-amazon-2000
      changes:
        - { id: margin, label: "Margin 10% to 12%", levers: { marginTarget: 12 } }
        - { id: revenue, label: "Sales in year 10 $39bn to $44bn", levers: { revenueYear10: 44000 } }
        - { id: reinvest, label: "Sales to capital 3 to 4", levers: { salesToCapital: 4 } }
        - { id: risk, label: "Cost of capital 12.84% to 11.84%", levers: { costOfCapitalGrowing: 11.84 } }
        - { id: leaner, label: "Sales to capital 3 to 5", levers: { salesToCapital: 5 } }
  - id: worth-q-price
    kind: price_assumes
    prompt: The price is $84. Which story gets there?
    skill: price-value
    explanation: Among these stories, only the bigger Amazon that keeps more of each sale is worth the price; cheaper money or leaner growth alone falls short.
    computed:
      case: spine-01-amazon-2000
      changes:
        - { id: bigger-richer, label: "$60bn of sales and a 12.5% margin", levers: { revenueYear10: 60000, marginTarget: 12.5 } }
        - { id: cheaper-money, label: "$39bn, 10% and a 10% cost of capital", levers: { costOfCapitalGrowing: 10 } }
        - { id: lean, label: "$39bn, 10% and sales to capital 5", levers: { salesToCapital: 5 } }
        - { id: bigger, label: "$50bn of sales and a 10% margin", levers: { revenueYear10: 50000 } }
  - id: worth-q-predict
    kind: predict
    prompt: "If {change} instead of 10%, the value will be:"
    skill: levers
    explanation: The margin is applied to every year's sales, so a few points of margin move the value a long way.
    computed:
      case: spine-01-amazon-2000
      changes:
        - { id: thin, label: "the margin ends at 4%", levers: { marginTarget: 4 } }
        - { id: eight, label: "the margin ends at 8%", levers: { marginTarget: 8 } }
      bands:
        - { id: most, label: "About two thirds", min: 0.4, max: 0.9 }
        - { id: fifth, label: "About a fifth", min: 0.1, max: 0.4 }
        - { id: none, label: "Nothing left for shareholders", max: 0.1 }
  - id: worth-q-direction
    kind: direction
    prompt: Amazon, which opened toy and electronics stores in 1999, will add still more kinds of goods. Which lever moves, and which way?
    skill: levers
    choices:
      - { id: size-up, text: "How big it gets, up" }
      - id: risk-up
        text: How risky it is, up
        mistake: { tag: lever_mixup, fix: "More things to sell means more sales: that is how big it gets, not how risky it is." }
      - id: margin-down
        text: What it keeps, down
        mistake: { tag: lever_mixup, fix: "New lines change how much it sells first; what it keeps of each sale is a separate lever." }
    answer: size-up
    explanation: New things to sell make the company bigger, so the size lever moves up.
    source: "Amazon.com press release, 13 July 1999 (toy and electronics stores launched); the lever as in Damodaran, valuation of Amazon, February 2000 (HighGrow.pdf)"
  - id: worth-q-hold
    kind: cannot_hold
    prompt: Which story contradicts itself?
    skill: levers
    choices:
      - { id: no-invest, text: "Sales grow 35 times in ten years and it invests almost nothing" }
      - id: slow
        text: Sales grow slowly and the margin stays thin
        mistake: { tag: dull_is_fine, fix: "A dull story can still hold together. Fast growth with no spending cannot: more sales need warehouses first." }
      - id: risky
        text: Sales grow fast and investors want a high return for the risk
        mistake: { tag: dull_is_fine, fix: "A fast-growing young company is risky, so a high cost of capital fits the story." }
    answer: no-invest
    explanation: Growth costs money. Selling 35 times as much needs warehouses and systems first.
    source: Damodaran, valuation of Amazon, February 2000 (HighGrow.pdf)
  - id: worth-q-pricevalue
    kind: price_or_value
    prompt: "\"This company's shares trade at ten times its sales, cheaper than its rival's.\" Is that about a price or a value?"
    skill: price-value
    choices:
      - { id: price, text: "A price" }
      - id: value
        text: A value
        mistake: { tag: price_for_value, fix: "Comparing what buyers pay with another company's price is still a price. A value comes from the business's own future cash." }
    answer: price
    explanation: Ten times sales compares what buyers pay; it says nothing about the business's own future cash.
    source: "Illustrative statement, not from the paper; price against value as in Damodaran, valuation of Amazon, February 2000 (HighGrow.pdf)"

checks:
  - id: worth-check
    kind: quiz
    questions: [worth-q-lever, worth-q-price, worth-q-predict, worth-q-direction, worth-q-hold, worth-q-pricevalue]
    perAttempt: 4
    passRule: { correct: 3 }
    card:
      title: A price is paid; a value is argued
      lines:
        - A price is what buyers pay today. A value is what the business's future cash is worth today. The two can differ for years.
        - "A value starts as a story: how big it gets, what it keeps, what growth costs, how risky it is."
        - Each part is one lever. Set the four levers and code works out a value.
        - "His story: $39 billion of sales in ten years, 10% kept, $3 of sales for each $1 invested."
      writeDown: A price is paid. A value is argued, with four levers.
      skills: [price-value, levers]
    quickTries:
      - id: worth-try-pv-half
        skill: price-value
        ask: "\"Amazon is at $84, so it is worth $84.\" Is $84 a price or a value?"
        halfDone: "First step, done for you: $84 is what buyers pay for a share today."
        kind: choice
        answer: price
        choices:
          - { id: price, text: "A price" }
          - id: value
            text: A value
            mistake: { tag: price_for_value, fix: "What buyers pay today is a price, whatever it is called. A value is argued from the business's future." }
      - id: worth-try-pv-story
        skill: price-value
        ask: His story says $35 a share. Is that a price or a value?
        kind: choice
        answer: value
        choices:
          - { id: value, text: "A value" }
          - id: price
            text: A price
            mistake: { tag: value_for_price, fix: "Nobody paid $35: it is worked out from a story about the business, so it is a value." }
      - id: worth-try-pv-trade
        skill: price-value
        ask: Buyers paid about $89 for a share on 3 January 2000. Is that a price or a value?
        kind: choice
        answer: price
        choices:
          - { id: price, text: "A price" }
          - id: value
            text: A value
            mistake: { tag: price_for_value, fix: "A trade is what buyers paid on the day: a price." }
      - id: worth-try-lever-half
        skill: levers
        ask: Amazon will add more kinds of goods to sell, as it did with toys and electronics in 1999. Which lever moves, and which way?
        halfDone: "First step, done for you: more things to sell means more sales."
        kind: choice
        answer: size
        choices:
          - { id: size, text: "How big it gets, up" }
          - id: risk
            text: How risky it is, up
            mistake: { tag: lever_mixup, fix: "More sales is how big it gets, not how risky it is." }
      - id: worth-try-direction-margin
        skill: levers
        ask: Rival shops start cutting their prices to win book buyers. Which lever moves, and which way?
        kind: choice
        answer: margin
        choices:
          - { id: margin, text: "What it keeps, down" }
          - id: size
            text: How big it gets, up
            mistake: { tag: lever_mixup, fix: "Cutting prices to keep buyers lowers what Amazon keeps of each sale; it does not make it bigger." }
      - id: worth-try-lever-computed
        skill: levers
        kind: which_lever
        ask: From his story, which change lifts the value most?
        computed:
          case: spine-01-amazon-2000
          changes:
            - { id: margin, label: "Margin 10% to 12%", levers: { marginTarget: 12 } }
            - { id: reinvest, label: "Sales to capital 3 to 4", levers: { salesToCapital: 4 } }
            - { id: risk, label: "Cost of capital 12.84% to 11.84%", levers: { costOfCapitalGrowing: 11.84 } }
      - id: worth-try-hold
        skill: levers
        ask: Which story holds together?
        kind: choice
        answer: spends
        choices:
          - { id: spends, text: "Sales grow fast and it builds warehouses first" }
          - id: free
            text: Sales grow 35 times in ten years and it invests almost nothing
            mistake: { tag: free_growth, fix: "Growth costs money: selling 35 times as much needs warehouses and systems first." }
  - id: worth-talk
    kind: conversation
    prompt: Tell Amazon's story in two or three sentences, as you would set the four levers. Which lever are you least sure of, and why?
    passCriteria: Gives a size, a margin and either a cost of growth or a risk; ties the value to that story; names one lever as uncertain with a reason; and treats the gap to the price as a question, not proof that the price is wrong.
    skills: [levers, price-value]
