# Percent, percentage points and basis points: a foundation Topic taught through a short Case.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
# Converted (spec #229): four Checks (one idea each, #248), each with a Concept card and Quick tries. Every sum is said in words (ADR 0002).
id: num-percent-bps
title: Percent, percentage points and basis points
# One line in the Topic bar: what the Learner can do by the end. Words only, never the Insight.
goal: Say any rate change in percent, percentage points and basis points, and name its base.
# Stage, place on the default path and prerequisites live in course/outline.yaml.

# A content-only restructure: Check ids pb-quiz-language and pb-fed-language are kept, so passes stay and Learners keep
# their step. No Check is required, so a Learner who passed Percent gets no Due Check.
restructure: content-only
# At the reveal code opens rate_move at the Fed's real move, read from the Case Data across the as-of date.
revealWidget:
  recipe: rate_move
  title: The Fed's move of February 1994
  case: fed-hike-1994
  dataset: fed-funds-target
  inputs: { old: "{before}", new: "{after}", mode: show }
exampleCurrency: INR
runningExample:
  text: A savings rate goes from 4% to 5%.
  numbers: [4, 5]
  scene:
    cast:
      - { id: asha, emoji: woman, name: Asha }
      - { id: bank, emoji: bank, name: The bank }
    beats:
      - { who: narrator, says: "Asha's savings account pays 4 percent a year.", emoji: coin }
      - { who: bank, says: "From today we pay 5 percent.", emoji: chart-increasing }
      - { who: asha, says: "That is one point more, or a hundred basis points.", emoji: thinking-face }

terms:
  - term: percentage point
    means: The plain gap between two rates, found by taking the old rate from the new one.
    pro: The rate rose by a full percentage point.
    example: "A fixed deposit rate going from 6 to 7 percent is up one point."
    emoji: chart-increasing
    inStory: In the story, the reporter will write any move as a fraction of a point.
  - term: basis point
    means: One hundredth of a percentage point, so a hundred basis points make one point.
    pro: Markets are pricing in fifty basis points of cuts.
    example: "100 paise make ₹1, and 100 basis points make 1 point."
    emoji: coin
    inStory: In the story, the bond trader will say any move in basis points.
  - term: rate hike
    means: A central bank raising its policy interest rate, which makes borrowing dearer.
    pro: The central bank delivered a rate hike.
    example: "After a hike, banks usually lift home-loan rates and the monthly EMI grows."
    emoji: high-voltage
    inStory: In the story, everyone waits to see whether the Fed will hike.
  - term: quarter point
    means: A move of one quarter of a percentage point, the same as 25 basis points.
    pro: Markets expect a quarter-point move at the next meeting.
    example: "A quarter of ₹1 is 25 paise, as a quarter point is 25 basis points."
    emoji: label
    inStory: In the story, the Fed's next step could be small or large.
  - term: percent change
    means: How big a move is compared with where the rate started, said as a percent of that start.
    pro: The rate is up eight percent from its old level.
    example: "₹10 more on ₹20 is a big jump. ₹10 more on ₹500 is small."
    emoji: bar-chart
    inStory: In the story, the headline writer measures the move against the old rate.

scenes:
  - id: fed-opening
    step: story
    recipe: story_scene
    title: The day before the Fed decides
    inputs:
      cast:
        - { id: fed, emoji: bank, name: The Fed, role: sets the rate }
        - { id: trader, emoji: man-office-worker, name: A bond trader, role: speaks in basis points }
        - { id: reporter, emoji: woman, name: A reporter, role: writes in points }
      beats:
        - { who: narrator, says: "It is 3 February 1994. The US central bank's rate stands at 3 percent.", emoji: calendar }
        - { who: trader, says: "Cheap loans let many of us hold long-term bonds.", emoji: chart-increasing }
        - { who: narrator, says: "Its committee is meeting. Tomorrow it decides its next step.", emoji: bank }
        - { who: reporter, says: "If it moves, I will write it in fractions of a point.", emoji: newspaper }
        - { who: trader, says: "I will say the same move in basis points.", emoji: megaphone }
      caption: Nobody yet knows whether the Fed will move
      date: "1994-02-03"
  - id: two-ways-to-say-it
    step: concept
    check: pb-quiz-language
    recipe: two_paths
    title: One move, two ways to say it
    inputs:
      question: The same rate move reaches two readers. How does each hear it?
      left:
        emoji: man-office-worker
        name: The trader
        choice: Says it in basis points
        outcome: [megaphone, direct-hit]
        outcomeLine: Short and exact, because a hundred basis points make one point.
      right:
        emoji: woman
        name: The reporter
        choice: Says it in points
        outcome: [newspaper, slightly-smiling-face]
        outcomeLine: Easy to read, and the very same move.
  - id: small-start-big-share
    step: concept
    check: pb-quiz-change
    recipe: money_jar
    title: A point on a small start
    inputs:
      label: Asha's savings rate
      start: 4
      end: 5
      unit: coin
      each: each coin is one point
      words: one more coin is a big share of a small start
  - id: say-which-size
    step: concept
    check: pb-quiz-wording
    recipe: myth_or_fact
    title: Which size do you mean
    inputs:
      cards:
        - claim: A headline saying rates are up one percent is always exact.
          isFact: false
          why: It could mean one point, or one percent of the old rate.
          emoji: red-question-mark
        - claim: Half a percentage point and fifty basis points are the same move.
          isFact: true
          why: A basis point is one hundredth of a point.
          emoji: check-mark-button
        - claim: Up twenty-five percent and up twenty-five points mean the same thing.
          isFact: false
          why: A percent compares with the old rate. Points are the gap itself.
          emoji: cross-mark
  - id: three-people-one-move
    step: concept
    check: pb-fed-language
    recipe: story_scene
    title: Three people, one move
    inputs:
      cast:
        - { id: trader, emoji: man-office-worker, name: The trader }
        - { id: reporter, emoji: woman, name: The reporter }
        - { id: writer, emoji: person, name: The headline writer }
      beats:
        - { who: narrator, says: "Another day, another central bank: a rate goes from 6.25 to 6.75 percent.", emoji: bank }
        - { who: trader, says: "Up fifty.", emoji: megaphone }
        - { who: reporter, says: "Up half a point.", emoji: newspaper }
        - { who: writer, says: "Rates up eight percent!", emoji: loudspeaker }
        - { who: narrator, says: "All three are right. Only one says what size it means." }
  - id: fed-front-page
    step: reveal
    recipe: headline
    title: The morning the Fed moved
    inputs:
      paper: The morning paper
      date: "1994-02-04"
      headline: Fed tightens, a slight increase in pressure on reserve positions
      deck: An imagined front page. No number was announced; traders read one in.
      source: https://www.federalreserve.gov/fomc/19940204default.htm
  - id: name-the-size
    step: principle
    recipe: two_paths
    title: Name the size every time
    inputs:
      question: Two writers describe the same rate move. Whose readers are never confused?
      left:
        emoji: person
        name: The headline writer
        choice: Wrote up one percent
        outcome: [thinking-face, red-question-mark]
        outcomeLine: Readers cannot tell which size was meant.
      right:
        emoji: woman
        name: The careful reporter
        choice: Wrote up a hundred basis points
        outcome: [check-mark-button, slightly-smiling-face]
        outcomeLine: Exact, and nobody can misread it.

skills:
  - id: pts
    rule: Points are the new rate minus the old rate.
  - id: pts-to-bp
    rule: Basis points are points times 100.
    analogy: 100 paise make ₹1.
  - id: bp-to-pts
    rule: Points are basis points divided by 100.
  - id: pct-change
    rule: Percent change is the move divided by the old rate, times 100.
    analogy: ₹10 more on ₹20 is big. ₹10 more on ₹500 is small.
  - id: wording
    rule: Up some percent compares the move with the old rate; points and bp are the gap itself.

cases:
  - id: fed-hike-1994
    title: The Federal Reserve meets in February 1994
    data: [fed-funds-target]
    asOf: 1994-02-03
    story: >
      On 3 February 1994 the overnight federal funds rate, the interest rate the US Federal
      Reserve steers, stands at 3%. Short-term rates have been low for some time, many investors
      have borrowed cheaply to hold long-term bonds, and the Fed's policy committee is meeting,
      due to decide its next step on 4 February. If it acts, the move will be reported in three different ways:
      a bond trader would say it in basis points, a newspaper in fractions of a point, and a
      headline writer might use percent of the old rate. As of this date nobody knows whether the
      Fed will move, by how much, or how the market for long-term bonds will react.
    reveal: >
      On 4 February 1994 the Fed tightened. It announced no numeric target; its statement said the Committee had
      "decided to increase slightly the degree of pressure on reserve positions". The federal
      funds rate went from about 3% to 3.25%, which markets read as 25 basis points. The long end moved far more over the following weeks, as leveraged
      bondholders sold to limit their losses: the US Treasury's 10-year par yield went from 5.81%
      on 3 February to 5.94% on 4 February, 6.15% by 28 February and 7.49% by 9 May, a rise of
      about 168 basis points, while the Fed's total increase by early May was 75 basis points.
      The same 25 was a quarter of a percentage point of the rate and 8.3% of its old level, and
      the long-rate rise that followed was several times larger than the step that set it off.

# Question templates: code draws the numbers and works out the answer. `avoid` keeps the Running example, the Quick
# tries', the Check questions' and the Case's moves out of every draw.
templates:
  # Check 1 tests points too, so its three Quick tries on pts can be shown (review item 0; lesson lint L8).
  - id: pb-t-points-from-move
    skill: pts
    ask: The central bank takes its rate from {a}% to {b}%. A reporter would call the gap…
    label: "{value}"
    params:
      a: { min: 1, max: 9, step: 0.25 }
      d: { min: -1.2, max: 1.2, step: 0.05 }
    derived: { b: "plus(a, d)" }
    answer: points_between
    unit: points
    decimals: 2
    sign: magnitude
    mistakes:
      - { tag: forgot_to_convert, fix: That is basis points. Points are the new rate minus the old rate. }
    avoid: [4, 5, 1, 100, 25, 3, 3.25, 3.5, 7.2, 7.5, 6.25, 6.75, 8, 8.5, 9, 9.4, 6.5, 5.9]
  - id: pb-t-bp-from-move
    skill: pts-to-bp
    ask: The central bank takes its rate from {a}% to {b}%. A bond trader would call that move…
    label: "{value}: the move counted in hundredths of a point"
    params:
      a: { min: 1, max: 9, step: 0.25 }
      d: { min: -1.2, max: 1.2, step: 0.05 }
    derived: { b: "plus(a, d)" }
    answer: bp_from_move
    unit: bp
    decimals: 0
    sign: magnitude
    mistakes:
      - { tag: stopped_at_points, fix: "That is the move in points. Times 100 gives basis points.", label: "{value}: the move left in points" }
      - { tag: used_x10, fix: "One point is 100 basis points, so multiply by 100, not 10.", label: "{value}: the move counted in tenths of a point" }
    halfDone: { shows: "First step, done for you: the move is {points} points.", asks: bp_from_points }
    avoid: [4, 5, 1, 100, 25, 3, 3.25, 3.5, 7.2, 7.5, 6.25, 6.75, 8, 8.5, 9, 9.4, 6.5, 5.9]
  - id: pb-t-points-from-bp
    skill: bp-to-pts
    ask: A trader says the rate is up {bp} basis points. A newspaper would say it is up…
    label: "Up {value}"
    params:
      bp: { min: 10, max: 300, step: 5 }
    answer: points_from_bp
    unit: points
    decimals: 2
    sign: magnitude
    mistakes:
      - { tag: divided_by_10, fix: "Divide by 100, not 10: 100 basis points make 1 point." }
      - { tag: divided_by_1000, fix: "Divide by 100, not 1,000: 100 basis points make 1 point." }
      - { tag: forgot_to_convert, fix: That is still basis points. Divide by 100 for points. }
    avoid: [100, 25, 1, 120, 1.2, 50, 75, 60, 30]
  - id: pb-t-pct-change
    skill: pct-change
    ask: A rate goes from {a}% to {b}%. A headline writer measures the rise against the old level. Which headline gets it right?
    label: "Up {value}: the move set against the old rate"
    params:
      a: { min: 1, max: 9, step: 0.5 }
      d: { min: 0.25, max: 2, step: 0.25 }
    derived: { b: "plus(a, d)" }
    answer: pct_change
    unit: percent
    decimals: 1
    sign: either
    mistakes:
      - { tag: mixed_percent_points, fix: "That is the move in points. Divide it by the old rate, then times 100.", label: "Up {value}: the gap in points, written as a percent" }
    halfDone: { shows: "First step, done for you: the move is {points} points.", asks: pct_change }
    avoid: [4, 5, 1, 100, 25, 3, 3.25, 3.5, 2, 6, 7.5, 1.5, 8, 6.25, 50, 12.5]

concept: >
  A percentage point is the plain gap between two rates: a savings rate going from 4% to 5% has
  risen 1 percentage point. A basis point is one hundredth of a percentage point, so that same
  move is 100 basis points (bp). A percent change compares the move with the starting rate, the
  base: 1 point on a start of 4% is a rise of 25 percent of the old rate. Rates move in points or
  basis points; prices and amounts move in percent. Always say which one you mean.

principle: >
  A change in a rate has two honest sizes, absolute (percentage points or basis points) and
  relative (percent of the old rate), and they differ by a lot. Name the base every time, and
  state rate changes in basis points to avoid mixing them up.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Tell a change in percentage points from a change in percent."
  - "Read rate moves in basis points, the way bond traders quote them."
  - "Name the base of every change so its size is never mixed up."

# Every question that ever was in a Percent Check stays defined, so an old attempt or Review still loads.
# pb-q-bp-definition, pb-q-bond-140 and pb-q-mortgage-rate are in no Check now: Check 1 draws questions from templates instead.
questions:
  - id: pb-q-bp-definition
    skill: pts-to-bp
    prompt: >
      A trader says a rate moved "60 bp". Which plain-words version of that is right?
    choices:
      - { id: a, text: "Six tenths of a percentage point" }
      - { id: b, text: "Six percentage points", mistake: { tag: used_x10, fix: "One point is 100 basis points, so 60 bp is well under one point, not six." } }
      - { id: c, text: "Sixty percentage points", mistake: { tag: forgot_to_convert, fix: "That keeps the 60 but changes the unit. Basis points are hundredths of a point." } }
      - { id: d, text: "Six hundredths of a point", mistake: { tag: divided_by_1000, fix: "Sixty hundredths of a point is 0.6 of a point, not 0.06." } }
    answer: a
    explanation: >
      A basis point is one hundredth of a percentage point, so 60 basis points is 0.6 of a point.
    source: >
      Investor.gov (US SEC), Basis Point glossary entry: https://www.investor.gov/introduction-investing/investing-basics/glossary/basis-point

  - id: pb-q-wrong-description
    skill: wording
    prompt: >
      A central bank lifts its rate from 8.00% to 8.50%. Which headline is clear and true?
    choices:
      - { id: a, text: "Rate up 50 percent", mistake: { tag: mixed_percent_points, fix: "50 is the move in basis points. As a percent of the old 8%, the move is only 6.25%." } }
      - { id: b, text: "Rate up 5 basis points", mistake: { tag: used_x10, fix: "One point is 100 basis points, so half a point is 50 bp, not 5." } }
      - { id: c, text: "Rate up 50 basis points" }
      - { id: d, text: "Rate up half a percent of its old level", mistake: { tag: mixed_percent_points, fix: "Half a point is the gap itself. Measured against the old 8%, the move is 6.25%." } }
    answer: c
    explanation: >
      The change is half a percentage point, which is 50 basis points. Compared with the old 8%,
      half a point is one sixteenth, or 6.25 percent of the old level. "Up 50 percent" would mean a
      new rate of 12%.
    source: >
      Federal Reserve Board, Regulatory Reform glossary, Basis point ("One one-hundredth of a percentage point"): https://federalreserve.gov/regreform/reform-glossary.htm ; the percent figures are the arithmetic of half a point on 8.00%.

  - id: pb-q-bond-140
    skill: bp-to-pts
    prompt: >
      A trader says a bond yield "rose 120 basis points". A newspaper would put that as:
    choices:
      - { id: a, text: "Up 1.2 percentage points" }
      - { id: b, text: "Up 12 percentage points", mistake: { tag: divided_by_10, fix: "Basis points are hundredths of a point, so you divide by 100, not 10." } }
      - { id: c, text: "Up 0.12 percentage points", mistake: { tag: divided_by_1000, fix: "Basis points are hundredths of a point, so you divide by 100, not 1,000." } }
      - { id: d, text: "Up 120 percentage points", mistake: { tag: forgot_to_convert, fix: "That is still basis points. Convert them to points first." } }
    answer: a
    explanation: >
      Basis points are hundredths of a point: 120 basis points is 1.2 percentage points.
    source: >
      Investor.gov (US SEC), Basis Point glossary entry: https://www.investor.gov/introduction-investing/investing-basics/glossary/basis-point

  - id: pb-q-unemployment
    skill: pct-change
    prompt: >
      Unemployment goes from 6% to 9%. A statistician says "up 3 points" and a headline says "up 50 percent". Which statement is correct?
    choices:
      - { id: a, text: "Both are right: 3 points is the gap, and 50 percent compares it with the old 6%" }
      - { id: b, text: "Only the headline is right: the gap is 50 points", mistake: { tag: mixed_percent_points, fix: "This swaps the two sizes. The gap is 3 points; 50 percent is the move measured against the start." } }
      - { id: c, text: "Only the statistician is right: percent never describes a rate move", mistake: { tag: percent_never_for_rates, fix: "A rate can rise by a percent of its old level. The writer just has to say so." } }
      - { id: d, text: "Neither is right, because the new rate is 9 points", mistake: { tag: gave_the_new_level, fix: "9% is where the rate ended. The move is the end minus the start." } }
    answer: a
    explanation: >
      The difference is 9 minus 6, which is 3 percentage points. Compared with the starting 6%, a
      move of 3 points is half of the start, so the relative increase is 50%.
    source: >
      Arithmetic from the Federal Reserve Board's definition of a percentage-point scale for rates (Regulatory Reform glossary): https://federalreserve.gov/regreform/reform-glossary.htm

  - id: pb-q-mortgage-rate
    skill: pts-to-bp
    prompt: >
      A lender cuts its mortgage rate by 0.3 of a percentage point. Traders call that a cut of:
    choices:
      - { id: a, text: "30 basis points" }
      - { id: b, text: "3 basis points", mistake: { tag: used_x10, fix: "One point is 100 basis points, so multiply by 100, not 10." } }
      - { id: c, text: "300 basis points", mistake: { tag: used_x1000, fix: "One point is 100 basis points, so multiply by 100, not 1,000." } }
      - { id: d, text: "0.3 basis points", mistake: { tag: stopped_at_points, fix: "That is the move in points. Times 100 gives basis points." } }
    answer: a
    explanation: >
      0.3 points times 100 is 30 basis points.
    source: >
      Investor.gov (US SEC), Basis Point glossary entry: https://www.investor.gov/introduction-investing/investing-basics/glossary/basis-point

  - id: pb-q-newspaper
    skill: wording
    prompt: >
      A rate goes from 1.5% to 2.25%. A reporter writes "up 50 percent" and a trader says "up 75 basis points". Which statement is true?
    choices:
      - { id: a, text: "Both are true: they are two sizes of one move" }
      - { id: b, text: "Only the trader is true: percent cannot describe a rate", mistake: { tag: percent_never_for_rates, fix: "A rate can rise by a percent of its old level. The writer just has to say so." } }
      - { id: c, text: "Only the reporter is true: basis points are for bonds only", mistake: { tag: bp_as_percent, fix: "Basis points are just hundredths of a point and describe any rate." } }
      - { id: d, text: "They conflict, so one of them must be wrong", mistake: { tag: mixed_percent_points, fix: "75 bp is the gap itself and 50 percent is the gap against the old 1.5%. They agree." } }
    answer: a
    explanation: >
      The rise is 0.75 percentage points, which is 75 basis points. Compared with the old 1.5%, a
      move of 0.75 points is half of the start, so 50%. Both descriptions are true, which is why a
      careful writer says which one is meant.
    source: >
      Federal Reserve Board, Regulatory Reform glossary, Basis point: https://federalreserve.gov/regreform/reform-glossary.htm ; the 50% is the arithmetic of 0.75 points on a start of 1.5%.

  - id: pb-q-up-one-percent
    skill: wording
    prompt: >
      A savings rate goes from 6% to 7%. A headline says "rate up 1%". What is the clearest way to fix it?
    choices:
      - { id: a, text: "Say up 1 percentage point, or up 100 basis points" }
      - { id: b, text: "Leave it: up 1% is exact", mistake: { tag: mixed_percent_points, fix: "Up 1% could mean 1 point, or 1% of the old 6%, which is only 0.06 points. Say points or bp." } }
      - { id: c, text: "Say up 100%", mistake: { tag: bp_as_percent, fix: "100 is the move in basis points, not a percent. As a percent of the old 6%, the move is about 17%." } }
      - { id: d, text: "Say up 1 basis point", mistake: { tag: forgot_to_convert, fix: "One point is 100 basis points, so a rise of 1 point is 100 bp, not 1." } }
    answer: a
    explanation: >
      The gap is 1 percentage point, which is 100 basis points. "Up 1%" could be read as 1 point or as
      1% of the old rate, so a careful writer names the size.
    source: >
      Federal Reserve Board, Regulatory Reform glossary, Basis point: https://federalreserve.gov/regreform/reform-glossary.htm ; the 17% is the arithmetic of 1 point on a start of 6%.

  - id: pb-q-lingo-basis-point
    skill: wording
    prompt: >
      What do bond traders call one hundredth of a percentage point?
    choices:
      - { id: a, text: "A basis point" }
      - { id: b, text: "A base rate", mistake: { tag: mixed_up_terms, fix: "A base rate is a central bank's lending rate, not a unit of change." } }
      - { id: c, text: "A quarter point", mistake: { tag: mixed_up_terms, fix: "A quarter point is a move of 25 basis points, a quarter of a full point." } }
      - { id: d, text: "A percent change", mistake: { tag: mixed_up_terms, fix: "A percent change compares a move with the old rate. It is not a unit of the gap." } }
    answer: a
    explanation: >
      A basis point is one hundredth of a percentage point, so 100 basis points make one full point.
    source: >
      Investor.gov (US SEC), Basis Point glossary entry: https://www.investor.gov/introduction-investing/investing-basics/glossary/basis-point

  - id: pb-q-lingo-quarter-point
    skill: wording
    prompt: >
      When a central bank raises its rate by 25 basis points, what do traders call that step?
    choices:
      - { id: a, text: "A quarter-point hike" }
      - { id: b, text: "A full-point hike", mistake: { tag: mixed_up_terms, fix: "A full point is 100 basis points. 25 basis points is only a quarter of that." } }
      - { id: c, text: "A twenty-five percent hike", mistake: { tag: mixed_percent_points, fix: "25 is the move in basis points. A percent would compare the move with the old rate." } }
      - { id: d, text: "A base-year hike", mistake: { tag: mixed_up_terms, fix: "A base year belongs to index numbers. It has nothing to do with the size of a rate step." } }
    answer: a
    explanation: >
      25 basis points is a quarter of a percentage point, so traders say a quarter-point move.
    source: >
      Federal Reserve Board, Regulatory Reform glossary, Basis point: https://federalreserve.gov/regreform/reform-glossary.htm

  - id: pb-q-lingo-rate-hike
    skill: wording
    prompt: >
      What do analysts call it when a central bank raises its main interest rate?
    choices:
      - { id: a, text: "A rate hike" }
      - { id: b, text: "A rate cut", mistake: { tag: mixed_up_terms, fix: "A cut lowers the rate. A hike raises it." } }
      - { id: c, text: "A percent change", mistake: { tag: mixed_up_terms, fix: "A percent change is a way of sizing any move, up or down. It does not say which way." } }
      - { id: d, text: "A rate base", mistake: { tag: mixed_up_terms, fix: "A base is the old level a change is measured against, not the act of raising a rate." } }
    answer: a
    explanation: >
      A hike raises the rate, a cut lowers it. Markets say "a rate hike" for a rise in the central bank's main rate.
    source: >
      Federal Reserve Board, Regulatory Reform glossary: https://federalreserve.gov/regreform/reform-glossary.htm

checks:
  # Check 1: points and basis points, typed answers only, with new numbers each attempt: one of each Skill a try.
  - id: pb-quiz-language
    kind: quiz
    templates: [pb-t-points-from-move, pb-t-bp-from-move, pb-t-points-from-bp]
    perAttempt: 3
    passRule:
      correct: 2
    card:
      title: One move, two ways
      lines:
        - A savings rate goes from 4% to 5%.
        - "Points: 5 minus 4 is 1 percentage point, how far it moved. A fall, 5% down to 4%, is the same gap."
        - "Basis points (bp for short): 1 point times 100 is 100 bp. It is the same move, in units 100 times smaller."
        - "Going back, bp divided by 100 gives points, as 100 paise make ₹1. So 250 bp is 2.5 points."
      writeDown: Points times 100 give basis points. Basis points divided by 100 give points.
      skills: [pts, pts-to-bp, bp-to-pts]
      widget: { recipe: rate_move, inputs: { old: 4, new: 5, mode: show } }
    quickTries:
      - id: pb-try-a1
        skill: pts
        ask: "A reporter sees a rate go from 3% to 3.5%. What gap would the story report?"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "Half a percentage point" }
          - { id: b, text: "50 percentage points", mistake: { tag: forgot_to_convert, fix: "That is basis points. Points are the new rate minus the old rate." } }
          - { id: c, text: "3.5 percentage points", mistake: { tag: gave_the_new_level, fix: "3.5% is where the rate ended. The gap is the end minus the start." } }
        halfDone: "First step, done for you: the new rate is 3.5% and the old rate is 3%."
      - id: pb-try-a2
        skill: pts-to-bp
        ask: "Same move, 3% to 3.5%. A bond trader would quote it as:"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "50 bp" }
          - { id: b, text: "5 bp", mistake: { tag: used_x10, fix: "One point is 100 basis points, so multiply by 100, not 10." } }
          - { id: c, text: "0.5 bp", mistake: { tag: stopped_at_points, fix: "That is the move in points. Times 100 gives basis points." } }
        halfDone: "First step, done for you: the move is 0.5 points."
      - id: pb-try-a3
        skill: pts-to-bp
        ask: "A rate falls from 7.5% to 7.2%. That is a fall of 0.3 points. A trader would quote the same fall as:"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "30 bp: the fall counted in hundredths of a point" }
          - { id: b, text: "3 bp: the fall counted in tenths of a point", mistake: { tag: used_x10, fix: "One point is 100 basis points, so multiply by 100, not 10." } }
          - { id: c, text: "0.3 bp: the fall left in points", mistake: { tag: stopped_at_points, fix: "That is the fall in points. Times 100 gives basis points." } }
      - id: pb-try-a4
        skill: bp-to-pts
        ask: "A trader says a yield is up 120 bp. A newspaper would say it is up:"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "1.2 points" }
          - { id: b, text: "12 points", mistake: { tag: divided_by_10, fix: "Divide by 100, not 10: 100 bp make 1 point." } }
          - { id: c, text: "0.12 points", mistake: { tag: divided_by_1000, fix: "Divide by 100, not 1,000: 100 bp make 1 point." } }
        halfDone: "First step, done for you: 100 bp make 1 point, so convert by 100."
      - id: pb-try-pts-2
        skill: pts
        ask: "A rate goes from 9% to 9.4%. A reporter would call the gap:"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "0.4 points" }
          - { id: b, text: "40 points", mistake: { tag: forgot_to_convert, fix: "That is basis points. Points are the new rate minus the old rate." } }
          - { id: c, text: "9.4 points", mistake: { tag: gave_the_new_level, fix: "9.4% is where the rate ended. The gap is the end minus the start." } }
      - id: pb-try-pts-3
        skill: pts
        ask: "A rate falls from 6.5% to 5.9%. A reporter would call the size of the fall:"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "0.6 points" }
          - { id: b, text: "60 points", mistake: { tag: forgot_to_convert, fix: "That is basis points. Points are the new rate minus the old rate." } }
          - { id: c, text: "5.9 points", mistake: { tag: gave_the_new_level, fix: "5.9% is where the rate ended. The fall is the gap between start and end." } }
      - { template: pb-t-bp-from-move }
      - { template: pb-t-points-from-bp }
      - { template: pb-t-bp-from-move, halfDone: true }

  # Check 2: percent change only. How a move is worded has its own Check (3), with its own card and Quick tries.
  - id: pb-quiz-change
    kind: quiz
    questions: [pb-q-unemployment]
    templates: [pb-t-pct-change]
    # The fixed question and two typed percent changes with fresh numbers a try.
    perAttempt: 3
    passRule:
      correct: 2
    card:
      title: Compared with the start
      lines:
        - "Same move: 4% to 5%. The move is 1 point."
        - "A percent change compares the move with where the rate started. That start is the base."
        - "Divide the move by the base: 1 divided by 4 is 0.25. Times 100 is 25%."
        - "Why the base matters: ₹10 more on ₹20 is big. ₹10 more on ₹500 is small."
      writeDown: Percent change is the move divided by the old rate, times 100.
      skills: [pct-change]
      widget: { recipe: rate_move, inputs: { old: 4, new: 5, mode: show } }
    quickTries:
      - id: pb-try-b1
        skill: pct-change
        ask: "A rate goes from 2% to 3%. A headline writer measures the move against the old rate and writes that it rose:"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "50%: the 1-point move set against the old 2%" }
          - { id: b, text: "1%: the move in points", mistake: { tag: mixed_percent_points, fix: "That is the move in points. Compare it with the old rate, 2%." } }
          - { id: c, text: "3%: the new rate", mistake: { tag: gave_the_new_level, fix: "3% is where the rate ended. The headline compares the move with the start, 2%." } }
        halfDone: "First step, done for you: the move is 1 point, on a start of 2%."
      - id: pb-try-b2
        skill: pct-change
        ask: "A rate goes from 4% to 4.5%. A headline writer measures the move against the old rate and writes that it rose:"
        kind: choice
        answer: a
        choices:
          - { id: a, text: "12.5%: the half-point move set against the old 4%" }
          - { id: b, text: "0.5%: the move in points", mistake: { tag: mixed_percent_points, fix: "That is the move in points. Compare it with the old rate, 4%." } }
          - { id: c, text: "4.5%: the new rate", mistake: { tag: gave_the_new_level, fix: "4.5% is where the rate ended. The headline compares the move with the start, 4%." } }
      - { template: pb-t-pct-change, halfDone: true }
      - { template: pb-t-pct-change }

  # Check 3: how a move is worded. "Which one is true?" items on the three sizes of one move.
  - id: pb-quiz-wording
    kind: quiz
    questions: [pb-q-newspaper, pb-q-wrong-description, pb-q-up-one-percent, pb-q-lingo-rate-hike, pb-q-lingo-basis-point, pb-q-lingo-quarter-point]
    # One a try from three, so three tries never repeat a question.
    perAttempt: 1
    passRule:
      correct: 1
    card:
      title: Say which size you mean
      lines:
        - "Same move: 4% to 5%. It is 1 point, 100 bp, and 25% of the old rate."
        - "All three are true, but they are different sizes."
        - "Up 1% could mean 1 point, or 1% of the old 4%, which is only 0.04 points. A reader cannot tell."
        - "So say up 1 point or up 100 bp. Rose 25% always means 25% of the old rate, so say the start with it."
      writeDown: Say points or bp for the gap itself. Say percent only for a share of the old rate.
      skills: [wording]
      widget: { recipe: rate_move, inputs: { old: 4, new: 5, mode: show } }
    quickTries:
      - id: pb-try-b3
        skill: wording
        ask: "A rate goes from 2% to 3%. True or false: a headline saying \"rates up 1%\" tells readers exactly which size of move it means."
        kind: truth
        answer: false
        halfDone: "First step, done for you: the move is 1 point, on a start of 2%."
        mistakes:
          - { answer: true, fix: "Up 1% could mean up 1 point, or up 1% of the old 2%. Say up 1 point or up 100 bp.", tag: mixed_percent_points }
      - id: pb-try-b4
        skill: wording
        ask: "A rate goes from 4% to 6%, and a headline says rates rose 50%. True or false: the headline means the rate went up 50 points."
        kind: truth
        answer: false
        mistakes:
          - { answer: true, fix: "Rose 50% compares the move with the old rate, 4%. The move itself is 2 points, or 200 bp.", tag: mixed_percent_points }
      - id: pb-try-word-3
        skill: wording
        ask: "A rate goes from 7% to 8%. True or false: it rose 100 basis points."
        kind: truth
        answer: true
        mistakes:
          - { answer: false, fix: "The move is 1 point, and 1 point is 100 basis points.", tag: mixed_percent_points }

  # Check 4: the conversation Check, on Skills Cards 1 to 3 already teach, so it needs no Quick tries of its own.
  - id: pb-fed-language
    kind: conversation
    skills: [pts, pts-to-bp, pct-change, wording]
    prompt: >
      Three people describe the same central bank move from 6.25% to 6.75%: a trader says "up
      50", a reporter says "half a point", and a headline says "rates up 8 percent". Explain why all
      three can be right, which phrase is most likely to mislead a reader, and how you would
      state the move so nobody can misread it.
    passCriteria: >
      The Learner explains that "50" means basis points (half a percentage point), that "half a
      point" means 0.5 percentage points, and that "8 percent" is the relative change: half a
      point on a start of 6.25% is 8 percent of the old rate. They identify the relative "percent"
      phrase (or the bare "50") as the one most likely to be misread, because a reader may take it
      as 8 or 50 percentage points, and they propose stating the move in basis points or
      percentage points with the starting and ending levels.
    card:
      title: Say it so nobody misreads it
      lines:
        - "Give the start and the end: from 4% to 5%."
        - "Then give the move in points or bp: up 1 point, or up 100 bp."
        - "Up 25% is also true, but only if you also say the start, 4%, because 25% is measured from it."
        - "Never say just up 1%: a reader cannot tell if you mean 1 point or 1% of the old rate."
      writeDown: Say the start, the end, and the move in points or bp.
      skills: [pts, pts-to-bp, wording]
      widget: { recipe: rate_move, inputs: { old: 4, new: 5, mode: show } }
