# Exchange rates and parity: a foundation Topic taught through the 1991 rupee devaluation.
# Case sources (checked): RBI Chronology of Events 1991-2000: https://rbi.org.in/history/Brief_Chro1991to2000.html ; Mint, India's tryst with currency devaluation (2016): https://livemint.com/Money/08f2pqhy1c2Yh2OYTItwDL/Indias-tryst-with-currency-devaluation.html ; IMF, India: Economic Reform and Growth, ch. III: http://www.elibrary.imf.org/display/book/9781557755391/ch03.xml
id: fx-basics
title: Exchange rates and parity

cases:
  - id: rupee-devaluation-1991
    title: The 1991 rupee devaluation
    asOf: 1991-06-30
    story: >
      At the end of June 1991 India was in the middle of an external payments crisis. Foreign
      exchange reserves had fallen to a level that would not pay for even a month of imports.
      Commercial lenders abroad had almost stopped lending to India since mid-1990, and large
      amounts of money held by non-resident Indians had been withdrawn. The authorities kept
      paying their debts only by squeezing imports and by emergency financing from the
      International Monetary Fund. The rupee was not allowed to float: it was fixed by the RBI
      against a basket of currencies, and the RBI adjusted the rate in small daily steps.
      Suppose policymakers decide to cut the rupee's value against other currencies.
      Consider the rupee price of a dollar. If India lowers the rupee's value, what happens to the
      rupee price of imported oil, to the dollar price of Indian exports, and to the
      incentive to send money home or to hold it abroad? How large a cut would be enough?
    reveal: >
      On 1 July 1991 the RBI cut the rupee's value by about 9%. Two days later, on 3 July,
      it cut it by a further 11%. The RBI's own chronology puts the cumulative devaluation at
      about 18% in US dollar terms; the IMF's account says 19%. The two steps compound:
      the rupee kept 91% of its dollar value after the first, and 89% of that after the second,
      which leaves 0.91 x 0.89 = 81% of the original, a fall of 19%. C. Rangarajan, then a
      deputy governor, later wrote that the plan, code-named "hop, skip and jump", was always for
      two stages, to test the market with the first dose. After the first step the market grew
      nervous and expected a larger fall, so the second was brought forward. In March 1992
      India introduced a dual exchange rate, and in March 1993 the two rates were unified in a
      system managed by the market.

concept: >
  An exchange rate is the price of one currency in terms of another, and it can be quoted
  either way: if one Mexican peso costs $0.0625, one dollar costs 16 pesos. When it takes
  more dollars to buy a peso the peso has appreciated, and when it takes fewer it has
  depreciated; one currency's appreciation is the other's depreciation. A devaluation is an
  official cut in the value of a currency that a government has fixed against others.
  Percentage changes need care: a rupee that goes from 75 to 80 per dollar has lost 6.25% of its
  dollar value, while the dollar has gained 6.7% in rupees. Two successive cuts, 10% and then
  20% of the new value, leave 0.90 x 0.80 = 72% of the original value: a 28% fall, not 30%. Over the long term, a currency's value should tend
  toward purchasing power parity (PPP): the exchange rate at which the same traded goods cost
  the same in both countries, since otherwise people would buy where it is cheaper and sell
  where it is dearer. In the short and medium run exchange rates often stray from PPP. A related
  relation, covered interest parity, says a currency with the lower interest rate trades at a
  forward premium that offsets the interest saved, so borrowing abroad and hedging the currency
  gains nothing.

principle: >
  A change in an exchange rate is a change in relative prices: it moves what imports cost, what
  exports earn and what foreign debts weigh, all at once. Always say which currency's value you
  are measuring and in which direction.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Read an exchange rate quoted either way round."
  - "Tell appreciation from depreciation, and measure each from the right base."
  - "Know why currencies drift toward the same price for the same goods over time."

questions:
  - id: fx-q-invert
    prompt: >
      A bank quotes one Mexican peso at $0.0625. The trader at the next desk reads out the same rate as "16 pesos to the dollar". What do traders call that second way of quoting?
    choices:
      - { id: a, text: "The inverse quote: the same rate, read from the dollar's side" }
      - { id: b, text: "A second, different rate for the peso", mistake: { tag: flip_is_new_rate, fix: "Flipping the quote changes nothing. It is the same rate read from the other currency's side." } }
      - { id: c, text: "A devaluation of the peso", mistake: { tag: flip_is_devaluation, fix: "A devaluation is a government cutting a fixed rate. Reading a quote the other way moves nothing." } }
      - { id: d, text: "A forward rate", mistake: { tag: flip_is_forward, fix: "A forward rate is for a later date. This is the same rate, today, quoted the other way." } }
    answer: a
    explanation: >
      Divide both sides of MXN 1 = USD 0.0625 by 0.0625 and you get MXN 16 = USD 1. The quote the other way round is the reciprocal: the same rate, quoted from the other currency.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 3.5 Foreign Exchange Rates: https://openstax.org/books/principles-finance-2e/pages/3-5-foreign-exchange-rates

  - id: fx-q-appreciate
    prompt: >
      The price of one Mexican peso rises from $0.0625 to $0.0800. What has happened to the peso?
    choices:
      - { id: a, text: "It has appreciated" }
      - { id: b, text: "It has depreciated" }
      - { id: c, text: "It has been devalued by its government" }
      - { id: d, text: "Nothing: only the dollar has moved" }
    answer: a
    explanation: >
      It now costs more dollars to buy a peso, so the price of the peso has risen: it has appreciated, and the dollar has depreciated against it. Devaluation applies only when a government deliberately lowers a fixed rate.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 3.5 Foreign Exchange Rates: https://openstax.org/books/principles-finance-2e/pages/3-5-foreign-exchange-rates

  - id: fx-q-exporter
    prompt: >
      A Mexican potter sells goods for $20,000. The exchange rate moves from MXN 16 = USD 1 to MXN 20 = USD 1. Which headline gets it right?
    choices:
      - { id: a, text: "The peso weakened, so the same dollars now buy more pesos and the potter gains in pesos" }
      - { id: b, text: "The peso strengthened, so the potter gains in pesos", mistake: { tag: read_the_rate_backwards, fix: "More pesos per dollar means each peso buys fewer dollars. The peso weakened." } }
      - { id: c, text: "The peso weakened, so the potter earns fewer pesos", mistake: { tag: weak_currency_hurts_exporter, fix: "A weaker peso means each dollar fetches more pesos. The exporter earns more in pesos." } }
      - { id: d, text: "Nothing changes for the potter, because the dollar price is the same", mistake: { tag: ignored_conversion, fix: "The dollars are the same, but converting them now gives a different number of pesos." } }
    answer: a
    explanation: >
      At 16 per dollar $20,000 buys 320,000 pesos; at 20 per dollar it buys 400,000. More pesos per dollar means each peso is worth fewer dollars: the peso depreciated, and the exporter earns more in pesos.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 3.5 Foreign Exchange Rates: https://openstax.org/books/principles-finance-2e/pages/3-5-foreign-exchange-rates

  - id: fx-q-percent
    prompt: >
      The rupee goes from INR 75 = USD 1 to INR 80 = USD 1. Which headline gets it right?
    choices:
      - { id: a, text: "The rupee lost value and the dollar gained, though the two percentage moves are not equal" }
      - { id: b, text: "The rupee gained value, because 80 is a bigger number than 75", mistake: { tag: bigger_number_stronger, fix: "A bigger number of rupees per dollar means each rupee buys less. The rupee lost value." } }
      - { id: c, text: "The rupee and the dollar moved by exactly the same percentage", mistake: { tag: same_percent_both_ways, fix: "Each move is measured from a different starting point, so the two percentages differ." } }
      - { id: d, text: "The rupee was revalued by its government", mistake: { tag: revalued_means_up, fix: "Revaluation raises a fixed rate. Here the rupee lost value against the dollar." } }
    answer: a
    explanation: >
      One rupee was worth 1/75 = $0.013333 and is now worth 1/80 = $0.0125, a fall of 6.25%. The rise in the rupee price of a dollar is 6.67% (80/75 - 1). Both describe one move, measured from different sides.
    source: >
      Arithmetic on the definitions in OpenStax, Principles of Finance (CC BY 4.0), 3.5 Foreign Exchange Rates: https://openstax.org/books/principles-finance-2e/pages/3-5-foreign-exchange-rates

  - id: fx-q-compound
    prompt: >
      A currency is devalued by 15% and then, two days later, by a further 20% of its new value. Which headline gets it right about the total fall?
    choices:
      - { id: a, text: "The total fall is a little less than the two cuts put together, because the second cut bites a smaller value" }
      - { id: b, text: "The total fall is exactly the two cuts put together", mistake: { tag: added_the_cuts, fix: "The second cut is a share of an already smaller value, so the cuts do not simply add." } }
      - { id: c, text: "The total fall is more than the two cuts put together", mistake: { tag: compounding_goes_up, fix: "The second cut applies to a smaller base, so it takes less than 20% of the original." } }
      - { id: d, text: "Nobody can say without the exchange rate", mistake: { tag: needs_the_rate, fix: "The two percentages are enough to say the total is a little below the cuts put together." } }
    answer: a
    explanation: >
      After the first cut the currency is worth 85% of its old value; after the second, 80% of that: 0.85 x 0.80 = 0.68, a total fall of 32%. Putting the cuts together as 35% overstates it.
    source: >
      Arithmetic on the definitions in OpenStax, Principles of Finance (CC BY 4.0), 3.5 Foreign Exchange Rates: https://openstax.org/books/principles-finance-2e/pages/3-5-foreign-exchange-rates

  - id: fx-q-ppp
    prompt: >
      A car sells for $20,000 in the United States. In Canada, where one US dollar buys 1.30 Canadian dollars, the same car sells for C$26,000. What does purchasing power parity mean here?
    choices:
      - { id: a, text: "The two prices match once the exchange rate is applied, so buyers have no reason to shop across the border" }
      - { id: b, text: "The two price tags show the same number", mistake: { tag: same_number_means_parity, fix: "Parity is about value after converting currencies, not matching numbers." } }
      - { id: c, text: "Canada is cheaper, so buyers should go there", mistake: { tag: bigger_number_cheaper, fix: "At parity the converted prices are equal. Neither side is cheaper." } }
      - { id: d, text: "Canada must devalue its dollar", mistake: { tag: parity_is_an_order, fix: "Parity describes prices lining up. It is not an order to any government." } }
    answer: a
    explanation: >
      At USD 1 = CAD 1.30, a $20,000 car costs 20,000 x 1.30 = C$26,000. If it were much cheaper in Canada, buyers would shift there until prices and exchange rates aligned.
    source: >
      OpenStax, Principles of Economics 3e (CC BY-NC-SA), 29.2 Demand and Supply Shifts in Foreign Exchange Markets: https://openstax.org/books/principles-economics-3e/pages/29-2-demand-and-supply-shifts-in-foreign-exchange-markets

checks:
  - id: fx-quiz-rates
    kind: quiz
    questions:
      - fx-q-invert
      - fx-q-appreciate
      - fx-q-exporter
      - fx-q-percent
      - fx-q-compound
      - fx-q-ppp
      - bank:eab:MBA-ECON-0050
      - bank:eab:MBA-ECON-0052
    perAttempt: 3
    passRule:
      correct: 2
  - id: fx-devaluation-explain
    kind: conversation
    prompt: >
      Suppose a country with a fixed exchange rate cuts its currency's value by 10% and then
      by a further 20% of the new value. In your own words, say what this does to the price of
      imports and to the foreign-currency price of exports, why the total fall is a little less
      than the two cuts put together, and how it could help with a payments crisis like India's in 1991.
    passCriteria: >
      The Learner says imports cost more in the home currency and exports cost less in foreign currency, so imports
      are discouraged and exports encouraged. They say the second cut bites an already smaller value, so the total fall
      is a little less than the two cuts put together (the story's figure is 28%, not 30%). They connect it to the crisis: a cheaper
      currency improves the trade balance and the incentive to hold the home currency, which helps restore reserves.
