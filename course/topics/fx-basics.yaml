  - id: fx-devaluation-explain
    kind: conversation
    prompt: >
      Anil's aunt sells cotton shirts to shops in Dubai. The morning after the government cuts the
      rupee's value, she calls him, delighted. Say in your own words why the cut is good news for her.
    passCriteria: >
      The Learner says, in any words, that her shirts now look cheaper to buyers abroad, so she can win
      more orders, or that each dirham or dollar she earns now changes into more rupees. Either idea is
      enough; no numbers are needed.
