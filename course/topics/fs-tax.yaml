# Corporate tax and after-tax cash flows: a foundation Topic taught through India's 2019 corporate tax cut.
# Case Data (the sourced figures and datasets) lives in the database; see docs/architecture.md.
id: fs-tax
title: Corporate tax and after-tax cash flows

cases:
  - id: india-tax-cut-2019
    title: India cuts corporate tax to 22%
    asOf: 2019-09-19
    story: >
      On 19 September 2019 Indian companies paid a base corporate tax rate of 30% on profit. With
      surcharge and cess added, the effective rate for larger companies was about 34.94%. India's
      economy was slowing: growth in the April to June quarter was 5%, down for six quarters in a row
      from 8.1% in early 2018, and a six-year low. The Reserve Bank of India had cut its policy rate
      four times so far in 2019, yet spending and investment remained weak. Economists expected the
      central bank to keep doing the heavy lifting. A company
      choosing whether to build a new factory would compare what it would earn after tax on the
      project with what it had to spend, and the tax rate sits in every year of that comparison.
    reveal: >
      On 20 September 2019 the finance minister, Nirmala Sitharaman, cut the base rate for domestic
      companies from 30% to 22%, for those that gave up exemptions and incentives, which with a 10%
      surcharge and 4% cess is an effective 25.17%, down from 34.94%. They also paid no Minimum
      Alternate Tax. New manufacturing companies incorporated on or after 1 October 2019 that begin
      production by 31 March 2023 could choose a 15% rate (17.01% effective). The cut was
      estimated to cost the government Rs 1.45 lakh crore of revenue. The Sensex jumped 1,921
      points, or 5.32%, in one day, its biggest single-day gain in over a decade.

concept: >
  A company pays tax on profit, not on revenue or cash. Tax = profit before tax x tax rate. Interest
  is deducted before tax, so debt carries a tax shield; depreciation is deducted too, so it reduces
  tax even though it is not a cash cost. A project's after-tax operating cash flow is therefore
  (revenue - cash costs - depreciation) x (1 - tax rate) + depreciation, equivalently
  (revenue - cash costs) x (1 - tax rate) + depreciation x tax rate. A lower tax rate raises
  profit after tax and the cash left for investors, and it also shrinks the value of depreciation
  and interest shields. In India the effective rate adds surcharge and cess on top of the base rate:
  30% x 1.12 x 1.04 = 34.94%. Accounting profit and taxable profit can differ by timing, which
  creates deferred tax.

principle: >
  Always use after-tax cash flows, and know which tax rate applies. A change in the rate moves
  every project's value, so tax policy is a valuation input, not a footnote.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "See how tax falls on profit, and how interest and depreciation lower it."
  - "Turn a project's profit into the cash left after tax."
  - "Treat a change in the tax rate as a change in value."

questions:
  - id: tx-q-after-tax-profit
    prompt: >
      A company reports profit before tax of Rs 1,000 crore and pays Rs 349.4 crore in tax at an effective rate of 34.94%. What do accountants call the Rs 650.6 crore that is left?
    choices:
      - { id: a, text: "Profit after tax" }
      - { id: b, text: "Operating profit", mistake: { tag: called_it_operating_profit, fix: "Operating profit comes before interest and tax; what is left after tax is profit after tax." } }
      - { id: c, text: "Gross profit", mistake: { tag: called_it_gross_profit, fix: "Gross profit is revenue less direct costs, long before tax is taken." } }
      - { id: d, text: "The tax charge", mistake: { tag: called_it_the_tax, fix: "The Rs 349.4 crore is the tax charge; the Rs 650.6 crore is what is left." } }
    answer: a
    explanation: >
      Profit before tax less the tax charge is profit after tax: 1,000 less 349.4 leaves 650.6. The Rs 349.4 crore is the tax itself, not what is left.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement (taxes and net income): https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: tx-q-saving
    prompt: >
      A headline reads: 'Tax cut lifts profits.' The effective tax rate falls from 40% to 30% while a company's profit before tax stays at Rs 1,000 crore. Which statement gets it right?
    choices:
      - { id: a, text: "The tax bill falls, so profit after tax rises, though profit before tax is unchanged" }
      - { id: b, text: "Profit before tax rises, because tax is lower", mistake: { tag: moved_profit_before_tax, fix: "Profit before tax is set before tax is charged, so a rate cut does not move it." } }
      - { id: c, text: "The tax bill falls, but profit after tax is unchanged", mistake: { tag: lost_the_saving, fix: "What the company no longer pays in tax stays with it as profit after tax." } }
      - { id: d, text: "Nothing changes, because the rate is only a label", mistake: { tag: ignored_the_rate, fix: "The effective rate decides how much of the profit goes to tax, so a cut matters." } }
    answer: a
    explanation: >
      At 40% the tax bill was Rs 400 crore; at 30% it is Rs 300 crore. The Rs 100 crore it no longer pays stays with the company as profit after tax, while profit before tax is the same.
    source: >
      A made-up example; the arithmetic is a multiplication.

  - id: tx-q-effective-rate
    prompt: >
      Indian corporate tax can carry a surcharge and a cess, both charged on the tax itself rather than on profit.
      So why does the effective rate land only a little above the base rate (say 20%)?
    choices:
      - { id: a, text: "Because each extra charge is a small percentage of the tax bill, so it lifts the base rate only a little" }
      - { id: b, text: "Because the extra charges are simply added to the base rate as points", mistake: { tag: added_the_points, fix: "They are percentages of the tax, not of profit, so they scale the tax rather than adding points." } }
      - { id: c, text: "Because the surcharge and cess replace the base rate", mistake: { tag: replaced_the_base, fix: "They sit on top of the base tax; they do not take its place." } }
      - { id: d, text: "Because the company gets the surcharge and cess refunded", mistake: { tag: assumed_a_refund, fix: "They are paid, and they are why the effective rate is above the base rate." } }
    answer: a
    explanation: >
      The surcharge and cess are charged on the tax, so they scale the bill up by a modest factor instead of adding whole percentage points of profit. The effective rate therefore sits only a little above the base rate.
    source: >
      A made-up example of how Indian surcharge and cess work on the tax bill.
  - id: tx-q-shield
    prompt: >
      A company records Rs 40 crore of depreciation, which involves no cash leaving the company. Why do analysts still say depreciation gives a 'tax shield'?
    choices:
      - { id: a, text: "It is deducted before tax, so it lowers the tax bill even though no cash went out" }
      - { id: b, text: "It is paid in cash to the tax office", mistake: { tag: thought_depreciation_is_paid, fix: "Depreciation is not a payment; it only lowers taxable profit, which cuts the tax bill." } }
      - { id: c, text: "It raises profit before tax", mistake: { tag: reversed_the_effect, fix: "Depreciation is a cost, so it lowers profit before tax, and with it the tax." } }
      - { id: d, text: "It gives none, because depreciation is a non-cash cost", mistake: { tag: stopped_at_not_cash, fix: "Depreciation itself is non-cash, but the tax it saves is real cash." } }
    answer: a
    explanation: >
      Depreciation is deducted before tax, so it lowers taxable profit and the tax bill. At a 25% rate, Rs 40 crore of depreciation saves Rs 10 crore of tax. Depreciation itself is not cash, but the tax it saves is.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: tx-q-ocf
    prompt: >
      A project's revenue less its cash costs leaves Rs 200 crore, and it also records Rs 50 crore of depreciation. When an analyst builds its after-tax operating cash flow, what happens to the depreciation?
    choices:
      - { id: a, text: "It is deducted to find taxable profit, then added back because no cash went out" }
      - { id: b, text: "It is ignored completely", mistake: { tag: ignored_depreciation, fix: "Ignoring it overstates the tax bill; depreciation lowers taxable profit." } }
      - { id: c, text: "It is deducted twice, once for tax and once for cash", mistake: { tag: deducted_twice, fix: "No cash left the company, so it is deducted once for tax and then added back." } }
      - { id: d, text: "It is paid to the tax office as cash", mistake: { tag: thought_depreciation_is_paid, fix: "Depreciation is an accounting cost, not a payment." } }
    answer: a
    explanation: >
      Depreciation reduces profit before tax, so it cuts the tax bill. But the company never paid it in cash, so after tax is worked out it is added back. Cash flow is therefore better than the after-tax profit by the depreciation amount.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement ; worked from the formula in the Topic.

checks:
  - id: tx-quiz-after-tax
    kind: quiz
    questions:
      - tx-q-after-tax-profit
      - tx-q-saving
      - tx-q-effective-rate
      - tx-q-shield
      - tx-q-ocf
      - bank:eab:MBA-ACC-FA-0039
    perAttempt: 4
    passRule:
      correct: 3
  - id: tx-tax-view
    kind: conversation
    prompt: >
      It is 19 September 2019 and a company is weighing a new Rs 500 crore factory that would earn
      a pre-tax operating profit of Rs 100 crore a year. Explain how the corporate tax rate enters
      the project's after-tax cash flows and what a cut of five percentage points in the effective
      rate (say from 35% to 30%) would do to them.
    passCriteria: >
      The Learner explains that tax is charged on profit, so after-tax cash flow is profit x (1 - tax
      rate) plus any depreciation add-back. They say in their own words that a cut in the rate
      leaves more of the profit with the company, which lifts the project's value; and note that depreciation and
      interest shields are worth somewhat less at a lower rate. Mentioning that weak demand, not tax,
      may still limit investment is a plus.
