# Corporate tax and after-tax cash flows: a foundation Topic taught through India's 2019 corporate tax cut.
# Case Data (the sourced figures and datasets) lives in the database; see docs/architecture.md.
id: fs-tax
title: Corporate tax and after-tax cash flows

cases:
  - id: india-tax-cut-2019
    title: India cuts corporate tax to 22%
    asOf: 2019-09-19
    story: >
      On 19 September 2019 Indian companies paid a base corporate tax rate of 30% on profit. With
      surcharge and cess added, the effective rate for larger companies was about 34.94%. India's
      economy was slowing: growth in the April to June quarter was 5%, down for six quarters in a row
      from 8.1% in early 2018, and a six-year low. The Reserve Bank of India had cut its policy rate
      four times so far in 2019, yet spending and investment remained weak. Economists expected the
      central bank to keep doing the heavy lifting. A company
      choosing whether to build a new factory would compare what it would earn after tax on the
      project with what it had to spend, and the tax rate sits in every year of that comparison.
    reveal: >
      On 20 September 2019 the finance minister, Nirmala Sitharaman, cut the base rate for domestic
      companies from 30% to 22%, for those that gave up exemptions and incentives, which with a 10%
      surcharge and 4% cess is an effective 25.17%, down from 34.94%. They also paid no Minimum
      Alternate Tax. New manufacturing companies incorporated on or after 1 October 2019 that begin
      production by 31 March 2023 could choose a 15% rate (17.01% effective). The cut was
      estimated to cost the government Rs 1.45 lakh crore of revenue. The Sensex jumped 1,921
      points, or 5.32%, in one day, its biggest single-day gain in over a decade.

concept: >
  A company pays tax on profit, not on revenue or cash. Tax = profit before tax x tax rate. Interest
  is deducted before tax, so debt carries a tax shield; depreciation is deducted too, so it reduces
  tax even though it is not a cash cost. A project's after-tax operating cash flow is therefore
  (revenue - cash costs - depreciation) x (1 - tax rate) + depreciation, equivalently
  (revenue - cash costs) x (1 - tax rate) + depreciation x tax rate. A lower tax rate raises
  profit after tax and the cash left for investors, and it also shrinks the value of depreciation
  and interest shields. In India the effective rate adds surcharge and cess on top of the base rate:
  30% x 1.12 x 1.04 = 34.94%. Accounting profit and taxable profit can differ by timing, which
  creates deferred tax.

principle: >
  Always use after-tax cash flows, and know which tax rate applies. A change in the rate moves
  every project's value, so tax policy is a valuation input, not a footnote.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "See how tax falls on profit, and how interest and depreciation lower it."
  - "Turn a project's profit into the cash left after tax."
  - "Treat a change in the tax rate as a change in value."

questions:
  - id: tx-q-after-tax-profit
    prompt: >
      A company earns profit before tax of Rs 1,000 crore. At an effective tax rate of 34.94%, what is its profit after tax?
    choices:
      - { id: a, text: "Rs 650.6 crore" }
      - { id: b, text: "Rs 349.4 crore" }
      - { id: c, text: "Rs 700.0 crore" }
      - { id: d, text: "Rs 1,349.4 crore" }
    answer: a
    explanation: >
      Tax = 1,000 x 0.3494 = 349.4. Profit after tax = 1,000 - 349.4 = 650.6. Rs 349.4 crore is the tax, not what is left.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement (taxes and net income): https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: tx-q-saving
    prompt: >
      A company earns Rs 1,000 crore profit before tax. By how much does its tax bill fall if the effective rate drops from 40% to 30%?
    choices:
      - { id: a, text: "Rs 100 crore" }
      - { id: b, text: "Rs 300 crore" }
      - { id: c, text: "Rs 400 crore" }
      - { id: d, text: "Rs 10 crore" }
    answer: a
    explanation: >
      Old tax 400, new tax 300; the difference is 100, which is 10 percentage points of profit.
    source: >
      A made-up example; the arithmetic is a multiplication.

  - id: tx-q-effective-rate
    prompt: >
      A base corporate tax rate of 20% plus a 10% surcharge on the tax and a 4% cess gives an effective rate of about what?
    choices:
      - { id: a, text: "22.88%" }
      - { id: b, text: "34%" }
      - { id: c, text: "22.00%" }
      - { id: d, text: "20.80%" }
    answer: a
    explanation: >
      The surcharge and cess are charged on the tax, so they multiply: 20% x 1.10 x 1.04 = 22.88%. Adding them as 20% + 10% + 4% = 34% is wrong because they are percentages of the tax, not of profit.
    source: >
      A made-up example of the compounding that Indian surcharge and cess work through; the arithmetic is a multiplication.

  - id: tx-q-shield
    prompt: >
      A company records Rs 40 crore of depreciation. At a 25% tax rate, how much tax does that depreciation save?
    choices:
      - { id: a, text: "Rs 10 crore" }
      - { id: b, text: "Rs 40 crore" }
      - { id: c, text: "Rs 30 crore" }
      - { id: d, text: "Nothing, because depreciation is not a cash cost" }
    answer: a
    explanation: >
      Depreciation is deducted before tax, so it lowers taxable profit by 40 and tax by 40 x 25% = 10. Depreciation itself is not cash, but the tax it saves is.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: tx-q-ocf
    prompt: >
      A project has revenue of Rs 500 crore, cash costs of Rs 300 crore and depreciation of Rs 50 crore, and a tax rate of 25%. What is its after-tax operating cash flow?
    choices:
      - { id: a, text: "Rs 162.5 crore" }
      - { id: b, text: "Rs 112.5 crore" }
      - { id: c, text: "Rs 150.0 crore" }
      - { id: d, text: "Rs 200.0 crore" }
    answer: a
    explanation: >
      Profit before tax = 500 - 300 - 50 = 150. Tax = 37.5. After-tax profit = 112.5. Add back depreciation, which is not cash: 112.5 + 50 = 162.5.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement ; the exercise is worked from the formula in the Topic.

checks:
  - id: tx-quiz-after-tax
    kind: quiz
    questions:
      - tx-q-after-tax-profit
      - tx-q-saving
      - tx-q-effective-rate
      - tx-q-shield
      - tx-q-ocf
      - bank:eab:MBA-ACC-FA-0039
    perAttempt: 4
    passRule:
      correct: 3
  - id: tx-tax-view
    kind: conversation
    prompt: >
      It is 19 September 2019 and a company is weighing a new Rs 500 crore factory that would earn
      a pre-tax operating profit of Rs 100 crore a year. Explain how the corporate tax rate enters
      the project's after-tax cash flows and what a cut of five percentage points in the effective
      rate (say from 35% to 30%) would do to them.
    passCriteria: >
      The Learner explains that tax is charged on profit, so after-tax cash flow is profit x (1 - tax
      rate) plus any depreciation add-back. They compute or reason that a cut from 35% to 30%
      raises after-tax profit on Rs 100 crore from Rs 65 crore to Rs 70 crore, an increase of
      roughly 8%, which lifts the project's value; and note that depreciation and
      interest shields are worth somewhat less at a lower rate. Mentioning that weak demand, not tax,
      may still limit investment is a plus.
