    perAttempt: 3
    passRule:
      correct: 2
  - id: cv-wework-round
    kind: conversation
    prompt: >
      On 8 January 2019 WeWork announced a $2 billion investment from SoftBank, with most of it
      at a post-money valuation of $47 billion and $1 billion of it at a pre-money valuation of
      $20 billion. Say in your own words what pre-money and post-money mean, why $1 billion buys a
      different slice of the company at a $20 billion pre-money valuation than at a $47 billion
      post-money one, and why a $47 billion headline is not the same as a $47 billion cash price
      for the company.
    passCriteria: >
      The Learner defines post-money as pre-money plus the new money, and says a stake is the new
      money measured against post-money. They say a higher valuation means the same cheque buys a
      smaller slice (about 4.8 percent at a $20 billion pre-money valuation, about 2.1 percent at
      a $47 billion post-money one), and need not give exact figures. They explain that the headline is the
      price of the newest shares scaled to all shares, set in one negotiation by one investor and
      with specific terms, so it does not mean anyone could buy the whole company for that amount;
      they may also mention preferences or other rights the new shares carry.
