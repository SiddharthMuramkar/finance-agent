# Market history and long-run returns: a foundation Topic taught through the Sensex boom of 1991-92.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
# Case sources (checked): BSE, SENSEX@40 white paper: https://bseindia.com/downloads1/SENSEX@40-White-Paper.pdf ; Forbes India, Economic Milestone: Stock Market Scam (1992): https://www.forbesindia.com/article/independence-day-special/economic-milestone-stock-market-scam-(1992)/38457/1 ; Rediff, The Sensex story from 1K to 18K: https://www.rediff.com/business/special/spec1/20071009.htm ; OpenStax, Principles of Finance 2e, 12.4.
id: eq-history
title: Market history and long-run returns

cases:
  - id: sensex-boom-1992
    title: The Sensex at the end of March 1992
    data: [sensex-year-end, sensex-march-1992-close]
    asOf: 1992-03-31
    story: >
      It is 31 March 1992. The BSE Sensex, India's best-known share index, was set at 100 in 1979. It closed
      1989 at 779 and 1990 at 1,048, a rise of about 35% in 1990. On 2 January 1991 it stood at 999. After the
      reforms of mid-1991 and the July budget it rose 82% in the calendar year to 1,909 at the end of 1991. On 15
      January 1992 it crossed 2,000 and on 29 February, after the next budget, it closed at 3,018, up 9.4% in
      a day. In March alone it rose 42% and today it closed at 4,285, more than four times its level of fifteen
      months ago. You are asked what the market might do from here.
      Before you answer, ask yourself whether a run like this looks like what shares usually do over many years, or
      something far out of the ordinary. What would you want to know to tell a lasting re-rating from a bubble?
    reveal: >
      The Sensex reached its high close of 4,467 in April 1992 (Forbes India puts the rise from April 1991 at 274%, from 1,194 to 4,467). On
      28 April it fell 12.77% in a day, as the securities scam came to light; it fell 5% over April and 23% in May.
      It ended 1992 at 2,615, about 41% below the April high, though still 37% up over the calendar year. It then rose 28% in 1993 to 3,346
      and 17% in 1994 to 3,927 before falling 21% in 1995 to 3,110. BSE's white paper counts positive returns in 75% of
      the last 40 calendar years: a long upward trend with violent years inside it. Zoom out to a longer record. In the US, over 1981-2020, large
      company stocks returned an average of 12.64% a year against 8.21% for ten-year Treasury bonds and 3.94% for
      bills, with annual standard deviations of 16.06%, 9.92% and 3.39%; inflation averaged 2.93%. Higher
      average returns came with bigger swings. A rise of 274% in a year is not a normal return; and what falls
      faster than it rose is the lesson: after a fall of 41%, the index needed a rise of about 71% just to get back to its high.

concept: >
  A return is the gain on an investment as a percentage of what was invested, with dividends included. Returns
  over several years are compared by converting them to a yearly rate. The arithmetic average adds the yearly
  returns and divides; the geometric average (compound annual growth rate) takes the nth root of the total growth
  factor and is the one that matches what an investor actually earned. A fall hurts more than an equal rise
  helps: after a 50% fall you need a 100% rise to be back where you started. Returns are quoted in nominal terms, or
  in real terms after inflation, where the real return is (1 + nominal) / (1 + inflation) - 1. Long records of
  markets show three things: shares have on average earned more than bonds and cash over long periods, which is
  the reward for risk (the equity risk premium); the average hides wide swings from year to year, measured by the standard deviation; and
  booms and busts recur, with prices sometimes running far ahead of earnings. Markets that have just risen sharply
  tell you little about future returns; the starting price and what is paid for earnings matter more. A single
  extreme year, up or down, is a poor guide to the normal range, so history needs many years and an honest eye on the
  worst of them.

principle: >
  The long-run record rewards patience but punishes buying after a spectacular run. Judge a return by its yearly
  rate, its risk and where it started.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Compare returns over many years by their yearly compound rate, not their simple average."
  - "See why a fall hurts more than an equal rise helps, and why inflation must come out of a return."
  - "Judge a market's record by its risk, its worst years and the price paid at the start."

questions:
  - id: eh-q-cagr
    prompt: >
      At dinner on 31 March 1992, Riya's uncle brags his shares "grew 40% a year on average". Riya wants the one steady yearly pace that, repeated, links his start to today. What do investors call it?
    choices:
      - { id: a, text: "The compound annual growth rate, or CAGR" }
      - { id: b, text: "The simple average of each year's change", mistake: { tag: averaged_changes, fix: "A plain average ignores that each year builds on the last; that is the uncle's shortcut." } }
      - { id: c, text: "The real return", mistake: { tag: mixed_up_terms, fix: "Real return allows for rising prices; it is not the steady rate linking start and end." } }
      - { id: d, text: "The standard deviation", mistake: { tag: mixed_up_terms, fix: "Standard deviation measures how much returns swing, not the steady pace of growth." } }
    answer: a
    explanation: >
      The CAGR is the one steady yearly rate that, compounded, links the start value to the end value. When returns swing, a simple average of the yearly changes overstates what an investor actually earned, which is why long-run records quote compound rates.
    source: >
      OpenStax, Principles of Finance 2e (CC BY 4.0), 13.1 Measures of Center (geometric mean for growth rates): https://openstax.org/books/principles-finance-2e/pages/13-1-measures-of-center

  - id: eh-q-up-down
    prompt: >
      Kunal is saving for his daughter's college fees. An agent shows him a fund that gained 50% one year and lost 50% the next, and says, "Average the two years and you lost nothing." Which statement gets it right?
    choices:
      - { id: a, text: "Kunal would have ended below the start, because the loss applied to a bigger amount" }
      - { id: b, text: "He would have broken even, because the gain and the loss cancel", mistake: { tag: averaged_returns, fix: "Gains and losses of the same size do not cancel; the loss falls on a bigger base." } }
      - { id: c, text: "He would have ended above the start, because the gain came first", mistake: { tag: order_myth, fix: "The order does not rescue the investor; the second-year loss is taken on the bigger amount." } }
      - { id: d, text: "No one can say without knowing the amounts in rupees", mistake: { tag: needs_rupees, fix: "The answer does not depend on the starting amount; the same pattern leaves any investor behind." } }
    answer: a
    explanation: >
      Start with Rs 100: a gain of 50% takes it to Rs 150, and a loss of 50% on that bigger amount takes it to Rs 75. The plain average of +50% and -50% is zero, but the investor has lost 25%: the geometric average is about -13.4% a year.
    source: >
      OpenStax, Principles of Finance 2e (CC BY 4.0), 13.1 Measures of Center (arithmetic and geometric mean): https://openstax.org/books/principles-finance-2e/pages/13-1-measures-of-center

  - id: eh-q-recover
    prompt: >
      Meera's shares drop 40% in one bad month. She tells her friend, "I only need a 40% climb to be even again." Is she right?
    choices:
      - { id: a, text: "No. She needs a bigger climb than 40%, because the gain starts from a smaller price" }
      - { id: b, text: "Yes. A 40% climb undoes a 40% drop, because a gain undoes a loss of the same size", mistake: { tag: same_percent_undoes, fix: "A 40% rise starts from the lower price, so it lands short of the old price." } }
      - { id: c, text: "No. She needs a smaller climb than 40%, because the price is now lower", mistake: { tag: lower_base_myth, fix: "The lower base means each point of gain is worth less, so the rise must be bigger." } }
      - { id: d, text: "No. The shares can never get back, because losses are permanent", mistake: { tag: losses_permanent, fix: "Prices can recover; the point is only that the rise needed is bigger than the fall." } }
    answer: a
    explanation: >
      Starting at 100, a fall of 40% leaves 60. To get back to 100 the price must rise by 40 / 60 = 66.7%, more than the 40% it fell.
    source: >
      OpenStax, Principles of Finance 2e (CC BY 4.0), 13.1 Measures of Center (working with growth factors): https://openstax.org/books/principles-finance-2e/pages/13-1-measures-of-center

  - id: eh-q-real
    prompt: >
      Dev's savings earned 15% last year, but prices in the shops rose 10%. His grandfather says, "You are far less than 15% richer." What is the grandfather pointing at?
    choices:
      - { id: a, text: "The real return: what he earned once the rise in prices is allowed for" }
      - { id: b, text: "The nominal return: the headline figure before allowing for prices", mistake: { tag: mixed_up_terms, fix: "The headline 15% is the nominal return, which Dev already has; his grandfather means the figure after prices." } }
      - { id: c, text: "The risk premium: the extra return for taking risk", mistake: { tag: mixed_up_terms, fix: "A risk premium is the extra return for taking risk, not an adjustment for rising prices." } }
      - { id: d, text: "The expected return: what is likely in future", mistake: { tag: mixed_up_terms, fix: "Expected return looks forward at what is likely; his grandfather is adjusting what was already earned." } }
    answer: a
    explanation: >
      Real return allows for rising prices: (1.15 / 1.10) - 1 = 4.5%. Simply taking away the price rise (15 - 10 = 5%) is a rough approximation that overstates it when inflation is high.
    source: >
      OpenStax, Principles of Finance 2e (CC BY 4.0), 7.4 Applications of TVM in Finance (nominal versus real interest rates): https://openstax.org/books/principles-finance-2e/pages/7-4-applications-of-tvm-in-finance

  - id: eh-q-risk-return
    prompt: >
      On 31 March 1992, as the Sensex soars, Isha's grandfather warns that shares beat safe Treasury bills over the long run "but you pay for it in sleepless nights". Over the long US record, which headline gets it right?
    choices:
      - { id: a, text: "Shares earned more on average, and swung far more year to year" }
      - { id: b, text: "Shares earned more and swung less", mistake: { tag: no_free_lunch, fix: "Higher average returns came with bigger swings, never smaller ones." } }
      - { id: c, text: "Bills earned more, while shares swung more", mistake: { tag: reversed_reward, fix: "Over long US records shares out-earned bills; the swings were the price of that." } }
      - { id: d, text: "Both earned and swung about the same", mistake: { tag: no_difference, fix: "The long record shows a clear gap: more return for shares, and more swing." } }
    answer: a
    explanation: >
      In the long US record, large-company stocks earned well above Treasury bills on average, with much wider swings from year to year (a bigger standard deviation). More return came with more risk: that extra reward is the equity risk premium.
    source: >
      OpenStax, Principles of Finance 2e (CC BY 4.0), 12.4 Historical Picture of Returns to Stocks: https://openstax.org/books/principles-finance-2e/pages/12-4-historical-picture-of-returns-to-stocks

checks:
  - id: eh-quiz-returns
    kind: quiz
    questions:
      - eh-q-cagr
      - eh-q-up-down
      - eh-q-recover
      - eh-q-real
      - eh-q-risk-return
    perAttempt: 3
    passRule:
      correct: 2
  - id: eh-judge-boom
    kind: conversation
    prompt: >
      The index has more than quadrupled in fifteen months, and your cousin wants to put his wedding
      savings in tomorrow. In your own words, what is the one thing you would check first, and why?
    passCriteria: >
      The Learner names one check and says why it matters: earnings and valuation (what buyers now pay
      for the profits), where the money for the buying comes from (borrowing, leverage), how broad the
      buying is, or how big a fall could be. They recognise that more than quadrupling in fifteen months
      is a pace far above what shares earn over many years, so the run is no guide to a normal year.
      They may add that a fall needs a bigger rise to recover, or that a lasting re-rating needs profits
      to grow into the price.
