      - bank:eab:MBA-ACC-FA-0026
    perAttempt: 4
    passRule:
      correct: 3
  - id: rr-run-rate-view
    kind: conversation
    prompt: >
      You are an investor reading WeWork's S-1 on 14 August 2019. The filing boasts of
      $3 billion of run-rate revenue; first-half revenue was $1.54 billion with a net loss of
      about $905 million. Say in your own words what the run-rate figure does and does not tell you, and name
      two questions you would put to the company before trusting it.
    passCriteria: >
      The Learner explains that a run rate scales a recent period to a year (the S-1 used the last
      month's revenue times twelve), so it is a pace and an assumption, not recorded revenue, and that recorded
      first-half revenue is the smaller, firmer figure.
      They note it says nothing about costs or profit: the company was losing more than half a dollar on every dollar of
      revenue. They raise at least two sensible questions, for example how the run rate is
      defined, how much revenue is recurring, how long customers commit, whether revenue is gross
      or net, or what the path to profit is.

