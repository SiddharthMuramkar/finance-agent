# Fiscal policy and government debt: a foundation Topic taught through the UK mini-budget and gilt crisis of 2022.
# Stage, place on the default path and prerequisites live in course/outline.yaml.
id: eco-fiscal-debt
title: Fiscal policy and government debt

cases:
  - id: uk-mini-budget-2022
    title: The UK mini-budget and gilt crisis
    asOf: 2022-09-23
    story: >
      On Friday 23 September 2022 the UK Chancellor, Kwasi Kwarteng, announces a "mini-budget": a package of
      about 45 billion pounds of tax cuts, the biggest in 50 years, with no matching spending cuts or tax
      rises. The Treasury declines to publish a forecast from the independent Office for Budget
      Responsibility. Inflation is already high, and the day before, the Bank of England raised its policy
      rate for the seventh time in a row, to the highest level in 14 years. So fiscal policy is loosening
      while monetary policy tightens. The government pays for its spending by selling bonds called gilts;
      buyers include UK pension funds. Many defined-benefit pension schemes use "liability-driven investment"
      (LDI): a roughly 1.5 trillion pound market in which funds borrow against their gilts and hold long
      gilts as collateral to match their long-term promises to pensioners. As the trading day on 23 September
      begins, nobody knows how investors will price the extra borrowing.
    reveal: >
      Markets rejected the plan. On Monday 26 September the pound fell nearly 5 per cent at one point to
      $1.0327, its lowest since Britain went decimal in 1971. Gilt prices fell sharply, so yields rose. Some
      long-dated bonds held in pension funds lost around half their value in days, and the funds received
      margin calls, demands for more collateral. To raise cash they had to sell gilts, which pushed prices
      down further and set off a spiral. On Wednesday 28 September the Bank of England, acting through its
      Financial Policy Committee, announced temporary purchases of long-dated gilts, up to 65 billion pounds
      over 13 working days, up to 5 billion pounds a day until 14 October, and postponed its planned gilt
      sales; the Treasury agreed to cover any losses. It was a financial-stability measure and not a cut in
      interest rates. Economists at ING also noted that the mini-budget had added about 62 billion pounds of
      gilt issuance in that fiscal year. The case shows that a government's ability to borrow rests on
      credibility, and that leverage in the holders of its bonds can turn a bond sell-off into a crisis.

concept: >
  Fiscal policy is the government's use of taxes and spending. The budget deficit is how much the
  government borrows in one year; the national debt is the total borrowed over time. The debt-to-GDP ratio
  compares the debt to the size of the economy: it can fall even when the government still runs a deficit,
  if GDP grows faster than the debt. Automatic stabilisers such as unemployment benefits and progressive
  taxes cushion the cycle without new laws, while discretionary stimulus needs a decision. Government
  borrowing can crowd out private investment when the economy is near full capacity, because it competes for
  the same savings and raises interest rates. Investors will hold a government's bonds only at a yield that
  compensates for the risk they see in them. Many bond holders borrow to hold bonds (leverage), which
  magnifies their gains and their losses.

principle: >
  A government's room to borrow is a matter of confidence as well as arithmetic. Look at the deficit, the
  debt ratio, and who holds the bonds and how they have financed them.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Tell a government's yearly deficit from its total debt."
  - "See how the debt ratio moves with growth as well as borrowing."
  - "Judge a government's room to borrow by confidence as well as arithmetic."

questions:
  - id: fd-q-deficit-debt
    prompt: >
      What is the difference between a government's budget deficit and its national debt?
    choices:
      - { id: a, text: "The deficit is what the government borrows in one year; the debt is the total borrowed over time" }
      - { id: b, text: "The deficit is the total borrowed over time; the debt is what it borrows in one year", mistake: { tag: flow_stock_swapped, fix: "That swaps them: the deficit is one year's borrowing, the debt is the pile built up." } }
      - { id: c, text: "They are the same thing measured in different currencies", mistake: { tag: same_thing, fix: "One is a single year's gap, the other the total owed; currency has nothing to do with it." } }
    answer: a
    explanation: >
      A deficit is a flow in one year, while the debt is the stock built up by past deficits (less surpluses).
    source: >
      OpenStax, Principles of Macroeconomics 3e (CC BY 4.0), 17.3 Federal Deficits and the National Debt: https://openstax.org/books/principles-macroeconomics-3e/pages/17-3-federal-deficits-and-the-national-debt

  - id: fd-q-ratio
    prompt: >
      For one year a government borrows nothing new, so its debt stays put, while the country's economy
      grows by about a tenth. Which headline gets the debt-to-GDP ratio right?
    choices:
      - { id: a, text: "'Debt burden grows as the economy gets bigger'", mistake: { tag: flipped_the_ratio, fix: "GDP is the bottom of the ratio, so a bigger economy makes the ratio smaller." } }
      - { id: b, text: "'Debt burden unchanged: the debt did not move'", mistake: { tag: forgot_gdp_is_in_it, fix: "The ratio divides debt by GDP, so a change in GDP moves it." } }
      - { id: c, text: "'Debt burden eases as the economy outgrows it'" }
      - { id: d, text: "'No comparison: the ratio looks only at debt'", mistake: { tag: forgot_gdp_is_in_it, fix: "The ratio is debt measured against GDP, so GDP matters." } }
    answer: c
    explanation: >
      The ratio compares what the government owes with the size of the whole economy. If the debt stays put
      and the economy grows, the same debt is a smaller share of a bigger economy, so the ratio falls.
    source: >
      OpenStax, Principles of Macroeconomics 3e (CC BY 4.0), 17.3 Federal Deficits and the National Debt: https://openstax.org/books/principles-macroeconomics-3e/pages/17-3-federal-deficits-and-the-national-debt
  - id: fd-q-ratio-with-deficit
    prompt: >
      A government runs a small deficit every year, so its debt keeps creeping up. Its economy, though, grows
      much faster than the debt does. Which headline gets it right?
    choices:
      - { id: a, text: "'Ratio must rise: the debt grew'", mistake: { tag: looked_only_at_debt, fix: "The ratio compares debt with GDP; if GDP grows faster, the ratio falls." } }
      - { id: b, text: "'Debt grows, yet the debt-to-GDP ratio falls'" }
      - { id: c, text: "'Ratio stays put: both of them grew'", mistake: { tag: thought_growth_cancels, fix: "Both grew, but GDP grew faster, so the bottom of the ratio grew more." } }
      - { id: d, text: "'Any deficit means the country is going broke'", mistake: { tag: deficit_means_default, fix: "A deficit is one year's borrowing; a fast-growing country can still shrink its debt burden." } }
    answer: b
    explanation: >
      A deficit adds to the debt, but the ratio compares that debt with the size of the economy. When the
      economy grows faster than the debt, the debt becomes a smaller share of it, so a country can run a
      deficit and still see its ratio fall.
    source: >
      OpenStax, Principles of Economics 3e (CC BY 4.0), Answer Key Chapter 30: https://openstax.org/books/principles-economics-3e/pages/chapter-30

checks:
  - id: eco-fiscal-quiz-debt
    kind: quiz
    questions:
      - bank:eab:MBA-ECON-0047
      - bank:eab:MBA-ECON-0048
      - fd-q-deficit-debt
      - fd-q-ratio
      - fd-q-ratio-with-deficit
    perAttempt: 3
    passRule:
      correct: 2
  - id: eco-fiscal-gilt-reasoning
    kind: conversation
    prompt: >
      The UK government announces about 45 billion pounds of tax cuts without matching spending cuts or an
      independent forecast, while the Bank of England is raising rates and many pension funds hold leveraged
      gilt positions. Predict what could happen to gilt prices and yields, who could be hurt, and how the
      damage might spread.
    passCriteria: >
      The Learner links the unfunded tax cuts (and no independent forecast) to investors possibly demanding
      higher yields on gilts, so bond prices would fall. They reason that leveraged holders such as pension
      funds using liability-driven investment could face margin calls and have to sell, pushing prices down
      further in a spiral, which could threaten financial stability and might call for a central bank to
      step in to restore orderly markets. They note that confidence in fiscal credibility matters for
      borrowing costs.
