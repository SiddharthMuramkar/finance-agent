# Judge Topic: a writer's claims about units and periods, taken back to the figures and recomputed.
# The writer's pieces are pasted by the Learner and never stored; the checkable figures are in each Case, in Case Data or in the sources named in the reveals.
# Case Data (the sourced figures and datasets) lives in the database; see docs/architecture.md.
id: jud-units-periods
title: "Judge: units, periods and labels"
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: jud-units-run-rate-2026
    title: A run rate set against one quarter of revenue
    asOf: 2026-10-13
    piece:
      author: Ed Zitron
      title: "The Annualized Enron Rate"
      published: 2026-10-13
      url: https://www.wheresyoured.at/annualized-enron-rate/
      from: paste
    story: >
      On 13 October 2026 the technology writer Ed Zitron published a piece arguing that the
      "annualized run rate" numbers reported for AI companies tell readers very little. Anthropic
      had not yet published audited quarterly figures, so he worked from press reports. He relays
      the Financial Times' account that Anthropic's run rate is calculated by annualising the
      prior 28 days of usage-based revenue and adding recurring monthly subscriptions. He gives
      revenue for the first half of 2026 as $12.4 billion for OpenAI ($5.7 billion in the first
      quarter and $6.7 billion in the second) and $15.5 billion for Anthropic ($4.6 billion and
      $10.9 billion), citing The Information, the Wall Street Journal and the Financial Times.
      Then he writes that Anthropic said it had reached an annualised run rate of $48 billion on
      28 May, which he calls roughly 430% more than its entire revenue in the second quarter, and
      that adding up every dollar both companies made in the first two quarters still leaves a
      gap to that run rate, which he puts at $19.1 billion. The Learner pastes the piece and
      takes these two claims back to the figures he himself gives.
    reveal: >
      Anthropic's registration statement (Form S-1), filed on 26 October 2026, later gave unaudited
      quarterly revenue: $4,731 million for the first quarter of 2026 and $11,555 million for the
      second, $16,286 million for the half. It defines run-rate revenue as the trailing 28 days
      of usage fees multiplied by 13, plus monthly subscription fees multiplied by 12, and says
      it is not a substitute for revenue or a forecast. Recomputed from the piece's own numbers,
      $48 billion is 48 / 10.9 = 4.40 times the second-quarter revenue he gives, which is about
      340% more, not 430%. Against the S-1's $11,555 million it is 4.15 times, about 315% more.
      The comparison also sets an annual pace against one quarter: four times the quarter is
      $43.6 billion on his figure (so $48 billion is about 10% above that) or $46.2 billion on
      the S-1 figure (about 3.9% above). The second claim has a smaller slip: $12.4 billion plus
      $15.5 billion is $27.9 billion, and 48 less 27.9 is $20.1 billion, not $19.1 billion. His
      main point, that a run rate is a pace and not revenue already earned, survives the
      arithmetic; the stated percentages do not. The OpenAI figures cannot be checked against
      any filing.

  - id: jud-units-bp-2026
    title: A basis point defined in a bond sidenote
    asOf: 2026-09-29
    data: [ten-year-treasury-par-yield]
    piece:
      author: Ed Zitron
      title: "Dead Money"
      published: 2026-09-29
      url: https://www.wheresyoured.at/dead-money/
      from: paste
    story: >
      On 29 September 2026 Ed Zitron published a piece on the cost of debt for AI companies. He
      says that ten-year US Treasury yields were around 5.24% as he wrote and that rising rates
      would add billions of dollars in interest to the sector's debt. In a sidenote he explains
      how bonds are quoted: by yield, or by spread, meaning how many basis points above a
      comparable US Treasury a bond yields, and he adds a short statement of what one basis
      point is. He also explains that a bond's price and its yield move in opposite directions.
      The Case Data shows the daily 10-year Treasury yield through the month. The Learner pastes
      the piece, checks each statement in the sidenote and the yield he quotes, and says in
      plain words what traders mean by a basis point.
    reveal: >
      A basis point is one hundredth of a percentage point: 0.01%, or 0.0001 as a fraction (the
      SEC's Investor.gov glossary and the European Central Bank both say so). The sidenote gave
      "0.001", which is ten times too large, 0.1% instead of 0.01%. The rest of the sidenote
      stands: spreads are quoted in basis points over a Treasury, and price and yield move in
      opposite directions. His own piece a week later used the unit correctly (6 basis points is
      0.06%; spreads of 105 to 165 basis points are 1.05% to 1.65%), so the slip was one
      sentence, not a misunderstanding repeated. The 10-year yield he quoted fits Treasury's
      data: the par yield closed at 5.24% on 28 September and 5.26% on 29 September, up from
      4.79% on 1 September, a rise of 47 basis points, and 5.29% on 30 September.

  - id: jud-units-sofr-2026
    title: SOFR explained as borrowing from the Fed
    asOf: 2026-10-06
    piece:
      author: Ed Zitron
      title: "The Credit Crunch"
      published: 2026-10-06
      url: https://www.wheresyoured.at/credit-crunch/
      from: paste
    story: >
      On 6 October 2026 Ed Zitron published a piece on how AI-related debt is priced when markets
      become more selective. To show how a strong customer can lift a borrower's terms, he points
      to the cloud company CoreWeave, which closed an $8.5 billion delayed-draw term loan in March
      2026 that was rated investment grade, with the customer contract of Meta behind it
      (CoreWeave's own announcement of 31 March 2026 confirms the size and the rating). The loan's
      floating rate is a margin over SOFR, and in a parenthesis he describes SOFR as the
      percentage on overnight borrowing from the Fed for banks. The Learner pastes the piece and
      checks the parenthesis against the body that publishes the rate.
    reveal: >
      The Federal Reserve Bank of New York, which publishes SOFR each business day, describes the
      Secured Overnight Financing Rate as a broad measure of the cost of borrowing cash overnight
      collateralised by Treasury securities, calculated from repurchase-agreement (repo)
      transactions between market participants. It is a private-market rate, so "borrowing from
      the Fed" mislabels it. Banks that do borrow from the Fed do so at the discount window, at a
      separate rate priced relative to the Federal Open Market Committee's target range for the
      federal funds rate. The slip does not change how the loan is priced: a floating rate of
      SOFR plus a margin is still a market benchmark plus a spread. It changes what a reader
      believes the benchmark is, and why it moves.

concept: >
  Before a number can be trusted, say what it measures, over what period, and in which unit. A
  period mismatch compares a pace with a period: an annual run rate is a yearly pace, while a
  quarter's revenue covers three months, so a like-for-like comparison scales the quarter to a
  year first. Percentages have their own traps. "A is 5 times B" means A is 400% more than B, and
  500% of B; the three phrases are not interchangeable. Units and labels have fixed definitions
  kept by the bodies that publish them, such as the SEC's investor glossary, the European Central
  Bank or the New York Fed. Do not rely on memory or on another writer: look the definition up,
  convert with it, and compare the writer's wording with the publisher's. To judge a claim, take it
  back to the figures it names, recompute with the writer's own inputs, and separate a slip in a
  unit or a label from a flaw in the argument.

principle: >
  Recompute a claim before you judge it: use the writer's own inputs, check the unit and the
  period, and check each label against the body that defines it. A slip in a number or a label
  does not decide whether the thesis is right, so say exactly what is wrong, how large, and what
  still stands.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Check a number's unit, period and label before trusting it."
  - "Tell apart saying one figure is several times another, more than it, or a share of it."
  - "Look a definition up at the body that publishes it, not in memory."

questions:
  - id: ju-q-pct-more
    prompt: >
      A writer says one figure is "five times" another, then calls it "500% more than" the other. What did the writer mix up?
    choices:
      - { id: a, text: "\"More than\" counts only the extra above the base, while \"times\" counts the whole figure, so the two phrases are not interchangeable" }
      - { id: b, text: "Nothing: \"times\" and \"percent more\" always mean the same", mistake: { tag: nothing_times_and_percent_mo, fix: "They do not. \"Five times\" is the whole figure; \"percent more\" counts only the extra on top." } }
      - { id: c, text: "A percentage above 100% is not allowed in a report", mistake: { tag: a_percentage_above_is_not_al, fix: "Percentages above 100% are fine. They just show one figure is more than double the other." } }
      - { id: d, text: "The writer should have quoted the gap in basis points", mistake: { tag: the_writer_should_have_quote, fix: "Basis points suit small rate moves. The mix-up here is between \"times\" and \"percent more\"." } }
    answer: a
    explanation: >
      "Five times" is the whole figure measured against the base. "500% more" counts only the extra on top, which would make it six times. The three phrases (times, percent more, percent of) are not interchangeable.
    source: >
      OpenStax, Prealgebra, 6.2 Solve General Applications of Percent (percent increase is the amount of increase as a percent of the original amount): https://openstax.org/books/prealgebra/pages/6-2-solve-general-applications-of-percent
  - id: ju-q-annualise-quarter
    prompt: >
      A headline quotes a company's "yearly pace" from just one quarter of revenue. What does that yearly pace assume?
    choices:
      - { id: a, text: "That every later quarter will look like this one" }
      - { id: b, text: "That the company has already earned a full year of revenue", mistake: { tag: that_the_company_has_already, fix: "A pace is not revenue earned. It only says what a year would bring if the quarter repeated." } }
      - { id: c, text: "That this quarter was the best the company will ever have", mistake: { tag: that_this_quarter_was_the_be, fix: "A pace assumes the quarter repeats. It says nothing about it being the best." } }
      - { id: d, text: "That the revenue will be paid out to shareholders", mistake: { tag: that_the_revenue_will_be_pai, fix: "A pace is about revenue, not payouts. Nothing in it says where the money goes." } }
    answer: a
    explanation: >
      A yearly pace takes one short period and carries it forward as if it repeated. It is a pace, not revenue earned, and it holds only if later quarters look the same.
    source: >
      Arithmetic on the run-rate definition in Anthropic, PBC, Form S-1 (filed 26 October 2026), Glossary, "Run-Rate Revenue": https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm
  - id: ju-q-like-for-like
    prompt: >
      Tuesday 13 October 2026, 3 pm; Rosa, a made-up newsletter editor, checks a chart before her 5 pm send. It sets a company's annual run rate beside the revenue it earned in one quarter. Which pairing would you pick, and why?
    choices:
      - { id: a, text: "The run rate against the quarter as it stands", mistake: { tag: year_against_quarter, fix: "A run rate is a yearly pace and a quarter is three months, so the periods do not match." } }
      - { id: b, text: "The run rate against the quarter scaled up to a year" }
      - { id: c, text: "The run rate against the quarter scaled down to a month", mistake: { tag: scaled_the_wrong_way, fix: "A month is still not a year. Scale the quarter up to a year, not down." } }
      - { id: d, text: "The run rate against the half-year's revenue, as it is closer", mistake: { tag: half_year_taken_for_year, fix: "Half a year is still not a year. Both sides need the same period." } }
    answer: b
    explanation: >
      A run rate is a yearly pace, so the quarter is scaled up to a year before the two are set side by side. Setting a year beside a quarter makes the run rate look far bigger than a like-for-like match would.
    source: >
      Anthropic, PBC, Form S-1 (filed 26 October 2026), risk factor on Run-Rate Revenue ("it annualizes a short measurement period"): https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm ; Rosa, the newsletter and the company are made up.

  - id: ju-q-gap-sum
    prompt: >
      A writer adds up two companies' half-year revenue and says the total falls well short of a yearly pace. What is the problem with setting these two side by side?
    choices:
      - { id: a, text: "One is revenue already earned over half a year and the other is a pace for a year, so the gap mixes two different periods" }
      - { id: b, text: "Nothing: any two revenue figures can be compared", mistake: { tag: nothing_any_two_revenue_figu, fix: "Periods matter. Half a year of earned revenue and a yearly pace measure different things." } }
      - { id: c, text: "Revenue can only be compared in percentages, never in dollars", mistake: { tag: revenue_can_only_be_compared, fix: "Dollars compare fine when the periods match. Here the periods differ." } }
      - { id: d, text: "A half-year total can never be added across two companies", mistake: { tag: a_half_year_total_can_never, fix: "Adding two companies is fine. The trouble is the half-year total against a yearly pace." } }
    answer: a
    explanation: >
      The total is revenue earned over six months. The pace is an annual rate. A gap between them mixes earned revenue with a pace and says little until both sit on the same period.
    source: Arithmetic on the figures stated in the question (hypothetical companies).
  - id: ju-q-bp-fraction
    prompt: >
      A sidenote says one basis point is "0.001". A regulator's glossary says a basis point is one hundredth of a percentage point. What should a careful reader conclude?
    choices:
      - { id: a, text: "The sidenote's unit is too big, and the publisher's definition decides" }
      - { id: b, text: "Both are fine: a basis point is a matter of taste", mistake: { tag: both_are_fine_a_basis_point, fix: "A basis point has one fixed definition, kept by the bodies that publish it." } }
      - { id: c, text: "The glossary is out of date, because a basis point changes with the market", mistake: { tag: the_glossary_is_out_of_date, fix: "A basis point is a fixed unit. It does not move with rates." } }
      - { id: d, text: "The sidenote is right, because small units are written with three zeros", mistake: { tag: the_sidenote_is_right_becaus, fix: "The publisher's definition decides, not a habit of zeros. Look it up." } }
    answer: a
    explanation: >
      A basis point is one hundredth of a percentage point, as the SEC's glossary and the ECB both say. The sidenote's version is ten times too large. Units have fixed definitions, so look them up at the body that publishes them.
    source: >
      European Central Bank, AnaCredit question 2020/0002 (a margin of one basis point is 0.01%, reported as 0.0001): https://ecb.europa.eu/stats/ecb_statistics/anacredit/questions/html/ecb.anaq.200131.0002.hr.html ; Investor.gov (US SEC), Basis Point: https://investor.gov/introduction-investing/investing-basics/glossary/basis-point
  - id: ju-q-bp-move
    prompt: >
      Traders quote a bond yield rising from 5.00% to 5.25% as "up 25 basis points". Why do they use basis points for small moves like this?
    choices:
      - { id: a, text: "A basis point is a hundredth of a percentage point, so small moves become whole numbers with no decimals" }
      - { id: b, text: "A basis point is a whole percentage point, so it keeps the move large", mistake: { tag: a_basis_point_is_a_whole_per, fix: "A basis point is only a hundredth of a point. It makes small moves easy to say." } }
      - { id: c, text: "A basis point is the price of the bond, not its yield", mistake: { tag: a_basis_point_is_the_price_o, fix: "It measures yield or rate moves, not the bond's price." } }
      - { id: d, text: "Basis points are only used for moves of 5% or more", mistake: { tag: basis_points_are_only_used_f, fix: "Basis points suit small moves best. Large ones are said in points." } }
    answer: a
    explanation: >
      A basis point is 0.01 of a percentage point, so a quarter-point move is simply "25 basis points". Traders use the unit so that small moves are said as whole numbers.
    source: >
      Investor.gov (US SEC), Basis Point glossary entry ("One one-hundredth (.01) of a percentage point"): https://investor.gov/introduction-investing/investing-basics/glossary/basis-point
  - id: ju-q-spread-sum
    prompt: >
      A loan pays a floating reference rate plus a margin quoted in basis points. How is its all-in rate put together?
    choices:
      - { id: a, text: "The reference rate with the margin added on top, both read as percentages" }
      - { id: b, text: "The margin replaces the reference rate", mistake: { tag: the_margin_replaces_the_refe, fix: "The margin sits on top of the reference rate. It does not replace it." } }
      - { id: c, text: "The margin multiplies the reference rate", mistake: { tag: the_margin_multiplies_the_re, fix: "The margin is added, not multiplied. It is a spread over the reference rate." } }
      - { id: d, text: "The lender charges whichever of the two is lower", mistake: { tag: the_lender_charges_whichever, fix: "The loan pays both: the reference rate plus the margin over it." } }
    answer: a
    explanation: >
      The all-in rate is the reference rate plus the margin over it. The margin is quoted in basis points, so it is read as a percentage before it is added.
    source: >
      Investor.gov (US SEC), Basis Point: https://investor.gov/introduction-investing/investing-basics/glossary/basis-point ; ECB AnaCredit question 2020/0002 (a margin over a reference rate): https://ecb.europa.eu/stats/ecb_statistics/anacredit/questions/html/ecb.anaq.200131.0002.hr.html
  - id: ju-q-spread-bp
    prompt: >
      A trader says a corporate bond "trades at a spread over the Treasury". What does the spread tell you?
    choices:
      - { id: a, text: "How much more yield the bond pays than a Treasury of similar maturity, quoted in basis points" }
      - { id: b, text: "How much more the bond costs in dollars than a Treasury", mistake: { tag: how_much_more_the_bond_costs, fix: "A spread is about yield, not the price paid in dollars." } }
      - { id: c, text: "How many years the bond has left until it matures", mistake: { tag: how_many_years_the_bond_has, fix: "Maturity is a different label. A spread compares yields." } }
      - { id: d, text: "What share of the bond the Treasury holds", mistake: { tag: what_share_of_the_bond_the_t, fix: "A spread does not describe ownership. It compares yields." } }
    answer: a
    explanation: >
      A spread is the extra yield over a comparable Treasury, quoted in basis points.
    source: >
      Investor.gov (US SEC), Basis Point glossary entry: https://investor.gov/introduction-investing/investing-basics/glossary/basis-point

checks:
  - id: ju-quiz-units-periods
    kind: quiz
    questions:
      - ju-q-pct-more
      - ju-q-annualise-quarter
      - ju-q-like-for-like
      - ju-q-gap-sum
      - ju-q-bp-fraction
      - ju-q-bp-move
      - ju-q-spread-sum
      - ju-q-spread-bp
    perAttempt: 4
    passRule:
      correct: 3
  - id: ju-recompute-run-rate
    kind: conversation
    prompt: >
      The pasted piece sets a yearly run rate beside one quarter's revenue, and beside half a
      year's. In your own words: why is that an uneven match, and what fairer match would you
      pick? Does the writer's main point, that a run rate is not revenue, still stand?
    passCriteria: >
      In their own words the Learner says that a run rate is a yearly pace while a quarter covers
      three months and a half-year six, so the two sides measure different periods, and that a fair
      match puts both on the same period (for example the quarter scaled to a year). They say that
      "percent more" counts only the extra above the base, not the whole figure. They keep the
      period slip apart from the writer's wider point, that a run rate is a pace and not revenue
      already earned, and say that point survives. No arithmetic is asked or needed; the Tutor
      supplies no figure of its own.
  - id: ju-recompute-units-labels
    kind: conversation
    prompt: >
      One pasted piece defines a basis point; another calls SOFR borrowing from the Fed. Look each
      up where it is published (the Tutor can help you find it in the Library). In your own words:
      what does each really mean, and does the slip change the writer's point?
    passCriteria: >
      The Learner looks up the publisher's definition of a basis point (a hundredth of a percentage
      point, as the SEC's glossary or the ECB says) and says in words that the sidenote's version is
      too big, and why traders use the unit for small moves. For SOFR they retrieve the New York
      Fed's description (the Tutor may help them find it in the Library) and say in their own words
      that it is a market rate for overnight borrowing backed by Treasuries, not borrowing from the
      Fed. For both they say the slip is one of a unit or a label and that neither changes the
      writer's conclusion by itself. No arithmetic is asked or needed. They make no forecast and no
      buy, sell or hold judgement. The Tutor supplies no figure of its own.
