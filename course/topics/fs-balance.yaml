  - id: fb-s-cash
    step: concept
    check: fb-satyam-cash
    recipe: myth_or_fact
    title: "Reading a balance sheet: myth or fact"
    inputs:
      cards:
        - claim: Every number on a balance sheet comes with proof attached.
          isFact: false
          why: It is a claim. Outside evidence, such as an auditor's checks, backs it up.
          emoji: magnifying-glass-tilted-left
        - claim: Assets always equal liabilities plus equity.
          isFact: true
          why: "That is the accounting equation: what is owned equals what is owed plus what is left."
          emoji: balance-scale
        - claim: A balance sheet covers a whole year of trading.
          isFact: false
          why: It is a snapshot at one date. The income statement covers a period.
          emoji: calendar
  - id: fb-s-reveal
    step: reveal
    recipe: timeline
    title: "From the balance sheet to the letter"
    inputs:
      beats:
        - { date: "2008-09-30", label: "Books show cash of Rs 5,361 crore", emoji: bank }
        - { date: "2009-01-07", label: Chairman Raju writes to the board, emoji: envelope }
        - { date: "2009-01-07", label: "Rs 5,040 crore of it did not exist", emoji: warning }
  - id: fb-s-principle
    step: principle
    recipe: lingo_card
    title: "The accounting equation"
    inputs:
      term: accounting equation
      pro: Assets equal liabilities plus equity, always.
      means: A false number on one side always needs a matching false number on the other.
      example: "Your savings app shows more than your bank does: something else must be wrong too."
      emoji: balance-scale
      inStory: Cash that never existed means equity that never existed.

questions:
  - id: fb-q-equation
    prompt: >
      What do accountants call what is left for the owners once everything owed is taken off everything owned?
    choices:
      - { id: a, text: "Equity" }
      - { id: b, text: "Liabilities", mistake: { tag: liabilities_for_equity, fix: "Liabilities are what the company owes. Equity is what is left for the owners." } }
      - { id: c, text: "Revenue", mistake: { tag: revenue_for_equity, fix: "Revenue is sales over a period and sits on the income statement." } }
      - { id: d, text: "Debtors", mistake: { tag: debtors_for_equity, fix: "Debtors are customers who owe the company. They are an asset." } }
    answer: a
    explanation: >
      Assets = liabilities + equity, so equity is what remains of the assets after the liabilities are met.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.2 The Balance Sheet, the accounting equation: https://openstax.org/books/principles-finance-2e/pages/5-2-the-balance-sheet

  - id: fb-q-borrow
    prompt: >
      A company borrows cash from a bank. What happens to its balance sheet?
    choices:
      - { id: a, text: "Assets and liabilities both rise; equity does not change" }
      - { id: b, text: "Assets and equity both rise", mistake: { tag: loan_is_equity, fix: "A loan is a debt, not owners' money. Equity rises only with kept profit or new share money." } }
      - { id: c, text: "Liabilities rise and assets fall", mistake: { tag: loan_cash_not_asset, fix: "The cash received is an asset, so assets rise too." } }
      - { id: d, text: "Nothing changes, because borrowing is not an asset", mistake: { tag: borrowing_invisible, fix: "The cash is an asset and the loan is a liability. Both show up." } }
    answer: a
    explanation: >
      Cash, an asset, rises, and the loan, a liability, rises by the same amount. The equation still balances and equity is unchanged.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.2 The Balance Sheet: https://openstax.org/books/principles-finance-2e/pages/5-2-the-balance-sheet

  - id: fb-q-retained-earnings
    prompt: >
      What do analysts call the profit a company keeps in the business instead of paying it out?
    choices:
      - { id: a, text: "Retained earnings" }
      - { id: b, text: "Dividends", mistake: { tag: dividends_for_retained, fix: "Dividends are the part of profit paid out to owners. Retained earnings is the part kept." } }
      - { id: c, text: "Liabilities", mistake: { tag: liabilities_for_retained, fix: "Liabilities are what the company owes. Kept profit belongs to the owners." } }
      - { id: d, text: "Revenue", mistake: { tag: revenue_for_retained, fix: "Revenue is the sales earned. Profit is what is left after costs." } }
    answer: a
    explanation: >
      Retained earnings are profit kept in the business. They grow with profit and shrink with dividends, and sit in equity on the balance sheet.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.4 The Statement of Owner's Equity: https://openstax.org/books/principles-finance-2e/pages/5-4-the-statement-of-owners-equity

  - id: fb-q-current-asset
    prompt: >
      Which of these is a current asset?
    choices:
      - { id: a, text: "Money owed by customers, due within 30 days" }
      - { id: b, text: "A factory building", mistake: { tag: building_is_current, fix: "A building lasts for years, so it is a long-term asset." } }
      - { id: c, text: "A five-year bank loan", mistake: { tag: loan_is_asset, fix: "A loan is owed by the company, so it is a liability." } }
      - { id: d, text: "The owners' share capital", mistake: { tag: capital_is_asset, fix: "Share capital is the owners' money, so it sits in equity." } }
    answer: a
    explanation: >
      Money owed by customers is a receivable expected in cash within a year, so it is a current asset. A building is a long-term asset; a loan is a liability; share capital is equity.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.2 The Balance Sheet: https://openstax.org/books/principles-finance-2e/pages/5-2-the-balance-sheet

  - id: fb-q-overstated-receivables
    prompt: >
      A shop counts some boxes of unsold stock twice by mistake, so its inventory is too high, and its liabilities are right. What else on the balance sheet must be too high?
    choices:
      - { id: a, text: "Nothing: assets can be too high on their own", mistake: { tag: assets_stand_alone, fix: "The balance sheet must balance, so an asset that is too high needs a matching error elsewhere." } }
      - { id: b, text: "Equity" }
      - { id: c, text: "Liabilities", mistake: { tag: liabilities_move_with_assets, fix: "The prompt says liabilities are right. The difference falls on equity." } }
      - { id: d, text: "Cash", mistake: { tag: cash_moves_with_stock, fix: "Cash is counted separately. The equation forces the other side, equity, to carry the difference." } }
    answer: b
    explanation: >
      The balance sheet must balance. With liabilities correct, inventory that is too high means equity is too high by the same amount, until the count is corrected.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.2 The Balance Sheet (assets = liabilities + equity): https://openstax.org/books/principles-finance-2e/pages/5-2-the-balance-sheet

  - id: fb-q-missing-assets
    prompt: >
      An uninsured fire destroys some of a warehouse company's stock, and the company writes the stock down. Its liabilities stay the same. What is true of its equity after the write-down?
    choices:
      - { id: a, text: "It equals the equity before the fire", mistake: { tag: equity_unaffected, fix: "Equity is assets less liabilities. Write assets down and equity falls too." } }
      - { id: b, text: "It is lower than the equity before the fire" }
      - { id: c, text: "It is higher than the equity before the fire", mistake: { tag: equity_goes_up, fix: "Fewer assets and the same liabilities leave less for the owners, not more." } }
      - { id: d, text: "It cannot be known from the balance sheet", mistake: { tag: unknowable, fix: "The equation settles it: equity is what remains of the assets after liabilities." } }
    answer: b
    explanation: >
      Equity is assets less liabilities. Write the destroyed stock down and the same liabilities leave less for the owners.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.2 The Balance Sheet: https://openstax.org/books/principles-finance-2e/pages/5-2-the-balance-sheet

  - id: fb-q-cash-bank
    prompt: >
      What do analysts call money a company holds in hand and in its bank accounts, ready to spend?
    choices:
      - { id: a, text: "Cash and bank balances" }
      - { id: b, text: "Debtors", mistake: { tag: debtors_for_cash, fix: "Debtors are customers who owe the company. The money is not in hand yet." } }
      - { id: c, text: "Retained earnings", mistake: { tag: retained_for_cash, fix: "Retained earnings is profit kept in the business. It can be spent on things other than cash." } }
      - { id: d, text: "Equity", mistake: { tag: equity_for_cash, fix: "Equity is what is left for the owners. It is not a pile of cash." } }
    answer: a
    explanation: >
      Cash and bank balances are the most liquid asset: money in hand and in bank accounts. Satyam's books showed Rs 5,361 crore of it at 30 September 2008.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.2 The Balance Sheet: https://openstax.org/books/principles-finance-2e/pages/5-2-the-balance-sheet

  - id: fb-q-auditor
    prompt: >
      What do you call the outside accountant who checks a company's accounts for investors?
    choices:
      - { id: a, text: "An auditor" }
      - { id: b, text: "A debtor", mistake: { tag: debtor_for_auditor, fix: "A debtor is someone who owes the company money." } }
      - { id: c, text: "An analyst", mistake: { tag: analyst_for_auditor, fix: "An analyst reads and judges the figures. An auditor checks the books." } }
      - { id: d, text: "A shareholder", mistake: { tag: shareholder_for_auditor, fix: "A shareholder owns part of the company. The auditor is hired to check the books." } }
    answer: a
    explanation: >
      An auditor is an independent accountant who examines a company's accounts and reports whether they give a fair picture.
    source: >
      Plain definition of an external auditor; the Satyam context is in the US SEC Litigation Release LR-21915: https://www.sec.gov/enforcement-litigation/litigation-releases/lr-21915

  - id: fb-q-debtors
    prompt: >
      On Satyam's balance sheet, debtors were customers who owed it money. What kind of item is that?
    choices:
      - { id: a, text: "An asset" }
      - { id: b, text: "A liability", mistake: { tag: debtors_are_liabilities, fix: "A liability is money the company owes. Debtors owe the company." } }
      - { id: c, text: "Equity", mistake: { tag: debtors_are_equity, fix: "Equity is what is left for the owners, not money owed by customers." } }
      - { id: d, text: "Revenue", mistake: { tag: debtors_are_revenue, fix: "Revenue is the sale itself, on the income statement. The unpaid amount is an asset." } }
    answer: a
    explanation: >
      Money customers owe is a receivable, which is a current asset: the company expects to collect it in cash within a year.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.2 The Balance Sheet: https://openstax.org/books/principles-finance-2e/pages/5-2-the-balance-sheet

checks:
  - id: fb-quiz-equation
    kind: quiz
    questions:
      - fb-q-equation
      - fb-q-borrow
      - fb-q-retained-earnings
      - fb-q-current-asset
      - fb-q-overstated-receivables
      - fb-q-missing-assets
      - fb-q-cash-bank
      - fb-q-auditor
      - fb-q-debtors
    perAttempt: 3
    passRule:
      correct: 2
  - id: fb-satyam-cash
    kind: conversation
    prompt: >
      Satyam's balance sheet at 30 September 2008 shows cash and bank balances of Rs 5,361 crore,
      and its revenue for the quarter was Rs 2,700 crore. Which line would you want to test first,
      and how? Say what evidence would convince you that the figure exists, and what you would
      expect to see elsewhere in the company's accounts if that much cash were really there.
    passCriteria: >
      The Learner picks the cash and bank balances (very large next to a quarter's revenue) and
      says the strongest evidence is independent: a confirmation obtained directly from the bank,
      not a statement handed over by the company. They say that a cash pile that large should
      earn a noticeable amount of interest income and that the company should have little reason
      to borrow, so they would compare the interest income and the borrowings with the balance.
      They may also say that, because the equation must balance, overstated cash would mean
      overstated equity or understated liabilities.
