# The balance sheet: a foundation Topic taught through a short Case.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
id: fs-balance
title: The balance sheet
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: satyam-balance-2008
    title: Satyam's balance sheet
    data: [cash-and-bank-reported, debtors-reported, cash-and-bank-actual, debtors-actual]
    asOf: 2008-09-30
    story: >
      Satyam Computer Services, based in Hyderabad, is one of India's largest software services
      companies. Its balance sheet at 30 September 2008, the end of its half year, shows cash
      and bank balances of Rs 5,361 crore and debtors (customers who owe it money) of Rs 2,651
      crore. For the quarter ended that day it reports revenue of Rs 2,700 crore. A balance sheet is a list of what the company owns (assets)
      against what it owes and what is left for owners (liabilities and equity), at one date.
      As of this date, you are an analyst looking at those reported figures and deciding what you
      would want to check before trusting them.
    reveal: >
      On 7 January 2009 the chairman, B. Ramalinga Raju, wrote to the board admitting that the
      accounts had been falsified for years. Of the cash and bank balances of Rs 5,361 crore
      reflected in the books, Rs 5,040 crore did not exist; debtors were overstated by Rs 490
      crore (Rs 2,651 crore in the books); there was Rs 376 crore of accrued interest that did
      not exist; and a liability of Rs 1,230 crore for funds he had arranged was left out. Cash
      that never existed means equity that never existed. The US SEC later put the fictitious
      cash at more than 1 billion dollars, about half of the company's total assets.

concept: >
  The balance sheet shows a company's financial position on one date. Assets are what it owns
  (cash, money owed by customers, inventory, buildings); liabilities are what it owes; equity is
  what is left for the owners. The accounting equation always holds: assets = liabilities +
  equity. Equity grows with profit kept in the business (retained earnings) and shrinks with
  dividends. Because the equation must balance, an overstated asset means an overstated equity
  or an understated liability somewhere else. Current assets and liabilities are those due within
  a year; the others are long term.

principle: >
  Every number on a balance sheet is a claim that something exists or is owed. Ask what
  independent evidence backs the biggest items, and remember the equation: a false asset always
  has a false counterpart on the other side.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Read a balance sheet as what a company owns, owes and leaves its owners."
  - "Use the accounting equation to see where a false number must be hiding."
  - "Ask what outside evidence backs the biggest items."

# Written for the story-first spec (E6b): terms, a Running example and scenes, and questions that ask about the story and the words (ADR 0009).
exampleCurrency: INR
runningExample:
  text: "A family owns a flat and savings worth ₹50 lakh and owes ₹30 lakh on a home loan."
  numbers: [50, 30]
  scene:
    cast:
      - { id: asha, emoji: woman, name: Asha }
      - { id: bank, emoji: bank, name: The bank }
    beats:
      - { who: narrator, says: "Asha's family owns a flat and savings worth ₹50 lakh.", emoji: house }
      - { who: bank, says: "They still owe us ₹30 lakh on the home loan.", emoji: receipt }
      - { who: asha, says: "What is left after the loan is the share that is really ours.", emoji: thinking-face }

terms:
  - term: assets
    means: Everything a company owns that has value, such as cash, money customers owe it and buildings.
    pro: Analysts start a balance sheet with its assets.
    example: "Your scooter, your savings and the ₹2,000 a friend owes you."
    emoji: money-bag
    inStory: Satyam's books listed cash and bank balances of Rs 5,361 crore as an asset.
  - term: liabilities
    means: Everything a company owes, such as loans, unpaid bills and money due to others.
    pro: Liabilities are the claims of outsiders on the company.
    example: "The ₹3 lakh education loan you still owe the bank."
    emoji: credit-card
    inStory: A balance sheet sets what Satyam owns against what it owes and what is left for owners.
  - term: equity
    means: What is left for the owners once everything owed is taken off everything owned.
    pro: Equity, or shareholders' funds, is the owners' stake.
    example: "Your scooter is worth ₹60,000 and ₹20,000 of the loan is unpaid. Your own share is the rest."
    emoji: gem-stone
    inStory: In Satyam's balance sheet, equity is what remains for the owners after liabilities.
  - term: cash and bank balances
    means: Money the company holds in hand and in its bank accounts, ready to spend.
    pro: Analysts call it cash and bank balances, or just cash.
    example: "The ₹10,000 in your wallet plus your savings account."
    emoji: bank
    inStory: Satyam's balance sheet showed cash and bank balances of Rs 5,361 crore.
  - term: auditor
    means: An outside accountant who checks a company's accounts and tells investors if they look fair.
    pro: The auditor signs off the accounts.
    example: "Like an examiner who rechecks your marks before the result is published."
    emoji: magnifying-glass-tilted-left
    inStory: An analyst wants to check Satyam's reported figures before trusting them.

scenes:
  - id: fb-s-story
    step: story
    recipe: story_scene
    title: "Satyam's half year ends"
    inputs:
      cast:
        - { id: satyam, emoji: office-building, name: Satyam, role: software services company in Hyderabad }
        - { id: analyst, emoji: woman-office-worker, name: An analyst, role: reads the balance sheet }
      beats:
        - { who: narrator, says: "30 September 2008: Satyam's half year ends and the balance sheet is out.", emoji: calendar }
        - { who: satyam, says: "Cash and bank balances: Rs 5,361 crore. Debtors: Rs 2,651 crore.", emoji: ledger }
        - { who: narrator, says: "A balance sheet lists what a company owns and what it owes, at one date." }
        - { who: analyst, says: "Big numbers. Which ones would I want to check before trusting them?", emoji: magnifying-glass-tilted-left }
      caption: An analyst decides what to check first
      date: "2008-09-30"
  - id: fb-s-equation
    step: concept
