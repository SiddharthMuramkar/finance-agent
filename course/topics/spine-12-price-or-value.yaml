  # this Topic's Case and is checked, not drawn (multiple_decoder's optional case).
  workbench:
    recipe: multiple_decoder
    case: s12-wework-iwg
    inputs:
      subject:
        name: WeWork
        multiple: 25.8
        # Its picture and its one plain figure on the scale: workstations at 30 Jun 2019, from the S-1 (verify file).
