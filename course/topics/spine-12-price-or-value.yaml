        pro: It trades at twenty-six times sales.
        example: "A café that sells for $2 million and takes $1 million a year sells at two times sales."
        emoji: label
        inStory: In the story, WeWork's $47 billion is about 26 times its 2018 revenue.

connections:
  - text: "A multiple folds the four levers of a value into one number, and relative valuation is where that shorthand is taught in full."
    topics: [spine-01-worth, val-multiples]
  - text: "A funding round and a first day of trading are prices too, each set by what buyers would pay that week."
    topics: [cf-venture, mkt-ipo-float]
  - text: "A company whose shares were priced far above a sober value, and what its multiple assumed, is a story of its own."
    topics: [fol-twitter-ipo, spine-13-price-assumes]

questions:
  - id: s12-q-lever
    kind: which_lever
    prompt: "Take one story for WeWork: sales grow fast for five years, it keeps 13% of each sale once it is grown up, and there is a one-in-four chance it never gets there. Which one change moves the value of a share most?"
    skill: s12-story
    explanation: "A small change in what WeWork keeps of each sale moves the value far more than a change in risk or in the chance of failure."
    computed:
      case: s12-wework-iwg
      # The Topic's own story, not anyone's valuation: 13% kept once grown up, a one-in-four chance of failure.
      preset: { marginTarget: 13, failureChance: 25 }
      changes:
        - { id: margin, label: "It keeps 11% of each sale, not 13%", levers: { marginTarget: 11 } }
        - { id: risk-nine, label: "Its cost of capital is a point higher, at 9%", levers: { costOfCapitalGrowing: 9 } }
        - { id: no-failure, label: "It is certain to survive", levers: { failureChance: 0 } }
        - { id: risk-ten, label: "Its cost of capital is 10%", levers: { costOfCapitalGrowing: 10 } }
  - id: s12-q-predict
    kind: predict
    prompt: "In that story WeWork keeps 13% of each sale once it is grown up, with a one-in-four chance it never gets there. Suppose instead that {change}. The value of a share will be:"
    skill: s12-story
    explanation: "WeWork's value rests on the margin it reaches years from now, so a few points either way change it out of all proportion."
    computed:
      case: s12-wework-iwg
      preset: { marginTarget: 13, failureChance: 25 }
      changes:
        - { id: margin-11, label: "it ends up keeping 11% of each sale", levers: { marginTarget: 11 } }
        - { id: margin-12, label: "it ends up keeping 12% of each sale", levers: { marginTarget: 12 } }
        - { id: fifteen, label: "it ends up keeping 15% of each sale", levers: { marginTarget: 15 } }
      bands:
        - { id: none, label: "Nothing left for shareholders", max: 0.1 }
        - { id: quarter, label: "About a quarter of it", min: 0.15, max: 0.45 }
        - { id: twothirds, label: "About two thirds of it", min: 0.5, max: 0.85 }
        - { id: double, label: "Not far off double", min: 1.4, max: 2.2 }
  - id: s12-q-round
    kind: price_or_value
    prompt: "In January 2019 SoftBank put money into WeWork at a $47 billion valuation. Is the $47 billion about a price or a value?"
    skill: s12-price
    choices:
      - { id: price, text: "A price" }
      - id: value
        text: "A value"
        mistake: { tag: price_for_value, fix: "It is what one investor paid for new shares, scaled up to the whole company: a price, whatever the headline calls it." }
    answer: price
    explanation: "A funding round sets what a buyer pays for the newest shares. Nobody argued it from WeWork's future cash."
    source: "CNBC, 8 Jan 2019: https://www.cnbc.com/2019/01/08/wework-rebranding-as-the-we-company-softbank-invests-2-billion.html"
  - id: s12-q-analyst
    kind: price_or_value
    prompt: "An analyst works out what WeWork's future cash is worth today. Is her answer about a price or a value?"
    skill: s12-price
    choices:
      - { id: value, text: "A value" }
      - id: price
        text: "A price"
        mistake: { tag: value_for_price, fix: "Nobody paid her figure: she argued it from the business's future cash, so it is a value." }
    answer: value
    explanation: "A value comes from a story about the business's future cash; a price is what someone pays."
    source: "Damodaran, Narrative and Numbers (Columbia Business School Publishing, 2017), on price and value"
  - id: s12-q-runrate
    kind: direction
    prompt: "WeWork's filing says its revenue was running at $3.3 billion a year by 30 June 2019, up 86% in a year. Which lever does that speak to, and which way?"
    skill: s12-story
    choices:
      - { id: size-up, text: "How big it gets, up" }
      - id: margin-up
        text: "What it keeps of each sale, up"
        mistake: { tag: lever_mixup, fix: "Faster sales say how big it gets. WeWork still lost money, so they say nothing yet about what it keeps." }
      - id: risk-down
        text: "How risky it is, down"
        mistake: { tag: lever_mixup, fix: "Growth in sales is size. Risk is how sure the cash is, which fast growth alone does not settle." }
    answer: size-up
    explanation: "Sales growing fast is evidence for the size lever: how big WeWork could get."
    source: "WeWork Form S-1, 14 Aug 2019: https://www.sec.gov/Archives/edgar/data/1533523/000119312519220499/d781982ds1.htm"
  - id: s12-q-leases
    kind: direction
    prompt: "WeWork owes rent on long leases, while its members can leave on short contracts. Which lever moves, and which way?"
    skill: s12-story
    choices:
      - { id: risk-up, text: "How risky it is, up" }
      - id: size-up
        text: "How big it gets, up"
        mistake: { tag: lever_mixup, fix: "The leases fix WeWork's costs; they do not add sales. The mismatch makes the cash less sure." }
      - id: margin-up
        text: "What it keeps of each sale, up"
        mistake: { tag: lever_mixup, fix: "Fixed rent with members who can leave is a danger to the margin, not a boost: if desks empty, the rent is still due." }
    answer: risk-up
    explanation: "Rent is owed for years while income can walk away in months, so the cash is less sure: risk goes up, and a riskier business deserves a lower multiple."
    source: "WeWork Form S-1, 14 Aug 2019: https://www.sec.gov/Archives/edgar/data/1533523/000119312519220499/d781982ds1.htm"
  - id: s12-q-hold
    kind: cannot_hold
    prompt: "Which story for WeWork contradicts itself?"
    skill: s12-story
    choices:
      - { id: free-growth, text: "Sales grow sixty percent a year for five years and it opens almost no new buildings" }
      - id: spends
        text: "Sales grow fast and it leases and fits out many new buildings first"
        mistake: { tag: spending_is_contradiction, fix: "Spending ahead of growth is how a desk business grows. Growth with no new buildings is what cannot hold." }
      - id: iwg-like
        text: "Sales grow slowly and it keeps a thin margin, like IWG"
        mistake: { tag: dull_is_fine, fix: "A dull story can still hold together. It just justifies a low multiple." }
    answer: free-growth
    explanation: "WeWork sells desks in buildings it leases, so more sales need more buildings first. Growth costs money."
    source: "WeWork Form S-1, 14 Aug 2019: https://www.sec.gov/Archives/edgar/data/1533523/000119312519220499/d781982ds1.htm"
  - id: s12-q-gap
    kind: direction
    prompt: "WeWork and IWG have about the same number of desks, yet IWG's shares sell for about a tenth of WeWork's price. For that gap to hold, which levers must WeWork's story set higher than IWG's?"
    skill: s12-story
    choices:
      - { id: growth-margin, text: "How big it gets and what it keeps, both far higher" }
      - id: risk
        text: "How risky it is, higher"
        mistake: { tag: risk_raises_multiple, fix: "More risk means a higher cost of capital, which pulls a multiple down, not up." }
      - id: desks
        text: "None: the same desks are worth the same"
        mistake: { tag: same_size_same_value, fix: "Desks today are the same; the multiple prices what those desks become, which is growth and margin." }
    answer: growth-margin
    explanation: "A buyer pays more for each dollar of sales only if that dollar becomes more cash later: faster growth, a richer margin, or both."
    source: "WSJ (Konrad Putzier) via Toronto Star, 20 Aug 2019: https://www.thestar.com/business/wework-is-valued-10-times-greater-than-this-profitable-public-rival/article_4f3a25b8-c326-50f6-aefc-6e39d447bee4.html"

checks:
  - id: s12-check
    kind: quiz
    questions: [s12-q-lever, s12-q-predict, s12-q-round, s12-q-analyst, s12-q-runrate, s12-q-leases, s12-q-hold, s12-q-gap]
    perAttempt: 4
    passRule: { correct: 3 }
    card:
      title: A multiple is a price in shorthand
      lines:
        - "A multiple divides a price by a measure such as revenue."
        - "WeWork's $47 billion was about 26 times its 2018 revenue."
        - "Buyers pay a high multiple only for fast growth, rich margins or low risk."
        - "So read a multiple back as the story it needs."
      writeDown: "A multiple is a price. Ask what story it needs."
      skills: [s12-price, s12-story]
    quickTries:
      - id: s12-try-forbes-half
        skill: s12-price
        ask: "Forbes divides WeWork's $47 billion by its 2018 revenue and gets about 26. Is that multiple a price or a value?"
        halfDone: "First step, done for you: the $47 billion is what investors paid for new shares, scaled up to the whole company."
        kind: choice
        answer: price
        choices:
          - { id: price, text: "A price" }
          - id: value
            text: "A value"
            mistake: { tag: price_for_value, fix: "Dividing a price by revenue still gives a price, just in shorthand." }
      - id: s12-try-iwg-cap
        skill: s12-price
        ask: "On 20 August 2019 the stock market puts IWG's shares at $4.45 billion. Is that a price or a value?"
        kind: choice
        answer: price
        choices:
          - { id: price, text: "A price" }
          - id: value
            text: "A value"
            mistake: { tag: price_for_value, fix: "It is what buyers pay for IWG's shares today: a price." }
      - id: s12-try-comparable
        skill: s12-price
        ask: "You want to borrow a rival's multiple to price WeWork's desks. Which company is the better comparable?"
        kind: choice
        answer: iwg
        choices:
          - { id: iwg, text: "IWG, which also rents desks in offices it leases" }
          - id: software
            text: "A fast-growing software company"
            mistake: { tag: growth_not_alike, fix: "A comparable must run a business like WeWork's. Fast growth alone does not make a software firm alike." }
      - id: s12-try-ebitda
        skill: s12-price
        ask: "Two companies that rent out office desks earn the same before interest, tax and the wear on their assets. One has borrowed heavily and the other hardly at all. You want one multiple that holds up across that gap. Which do you reach for?"
        kind: choice
        answer: ev
        choices:
          - { id: ev, text: "A multiple on the enterprise value, which prices the whole business, lenders included" }
          - id: pe
            text: "A price-to-earnings multiple on the shares"
            mistake: { tag: equity_multiple_hides_debt, fix: "Profit after interest already carries the debt, so two companies that borrow differently are no longer alike." }
          - id: share-sales
            text: "The shares' price over sales, because both rent out desks"
            mistake: { tag: equity_multiple_hides_debt, fix: "Shareholders are paid after the lenders, so the company that borrowed heavily has cheaper shares for the same sales." }
      - id: s12-try-gap-half
        skill: s12-story
        ask: "Buyers pay about 26 times sales for WeWork's shares and about 1.4 times for IWG's. Which belief best explains the gap?"
        halfDone: "First step, done for you: a buyer pays more for each dollar of sales only if that dollar becomes more cash later."
        kind: choice
        answer: grow-keep
        choices:
          - { id: grow-keep, text: "WeWork will grow much faster and keep more of each sale" }
          - id: riskier
            text: "WeWork is the riskier of the two"
            mistake: { tag: risk_raises_multiple, fix: "More risk pulls a multiple down. The gap needs faster growth or a richer margin." }
          - id: desks
            text: "WeWork has far more desks"
            mistake: { tag: same_size_same_value, fix: "The two have about the same number of desks." }
      - id: s12-try-least
        skill: s12-story
        kind: which_lever
        ask: "Take the same story for WeWork, with its one-in-four chance of never getting there. Which one change moves the value of a share least?"
        computed:
          case: s12-wework-iwg
          preset: { marginTarget: 13, failureChance: 25 }
          changes:
            - { id: risk-nine, label: "Its cost of capital is a point higher, at 9%", levers: { costOfCapitalGrowing: 9 } }
            - { id: margin, label: "It keeps 12% of each sale, not 13%", levers: { marginTarget: 12 } }
            - { id: no-failure, label: "It is certain to survive", levers: { failureChance: 0 } }
      - id: s12-try-story
        skill: s12-story
        ask: "Which story could justify a multiple as high as WeWork's?"
        kind: choice
        answer: fast-rich
        choices:
          - { id: fast-rich, text: "Fast growth for years and, in time, a margin above IWG's" }
          - id: slow-thin
            text: "Slow growth and a thin margin"
            mistake: { tag: dull_story_high_multiple, fix: "A slow, thin story justifies a low multiple, like IWG's." }
  - id: s12-talk
    kind: conversation
    prompt: "WeWork was priced at about 26 times its 2018 revenue and IWG's shares at about 1.4 times. In two or three sentences, say what WeWork's multiple assumes about growth, margins and risk, and what you would want to see before you believed it."
    passCriteria: "Treats the multiple as a price, not a value; names at least two of growth, margin and risk as what the multiple assumes; says what evidence about WeWork would have to hold, such as fast growth turning into profit; uses IWG as a comparable with a reason it differs."
    skills: [s12-story]
