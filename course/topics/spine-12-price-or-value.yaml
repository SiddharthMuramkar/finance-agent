      peers:
        - name: IWG
          icon: cityscape
          note: "602,535 desks"
          multiple: 1.44
          source:
            title: "IWG's $4.45bn market value (WSJ via Toronto Star, 20 Aug 2019) over its 2018 revenue at $1.2153 a pound (FRED), computed"
            url: https://www.thestar.com/business/wework-is-valued-10-times-greater-than-this-profitable-public-rival/article_4f3a25b8-c326-50f6-aefc-6e39d447bee4.html
      # Held still while the three levers move, from WeWork's own filing-based figures; the opening is a plain story of the
      # Topic's own (sales growing by half a year, a tenth of each sale kept, a 9% cost of capital), not anyone's valuation.
      assumptions: { taxPercent: 25, salesToCapital: 1.68, growthAfterPercent: 1.6 }
      opening: { growth: 50, risk: 9, margin: 10 }
      # The Topic's word on a Lingo card above the decoder (Spine critics round 1 on #96: Sliders and a dot strip alone is
      # chart-only), the same card as the term below.
