# Spine Topic 12 (spec 2026-11-12, C4): is a price a value? Multiples and comparables, on WeWork at $47 billion against IWG.
# Facts: docs/research/verify-wework-2019.json (cases wework-iwg-multiples-2019, wework-leases-2019, wework-private-round-2019),
# and the Electives this Topic draws on (Appendix D): val-multiples (Case wework-iwg-multiples-2019), fol-twitter-ipo,
# cf-venture and mkt-ipo-float. Everything before the reveal keeps to what was known on 20 Aug 2019: the decoder opens on
# a plain story of the Topic's own (sales growing by half, a tenth of each sale kept, a 9% cost of capital), and the Check's
# computed questions start from another, the Topic's own too (13% kept, a one-in-four chance of failure). Neither is anyone's
# published valuation. Damodaran's 9 Sep 2019 story and its $26 a share are in the reveal only.
# What stays his: the engine behind the levers is his block (wework-leases-2019), whose growth path, cost of capital, leases
# and cash were set on 9 Sep, and whose cash counts $3.5bn of hoped-for IPO money. It is the only sourced valuation of
# WeWork, so the Topic names no figure from it before the reveal and moves the levers around it instead.
id: spine-12-price-or-value
title: "Is a price a value? Multiples and comparables"
# Stage, place on the Spine, length's outline entry and drawsOn live in course/outline.yaml.
minutes: 13
exampleCurrency: USD
goal: "Read a multiple as a price, and say what growth, margins and risk it would need to hold"
# Why it matters (spec 2026-11-12 A6): how this Topic helps value a company, for the Tutor to say in its own words.
why: "Multiples are the quickest way people price a company; reading one back as a story about the business tells you whether that price could ever be a value."
youllLearn:
  - "Tell a multiple, which is a price, from a value argued from the business."
  - "Pick a comparable and say where it differs from the company you are pricing."
  - "Keep what the whole business is worth apart from what its shares are worth."

cases:
  - id: s12-wework-iwg
    title: WeWork at $47 billion against IWG
    asOf: 2019-08-20
    story: >
      It is 20 August 2019. WeWork leases office buildings and rents desks in them to members on
      short contracts. In January SoftBank put $2 billion more into WeWork, most of it at a valuation of $47 billion.
      On 14 August it filed to sell shares to the public: in 2018 it sold $1.82 billion and lost
      $1.93 billion, and its revenue was growing 86% a year. The $47 billion is about 26 times its
      2018 revenue. Today a newspaper sets WeWork beside IWG, the owner of Regus, which is listed in
      London and makes a small profit. The two have about the same number of desks, yet the
      stock market puts IWG's shares at $4.45 billion, about a tenth as much: about 1.4 times its 2018 revenue. Is
      $47 billion what WeWork is worth, or a price that needs a story?
    reveal: >
      On 9 September 2019 Aswath Damodaran published his own story: sales growing 60% a year for five
      years, a margin of 12.5% from year 6, a cost of capital near 8%, and a one-in-five chance that
      WeWork fails. It came to about $26 a share, about $10 billion for the shares before the
      hoped-for money from the listing, far below $47 billion. The
      market did not pay the multiple either. By late September reports put the IPO valuation as
      low as $10 billion. Adam Neumann stepped down as chief executive on 24 September and the IPO
      was withdrawn on 30 September. On 22 October SoftBank's rescue valued WeWork at about $8
      billion, a cut of more than 80% from January: still pricier for its sales than IWG, but
      nowhere near 26 times.
    # Damodaran's 9 Sep 2019 valuation, written once in fs-leases-debt.yaml (wework-leases-2019): dollars and shares in
    # millions. Cash counts the $3.5bn of hoped-for IPO money and $218.44m of non-operating assets; debt counts
    # $22,062.91m of leases. The price is the sheet's placeholder ($30), not a market price: no question reads it.
    valuationFrom: wework-leases-2019

concept: >
  A multiple divides a price by a measure of the business, such as its revenue. It is quick: if a
  rival sells for so many times its sales, the same multiple can be laid on the company you are
  pricing. But a multiple is still a price, set by what buyers pay, and a comparable is useful only
  when it really is alike. Behind every multiple sits a view of the future: how fast sales grow,
  how much of each sale is kept, and how risky that cash is. Two companies with the same sales
  deserve very different multiples when those views differ. So before you borrow a rival's
  multiple, or accept a company's own, ask what growth, margins and risk it needs, and whether the
  business looks like that. Sales are only one measure to divide by: buyers also divide by profit,
  or set the whole business, lenders included, against what it earns. Each one hides the same three
  beliefs; each one is still a price.

# Go deeper (H1): beyond the Topic's Checks, for a Learner who asks. No Check, Skill or Lingo term tests it.
goDeeper: >
  EV/EBITDA is enterprise value divided by EBITDA, the earnings before interest, tax and the wear on
  the assets: what the whole business costs for each dollar it earns before those. A café bought for
  $2 million whose takings less its running costs are $200,000 a year sells at ten times. IWG makes a
  small profit, so it has earnings to set the whole business against; WeWork's losses were bigger than
  its sales, so it is priced against its sales instead. Which measure you divide by changes what the
  multiple hides. A price-to-earnings multiple rests on
  profit after interest, so it mixes in how much the company has borrowed; EV/EBITDA sets the whole
  business against earnings before interest and before the wear on its assets, which makes two
  companies with different debts easier to set side by side, though it flatters a business whose
  equipment wears out and must be replaced, as aircraft and office fit-outs do. The PEG ratio goes a step further
  and divides a price-to-earnings multiple by the growth expected over the next few years, so a
  higher multiple may be called cheap when the growth is faster. A PEG near one is treated as fair by
  habit rather than by arithmetic, and it says nothing about risk, so it is a shorthand for a
  shorthand: useful for a first sort, never for a verdict.

principle: >
  A multiple is a price in shorthand, not a value. Read it back as the growth, margins and risk it
  needs, then ask whether the company's own story can deliver them.

dailyLife: "Pricing a flat by what the one next door sold for: first ask whether yours is really alike, the same size, the same street, the same repairs due."

terms:
  - term: multiple
    means: A price divided by a measure of the business, such as its revenue or its profit.
    pro: It trades at twenty-six times sales.
    example: "A café that sells for $2 million and takes $1 million a year sells at two times sales."
    emoji: label
    inStory: In the story, WeWork's $47 billion is about 26 times its 2018 revenue.
  - term: comparable
    means: A similar company whose price is used to judge another company's price.
    pro: IWG is the closest listed comparable.
    example: "To price a corner shop, you look at what similar corner shops nearby sold for."
    emoji: balance-scale
    inStory: In the story, IWG has about as many desks as WeWork, and a stock market price.
  - term: enterprise value
    means: What the whole business is worth, to its lenders and its shareholders together.
    pro: On enterprise value to sales, IWG looks far cheaper.
    example: "A shop whose owners' stake is worth $1 million and which owes the bank $1 million is a $2 million business."
    emoji: office-building
    inStory: In the story, IWG's $4.45 billion counts its shares only, not its debt.
  - term: justified multiple
    means: The multiple a story about growth, margins and risk can support.
    pro: The justified multiple sits far below what the market pays.
    example: "A café that will never grow justifies a lower multiple than one opening a new branch every year."
    emoji: magnifying-glass-tilted-left
    inStory: In the explore step, the decoder shows the multiple each Story for WeWork or IWG justifies.

skills:
  - id: s12-price
    rule: "A multiple is a price: what buyers pay for each dollar of sales or profit, not what the business is worth."
  - id: s12-story
    rule: "A high multiple holds only if its story does: fast growth, rich margins or low risk."

primers:
  - id: s12-primer-ev
    title: Business value and share value
    lines:
      - "Enterprise value is what the whole business is worth, to its lenders and its shareholders together."
      - "Shareholders own what is left once the lenders are paid, with any spare cash added back."
      - "Revenue pays lenders and shareholders alike, so set shares against sales only for companies with like debts."
    term: enterprise value
    quickTry:
      id: s12-primer-try
      skill: s12-price
      ask: "The stock market puts IWG's shares at $4.45 billion, and IWG owes more than it holds in cash. Is its whole business worth more or less than its shares?"
      kind: choice
      answer: more
      choices:
        - { id: more, text: "More than its shares" }
        - id: less
          text: "Less than its shares"
          mistake: { tag: debt_shrinks_business, fix: "Debt is a claim on the business, so the whole business is the shares plus what lenders are owed." }
    elective: val-multiples
    at: concept

insight:
  question: "Set the decoder so it justifies WeWork's multiple, then IWG's. What did you have to believe each time?"
  written: "A multiple hides a view on growth, risk and margins: WeWork's needed years of fast growth and a rich margin from the start, and more still if the margin comes only after years of losses, while IWG's fits a slow-growing business."
  foundWhen: "The Learner gets near WeWork's multiple and near IWG's, and says the gap comes from what each story assumes about growth and margins (or risk), not from the desks the two companies have."
  hints:
    - "Hold the cost of capital still and push growth and margin up together until you reach WeWork."
    - "Now bring growth down to nine percent a year and nudge the margin up two or three points: that is where IWG sits."

explore:
