# CAPM, beta and factor models: a foundation Topic taught through Damodaran's cost of equity for Amazon in February 2000.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
# Case sources (checked): Damodaran, "Valuing Amazon.com" (HighGrow) paper, valuation done February 2000: http://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf ; Amazon.com, Form 10-K405 for 2000 (SEC EDGAR 0001032210-01-500087): https://www.sec.gov/Archives/edgar/data/1018724/000103221001500087/d10k405.txt ; OpenStax, Principles of Finance 2e, 15.3.
# Not covered: an India beta and cost-of-capital input dated before the Case; no past-dated Indian file was found.
id: risk-capm
title: CAPM, beta and factor models

cases:
  - id: amazon-cost-of-equity-2000
    title: What return should Amazon's shareholders require? (February 2000)
    data: [amzn-quarterly-high, amzn-quarterly-low]
    asOf: 2000-02-01
    story: >
      In February 2000 Amazon.com, the online retailer, trades at $84 a share,
      and Aswath Damodaran of New York University is valuing it. He needs the cost of equity: the return
      shareholders should require for the risk they bear, used to discount the company's future cash flows. The yield on the US Treasury bond, his risk-free rate, is 6.5%. The premium for holding
      average-risk shares over the risk-free rate (the equity risk premium) he takes as 4%. For beta, the measure of how much
      a share moves with the market, he has two figures. A regression of two years of weekly Amazon returns on the
      market (from Bloomberg) gives a beta of 2.29, but with a standard error of 0.50, which is large because the
      company has a short history. The average beta of internet firms is about 1.60, and of retailers close to
      1.0. He chooses 1.60 for the first five years, fading to 1.00 by year ten as the company matures. Which beta
      would you use for the cost of equity, and why does the choice matter to the value?
    reveal: >
      Damodaran used beta 1.60 and a cost of equity of 12.90% for years one to five (6.5% + 1.60 x 4%), falling to 10.50% by year ten (beta 1.00).
      The regression beta of 2.29 would have implied 15.66%. Combined with forecasts of rapid revenue growth and rising margins,
      his cost of capital of 12.84% in year one and 9.61% in the stable phase gave a value of $35.08 a share, well under the $84 market
      price. The shares did not fall in a straight line. Amazon's 10-K shows a first-quarter 2000 high of $91.50, but then quarterly lows of
      $58.44, $32.47, $27.88 and $14.88 in the year, and the stock traded as high as $91.50 and as low as $14.88
      in 2000. The cost of equity says what return to demand, not what the price will do in the next year: a
      beta tells how a share moves with the market, not whether the price is right. The gap between the high
      and low also shows how weak a short-history beta is as a guide to the actual swings of a young company.

concept: >
  The capital asset pricing model (CAPM) says investors are rewarded only for systematic risk, the part
  of a share's risk that cannot be diversified away. A share's beta measures how much it moves with the market:
  a beta of 1 moves in line, 2 moves twice as much, 0.5 half as much. The expected return is
  Re = Rf + beta x (Rm - Rf), where Rf is the risk-free rate (usually a government bond yield) and Rm - Rf is the market
  risk premium (equity risk premium), the extra return investors expect for holding the market instead of the risk-free asset.
  A share with a beta above 1 should offer a higher expected return than the market and one below 1 a lower return. Beta is
  estimated by regressing the share's returns on the market's returns, and the estimate depends on the
  period, the return interval and the market index used, so two providers give different numbers for the same share. For a young
  company or one with few years of data, the regression beta carries a large standard error (the true beta is roughly
  within two standard errors either side of the estimate), so analysts often use the average beta of comparable firms instead.
  Beta also rises with a company's debt, which is why comparable betas are adjusted for leverage. CAPM has one factor,
  the market; factor models extend it with more, such as company size and value, and are used to explain why
  some groups of shares have earned more than beta alone would predict. In valuation, the cost of equity is the
  discount rate for equity cash flows, so the choice of beta and equity risk premium changes the value.

principle: >
  Beta prices only the risk you cannot diversify. The cost of equity is the return you should demand, built from
  the risk-free rate, the premium for market risk and the beta, and the beta is an estimate with error.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Read beta as how much a share moves with the market."
  - "Build a cost of equity from the risk-free rate, the market risk premium and beta."
  - "Treat a measured beta as an estimate with error, and know when to borrow one from similar firms."

questions:
  - id: cm-q-capm
    prompt: >
      Neha's dad owns two shares: a sleepy power company and a jumpy dot-com that swings about twice as hard as the market. Over Sunday dinner he asks which should promise him more return. What does the CAPM say?
    choices:
      - { id: a, text: "The dot-com, because it carries more of the market's risk" }
      - { id: b, text: "Both the same, since both are just shares", mistake: { tag: beta_ignored, fix: "The model pays more for more market risk, so the jumpier share must promise more." } }
      - { id: c, text: "The power company, because steady shares deserve more", mistake: { tag: safety_premium, fix: "Steadiness is a comfort, not a reward; the model pays only for market risk you bear." } }
      - { id: d, text: "Whichever did best over the last five years", mistake: { tag: past_is_expected, fix: "The model builds expected return from the safe rate, beta and the market's premium, not past returns." } }
    answer: a
    explanation: >
      The CAPM starts from the safe rate (a government bond) and adds a slice of the market's extra reward for risk, sized by beta. The dot-com's beta is about 2, so it should promise roughly twice the extra reward of an average share; the sleepy one, less.
    source: >
      OpenStax, Principles of Finance 2e (CC BY 4.0), 15.3 The Capital Asset Pricing Model (CAPM equation): https://openstax.org/books/principles-finance-2e/pages/15-3-the-capital-asset-pricing-model-capm

  - id: cm-q-beta
    prompt: >
      On the morning of her first trade, Meera's broker tips a start-up share "with a beta of 2". She hopes that means a calm ride for her savings. What do traders mean by a beta of 2?
    choices:
      - { id: a, text: "It tends to swing about twice as far as the market, same direction" }
      - { id: b, text: "It tends to swing about half as far as the market", mistake: { tag: beta_inverted, fix: "A beta above 1 means the share swings more than the market, not less." } }
      - { id: c, text: "Twice as far as the market, but the opposite way", mistake: { tag: sign_slip, fix: "A beta of 2 is positive, so the share moves the same way as the market." } }
      - { id: d, text: "It is twice as safe as the market", mistake: { tag: beta_is_safety, fix: "A higher beta means more market risk, so the share is riskier, not safer." } }
    answer: a
    explanation: >
      When the market rises 10%, a beta-2 share tends to rise about 20%; when the market falls 5%, it tends to fall about 10%. That is a wild ride, not a calm one.
    source: >
      OpenStax, Principles of Finance 2e (CC BY 4.0), 15.3 The Capital Asset Pricing Model (Interpreting Beta): https://openstax.org/books/principles-finance-2e/pages/15-3-the-capital-asset-pricing-model-capm

  - id: cm-q-differ
    prompt: >
      One evening Arjun looks up his favourite share's beta on two websites: one says 1.2, the other 1.5. He suspects a typo before he invests. What is the likelier reason?
    choices:
      - { id: a, text: "They measured over different periods, intervals or market indexes" }
      - { id: b, text: "One site made an arithmetic slip it could never avoid", mistake: { tag: arithmetic_slip, fix: "Both can be right; a beta is an estimate that shifts with the data chosen." } }
      - { id: c, text: "The company sets its own beta and reports two", mistake: { tag: company_sets_beta, fix: "Analysts estimate beta from share prices; companies do not announce it." } }
      - { id: d, text: "Beta changes every time someone looks it up", mistake: { tag: beta_random, fix: "Beta shifts with the data window chosen, not with each lookup." } }
    answer: a
    explanation: >
      A beta is a regression estimate. Three- and five-year windows, weekly and monthly returns, and different indexes give different slopes for the same share.
    source: >
      OpenStax, Principles of Finance 2e (CC BY 4.0), 15.3 The Capital Asset Pricing Model (Calculating Beta): https://openstax.org/books/principles-finance-2e/pages/15-3-the-capital-asset-pricing-model-capm

  - id: cm-q-stderr
    prompt: >
      Rohan is valuing a young online shop listed only two years ago. Its own price history gives a beta of 1.8, but his software flags it as shaky. His report is due tonight. What should he do?
    choices:
      - { id: a, text: "Treat 1.8 as rough and lean on similar firms' average beta" }
      - { id: b, text: "Use 1.8: the software produced it, so it is exact", mistake: { tag: false_precision, fix: "A short price history gives only a rough estimate; the warning says it could be far off." } }
      - { id: c, text: "Call the shop low risk, since its beta is shaky", mistake: { tag: error_is_risk, fix: "Shaky describes how reliable the 1.8 is, not how risky the shop is." } }
      - { id: d, text: "Assume the true beta is below 1", mistake: { tag: error_direction, fix: "The error can push the true beta either way; it does not pull it below 1." } }
    answer: a
    explanation: >
      A beta from a short history carries a big standard error, so the true figure could be well below or well above 1.8. Damodaran faced this with Amazon in February 2000: its regression beta of 2.29 had a standard error of 0.50, so he used the average beta of internet firms, about 1.60.
    source: >
      Damodaran, Amazon.com valuation paper, section 5 (regression betas for firms with limited history carry substantial error; Amazon's 2.29 beta had a standard error of 0.50): http://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf

checks:
  - id: cm-quiz-capm
    kind: quiz
    questions:
      - cm-q-capm
      - cm-q-beta
      - cm-q-differ
      - cm-q-stderr
      - bank:eab:MBA-FIN-VAL-0037
      - bank:eab:MBA-FIN-VAL-0046
    perAttempt: 3
    passRule:
      correct: 2
  - id: cm-choose-beta
    kind: conversation
    prompt: >
      A young company's short price history gives it a beta of 2.1, a shaky figure. Similar, older firms
      average 1.5. Which would you pick to set the return its shareholders should demand, and why?
    passCriteria: >
      The Learner picks a beta and gives a reason. They say a short history makes the company's own beta
      unreliable, so the average of similar firms is the sounder choice (or they argue for 2.1 with a
      reason). They say a higher beta means shareholders demand a higher return, which makes the
      company's future cash worth less today, so the choice changes the value.
