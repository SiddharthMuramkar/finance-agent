  - id: fc-s-cash
    step: concept
    check: fc-webvan-cash
    recipe: myth_or_fact
    title: "Cash and profit: myth or fact"
    inputs:
      cards:
        - claim: A company with a net loss always uses exactly that much cash.
          isFact: false
          why: Non-cash costs such as depreciation make the loss and the cash used differ.
          emoji: chart-decreasing
        - claim: Money raised from investors counts as operating cash flow.
          isFact: false
          why: It is financing. Operating cash flow comes from running the business.
          emoji: money-bag
        - claim: Cash on hand and the pace of cash use show how long cash lasts.
          isFact: true
          why: Cash on hand against the monthly cash use is the runway.
          emoji: hourglass-not-done
