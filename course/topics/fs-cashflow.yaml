# The cash flow statement: a foundation Topic taught through a short Case.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
# Case sources (checked): Webvan Form 10-K for 2000 (SEC accession 0001012870-01-001485); Webvan Form 8-K filed 27 Jul 2001 (SEC accession 0001021408-01-504054) for the bankruptcy filing date.
id: fs-cashflow
title: The cash flow statement
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: webvan-cash-2001
    title: Webvan's cash burn
    data: [net-loss, operating-cash-flow, capital-spending, cash-burn-reported-later]
    asOf: 2001-04-02
    story: >
      Webvan is an online grocer that delivers to homes from large automated warehouses. It went
      public in 1999, raising about 402.6 million dollars after costs, and bought its
      rival HomeGrocer in 2000. On 2 April 2001 it files its annual report for 2000. The report
      shows net sales of 178.5 million dollars and a net loss of 453.3 million dollars. The cash flow statement shows net cash used in operating activities
      of 263.1 million dollars, and 259.8 million dollars spent on property, equipment and
      leasehold improvements, mostly warehouses and vehicles. At 31 December 2000 it holds 40.3
      million dollars in cash and 171.6 million dollars in marketable securities. As of this date, investors are
      asking what the three sections of the statement say about the business, and whether that
      cash can carry it much further.
    reveal: >
      On 9 July 2001 Webvan shut down all seven of its markets, which served about 750,000
      customers, and said it would file for bankruptcy protection; it filed for Chapter 11 on 13
      July. Its accumulated deficit had reached
      829.7 million dollars by 31 March 2001. (A TIME report put its cash burn at 480 million
      dollars; that is a press estimate, not a filing figure.) The cash flow statement had already shown it: the business used
      cash in operations (263.1 million dollars in 2000, up from 58.8 million in 1999), spent
      almost as much again on warehouses, and was paying for both from money raised from investors
      in 1999. Once that money was spent, nothing from sales was coming in to replace it.

concept: >
  The cash flow statement shows where cash came from and where it went over a period, in three
  sections. Operating activities are cash from running the business, starting from net income
  and adding back non-cash expenses such as depreciation, with changes in receivables,
  inventory and payables. Investing activities are cash spent on or received from long-term
  assets, such as equipment and securities. Financing activities are cash from or to the
  providers of money: shares, loans and dividends. Free cash flow is operating cash flow minus
  spending on equipment (capital spending). A company can show a net loss that is larger or
  smaller than its cash use, and only the cash flow statement says how long its cash lasts.

principle: >
  Profit is an opinion; cash is a fact. Compare net income with operating cash flow, ask who is
  paying for the investing, and divide cash on hand by the monthly cash use to see how long the
  money lasts.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Read where a company's cash came from and where it went."
  - "Compare reported profit with the cash the business really produces."
  - "Work out how long a company's cash will last."

# Written for the story-first spec (E6b): terms, a Running example and scenes, and questions that ask about the story and the words (ADR 0009).
exampleCurrency: INR
runningExample:
  text: "A chai stall spends ₹10,000 more cash than it takes in each month."
  numbers: [10000]
  scene:
    cast:
      - { id: meena, emoji: cook, name: Meena, role: chai stall owner }
    beats:
      - { who: narrator, says: "Meena's chai stall takes in less cash than it spends each month.", emoji: hot-beverage }
      - { who: narrator, says: "She pays the gap from the ₹60,000 she saved before opening.", emoji: money-bag }
      - { who: meena, says: "The longer the gap lasts, the sooner my savings run out.", emoji: hourglass-not-done }

terms:
  - term: cash burn
    means: How fast a company uses up its cash because it spends more than it takes in.
    pro: The company is burning cash every month.
    example: "You spend ₹12,000 a month and earn ₹7,000: your savings shrink."
    emoji: fire
    inStory: Webvan used 263.1 million dollars of cash in its operations in 2000.
  - term: runway
    means: How long a company's cash will last if it keeps spending at the same pace.
    pro: Analysts ask how much runway is left.
    example: "Your ₹60,000 of savings lasts only until it runs out at a steady monthly spend."
    emoji: airplane
    inStory: At 31 December 2000 Webvan held 40.3 million dollars in cash and 171.6 million in securities.
  - term: operating cash flow
    means: Cash a company really gets from, or spends on, running the business, whatever profit says.
    pro: Analysts look at operating cash flow, not just net income.
    example: "Cash in your tea stall's till this month, not what customers promised."
    emoji: coin
    inStory: Webvan's statement showed net cash used in operating activities, not cash earned.
  - term: free cash flow
    means: Cash from operations left after paying for the equipment and long-term assets the business needs.
    pro: Free cash flow is operating cash flow after capital spending.
    example: "Tea sales cash, less the ₹40,000 you spent on a new stove."
    emoji: money-with-wings
    inStory: Webvan also spent 259.8 million dollars on warehouses and vehicles, on top of its operations.
  - term: financing activities
    means: "Cash raised from, or paid to, owners and lenders: selling shares, borrowing, paying dividends."
    pro: Analysts check who is financing the burn.
    example: "Your parents lending you ₹50,000 to open the stall."
    emoji: bank
    inStory: Webvan went public in 1999, raising about 402.6 million dollars after costs.

