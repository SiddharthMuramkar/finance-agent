    step: principle
    recipe: two_paths
    title: "Two readers, one loss"
    inputs:
      question: Two readers see the same loss. How does each judge the company?
      left:
        emoji: man-office-worker
        name: Reader A
        choice: Looks only at net profit
        outcome: [chart-decreasing, thinking-face]
        outcomeLine: Knows there is a loss, but not how long the cash lasts.
      right:
        emoji: woman-office-worker
        name: Reader B
        choice: Follows the cash
        outcome: [magnifying-glass-tilted-left, hourglass-not-done]
        outcomeLine: Sees where the cash came from and when it runs out.

questions:
  - id: fc-q-loss-vs-cash
    prompt: >
      Webvan's net loss for 2000 was bigger than the cash it used in operations. What most likely explains the gap?
    choices:
      - { id: a, text: "Non-cash expenses, such as depreciation and share-based pay, reduced profit but not cash" }
      - { id: b, text: "The company earned extra interest that year", mistake: { tag: interest_explains_gap, fix: "Interest earned is small here. The big gap comes from costs that took no cash." } }
      - { id: c, text: "Money raised from investors counts as operating cash flow", mistake: { tag: financing_in_operating, fix: "Money raised from investors is financing, not operating." } }
      - { id: d, text: "The cash flow statement is always lower than the income statement", mistake: { tag: always_lower, fix: "There is no such rule. It depends on non-cash costs and on changes in receivables, inventory and payables." } }
    answer: a
    explanation: >
      Starting from net income, the operating section adds back expenses that cost no cash, such as depreciation (94 million in Webvan's 2000 statement) and share-based pay. Money raised from investors is financing, not operating.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.5 The Statement of Cash Flows: https://openstax.org/books/principles-finance-2e/pages/5-5-the-statement-of-cash-flows ; Webvan Group, Form 10-K for 2000, filed 2 April 2001.

  - id: fc-q-sections
    prompt: >
      Where do these three cash flows appear on the statement: (1) cash received from customers, (2) cash spent on a new warehouse, (3) cash received from selling new shares?
    choices:
      - { id: a, text: "(1) operating, (2) investing, (3) financing" }
      - { id: b, text: "(1) operating, (2) financing, (3) investing", mistake: { tag: swapped_investing_financing, fix: "Buying a warehouse is investing. Selling shares to owners is financing." } }
      - { id: c, text: "(1) investing, (2) operating, (3) financing", mistake: { tag: swapped_operating_investing, fix: "Customer receipts come from running the business, so they are operating." } }
      - { id: d, text: "(1) financing, (2) investing, (3) operating", mistake: { tag: reversed_order, fix: "Customer receipts are operating and share money is financing." } }
    answer: a
    explanation: >
      Customer receipts come from running the business (operating). Buying a long-term asset is investing. Selling shares raises money from owners, which is financing.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.5 The Statement of Cash Flows: https://openstax.org/books/principles-finance-2e/pages/5-5-the-statement-of-cash-flows

  - id: fc-q-free-cash-flow
    prompt: >
      What do analysts call the cash left from operations after paying for equipment and other long-term assets?
    choices:
      - { id: a, text: "Free cash flow" }
      - { id: b, text: "Net income", mistake: { tag: net_income_for_fcf, fix: "Net income is profit by accounting rules, not cash left after equipment." } }
      - { id: c, text: "Retained earnings", mistake: { tag: retained_for_fcf, fix: "Retained earnings is kept profit on the balance sheet, not a cash flow." } }
      - { id: d, text: "Financing cash flow", mistake: { tag: financing_for_fcf, fix: "Financing is cash from owners and lenders, not cash left after equipment." } }
    answer: a
    explanation: >
      Free cash flow is operating cash flow after capital spending. For Webvan in 2000 both sides were outflows, so it was deeply negative.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.6 Operating Cash Flow and Free Cash Flow to the Firm: https://openstax.org/books/principles-finance-2e/pages/5-6-operating-cash-flow-and-free-cash-flow-to-the-firm-fcff ; the figures are Webvan's 2000 annual report.

  - id: fc-q-months
    prompt: >
      Analysts ask how long a company's cash will last at its current pace of spending. What do they call that?
    choices:
      - { id: a, text: "The runway" }
      - { id: b, text: "Free cash flow", mistake: { tag: fcf_for_runway, fix: "Free cash flow is cash left after equipment. The runway is how long the cash lasts." } }
      - { id: c, text: "The run rate", mistake: { tag: run_rate_for_runway, fix: "A run rate scales the latest period up to a year. The runway counts how long cash lasts." } }
      - { id: d, text: "The accumulated deficit", mistake: { tag: deficit_for_runway, fix: "That is total losses to date, not how long the cash lasts." } }
    answer: a
    explanation: >
      The runway is cash on hand set against the pace of cash use. Webvan's cash and securities were less than one year of its 2000 operating cash use, before any equipment spending.
    source: >
      Webvan Group, Form 10-K for 2000 (cash 40.3 million, marketable securities 171.6 million, operating cash use 263.1 million).

  - id: fc-q-profit-no-cash
    prompt: >
      A company reports a profit, but its receivables (money owed by customers) rose sharply during the year. What does that tend to do to its operating cash flow compared with net income?
    choices:
      - { id: a, text: "Operating cash flow is lower than net income, because sales were recorded but not yet collected" }
      - { id: b, text: "Operating cash flow is higher than net income", mistake: { tag: receivables_raise_cash, fix: "Unpaid sales have not produced cash, so cash flow is lower, not higher." } }
      - { id: c, text: "Operating cash flow is the same as net income", mistake: { tag: cash_equals_profit, fix: "They differ whenever sales are made on credit. Profit counts the sale, cash waits for payment." } }
      - { id: d, text: "Receivables only affect the balance sheet and never the cash flow statement", mistake: { tag: receivables_balance_only, fix: "A rise in receivables is subtracted from net income in operating cash flow." } }
    answer: a
    explanation: >
      On the indirect method an increase in receivables is subtracted from net income, because those sales have not yet produced cash.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.5 The Statement of Cash Flows, operating activities: https://openstax.org/books/principles-finance-2e/pages/5-5-the-statement-of-cash-flows

  - id: fc-q-burn
    prompt: >
      A newspaper says Webvan was "burning cash". What does that mean?
    choices:
      - { id: a, text: "It was spending more cash than it took in" }
      - { id: b, text: "A fire had damaged one of its warehouses", mistake: { tag: burn_is_fire, fix: "Cash burn is a money term. It has nothing to do with real fires." } }
      - { id: c, text: "It was paying out a large dividend", mistake: { tag: burn_is_dividend, fix: "Burn means cash going out faster than it comes in, whatever the reason." } }
      - { id: d, text: "It had no customers at all", mistake: { tag: burn_is_no_customers, fix: "A company with many customers can still burn cash if its costs are bigger than the cash coming in." } }
    answer: a
    explanation: >
      Cash burn is how fast a company uses up its cash because it spends more than it takes in. Webvan used 263.1 million dollars in operations in 2000.
    source: >
      Webvan Group, Form 10-K for 2000 (SEC accession 0001012870-01-001485); the plain meaning of cash burn.

  - id: fc-q-financing
    prompt: >
      Cash that a company raises by selling new shares is reported under what name on the cash flow statement?
    choices:
      - { id: a, text: "Financing activities" }
      - { id: b, text: "Operating activities", mistake: { tag: shares_in_operating, fix: "Operating is cash from running the business. Selling shares raises money from owners." } }
      - { id: c, text: "Investing activities", mistake: { tag: shares_in_investing, fix: "Investing is cash spent on or received from long-term assets." } }
      - { id: d, text: "Free cash flow", mistake: { tag: shares_in_fcf, fix: "Free cash flow is operating cash after equipment. It is not a section of the statement." } }
    answer: a
    explanation: >
      Cash from owners and lenders is financing. Webvan went public in 1999, and that money paid for its warehouses and its losses.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.5 The Statement of Cash Flows: https://openstax.org/books/principles-finance-2e/pages/5-5-the-statement-of-cash-flows

checks:
  - id: fc-quiz-cash
    kind: quiz
    questions:
      - fc-q-loss-vs-cash
      - fc-q-sections
      - fc-q-free-cash-flow
      - fc-q-months
      - fc-q-profit-no-cash
      - fc-q-burn
      - fc-q-financing
      - bank:eab:MBA-ACC-FA-0046
    perAttempt: 3
    passRule:
      correct: 2
  - id: fc-webvan-cash
    kind: conversation
    prompt: >
      Webvan's 2000 annual report shows a net loss of 453.3 million dollars, net cash used in
      operations of 263.1 million, equipment spending of 259.8 million, and 212 million in cash and
      securities at the year end. In words: why do the net loss and the cash used differ, how was
      Webvan paying for its equipment, and would you call its runway long or short? What would
      you want to know about 2001?
    passCriteria: >
      The Learner explains that the gap between the loss and the operating cash use is mostly
      non-cash expenses added back (depreciation, share-based pay, restructuring charges). They
      say the equipment was bought with money raised from investors in earlier years (the 1999
      share sale among it) and from selling securities, not from operating cash.
      They call the runway short: the cash and securities were less than one year of operating cash use,
      even before more equipment spending (they need not give a number; accept roughly ten months if they do),
      and say they would ask whether equipment spending would fall, whether sales were rising fast enough to cut
      the operating cash use, and whether new financing was available.
