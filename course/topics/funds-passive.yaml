# Mutual funds, ETFs and passive investing (incl. India AIFs): a foundation Topic taught through the Buffett-Protege bet.
# Case Data (the bet's yearly results, shown only at the reveal) lives in the database; see docs/architecture.md.
# Case sources (checked 2 Nov 2026): Long Bets, bet no. 362: https://longbets.org/362/ ; Berkshire Hathaway 2017 letter to shareholders (the bet's terms and final table): https://www.berkshirehathaway.com/letters/2017ltr.pdf
id: funds-passive
title: Mutual funds, ETFs and passive investing (incl. India AIFs)

cases:
  - id: buffett-protege-bet-2007
    title: Warren Buffett bets an index fund against hedge funds
    data: [bet-index-fund-return, bet-funds-of-funds-return]
    asOf: 2007-12-19
    story: >
      On 19 December 2007 Warren Buffett, who runs Berkshire Hathaway, made a ten-year bet
      with Protégé Partners, a New York investment firm. The bet,
      listed on the Long Bets website, reads: over the ten years from 1 January 2008 to
      31 December 2017, "the S&P 500 will outperform a portfolio of funds of hedge funds, when
      performance is measured on a basis net of fees, costs and expenses". Buffett would hold
      an S&P 500 index fund, a "virtually cost-free" fund that simply owns the 500 shares in
      proportion to the index and makes no attempt to pick winners. Protégé would pick five
      funds of funds, each of which invests in a group of hedge funds chosen by its manager
      and charges its own fee on top of the fees of those hedge funds. The prize was $1 million
      for the winner's charity. To fund it, each side bought $500,000 face amount of zero-coupon
      US Treasury bonds, which pay nothing until they mature in ten years and so sell at a deep
      discount. Each paid $318,250, a bit less than 64 cents on the dollar. As of 19 December
      2007, who would you back, and what would you need to know to judge the bet fairly?
    reveal: >
      Berkshire's 2017 letter gives the result. Over the ten years the index fund gained 125.8
      per cent, 8.5 per cent a year. The five funds of funds gained 21.7, 42.3, 87.7, 2.8 and
      27.0 per cent (2.0, 3.6, 6.5, 0.3 and 2.4 per cent a year); one was liquidated in 2017, so
      it has no 2017 figure. Their average was about 36 per cent, around
      2.2 per cent a year (the average is our own arithmetic from the letter's table). The
      funds of funds started well: each beat the index fund in 2008, a year in which the
      index fund fell 37 per cent and they fell between 16.5 and 30.1 per cent. After that,
      the average of the five trailed the index fund in each of the next nine years (our own
      arithmetic from the letter's table), although single funds beat it in some years. Buffett puts the fixed fees at about
      2.5 per cent of assets a year on average, and writes that "performance comes, performance
      goes. Fees never falter." In 2012 the two sides had agreed to swap the bonds for Berkshire
      B shares, and the charity, Girls Inc. of Omaha, received $2,222,279. The bet shows the
      arithmetic, not a law of nature: some active managers beat the market after fees, but
      picking them in advance is very hard, and every year's fees are certain.

concept: >
  A mutual fund pools money from many investors and buys a portfolio. Each unit is a share of
  that portfolio; its net asset value (NAV) per unit is the value of all assets minus all
  liabilities, divided by the number of units, and investors buy from and sell to the fund at
  the NAV worked out at the end of the day. An exchange-traded fund (ETF) is also a pooled
  fund and also calculates a NAV every day, but its shares trade on a stock exchange all day
  at a market price that can sit a little above or below NAV. A passive or index fund
  does not try to pick winners. It holds the index and charges little. An active fund pays
  managers and analysts to try to beat the index and charges more. The arithmetic of active
  against passive (as Damodaran sets it out): everyone who holds
  the market portfolio earns the market return before costs, so if passive investors earn
  that, active investors as a group must earn it too. After costs, active investors as a
  group earn less than passive investors, by the difference in costs. A fund of funds adds a
  second layer of fees. Costs compound: a 1 per cent annual cost on a 20-year holding takes
  far more than 20 per cent of the final amount. In India, mutual funds are regulated by
  SEBI. Pools for larger investors, such as private equity and hedge-fund style vehicles, are
  Alternative Investment Funds (AIFs) under SEBI's 2012 regulations; SEBI's 2016 FAQ states
  a minimum of Rs 1 crore from each investor (the rules have been amended since).

principle: >
  Compare returns net of fees, over the same period and risk, and remember that the average
  active investor cannot beat the average passive investor after costs. A manager may be
  skilled, but fees are certain and skill is hard to identify in advance.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Read a fund's net asset value and tell a mutual fund from an exchange-traded fund."
  - "Explain why active investors as a group trail passive ones after costs."
  - "Compare funds net of fees, over the same period and the same risk."

questions:
  - id: fp-q-nav
    prompt: >
      On 1 April your aunt Meera checks her mutual fund. It owns shares and bonds, and it also owes some bills. What does its NAV per unit tell her?
    choices:
      - id: a
        text: "Everything it owns, ignoring the bills, per unit"
        mistake: { tag: liabilities_ignored, fix: "The fund owes its bills, so they come off before anything is shared out." }
      - { id: b, text: "What is left after paying the bills, per unit" }
      - id: c
        text: "Just the bills it owes, per unit"
        mistake: { tag: nav_as_debt, fix: "The bills are what the fund owes. NAV is what is left for unit-holders." }
      - id: d
        text: "Its holdings and its bills added together, per unit"
        mistake: { tag: liabilities_added, fix: "Bills are owed, so they are taken away, never added." }
    answer: b
    explanation: >
      NAV per unit is what is left after the fund pays what it owes, shared among the units. For example, Rs 520 crore of assets less Rs 20 crore owed leaves Rs 500 crore for 10 crore units, about Rs 50 a unit.
    source: >
      Investor.gov (US SEC), Updated Investor Bulletin: Exchange-Traded Funds (NAV per share is the value of all assets minus all liabilities, divided by the number of shares): https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins-24

  - id: fp-q-etf
    prompt: >
      Which statement correctly contrasts an exchange-traded fund (ETF) with a traditional open-end mutual fund?
    choices:
      - { id: a, text: "ETF shares trade on an exchange all day at market prices, which can differ from NAV; mutual fund investors deal with the fund at the end-of-day NAV" }
      - { id: b, text: "ETF shares are always priced exactly at NAV; mutual fund units trade on an exchange all day", mistake: { tag: pricing_swapped, fix: "That swaps them: ETFs trade all day and can drift from NAV, mutual funds deal at NAV." } }
      - { id: c, text: "An ETF cannot hold shares; a mutual fund can", mistake: { tag: etf_no_shares, fix: "ETFs hold shares like any fund; the difference is how investors buy and sell them." } }
      - { id: d, text: "An ETF is always actively managed; a mutual fund is always passive", mistake: { tag: style_by_wrapper, fix: "Either type can be active or passive; the wrapper is about trading, not style." } }
    answer: a
    explanation: >
      Both are pooled funds that work out a NAV each business day. The difference is in how they are bought and sold: ETF shares change hands on an exchange at market prices, so the price can drift from NAV, while mutual fund investors buy and redeem with the fund at the day's NAV. Either type can be active or passive.
    source: >
      Investor.gov (US SEC), Characteristics of Mutual Funds and Exchange-Traded Funds: https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/characteristics-mutual-funds-exchange-traded-funds

  - id: fp-q-sharpe
    prompt: >
      Your cousin Arjun bets his active fund will beat your index fund. As groups, active and index investors earn the same market return before fees. Who wins after fees?
    choices:
      - { id: a, text: "The index side, ahead by roughly the gap in fees" }
      - id: b
        text: "Arjun's side, since managers are paid to pick winners"
        mistake: { tag: active_beats_market, fix: "As a group, active funds own the rest of the market, so before fees they earn its return." }
      - id: c
        text: "Neither, because fees are too small to matter"
        mistake: { tag: costs_ignored, fix: "Fees come straight out of what each group keeps." }
      - id: d
        text: "Whoever did more research, since study beats a cheap fee"
        mistake: { tag: research_pays, fix: "Research costs fees. The index side keeps more because its fee is far smaller." }
    answer: a
    explanation: >
      Before costs, the active investors in aggregate hold what the passive investors do not, so together they earn the market return. Costs then come out, and the active group's bigger fee leaves it with less. Some active investors beat the index; others fall short by more.
    source: >
      Damodaran, "Active Investing: Rest in Peace or Resurgent Force?" (Musings on Markets, December 2016): https://aswathdamodaran.blogspot.com/2016/12/active-investing-rest-in-peace-or.html

  - id: fp-q-fund-of-funds
    prompt: >
      Dad puts his savings in a fund of funds. Each hedge fund inside charges a yearly fee, and the outer fund adds its own. Leaving performance fees aside, what happens to those fixed fees?
    choices:
      - id: a
        text: "Only the outer fee counts, since the inner funds are hidden"
        mistake: { tag: inner_fees_hidden, fix: "The inner funds' fees come out of the same money, so Dad bears them too." }
      - id: b
        text: "The inner funds charge him; the picking is free"
        mistake: { tag: outer_fee_ignored, fix: "The outer fund charges its own fee on top of the inner ones." }
      - { id: c, text: "Both layers stack up, paid every year, win or lose" }
      - id: d
        text: "They are charged only in years the funds make money"
        mistake: { tag: fees_on_profit_only, fix: "Fixed fees come out every year. Only performance fees depend on profit." }
    answer: c
    explanation: >
      The two layers of fixed fees stack: a 2% fee inside and a 1% fee outside take about 3% of the assets every year, whether or not the funds make money.
    source: >
      Arithmetic from the stated figures (two layers of fees, as described in the Long Bets terms and Berkshire's 2017 letter): https://www.berkshirehathaway.com/letters/2017ltr.pdf

  - id: fp-q-compounding-cost
    prompt: >
      On your 20th birthday you and your friend Zoya each invest the same amount for 20 years. Your fund's yearly fee is a little lower. Where do you two stand at 40?
    choices:
      - id: a
        text: "Close together, since a small yearly gap stays small"
        mistake: { tag: gap_stays_small, fix: "A small yearly gap compounds over 20 years into a large difference." }
      - { id: b, text: "You are far ahead: the small gap compounds every year" }
      - id: c
        text: "You have exactly double Zoya's pot, whatever the rates"
        mistake: { tag: fixed_multiple, fix: "You end well ahead, but by no fixed multiple. It depends on the rates and the years." }
      - id: d
        text: "Level, since both funds charge some costs"
        mistake: { tag: costs_cancel, fix: "Both funds charge costs, but the cheaper one compounds faster and ends well ahead." }
    answer: b
    explanation: >
      Growth builds on earlier growth, so a small yearly gap widens every year. For example, Rs 1,00,000 growing at 7.9% a year for 20 years reaches about Rs 4,57,500, against about Rs 3,52,400 at 6.5%.
    source: >
      Compound growth: OpenStax, Principles of Finance (CC BY-NC-SA), 7.3 Methods for Solving Time Value of Money Problems: https://openstax.org/books/principles-finance-2e/pages/7-3-methods-for-solving-time-value-of-money-problems

  - id: fp-q-zero-return
    prompt: >
      To fund their 2007 bet, Buffett and Protégé each paid $318,250 for zero-coupon bonds that pay $500,000 after ten years and nothing before. What is each side quietly earning?
    choices:
      - id: a
        text: "Nothing, since the bonds never pay interest"
        mistake: { tag: no_coupon_no_return, fix: "The return comes from buying at a discount and getting the full face value back." }
      - { id: b, text: "A steady yearly return, compounded from the discount" }
      - id: c
        text: "The total gain split evenly over the ten years"
        mistake: { tag: simple_average, fix: "Splitting the gain evenly ignores compounding and overstates the yearly return." }
      - id: d
        text: "Its whole gain, counted as one year's return"
        mistake: { tag: total_as_yearly, fix: "The gain is spread over ten years. The yearly return is much smaller." }
    answer: b
    explanation: >
      A bond bought for $318,250 that pays $500,000 in ten years grows by about 1.57 times, a yearly return of about 4.6%. The total gain is 57%, but dividing it by ten gives 5.7%, which ignores compounding.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 7.3 Methods for Solving Time Value of Money Problems: https://openstax.org/books/principles-finance-2e/pages/7-3-methods-for-solving-time-value-of-money-problems

checks:
  - id: fp-quiz-funds
    kind: quiz
    questions:
      - fp-q-nav
      - fp-q-etf
      - fp-q-sharpe
      - fp-q-fund-of-funds
      - fp-q-compounding-cost
      - fp-q-zero-return
    perAttempt: 3
    passRule:
      correct: 2
  - id: fp-active-or-passive
    kind: conversation
    prompt: >
      A friend is choosing between an actively managed mutual fund that charges 1.5% a year and
      an index fund that charges 0.1%. Using the idea that investors as a group earn the market
      return before costs, explain how you would compare the two, and what a fair ten-year
      comparison of an active manager against an index would have to hold constant.
    passCriteria: >
      The Learner explains that before costs the average active investor earns the market
      return, so after costs active investors as a group earn less than passive investors by
      the difference in costs, and that fees are certain while outperformance is not. They say
      a fair comparison measures returns net of all fees and costs, over the same period, at
      comparable risk, and counts funds that closed or were merged (survivorship). They may
      add that some managers do beat the index but that picking them in advance is hard. They
      must not claim that active management can never win in any single period or for any
      single investor.
