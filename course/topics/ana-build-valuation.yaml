# Analyse: build a valuation as of a past date, taught through two Cases: Amazon.com in February 2000
# and, as a lesser-known company, Webvan at its share offering on 4 November 1999.
# The Learner chooses the inputs, values the firm, and only then sees the other inputs and what happened.
# No Case Data: every figure is stated in the stories; see docs/architecture.md.
# Case sources (checked):
#  - Amazon: Damodaran, valuation paper on young high-growth firms (HighGrow.pdf, pages 31-34: inputs and output; valuation done February 2000); Amazon.com Form 10-K405 for 2000 (net sales, operating loss and quarterly share prices).
#  - Webvan story (checked 2 Nov 2026): Webvan Group Form 424B1 prospectus dated 4 November 1999 (SEC accession 0000891618-99-004914, filed 5 Nov 1999): offer, shares, options, cash, loans, plan, capacity, the company's $300m / 12% / 4% claims, Forrester and sales figures. 10-year Treasury 5.95% on 4 Nov 1999: Federal Reserve H.15 release of 8 Nov 1999. 35% marginal rate: top federal corporate rate for 1999 (IRS Publication 542 table, Tax Policy Center).
#  - Webvan reveal: the prospectus (Goldman Sachs projections, Goldman affiliates' $100.0m of Series D-2); New York Times 6 Nov 1999 (first-day close $24.875, $7.9bn); Form 10-K405 for 1999 (0000891618-00-001877); Form 10-K for 2000 (0001012870-01-001485: results, HomeGrocer merger on 5 Sep 2000, share prices); Form 10-Q for Q1 2001 (0001012870-01-500862); closure on 9 Jul 2001: Los Angeles Times 10 Jul 2001, CNET, BBC; Form 8-K of 27 Jul 2001 (0001021408-01-504054): Chapter 11 petition filed 13 Jul 2001, not 9 Jul.
id: ana-build-valuation
title: "Analyse: build a valuation as of a past date"

cases:
  - id: amazon-2000-analyse
    title: Build your own value for Amazon.com
    asOf: 2000-02-01
    story: >
      It is February 2000. Amazon.com, the online retailer, trades on the Nasdaq at $84 a share.
      You will build your own discounted cash flow valuation from what was public then. Revenue
      for the twelve months to September 1999 was $1,117 million, with an operating loss of $410
      million, a margin of about -36.7%. In 1998 revenue was $610 million and the operating loss
      $125 million. The firm has $26 million of cash and $349 million of debt, about 341 million
      shares, and employees hold about 38 million options with an exercise price of $13.375. The
      Treasury bond yield is 6.5% and the marginal tax rate is 35%. Established specialty
      retailers earn an operating margin of about 10%. Amazon spends on warehouses and systems as
      it grows; assume it needs about $1 of new capital for every $3 of added revenue. Choose
      your own path for ten years: how fast revenue grows, when the margin turns positive and
      where it settles, what rate you discount at, and what stable growth rate you use after year
      10. Then work out free cash flow each year, a terminal value, and a value per share, taking
      cash, debt and the options into account. Write your inputs down before you compute
      anything. How does your value compare with $84, and which of your inputs moves it most?
      (You are valuing the firm as of February 2000 only. Do not try to say what happens next.)
    reveal: >
      Aswath Damodaran, a professor at New York University's Stern School of Business, valued
      Amazon in February 2000 with a paper dated March 2000. He grew revenue 150%, 100%, 75%, 50%
      and 30% in years 1 to 5, then 25.2%, 20.4%, 15.6%, 10.8% and 6% in years 6 to 10, which
      takes revenue to $39,006 million in year 10. His operating margin rose from -13.35% in year
      1 to -1.68%, 4.16%, 7.08%, 8.54%, 9.27%, 9.64%, 9.82%, 9.91% and 9.95% in year 10. He
      assumed $1 of capital for every $3 of added revenue, taxes of 0% in years 1 to 3, 16.13% in
      year 4 and 35% after, and a cost of capital of 12.84% falling to 9.61% by year 10 as beta
      fell towards 1. Stable growth was 6% after year 10. His result was $35.08 a share, against
      $84, after subtracting $2,892 million for the options. What happened: in 2000 Amazon's net
      sales were $2,762 million, close to his year-1 figure of about $2,793 million, but its
      operating loss was $864 million, a margin of about -31%, far below his -13.35% for year 1.
      The shares traded between $91.50 and $58.44 in the first quarter and between $40.88 and
      $14.88 in the fourth quarter (Amazon's 10-K405 for 2000). Compare your own inputs with his:
      his revenue path was one many could accept, but the whole value rested on the margin
      reaching about 10% and on the discount rate falling. Your value, his value and the price are
      three estimates of one firm, and the gaps between them come from stated inputs that can be
      examined. The price falling does not prove either valuation right: a value and a price are
      compared as questions.

  - id: webvan-1999-analyse
    title: Build your own value for Webvan at its public offering
    asOf: 1999-11-04
    story: >
      It is the evening of Thursday 4 November 1999. Webvan Group, which delivers groceries ordered on
      the internet, has priced its first sale of shares to the public: 25 million new shares at $15.00,
      with an option for the underwriters to buy up to 3.75 million more. You will build your own
      discounted cash flow valuation from what its prospectus, dated today, says. Webvan launched on 2
      June 1999 with one automated distribution centre, in Oakland, designed for 8,000 orders a day. It
      runs five days a week at under 20% of designed capacity. Net sales were about $3.8 million in the
      three months to September, with an average order of about $71 since the launch. The net loss was
      $35.1 million in the first half of 1999, and Webvan expects a net loss of $64 million to $65
      million for the third quarter alone, including about $41.1 million of compensation expense (a
      bonus and stock-based compensation). The company says a centre at designed capacity, seven days a
      week with an average order of $103, would sell about $300 million a year and earn an operating
      margin of 12%, against 4% for a traditional supermarket. It adds that the success of its system at
      high volumes "has yet to be proven" and that no centre is expected to reach designed capacity for
      several years. It plans a second centre in Atlanta in the second quarter of 2000, then two in 2000
      and seven in 2001 under a July 1999 agreement with the engineering firm Bechtel to build up to 26
      more over three years, at an estimated $25 million to $35 million each, with no firm commitment to
      build them all. Forrester Research expects online grocery sales in the US to grow from $235
      million in 1998 to $10.8 billion in 2003, about 2% of the grocery market. After the offering there
      will be 321.8 million shares, and options on 67.5 million shares (average exercise price $3.88)
      are outstanding. Cash was $21.8 million at 30 June 1999; counting the $275.0 million raised from
      investors in July and August and about $350.5 million from this offering after fees, it is $647.2
      million, plus $22.2 million of marketable securities. Loans and leases were about $18 million. The
      10-year Treasury yield is 5.95% and the marginal tax rate is 35%. Choose your own path for ten
      years: how many centres open and when, how full each one gets and how fast, the average order,
      where the operating margin settles, the discount rate, and the stable growth rate after year 10.
      Work out free cash flow each year, a terminal value and a value per share, allowing for the cash,
      debt and options. Write your inputs down before you compute anything. How does your value compare
      with $15, and which input moves it most? What would you have to believe for $15 to be a fair
      price? (You are valuing the firm as of November 1999 only. Do not try to say what happens next.)
    reveal: >
      The prospectus carried one outside view: Goldman Sachs, the lead underwriter, had told prospective
      investors on a conference call that it projected revenue of $11.9 million and a net loss of $73.8
      million for 1999, $120.0 million and $154.3 million for 2000, and $518.2 million and $302 million
      for 2001, not counting stock compensation. Affiliates of Goldman had also bought $100.0 million of
      the July preferred stock. On 5 November the shares closed at $24.875, 65% above the offer price,
      valuing Webvan at $7.9 billion. The underwriters took their option in full, so Webvan sold 28.75
      million shares, raising $431.3 million, or $402.6 million after costs, against the $350.5 million
      expected. In 1999 net sales were $13.3 million and the net loss $144.6 million; at the end of the
      year Oakland was at less than 25% of designed capacity and the average order for the year was
      $77.65. In 2000 Webvan added centres in Atlanta and Chicago and on 5 September merged with
      HomeGrocer. Net sales were $178.5 million ($55.6 million of it from HomeGrocer) and the net loss
      $453.3 million. The average order was $104 for the year, so the order size the plan needed was
      reached. But the annual report said no facility operated at or near designed capacity and none had
      become profitable on a cash-flow basis, both of which the prospectus had said it could not assure.
      Capital spending was $259.8 million and operations used $263.1 million of cash, and its auditors
      expressed substantial doubt about its ability to continue. The shares traded between $2.28 and
      $0.28 in the fourth quarter of 2000. On 9 July 2001, with the shares at 6 cents, Webvan ceased
      operations in all seven of its markets, let go about 2,000 employees and said it would file for
      Chapter 11 protection, which it did on 13 July. Compare your inputs with the company's and the
      underwriter's, input by input: the order size was reached, but the fill rate and the margin the
      plan needed were not. Your value, the company's claims, the underwriter's projections and the
      price were four estimates of one firm, and the later failure does not by itself show which was
      right on 4 November 1999: a value and a price are compared as questions.

concept: >
  Building a valuation as of a past date means fixing the date, using only what was known then,
  and writing every input down before computing. For a young company, set out four things: the
  revenue path (growth fading year by year to a stable rate; or, when growth comes from opening
  units such as distribution centres, built from the units: how many open each year, how full
  each one gets and how fast, and what a full one sells), the operating margin path (from
  today's margin towards what mature firms in the business earn; a company's own claim about its
  mature margin is an input to test against that, not a fact), the reinvestment needed (new
  revenue divided by sales-to-capital gives new capital spending; for units, what each costs to
  build), and the discount rate (the cost of capital, which can fall as the firm matures and its
  beta moves towards 1). Free cash flow to the firm each year = operating income x (1 - tax
  rate) - reinvestment. Tax is zero while there are losses to carry forward. Terminal value =
  free cash flow in year 11 / (cost of capital - stable growth), and stable growth should not
  exceed the risk-free rate, or the firm would outgrow the economy for ever. Operating value +
  cash - debt = value of equity; if the firm is selling new shares as of the valuation date,
  count the cash it raises and the new shares. Subtract the value of employee options before
  dividing by the shares: an option is worth at least the amount by which the value per share
  exceeds its exercise price, so many low-priced options take a large part of the value. The
  `dcf` calculator takes one flat discount rate, so use it for a quick version of the valuation
  and say that a rate that falls over time will raise the value a little. Then compare the result
  with the price as a question and with a second analyst's inputs, input by input, rather than
  only the final numbers. Run sensitivity tests on the margin, the growth rate (or, for units,
  how full they get) and the cost of capital, and say which one moves the value most. The valuation is practised on a past date only: do not forecast, and do
  not turn a value into a buy, sell or hold call.

principle: >
  Write the inputs down before computing, test the ones that drive the value (including any claim
  the company makes about its own margin or capacity), and compare your value with the price and
  with other analysts' inputs as questions, never as verdicts.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Build a valuation as of a past date using only what was known then."
  - "Write every input down before computing: revenue, margin, reinvestment and discount rate."
  - "Find which input moves the value most with sensitivity tests."

# Claude-written quiz questions; each answer was checked against the cited source (see docs/architecture.md).
questions:
  - id: abv-q-revenue
    prompt: >
      A young firm has revenue of $1,000 million. An analyst assumes it grows 100% in year 1, 50% in year 2 and 20% in year 3, and writes "$3,600 million in year 3". Which statement about that line is right?
    choices:
      - { id: a, text: "Right: each year's growth builds on the year before, so the growth compounds" }
      - { id: b, text: "Wrong: the three growth rates should be added into one, 170%, and applied to the first year", mistake: { tag: added_growth_rates, fix: "Each year grows from a bigger base, so growth compounds. Adding the rates undercounts." } }
      - { id: c, text: "Wrong: only the last year's 20% matters for year 3", mistake: { tag: used_last_growth_only, fix: "Year 3 starts where year 2 ended, so all three years of growth count." } }
      - { id: d, text: "Wrong: revenue cannot come from growth rates; the margin has to be set first", mistake: { tag: margin_before_revenue, fix: "Revenue comes first. The growth path builds it, and the margin is applied to it." } }
    answer: a
    explanation: >
      Growth compounds: 1,000 x 2.00 x 1.50 x 1.20 = 3,600. Adding the growth rates (170%) would give 2,700, which is wrong.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 7.3 Methods for Solving Time Value of Money Problems (compound growth): https://openstax.org/books/principles-finance/pages/7-3-methods-for-solving-time-value-of-money-problems

  - id: abv-q-reinvest
    prompt: >
      A firm assumes it needs $1 of new capital for every $3 of added revenue, which analysts call a sales-to-capital ratio of 3. Its revenue rises from $1,000 million to $1,600 million. Which sentence describes its reinvestment that year?
    choices:
      - { id: a, text: "$200 million: one dollar of new capital for every three dollars of the $600 million of added revenue" }
      - { id: b, text: "$600 million: all of the added revenue is put back into the firm", mistake: { tag: reinvested_all_the_growth, fix: "Added revenue is not spent in full. Only a third of it is needed as new capital." } }
      - { id: c, text: "$1,800 million: three dollars of new capital for every dollar of added revenue", mistake: { tag: flipped_sales_to_capital, fix: "The ratio is sales per dollar of capital: $3 of sales needs $1 of capital, not the reverse." } }
      - { id: d, text: "$533 million: a third of all the revenue the firm has after the rise", mistake: { tag: used_total_revenue, fix: "Only the added revenue needs new capital, not the revenue the firm already had." } }
    answer: a
    explanation: >
      Reinvestment = added revenue / sales-to-capital = (1,600 - 1,000) / 3 = 200. It is subtracted from after-tax operating income to give free cash flow.
    source: >
      Damodaran, valuation paper on young high-growth firms (HighGrow.pdf), where reinvestment is set by a sales-to-capital ratio of 3.0: https://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf

  - id: abv-q-terminal-share
    prompt: >
      In a valuation of a hypothetical young company, the present value of the ten forecast years of free cash flow is $200 million and the present value of the terminal value is $800 million. What share of the operating value comes from beyond year 10?
    choices:
      - { id: a, text: "80%" }
      - { id: b, text: "20%" }
      - { id: c, text: "40%" }
      - { id: d, text: "It cannot be worked out" }
    answer: a
    explanation: >
      The operating value is 200 + 800 = 1,000, and 800 / 1,000 = 80% comes from beyond year 10. When this share is high, the stable-growth and margin assumptions deserve the most testing.
    source: >
      Damodaran, valuation paper on young high-growth firms (HighGrow.pdf): https://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf

  - id: abv-q-options
    prompt: >
      A hypothetical valuation gives operating assets of $5,000 million. The firm holds cash of $100 million, owes debt of $300 million, has employee options worth $400 million and has 100 million shares. Which sentence describes the value per share that belongs to its shareholders?
    choices:
      - { id: a, text: "$44: operating assets, with the cash added and the debt and the options taken off, shared among the shares" }
      - { id: b, text: "$48: the same, but leaving the employee options out", mistake: { tag: left_out_options, fix: "Options are a claim on shareholders' value too, so they come off before sharing it out." } }
      - { id: c, text: "$50: the operating assets alone, shared among the shares", mistake: { tag: skipped_the_bridge, fix: "Cash adds to the equity and debt takes from it, so operating assets alone is not equity." } }
      - { id: d, text: "$52: the options added to the value instead of taken off", mistake: { tag: added_options, fix: "Options are a claim on shareholders, so they are taken off the value, not added." } }
    answer: a
    explanation: >
      Equity = 5,000 + 100 - 300 = 4,800; less the options, 4,400; divided by 100 million shares = $44. Leaving out the options would give $48.
    source: >
      Damodaran, valuation paper on young high-growth firms (HighGrow.pdf), pages 31-34 (the bridge from operating value to value per share, with options subtracted): https://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf

  - id: abv-q-stable-growth
    prompt: >
      The Treasury bond yield is 6.5%. Which stable growth rate after year 10 is hardest to defend?
    choices:
      - { id: a, text: "9%, because the firm would outgrow the whole economy for ever" }
      - { id: b, text: "6%" }
      - { id: c, text: "4%" }
      - { id: d, text: "2%" }
    answer: a
    explanation: >
      The risk-free rate is a rough ceiling for the long-run nominal growth of the economy, so a stable growth rate above it implies the firm eventually becomes larger than the economy. 
    source: >
      Damodaran, valuation paper on young high-growth firms (HighGrow.pdf), where stable growth is capped by the Treasury bond yield: https://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf

checks:
  - id: abv-quiz-build
    kind: quiz
    questions:
      - abv-q-revenue
      - abv-q-reinvest
      - abv-q-terminal-share
      - abv-q-options
      - abv-q-stable-growth
    perAttempt: 3
    passRule:
      correct: 2
  - id: abv-build-explain
    kind: conversation
    prompt: >
      Using the Amazon figures from February 2000, state the inputs of your own valuation (revenue
      growth path, the margin you reach in year 10, the discount rate, stable growth), show how
      you get from them to a value per share (use the dcf calculator for a quick version), and
      say which input moves your value most. Then compare your value with the $84 price.
    passCriteria: >
      The Learner writes their inputs down before giving a result: a revenue path that fades,
      an operating margin that improves towards a level justified by mature firms, a discount
      rate and a stable growth rate no higher than the risk-free rate. They get from free cash
      flow to value per share through a terminal value, cash, debt and the options. They name
      the input that drives the value (usually the long-run margin, the discount rate or
      terminal growth) and test it with a different value. They treat the gap with the price as a
      question, not proof that the price is wrong, and make no forecast of the share price and no
      buy, sell or hold call.
  - id: abv-build-webvan
    kind: conversation
    prompt: >
      Using the Webvan figures from 4 November 1999, state the inputs of your own valuation (the
      number of distribution centres and when they open, how full each one gets and how fast, the average
      order, the operating margin you reach, the discount rate and stable growth), show how you get
      from them to a value per share (use the dcf calculator for a quick version, and count the
      cash from the offering, the debt and the options), and say which input moves your value most.
      Then compare your value with the $15 offer price and say what you would have to believe for
      $15 to be a fair price.
    passCriteria: >
      The Learner writes their inputs down before giving a result: the number and timing of
      centres (no faster than the plan in the story unless they say why), how full each centre gets
      and how fast, starting from under 20% and not from full capacity, the average order and what
      a full centre sells, an operating margin that they set against both the company's 12% and a
      supermarket's 4%, the cost of building each centre ($25 million to $35 million) as
      reinvestment, a discount rate above the Treasury yield and a stable growth rate no higher
      than the Treasury yield. They get from free cash flow to value per share through a terminal
      value, the cash (counting the offering), the loans and the options (which cover about a fifth
      as many shares as are outstanding, so leaving them out is a clear error). They name the input
      that drives the value (usually how full the centres get, the long-run margin or the discount
      rate) and test it with a different value. They treat the gap with the $15 offer price as a
      question, not proof that the price is wrong, and make no forecast of the share price and no
      buy, sell or hold call.
