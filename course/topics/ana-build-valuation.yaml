concept: >
  Building a valuation as of a past date means fixing the date, using only what was known then,
  and writing every input down before computing. For a young company, set out four things: the
  revenue path (growth fading year by year to a stable rate; or, when growth comes from opening
  units such as distribution centres, built from the units: how many open each year, how full
  each one gets and how fast, and what a full one sells), the operating margin path (from
  today's margin towards what mature firms in the business earn; a company's own claim about its
  mature margin is an input to test against that, not a fact), the reinvestment needed (new
  revenue divided by sales-to-capital gives new capital spending; for units, what each costs to
  build), and the discount rate (the cost of capital, which can fall as the firm matures and its
  beta moves towards 1). Free cash flow to the firm each year is worked out in steps: take the
  operating income, take off the tax on it, then take off the reinvestment. Tax is zero while
  there are losses to carry forward. The terminal value is worked out in steps too: take the
  cost of capital, take off the stable growth rate, then divide the free cash flow in year 11 by
  what is left. Stable growth should not exceed the risk-free rate, or the firm would outgrow the
  economy for ever. To get the value of equity, start from the operating value, add the cash and
  take off the debt; if the firm is selling new shares as of the valuation date,
  count the cash it raises and the new shares. Subtract the value of employee options before
  dividing by the shares: an option is worth at least the amount by which the value per share
  exceeds its exercise price, so many low-priced options take a large part of the value. The
  `dcf` calculator takes one flat discount rate, so use it for a quick version of the valuation
  and say that a rate that falls over time will raise the value a little. Then compare the result
  with the price as a question and with a second analyst's inputs, input by input, rather than
  only the final numbers. Run sensitivity tests on the margin, the growth rate (or, for units,
  how full they get) and the cost of capital, and say which one moves the value most. The valuation is practised on a past date only: do not forecast, and do
  not turn a value into a buy, sell or hold call.

principle: >
  Write the inputs down before computing, test the ones that drive the value (including any claim
  the company makes about its own margin or capacity), and compare your value with the price and
  with other analysts' inputs as questions, never as verdicts.

goDeeper: >
  The same steps written as formulas, for a Learner who wants them. Free cash flow to the firm
  each year = operating income x (1 - tax rate) - reinvestment. Terminal value = free cash flow
  in year 11 / (cost of capital - stable growth). Value of equity = operating value + cash - debt.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Build a valuation as of a past date using only what was known then."
  - "Write every input down before computing: revenue, margin, reinvestment and discount rate."
  - "Find which input moves the value most with sensitivity tests."

# Claude-written quiz questions; each answer was checked against the cited source (see docs/architecture.md).
questions:
  - id: abv-q-revenue
    prompt: >
      An analyst gives a young firm three years of fast growth, a little slower each year. How does the second and third year's growth work?
    choices:
      - { id: a, text: "Each year grows from where the year before ended, so the growth compounds" }
      - { id: b, text: "The three growth rates are added into one and applied to the starting revenue", mistake: { tag: added_growth_rates, fix: "Each year grows from a bigger base, so growth compounds. Adding the rates undercounts." } }
      - { id: c, text: "Only the last year's growth matters for year 3", mistake: { tag: used_last_growth_only, fix: "Year 3 starts where year 2 ended, so all three years of growth count." } }
      - { id: d, text: "Growth cannot be set until the margin is chosen", mistake: { tag: margin_before_revenue, fix: "Revenue comes first. The growth path builds it, and the margin is applied to it." } }
    answer: a
    explanation: >
      Growth compounds: each year starts from the bigger revenue the year before left behind. Adding the rates up and applying them to the start would undercount the path.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 7.3 Methods for Solving Time Value of Money Problems (compound growth): https://openstax.org/books/principles-finance/pages/7-3-methods-for-solving-time-value-of-money-problems

  - id: abv-q-reinvest
    prompt: >
      A firm assumes a sales-to-capital ratio of 3. Its revenue rises. Which sentence describes its reinvestment that year?
    choices:
      - { id: a, text: "A third of the added revenue is needed as new capital" }
      - { id: b, text: "All of the added revenue is put back into the firm", mistake: { tag: all_of_the_added_revenue_is, fix: "Added revenue is not spent in full. Only a third of it is needed as new capital." } }
      - { id: c, text: "Three times the added revenue is needed as new capital", mistake: { tag: three_times_the_added_revenu, fix: "The ratio is sales per dollar of capital: $3 of sales needs $1 of capital, not the reverse." } }
      - { id: d, text: "A third of all the revenue the firm has after the rise", mistake: { tag: a_third_of_all_the_revenue_t, fix: "Only the added revenue needs new capital, not the revenue the firm already had." } }
    answer: a
    explanation: >
      Reinvestment is the added revenue divided by the sales-to-capital ratio. With a ratio of 3, that is a third of the added revenue. It is subtracted from after-tax operating income to give free cash flow.
    source: >
      Damodaran, valuation paper on young high-growth firms (HighGrow.pdf), where reinvestment is set by a sales-to-capital ratio of 3.0: https://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf
  - id: abv-q-terminal-share
    prompt: >
      In a valuation of a young company, most of the operating value comes from the terminal value, beyond year 10. What does a high terminal share tell the judge?
    choices:
      - { id: a, text: "The stable-growth and margin assumptions deserve the most testing" }
      - { id: b, text: "The ten forecast years are now certain", mistake: { tag: the_ten_forecast_years_are_n, fix: "A big terminal share means the opposite: the later, less certain years carry the value." } }
      - { id: c, text: "The company has already matured", mistake: { tag: the_company_has_already_matu, fix: "A young company with most of its value late is far from mature." } }
      - { id: d, text: "The valuation must be wrong", mistake: { tag: the_valuation_must_be_wrong, fix: "A high share is a signal to test, not proof of an error." } }
    answer: a
    explanation: >
      When most of the value sits beyond year 10, the stable-growth and margin assumptions drive the result, so they deserve the most testing. It is a prompt to test, not proof of an error.
    source: >
      Damodaran, valuation paper on young high-growth firms (HighGrow.pdf): https://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf
  - id: abv-q-options
    prompt: >
      A valuation gives a young firm's operating assets. The firm holds cash, owes debt and has employee options outstanding. Which sentence describes the path to the value per share that belongs to its shareholders?
    choices:
      - { id: a, text: "Start from the operating assets, add the cash, take off the debt and the options, then share the rest among the shares" }
      - { id: b, text: "The same, but leave the employee options out", mistake: { tag: the_same_but_leave_the_emplo, fix: "Options are a claim on shareholders' value too, so they come off before sharing it out." } }
      - { id: c, text: "Take the operating assets alone and share them among the shares", mistake: { tag: take_the_operating_assets_al, fix: "Cash adds to the equity and debt takes from it, so operating assets alone is not equity." } }
      - { id: d, text: "The same, but add the options instead of taking them off", mistake: { tag: the_same_but_add_the_options, fix: "Options are a claim on shareholders, so they are taken off the value, not added." } }
    answer: a
    explanation: >
      Equity is the operating assets plus cash less debt. The value of the employee options then comes off before dividing by the shares, because options are a claim on shareholders' value.
    source: >
      Damodaran, valuation paper on young high-growth firms (HighGrow.pdf), pages 31-34 (the bridge from operating value to value per share, with options subtracted): https://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf
  - id: abv-q-stable-growth
    prompt: >
      An analyst lets a young firm grow for ever after year 10 at a "stable" rate above the Treasury bond yield. Why do valuers push back?
    choices:
      - { id: a, text: "Growing faster than the economy for ever, the firm would one day be bigger than the economy" }
      - { id: b, text: "Growth after year 10 never changes the value", mistake: { tag: late_growth_irrelevant, fix: "Most of a young firm's value sits after year 10, so that growth matters a lot." } }
      - { id: c, text: "No firm is allowed to grow after year 10", mistake: { tag: no_growth_after_year_ten, fix: "Firms can keep growing. The limit is on growing faster than the economy for ever." } }
      - { id: d, text: "The Treasury yield caps the firm's profit margin, not its growth", mistake: { tag: yield_caps_margin, fix: "The yield is a rough ceiling for the economy's growth, not for any margin." } }
    answer: a
    explanation: >
      The risk-free rate is a rough ceiling for the long-run nominal growth of the economy, so a stable growth rate above it implies the firm eventually becomes larger than the economy.
    source: >
      Damodaran, valuation paper on young high-growth firms (HighGrow.pdf), where stable growth is capped by the Treasury bond yield: https://pages.stern.nyu.edu/~adamodar/pdfiles/papers/HighGrow.pdf

