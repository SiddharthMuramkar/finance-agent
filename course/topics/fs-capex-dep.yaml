# Capex, depreciation, amortisation and EBITDA: a foundation Topic taught through Webvan.
# Case Data (the sourced figures and datasets) lives in the database; see docs/architecture.md.
# Case sources (checked): Webvan final prospectus (424B1) dated 4 Nov 1999 (SEC accession 0000891618-99-004914) for the first-half 1999 loss of $35.1 million; Webvan Form 8-K filed 27 Jul 2001 (SEC accession 0001021408-01-504054) for the bankruptcy filing date.
id: fs-capex-dep
title: Capex, depreciation, amortisation and EBITDA
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: webvan-build-out-1999
    title: Webvan's warehouse and fleet build-out
    asOf: 1999-11-05
    story: >
      Webvan, an online grocer based in Foster City, California, sold its shares to the public for
      the first time in early November 1999. The offering was priced at $15 a share; the base deal
      of 25 million shares raised $375 million, and trading was due to begin on 5 November. The
      company then delivered only in the San Francisco Bay Area. In the six months to 30 June 1999
      it had revenue of $395,000 and a net loss of $35.1 million. It planned to expand into
      many new markets, and in July 1999 it had agreed with the engineering firm Bechtel to build
      up to 26 more automated distribution centres over three years, at about $1 billion in all,
      though with no specific capital commitment. Its Oakland centre alone covered 336,000 square
      feet. The
      average order was about $80. Analysts noted that grocers earn thin margins. Goldman Sachs, the
      lead underwriter, projected revenue of $120 million for 2000 and $518 million for 2001, with
      losses of $154 million and $302 million.
    reveal: >
      Webvan's shares rose on the first day, closing at $24.875 and valuing the company at about
      $7.9 billion. The plan did not hold. It bought a rival, HomeGrocer, and net losses grew from
      $144.6 million in 1999 to $453.3 million in 2000, when auditors voiced "substantial doubt"
      about its ability to continue. In early 2001 its operating costs alone (marketing,
      development, administration) came to $143 for every $100 of sales, on top of $72 of food
      cost, on the Chicago Tribune's reading of its quarterly report. On 9 July 2001, with the
      shares at 6 cents, it shut down and said it would file for bankruptcy protection; it filed
      on 13 July. The heavy spending on warehouses and trucks had been committed ahead of the
      customers who would pay for it.

concept: >
  Capital expenditure (capex) is spending on things that last, such as warehouses, trucks and
  equipment. It is not an expense when paid. It becomes an asset on the balance sheet and its
  cost is spread over its useful life as depreciation (for physical assets) or amortisation (for
  intangibles such as software or licences). Straight-line depreciation divides cost, less any
  residual value, by the life in years. Cash leaves in the year of purchase, but the profit and
  loss account shows only a slice each year. EBITDA (earnings before interest, taxes,
  depreciation and amortisation) adds depreciation and amortisation back, so it leaves out the
  cost of the very assets the business must keep buying. Compare EBITDA with capex, and with
  operating cash flow, before treating it as cash.

principle: >
  EBITDA can look healthy while the business is spending far more on assets than it earns. Judge
  an asset-heavy business by what it earns after the cost of the assets it needs, and whether the
  assets will be filled with customers before the cash runs out.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "See how spending on lasting assets is spread over their life."
  - "Know what EBITDA leaves out and why that matters."
  - "Judge an asset-heavy business after the cost of the assets it needs."


exampleCurrency: INR
runningExample:
  text: A baker buys an oven for ₹6 lakh that should bake for six years.
  numbers: [6, 6]
  scene:
    cast:
      - { id: dev, emoji: cook, name: Dev, role: runs a bakery }
      - { id: acct, emoji: woman-office-worker, name: The accountant }
    beats:
