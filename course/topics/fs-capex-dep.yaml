      correct: 3
  - id: cx-ebitda-view
    kind: conversation
    prompt: >
      It is 5 November 1999. Webvan has agreed to build distribution centres costing about
      $1 billion and has revenue of $395,000 for the half year. A banker says "look at EBITDA, not net loss". Say in your own words what depreciation and EBITDA would show for this plan over the next few years, and what you would
      look at instead to judge whether the build-out can pay for itself.
    passCriteria: >
      The Learner explains that the $1 billion is capex: cash goes out up front, appears on the
      balance sheet as an asset, and is expensed gradually through depreciation. EBITDA adds
      depreciation back, so it hides the cost of the build-out and flatters an asset-heavy plan.
      They suggest looking at capex against operating cash flow, how fast each centre can fill
      with orders (utilisation, orders per day, revenue per centre) and thin grocery margins, or at
      profit after depreciation, to see whether the assets can earn their cost.

