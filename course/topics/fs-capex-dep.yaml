terms:
  - term: capex
    means: Money spent on things that last for years, like warehouses and trucks.
    pro: Analysts read capex next to cash flow to see what a business must keep spending.
    example: A bakery buying a ₹8 lakh oven that it will use for years.
    emoji: factory
    inStory: Webvan planned about a billion dollars of automated distribution centres.
  - term: depreciation
    means: Spreading the cost of a lasting thing across the years it is used.
    pro: Depreciation is the yearly slice of a purchase charged to profit.
    example: An autorickshaw bought for ₹3 lakh is charged a slice each year of its life.
    emoji: delivery-truck
    inStory: Webvan's warehouses and trucks would each be charged to profit a slice a year.
  - term: amortisation
    means: The same spreading idea, for things you cannot touch, like software or licences.
    pro: Analysts lump it with depreciation as D and A, and add both back.
    example: A software licence paid for up front is charged to profit over its years of use.
    emoji: laptop
    inStory: Webvan's buildings would be depreciated; any software or licences would be amortised instead.
  - term: EBITDA
    means: Profit with interest, tax, depreciation and amortisation all added back.
    pro: Bankers say "look at EBITDA", but it hides what the assets cost.
    example: A taxi owner counting profit while ignoring the yearly cost of the taxi itself.
    emoji: warning
    inStory: A banker might point at EBITDA while Webvan's buildings cost a billion dollars.
  - term: fixed assets
    means: The lasting things a company owns and uses, like buildings, trucks and machines.
    pro: Fixed assets sit on the balance sheet and are depreciated.
    example: A tailor's sewing machines and shop counter.
    emoji: office-building
    inStory: Webvan's Oakland centre alone covered 336,000 square feet.

questions:
  - id: cx-q-straight-line
    prompt: >
      A company buys a warehouse that will serve it for many years. In its accounts, how is the cost of the warehouse treated?
    choices:
      - { id: a, text: "Spread across the years it is used, as depreciation" }
      - { id: b, text: "Charged to profit in full in the year it is bought", mistake: { tag: expensed_it_all_at_once, fix: "A lasting asset is recorded on the balance sheet and its cost is spread over its life." } }
      - { id: c, text: "Left out of the accounts until the warehouse is sold", mistake: { tag: left_it_off_the_books, fix: "The warehouse is recorded as an asset the day it is bought." } }
      - { id: d, text: "Counted only when customers pay for the goods in it", mistake: { tag: tied_it_to_sales, fix: "Cost is spread over the asset's useful life, not tied to each sale." } }
    answer: a
    explanation: >
      Straight-line depreciation divides the cost, less any residual value, over the life in years. Cash leaves in the year of purchase, but the profit and loss account bears only a slice each year.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: cx-q-ebitda-blind-spot
    prompt: >
      EBITDA adds back depreciation and amortisation. What does that mean for a company that spends heavily on equipment?
    choices:
      - { id: a, text: "EBITDA leaves out the cost of the equipment, so it can look healthy while cash is going out on capex" }
      - { id: b, text: "EBITDA includes the full purchase price in the year the equipment is bought", mistake: { tag: thought_ebitda_counts_the_purchase, fix: "It does the opposite: depreciation is added back, so the cost of the equipment drops out." } }
      - { id: c, text: "EBITDA is lower than operating profit", mistake: { tag: swapped_the_direction, fix: "Adding costs back makes EBITDA higher than operating profit, not lower." } }
      - { id: d, text: "Heavy spending on equipment has no effect on cash", mistake: { tag: ignored_the_cash, fix: "The cash leaves when the equipment is bought, whatever the yearly charge says." } }
    answer: a
    explanation: >
      EBITDA is profit before depreciation, interest and tax. Because depreciation is added back, the cost of the assets does not appear in it, so it must be read next to capex.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement: EBITDA: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: cx-q-bechtel
    prompt: >
      In 1999 Webvan agreed with Bechtel to build up to 26 distribution centres for about $1 billion. What do analysts call this kind of spending on buildings that last for years?
    choices:
      - { id: a, text: "Capital expenditure, or capex" }
      - { id: b, text: "An operating expense", mistake: { tag: called_it_operating_expense, fix: "Operating expenses are everyday running costs. Spending on lasting buildings is capex." } }
      - { id: c, text: "Amortisation", mistake: { tag: called_it_amortisation, fix: "Amortisation spreads the cost of things you cannot touch, and it is a yearly charge, not the spending itself." } }
      - { id: d, text: "Working capital", mistake: { tag: called_it_working_capital, fix: "Working capital is the day-to-day float of stock and bills. Buildings are fixed assets." } }
    answer: a
    explanation: >
      Capex is spending on things that last. It becomes an asset, and its cost is spread through depreciation. The agreement carried no specific capital commitment, but it shows the scale of the plan.
    source: >
      Contract size from Webvan's 10-K405 for 1999, filed 30 March 2000 (EDGAR, accession 0000891618-00-001877).

  - id: cx-q-lingo-amortisation
    prompt: >
      A firm pays up front for a software licence that lasts five years. What do accountants call spreading its cost over those years?
    choices:
      - { id: a, text: "Amortisation" }
      - { id: b, text: "Depreciation", mistake: { tag: used_depreciation_for_intangibles, fix: "Depreciation is the word for physical things such as warehouses and trucks. A licence is spread by amortisation." } }
      - { id: c, text: "Capex", mistake: { tag: called_the_spread_capex, fix: "Capex is the spending itself. The spreading over the years has its own name." } }
      - { id: d, text: "EBITDA", mistake: { tag: called_the_spread_ebitda, fix: "EBITDA is a profit measure that adds the spreading back." } }
    answer: a
    explanation: >
      Amortisation spreads the cost of an intangible, such as software or a licence, over its useful life. Depreciation does the same for physical assets.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

  - id: cx-q-lingo-fixed-assets
    prompt: >
      Which of these would an analyst list among Webvan's fixed assets?
    choices:
      - { id: a, text: "Its automated distribution centre in Oakland" }
      - { id: b, text: "The groceries on the shelf, sold within days", mistake: { tag: counted_stock_as_fixed, fix: "Stock is sold within days. Fixed assets are things used for years." } }
      - { id: c, text: "The cash raised from the share sale", mistake: { tag: counted_cash_as_fixed, fix: "Cash is money in hand. Fixed assets are the lasting things it buys." } }
      - { id: d, text: "Its customers' goodwill", mistake: { tag: counted_goodwill_as_fixed, fix: "Goodwill cannot be touched or counted as a building or truck." } }
    answer: a
    explanation: >
      Fixed assets are the lasting things a company owns and uses, like buildings, trucks and machines. The Oakland centre alone covered 336,000 square feet.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement; the Oakland centre is from the Webvan prospectus summarised in this Topic's Case.

  - id: cx-q-lingo-ebitda
    prompt: >
      A banker tells Webvan's investors to "look at EBITDA". Which expansion of the letters is true?
    choices:
      - { id: a, text: "Earnings before interest, taxes, depreciation and amortisation" }
      - { id: b, text: "Earnings before income, tax, debt and assets", mistake: { tag: scrambled_the_letters, fix: "The letters are interest, taxes, depreciation and amortisation." } }
      - { id: c, text: "Expenses before interest and tax on every asset", mistake: { tag: read_e_as_expenses, fix: "The E is for earnings, a profit figure, not expenses." } }
      - { id: d, text: "Estimated balance of income, taxes and dividends", mistake: { tag: invented_a_meaning, fix: "EBITDA is not an estimate. It is earnings with four things added back." } }
    answer: a
    explanation: >
      EBITDA stands for earnings before interest, taxes, depreciation and amortisation. Adding back depreciation and amortisation hides the cost of the assets the business must keep buying.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 5.1 The Income Statement: EBITDA: https://openstax.org/books/principles-finance-2e/pages/5-1-the-income-statement

