# Spine Topic 4 (spec 2026-11-12, C2, C4, Appendix D): how big can it get, taught through Uber as of 2 December 2014,
# Damodaran's June value against the venture price. It explores Value levers in market mode: lever 1 is Uber's share of
# a market, which feeds revenue in year 10 (Appendix D: "Market size and share feed lever 1").
# The valuation block is Damodaran's June 2014 one (9 Jun 2014 post and ubervaluation.xls), written once on val-young's
# Case uber-vc-narrative-2014 and borrowed here with valuationFrom; verify-uber-2014.json's correction says the
# "Damodaran's story" chip must use these June inputs ($5,895m), since his December post gives no value of his own.
# The block values the whole company in $ millions (per: company), against the June round's $17bn pre-money price.
# Market mode values revenue as a share of a market, so each market is written as the pool of revenue Uber could share
# in: his 20% slice of the fares (Damodaran: $100bn of taxi and car-service fares growing 6% a year; his breakeven, a
# market about three times that). His 10% share of the first opens lever 1, which gives his $3,582m of year-10 revenue.
# Facts: docs/research/verify-uber-2014.json (storyFacts, widgetFacts) and the outline's sources. Case ids are
# unique across files, so the Case here is "spine-04-uber-2014". Every figure a computed question shows is the
# engine's, and no sum is asked (ADR 0002).
id: spine-04-growth
title: "Growth: how big can it get?"
goal: Turn a story about the market a young company can win into its future revenue, and weigh its effect on value.
why: "A company's value starts with how big it can get, and for a young company that rests on a story about the market it can win."
# The daily-life line (spec #68): shown at the Principle step and on the Topic complete card, and kept in the Topic Note.
dailyLife: "A food-delivery app says its market is huge: how big a slice of it can it really take?"
minutes: 12
exampleCurrency: USD

cases:
  - id: spine-04-uber-2014
    title: Uber, Damodaran against venture capital
    asOf: 2014-12-02
    valuationFrom: uber-vc-narrative-2014
    story: >
      In June 2014 Uber, still a private company about five years old, raised $1.2 billion in a
      venture round (investors buying stakes in a young private company), led by the fund manager
      Fidelity, at a price of $17 billion for the whole company, before counting their new money. Days later Aswath Damodaran, a valuation
      professor at NYU Stern, valued it at about $5.9 billion as a car-service company, and published
      his spreadsheet so anyone could try their own story. His story: taxis and car services worldwide
      take about $100 billion of fares a year; Uber wins 10% of them within ten years; and it takes 20%
      of each fare as its fee, its revenue, with drivers getting the rest. In July Bill Gurley, an Uber
      investor and board member, argued that the market was far bigger once people give up owning
      cars. On 2 December 2014 Uber has added car-pooling, a business service and deliveries in New
      York, and value estimates of $40 billion and more are in the news.
    reveal: >
      Uber priced its shares at $45 on 9 May 2019, which valued it at about $82.4 billion, and began
      trading the next day. In 2018 it had about $11.3 billion of revenue, only four years after 2014
      and already about three times the $3.6 billion Damodaran's story had for year ten: the market
      was far bigger than his story allowed. Back in 2014 he had written that to justify $17 billion
      the market would have to be about three times his estimate, and when he ran Gurley's story (a
      $300 billion market and a 40% share) through his own spreadsheet in July 2014, it came to $53.4
      billion. In April 2019, from Uber's filing, he valued its equity at about $61.7 billion, below
      the $82.4 billion it listed at, and called his June 2014 post his "first and fatally flawed
      valuation of Uber". The values were far apart because the stories about the market were.

concept: >
  For a young company, revenue years from now is a story in three parts: how big the market is,
  what share of it the company wins, and what slice of each sale it takes as its fee, its revenue. Damodaran's
  Uber, for example, is a share of the world's taxi fares, with Uber taking a fifth of each fare.
  This slice is not the margin: the margin is what Uber keeps of that revenue as profit, the next
  Topic's lever.
  Each part is a claim to argue: a market can be defined narrowly (taxis today) or widely (every
  trip people might take instead of driving their own car), and a share or a slice depends on
  rivals. A young company is early in its life, with small revenue and most of its value in
  what it might become, so the size of the market it can win moves its value more than any other
  input. The sums are the same for everyone; the stories are not.

# Go deeper (spec H1, #68): beyond the Checks, for the Tutor to give when the Learner presses Go deeper. Never quizzed.
goDeeper: >
  Analysts call the stages a company passes through its life cycle: young and growing fast, then mature, then
  declining. A young company like Uber in 2014 has small revenue and little profit, so nearly all its value sits in
  what it might become, and the story about its market moves that value most. A mature company's value sits more in
  the business it already runs. A Learner who wants more can ask where a company like a decades-old coffee chain sits.

principle: >
  When two values for a young company sit far apart, look first at the story each tells about the
  market, the share and the slice, then check that the numbers follow from it. Argue about the
  story before you argue about the arithmetic.

youllLearn:
  - "Build a young company's revenue years from now from its market, share and slice."
  - "See how much the story about the market moves a value."
  - "Find the difference in story behind two values that sit far apart."

terms:
  - term: total market
    means: All the sales in a market a company could win, before asking how much of it the company gets.
    pro: How big is the total market?
    example: "Every cup of coffee sold in a city, before asking how many are yours."
    emoji: globe-showing-americas
    inStory: In the story, Damodaran puts taxi and car-service fares at about $100 billion a year.
  - term: market share
    means: The part of a market's sales that one company wins.
    pro: They hope to reach a tenth of the market.
    example: "Your stall sells one cup in ten of all the coffee in town."
    emoji: bar-chart
    inStory: In the story, Uber's share grows from 1.5% to 10% in ten years.
  - term: take rate
    means: The slice of each sale a platform takes as its fee, which is its revenue; the rest goes to the sellers or drivers.
    pro: The platform's take rate is about a fifth.
    example: "An app takes $2 of a $10 ride as its fee and the driver gets $8."
    emoji: coin
    inStory: In the story, Uber takes 20% of each fare and drivers get the rest.
  - term: compounding
    means: "Growth earned on growth: each year's gain joins the total, and the next year grows on that."
    pro: Compounding does the heavy lifting over long horizons.
    example: "Leave $100 in a deposit at 5%: next year the interest earns interest of its own."
    emoji: chart-increasing
    inStory: In the story, a market growing 6% a year is far bigger after ten years.

