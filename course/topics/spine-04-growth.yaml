skills:
  - id: market-story
    rule: "Revenue years from now is a story in three parts: the size of the market, the share the company wins, and the slice of each sale it takes as its fee."
    analogy: "A stall's takings are the town's coffee, times its share of the cups, times the price it charges for each."
  - id: story-moves-value
    rule: "For a young company the market it can win moves the value more than any other input, so values far apart are usually stories far apart."

# The Insight (ADR 0001), found at explore with Value levers in market mode. Words only.
insight:
  question: >
    Start from Damodaran's story, then change only the market Uber is sharing in, keeping its share,
    margin and the rest. What happens to the value, and what does that say about the gap between his
    value and the venture price?
  written: >
    The sums are the same in every story: market, share and slice give revenue, then margins and
    reinvestment give cash. Change only the size of the market Uber can win and the value moves
    several-fold, close to the venture price, so the gap between the professor and the investors is a
    gap between stories about the market, not a sum one side got wrong.
  foundWhen: >
    The Learner switches the market (or moves the share) and sees the value move several-fold with
    nothing else changed, and says in their own words that the professor and the investors differ
    mainly in their story about how big Uber's market is, not in their arithmetic. Saying only that
    the value went up is not yet enough.
  hints:
    - >
      Keep every lever where his story sets it and switch to the bigger market. Each market button
      is already Uber's slice of the fares, a fifth of them. Watch the value and the price marker.
    - >
      If the same sums can give his value and the investors' price, what are the two sides really
      disagreeing about?

explore:
  before: ug-check
  requiredWhenPassed: false
  workbench:
    recipe: value_levers
    case: spine-04-uber-2014
    title: How big can Uber get?
    inputs:
      caseStory: "Damodaran's June story"
      mode:
        kind: market
        markets:
          - label: "Uber's 20% slice of $100bn of fares"
            # His $100bn of fares a year, at his 20% slice: $20bn of revenue to share in, growing 6% a year.
            size: 20000
            growthPercent: 6
            source:
              title: "Damodaran, A Disruptive Cab Ride to Riches: The Uber Payoff (9 Jun 2014), and ubervaluation.xls"
              url: https://aswathdamodaran.blogspot.com/2014/06/a-disruptive-cab-ride-to-riches-uber.html
          - label: "Uber's 20% slice of $300bn of fares"
            # His breakeven: "the total market has to be ... three times bigger than my estimate (around $300 billion)".
            size: 60000
            growthPercent: 6
            source:
              title: "Damodaran, A Disruptive Cab Ride to Riches (9 Jun 2014): the market three times bigger, around $300bn"
              url: https://aswathdamodaran.blogspot.com/2014/06/a-disruptive-cab-ride-to-riches-uber.html

# Primer (spec C3): Growth on growth, cut from the Growth and compounding Elective.
primers:
  - id: ug-primer-growth
    title: Growth on growth
    lines:
      - "Growth compounds: each year's growth is earned on the new, bigger total."
      - "Damodaran's market of $100bn grows 6% a year, so in ten years it is about $179bn, not $160bn."
      - "Ten years of growth multiply; they do not simply add up."
    term: compounding
    quickTry:
      id: ug-primer-try
      skill: market-story
      ask: "A $100bn market growing 6% a year is about $179bn after ten years. Why not $160bn?"
      kind: choice
      answer: compounds
      choices:
        - { id: compounds, text: "Each year's 6% is earned on a bigger market than the year before" }
        - { id: speeds, text: "Markets grow faster as they get older", mistake: { tag: growth_speeds_up, fix: "The rate stays 6% a year. It is the amount it works on that grows." } }
        - { id: simple, text: "It should be $160bn: six percent of $100bn, ten times", mistake: { tag: simple_growth, fix: "That adds the first year's growth ten times. Each year's 6% is on the new, bigger market." } }
    elective: num-compounding
    at: concept

connections:
  - text: >
      Damodaran's crowd valuation hands readers every step of the story, from the market to the slice,
      and shows how far apart the values of different stories sit.
    topics: [fol-uber-2014, val-young]
  - text: >
      Size is one lever; what the company keeps of each sale is the next, and a story about size must
      agree with the story about margins and reinvestment.
    topics: [spine-05-margins, spine-11-story-to-numbers]

questions:
  # Which lever (D1), computed from the June valuation block.
  - id: ug-q-which-lever
    kind: which_lever
    skill: story-moves-value
    prompt: >
      From Damodaran's June story, which single change lifts the value most?
    explanation: "For a young company the market it can win moves the value most."
    computed:
      case: spine-04-uber-2014
      changes:
        - { id: market-3x, label: "A market three times his, $300bn of fares", levers: { revenueYear10: 10745 } }
        - { id: no-failure, label: "No chance of failure, not 10%", levers: { failureChance: 0 } }
        - { id: rate-10, label: "Cost of capital 12% to 10% while it grows", levers: { costOfCapitalGrowing: 10 } }
        - { id: lean, label: "Sales to capital 5 to 10", levers: { salesToCapital: 10 } }
  # What the price assumes (D1), computed: which story is worth the $17bn venture price.
  - id: ug-q-price
    kind: price_assumes
    skill: story-moves-value
    prompt: >
      In June, investors priced the whole of Uber at $17 billion, before their $1.2 billion went in.
      Which story gets there?
    explanation: "The price needed a market about three times his, with everything else as he set it."
    computed:
      case: spine-04-uber-2014
      changes:
        - { id: market-3x, label: "Three times his market, the same 10% share", levers: { revenueYear10: 10745 } }
        - { id: market-2x, label: "Twice his market, the same 10% share", levers: { revenueYear10: 7163 } }
        - { id: safe-cheap, label: "His market, no chance of failure and a 10% cost of capital", levers: { failureChance: 0, costOfCapitalGrowing: 10 } }
        - { id: big-thin, label: "Three times his market, but a 30% margin", levers: { revenueYear10: 10745, marginTarget: 30 } }
  # Predict, then see (D1), computed: never marked wrong.
  - id: ug-q-predict
    kind: predict
    skill: market-story
    prompt: "In his story Uber wins 10% of the market. With {change}, and everything else the same, his value will be:"
    explanation: "Revenue years from now follows the share one for one, and the value follows revenue closely."
    computed:
      case: spine-04-uber-2014
      changes:
        - { id: share-20, label: "a 20% share instead", levers: { revenueYear10: 7163 } }
        - { id: share-5, label: "only a 5% share", levers: { revenueYear10: 1791 } }
      bands:
        - { id: half, label: "About half", min: 0.3, max: 0.7 }
        - { id: same, label: "About the same", min: 0.9, max: 1.1 }
        - { id: double, label: "About double", min: 1.6, max: 2.4 }
        - { id: tenfold, label: "About ten times", min: 5 }
  # Direction (D1).
  - id: ug-q-direction
    kind: direction
    skill: market-story
    prompt: >
      December 2014. Uber now runs car-pooling, a service for businesses and deliveries in New York.
      Which part of its story moves, and which way?
    choices:
      - { id: market-up, text: "The market it can win, up" }
      - id: slice-up
        text: "The slice of each fare it takes as its fee, up"
        mistake: { tag: lever_mixup, fix: "New services reach new customers and trips. That widens the market; the slice is a separate claim." }
      - id: risk-down
        text: "How risky it is, down"
        mistake: { tag: lever_mixup, fix: "New lines of business widen what Uber can sell first. Risk is a separate lever, and new ventures add some." }
      - id: margin-down
        text: "Its operating margin, the profit left from each $1 of revenue, down"
        mistake: { tag: lever_mixup, fix: "The first thing new services change is how big the market is. The margin is a separate lever." }
    answer: market-up
    explanation: >
      Deliveries and shared rides reach trips that taxis never served, so the market Uber can win
      grows. That is the argument Gurley made, and the reason Damodaran let readers pick wider markets.
    source: "Damodaran, Up, Up and Away! A Crowd Valuation of Uber! (2 Dec 2014): https://aswathdamodaran.blogspot.com/2014/12/up-up-and-away-crowd-valuation-of-uber.html"
  # Story that cannot hold (D1).
  - id: ug-q-cannot-hold
    kind: cannot_hold
    skill: market-story
    prompt: >
      Three readers send Damodaran their Uber stories. Which one contradicts itself?
    choices:
      - { id: free-growth, text: "Uber wins 40% of a market three times bigger within ten years, and invests almost nothing to get there" }
      - id: car-service
        text: "Uber wins 10% of taxis and car services and takes a fifth of each fare as its fee"
        mistake: { tag: dull_is_fine, fix: "That one holds: a modest share and Uber's own slice fit together." }
      - id: no-cars
        text: "The market grows because people give up owning cars, and Uber spends heavily to win them"
        mistake: { tag: dull_is_fine, fix: "That one holds: a bigger market, paid for with heavy spending." }
    answer: free-growth
    explanation: >
      Winning a large share of a much bigger market takes cars on the road, cities opened and riders
      won, all paid for before the revenue arrives. Huge growth that costs nothing is the part that
      cannot hold.
    source: "Damodaran, Up, Up and Away! A Crowd Valuation of Uber! (2 Dec 2014): https://aswathdamodaran.blogspot.com/2014/12/up-up-and-away-crowd-valuation-of-uber.html"
  # Price or value (D1).
  - id: ug-q-pre-money
    kind: price_or_value
    skill: story-moves-value
    prompt: >
      June 2014. Investors led by the fund manager Fidelity put $1.2 billion into Uber at what the press
      reported as a "$17 billion valuation". Is the $17 billion a price or a value?
    choices:
      - { id: price, text: "A price: what investors paid for their stake, scaled up to the whole company" }
      - id: value
        text: "A value: the word valuation says so"
        mistake: { tag: price_for_value, fix: "A round is what buyers paid. A value has to be argued from a story about the business's cash." }
    answer: price
    explanation: >
      A funding round is a trade: investors paid a price for part of the company, and the press scaled
      it up to the whole. Damodaran's $5.9 billion was a value, argued from a story.
    source: "Uber blog, 4 Years In (6 Jun 2014), Wayback capture: http://web.archive.org/web/20140606180823/http://blog.uber.com/4years"
  # Not a judgement kind: where a young company's value sits.
  - id: ug-q-life-cycle
    skill: story-moves-value
    prompt: >
      Uber in 2014 is a few years old, with small revenue that is growing fast. Where does most of its
      value sit?
    choices:
      - { id: future, text: "In what it might become, many years from now" }
      - id: cars
        text: "In the cars it owns"
        mistake: { tag: assets_for_value, fix: "Drivers own the cars. Uber's value is in the business it might build." }
      - id: this-year
        text: "In this year's profit"
        mistake: { tag: profit_for_value, fix: "A young company has little profit yet. Its value is mostly in the years ahead." }
    answer: future
    explanation: >
      Early in its life a company has little revenue and less profit, so nearly all its value is
      in the business it might become, which is why the story about the market matters so much.
    source: "Damodaran, A Disruptive Cab Ride to Riches: The Uber Payoff (9 Jun 2014): https://aswathdamodaran.blogspot.com/2014/06/a-disruptive-cab-ride-to-riches-uber.html"

checks:
  - id: ug-check
    kind: quiz
    questions: [ug-q-which-lever, ug-q-price, ug-q-predict, ug-q-direction, ug-q-cannot-hold, ug-q-pre-money, ug-q-life-cycle]
    perAttempt: 4
    passRule:
      correct: 3
    card:
      title: "How big can it get?"
      lines:
        - "Revenue years from now is a story in three parts: the market, the share won, the slice taken."
        - "A made-up example: a $50bn market, a 10% share and a 30% slice give $1.5bn of revenue."
        - "A young company is early in its life: most of its value is in what it might become."
        - "So each part of the size story is a claim to argue, not a fact to look up."
      writeDown: "Revenue later is market, times share, times slice: three claims to argue."
      skills: [market-story, story-moves-value]
      example: [50, 10, 30, 1.5]
    quickTries:
      - id: ug-try-slice-half
        skill: market-story
        ask: "Uber takes 20% of each fare it carries as its fee. Which part of the fares riders pay is Uber's revenue?"
        halfDone: "First step, done for you: drivers keep the other 80% of each fare."
        kind: choice
        answer: slice
        choices:
          - { id: slice, text: "The slice it takes as its fee" }
          - { id: fares, text: "Every fare riders pay", mistake: { tag: gross_for_revenue, fix: "That is what riders pay in total. Uber's revenue is only the slice it takes." } }
          - { id: drivers, text: "The part the drivers keep", mistake: { tag: gross_for_revenue, fix: "The drivers keep that. Uber's revenue is the 20% it takes." } }
      - id: ug-try-three-parts
        skill: market-story
        ask: "Which three parts make Uber's revenue years from now?"
        kind: choice
        answer: three
        choices:
          - { id: three, text: "The market's size, Uber's share of it, and the slice of each fare it takes" }
          - { id: places, text: "Its cities, its countries and its drivers", mistake: { tag: lever_mixup, fix: "Those describe where it runs. Revenue comes from the market, the share and the slice." } }
          - { id: margin, text: "The market's size and its margin", mistake: { tag: skipped_the_share, fix: "Uber wins only a share of the market, and takes only a slice of each fare. The margin comes later." } }
      - id: ug-try-double-share
        skill: market-story
        ask: "True or false: if Uber's share doubles, with the same market and the same slice, its revenue doubles."
        kind: truth
        answer: true
        mistakes:
          - { answer: false, fix: "Revenue is market, times share, times slice, so twice the share gives twice the revenue.", tag: added_not_chained }
      - id: ug-try-deliveries
        skill: market-story
        ask: "Uber starts delivering parcels in New York. Which part of its revenue story moves first?"
        kind: choice
        answer: market
        choices:
          - { id: market, text: "The market it can win" }
          - { id: slice, text: "The slice of each fare it takes", mistake: { tag: lever_mixup, fix: "A new service reaches new trips. That widens the market first." } }
          - { id: share, text: "Its share of taxi rides", mistake: { tag: lever_mixup, fix: "Parcels are not taxi rides. The new service widens the market Uber can win." } }
      - id: ug-try-gap-half
        skill: story-moves-value
        ask: "Two analysts use the same spreadsheet for Uber. One gets $6 billion, the other $53 billion. What most likely differs?"
        halfDone: "First step, done for you: the same spreadsheet means the same sums."
        kind: choice
        answer: story
        choices:
          - { id: story, text: "Their stories about how big Uber's market is" }
          - { id: slip, text: "One of them made a slip in the sums", mistake: { tag: arithmetic_for_story, fix: "The spreadsheet is the same. Values this far apart come from different stories." } }
          - { id: rate, text: "A point or two of discount rate", mistake: { tag: lever_mixup, fix: "A point of discount rate moves a value a little, not ninefold. The market story moves it most." } }
      - id: ug-try-gap-truth
        skill: story-moves-value
        ask: "True or false: when two values for a young company sit far apart, the gap usually comes from different stories rather than a slip in the sums."
        kind: truth
        answer: true
        mistakes:
          - { answer: false, fix: "Damodaran's lesson from his December 2014 range of stories: big differences in value come almost always from different stories.", tag: arithmetic_for_story }
      - id: ug-try-lever-computed
        skill: story-moves-value
        kind: which_lever
        ask: "From his June story, which change lifts the value most?"
        computed:
          case: spine-04-uber-2014
          changes:
            - { id: market-2x, label: "A market twice his", levers: { revenueYear10: 7163 } }
            - { id: no-failure, label: "No chance of failure", levers: { failureChance: 0 } }
            - { id: rate-10, label: "Cost of capital 12% to 10%", levers: { costOfCapitalGrowing: 10 } }

  - id: ug-talk
    kind: conversation
    skills: [market-story, story-moves-value]
    prompt: >
      December 2014. A friend says Damodaran's $5.9 billion must be a mistake, since investors paid $17
      billion and the news now talks of $40 billion. In your own words, how can both come from the same
      kind of sums, and which part of Uber's story would you argue about first?
    passCriteria: >
      The Learner explains that the value and the price can come from the same steps (market, share and
      slice give revenue; margins and reinvestment give cash) with different stories, and that the
      biggest difference is how big a market Uber can win. They name the part of the story they would
      argue about first (most likely the market's size or Uber's share) with a reason, and treat the gap
      to the price as a question about the story, not a sum to correct. No figure needs to be worked out.
