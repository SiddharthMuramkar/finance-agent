# Present value: a foundation Topic taught through a short Case.
# Case Data (the sourced figures and datasets) lives in the database; see docs/architecture.md.
id: present-value
title: Present value
# One line in the Topic bar: what the Learner can do by the end. Words only, never the Insight.
goal: Compare money paid at different dates by moving each amount to today.
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: mega-millions-2018
    title: The $1.537 billion Mega Millions jackpot
    asOf: 2018-10-24
    data: [advertised-annuity, cash-option, treasury-30-year, winner-cash-payment]
    story: >
      On 23 October 2018 a single ticket sold in Simpsonville, South Carolina matched all
      six numbers in the US Mega Millions lottery. The advertised jackpot was $1.537 billion,
      but that figure was the total of an annuity: 30 yearly payments, one now and one each
      year for the next 29 years. The payments were graduated: each was 5% larger than the
      one before, starting at about $23.1 million (the 30 payments add up to the $1.537 billion).
      The same prize was also offered as a single cash payment
      of about $877.8 million. Both figures were before tax. The winner had 180 days to come
      forward and choose. As of 24 October 2018 nobody knew who held the ticket or which
      option they would pick.
    reveal: >
      The winner stayed anonymous, came forward on 4 March 2019 and took the cash option, a
      one-time payment of $877,784,124 before tax. Most large jackpot winners make the same choice.
      The cash figure was not a discount for impatience invented by the lottery: it was
      roughly what the lottery would have had to spend on bonds to fund the 30 payments,
      that is, the present value of the annuity at the interest rates of the time.

exampleCurrency: INR
runningExample:
  text: A friend offers you ₹1,000 next year, or ₹950 today.
  numbers: [1000, 950]
  scene:
    cast:
      - { id: asha, emoji: woman, name: Asha }
      - { id: ravi, emoji: man, name: Ravi }
    beats:
      - { who: narrator, says: "Ravi owes Asha money and offers two ways to pay.", emoji: money-bag }
      - { who: ravi, says: "Either ₹1,000 next year, or ₹950 today.", emoji: calendar }
      - { who: asha, says: "If I take it today I can invest it meanwhile.", emoji: seedling }
      - { who: narrator, says: "Waiting costs something. Present value says how much." }

terms:
  - term: present value
    means: What a future payment is worth in today's money, after allowing for the cost of waiting.
    pro: We discount the cash flows to get their present value.
    example: "₹1,000 promised in a year is worth less than ₹1,000 in your hand today."
    emoji: hourglass-not-done
    inStory: In the story, the lottery offers money now or money spread over 30 years.
  - term: lump sum
    means: One single payment of the whole amount, all at once.
    pro: She asked for the lump sum, not instalments.
    example: Taking a retirement payout as one ₹50 lakh cheque, not a monthly pension.
    emoji: money-bag
    inStory: In the story, one cash payment is offered instead of 30 yearly ones.
  - term: annuity
    means: A stream of payments made at regular times, such as once a year.
    pro: The prize is paid as a thirty-year annuity.
    example: "A pension of ₹30,000 a month is an annuity: money arrives on a schedule."
    emoji: calendar
    inStory: In the story, the advertised jackpot is 30 yearly payments.
  - term: discount rate
    means: The yearly rate used to shrink a later payment into today's money.
    pro: What discount rate are you using for those payments?
    example: If your bank pays 6 percent a year, ₹106 next year is worth ₹100 today.
    emoji: chart-decreasing
    inStory: In the story, a higher discount rate makes the later payments worth less.
  - term: cash option
    means: The choice to take a smaller lump sum today instead of the advertised annuity.
    pro: Do you want the annuity or the cash option?
    example: "A shop offers ₹90,000 now or ₹1 lakh in a year: that is a cash option."
    emoji: coin
    inStory: In the story, the winner has 180 days to come forward and choose.

