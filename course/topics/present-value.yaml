concept: >
  Money available today is worth more than the same amount later, because today's money
  can be invested to grow. Present value turns a future amount into today's money by
  discounting it: for each year you wait, the amount is divided by one plus the yearly
  interest rate. For example, {{formula:present-value amount=1000 ratePercent=10 years=5}}
  A stream of payments is worth the sum of each payment's present value.
  The higher the rate or the more years until the payment arrives, the less a future payment is worth today.

# The named formulas this Topic teaches; the Tutor shows them only as Formula Cards (see src/finance/formulas.ts).
formulas:
  - present-value
  - annuity-present-value
  - growing-annuity-present-value

principle: >
  An advertised total that adds up payments made at different times overstates their value.
  Compare cash flows only after moving them to the same date, and ask which interest rate
  makes two offers equal.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "See why money later is worth less than money now."
  - "Move payments made at different dates to one date before comparing them."
  - "Find the interest rate at which two offers are worth the same."

# The Insight (ADR 0001): found by the Learner at the explore step, before the jackpot conversation Check.
# The text uses no figures. The written Insight reaches the Tutor only once it is found or told.
insight:
  question: >
    Move the interest rate up and down and watch what happens to the payments that come later.
    What do you notice, and what does it mean for the choice?
  written: >
    When interest rates are high, money today beats bigger payments later: a high rate shrinks
    far-off payments so much that a smaller sum now can be worth more than a larger total paid out over many years.
  foundWhen: >
    The Learner says in their own words how the rate changes what the later payments are worth, and
    which payments it changes most, and then draws a conclusion about having money now versus
    receiving it later. Noticing only that "the bars get smaller" is not yet enough: they must
    connect it to the choice between now and later.
  hints:
    - >
      Watch the bars for the payments that arrive furthest away as you raise the rate. Which bars
      shrink the most, and which hardly move?
    - >
      Compare the total of the shrunken bars with a single sum arriving today. At a high rate, which
      one would you rather have, and why?
# The explore Widget is the annuity Widget below, shown by code at explore (not by the Tutor); the Tutor reopens it
# later with open_widget. It draws only the cash option's dataset (dated on or before the as-of date) and leaves out
# the 30-year Treasury chart and the winner's payment, so nothing leads the Learner to the reveal.
explore:
  before: pv-jackpot-choice
  requiredWhenPassed: false
  widget: annuity-worth-today

# The owner's Part 5 annuity Widget. Until the Insight is settled the chart hides its verdict and break-even (code
# works both out); until the reveal the 30-year Treasury quick button and task stay out. The break-even task ticks
# within 0.02% of the break-even code works out (about 3.38%); a test holds the two together.
widgets:
  - id: annuity-worth-today
    # The Tutor may not draw an annuity chart or schedule of its own here: this Widget is the one.
    parts: [AnnuityChart, annuity_schedule]
    code: |
      root = Widget("What the annuity is worth today", [rate, chart, steps])
      $rate = 5
      rate = Slider("rate", "Interest rate (discount rate)", 0, 10, 0.01, $rate, "percent", [{value: 0}])
      chart = AnnuityChart(1537000000, 30, 5, $rate, "mega-millions-2018/cash-option", 2018)
      steps = GuidedTasks([zero, even])
      zero = GuidedTask("Set the rate to 0%: the payments are worth the advertised $1.537B", $rate == 0)
      even = GuidedTask("Find the rate where the annuity is worth the same as the cash", $rate >= 3.36 && $rate <= 3.39)
    revealTask:
      case: mega-millions-2018
      dataset: treasury-30-year
      text: "Set the 30-year Treasury yield of 24 Oct 2018: {before}%"
      done: "$rate == {before}"
      quick: { slider: rate, note: "30-yr Treasury, 24 Oct 2018" }

# What the Learner found, said on Past Sessions and the Topic complete card once their saved Widget state shows it.
found:
  - when: { kind: ticked, widget: annuity-worth-today, task: 2 }
    text: You found the rate where the annuity is worth the same as the cash.

# Given by the Tutor at the principle step. Written in words (no figures); each names outline Topic IDs, checked by `npm run course:check`.
connections:
  - text: >
      A bond's yield is the market's discount rate for its payments. So when yields rise, bond
      prices fall, and the bonds with the furthest payments fall the most.
    topics: [bond-pricing, bond-yield]
  - text: >
      In a recession safe interest rates usually fall, while the extra return investors demand
      on risky payments can rise. The discount rate for a risky payment can therefore move
      either way.
    topics: [eco-gdp-cycles, eco-central-banks]
  - text: >
      When rates rise, cash a business expects far in the future loses the most value. That is
      why valuing a business that pays off late is so sensitive to the discount rate.
    topics: [val-dcf]

# Claude-written quiz questions; each answer was checked against the cited source (see docs/architecture.md).
questions:
  - id: pv-q-today-vs-later
    prompt: >
      Ravi offers Asha ₹1,000 today or ₹1,000 in five years. She could earn a positive interest rate on money she holds. Which is worth more to her today?
    choices:
      - { id: a, text: "The ₹1,000 offered today" }
      - { id: b, text: "The ₹1,000 offered in five years", mistake: { tag: later_is_bigger, fix: "Same rupees later is worth less: the money in hand could have been earning for five years." } }
      - { id: c, text: "They are worth the same today", mistake: { tag: ignores_waiting, fix: "Waiting has a cost. Money today can be invested and grow, so it is worth more." } }
    answer: a
    explanation: >
      Money you hold today can be invested and grow, so a future amount is worth less today. Discounting expresses exactly that.
    source: >
      CFA Institute, Time Value of Money in Finance (refresher reading, 2024): https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2024/time-value-money

  - id: pv-q-one-year
    prompt: >
      Asha is promised ₹1,100 in a year, and her bank pays 10 percent a year. Finance people call the ₹1,000 that would grow into that ₹1,100 its:
    choices:
      - { id: a, text: "Present value" }
      - { id: b, text: "Future value", mistake: { tag: mixed_up_terms, fix: "The future value is the ₹1,100 itself. The sum today that grows into it is the present value." } }
      - { id: c, text: "Lump sum", mistake: { tag: mixed_up_terms, fix: "A lump sum is a single payment. Here we name the worth today of a later payment." } }
      - { id: d, text: "Discount rate", mistake: { tag: mixed_up_terms, fix: "The discount rate is the 10 percent. The ₹1,000 it produces is the present value." } }
    answer: a
    explanation: >
      Waiting one year at 10% means dividing by 1.10 once. {{formula:present-value amount=1100 ratePercent=10 years=1}}
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 7.3 Methods for Solving Time Value of Money Problems: https://openstax.org/books/principles-finance/pages/7-3-methods-for-solving-time-value-of-money-problems

  - id: pv-q-two-years
    prompt: >
      A payment of ₹1,210 is due in two years and the discount rate is 10 percent. How does its present value reflect the two years of waiting?
    choices:
      - { id: a, text: "It is discounted twice, once for each year of waiting" }
      - { id: b, text: "It is discounted once, however long the wait", mistake: { tag: discounted_once, fix: "Each year of waiting adds a discount. Two years means two discounts." } }
      - { id: c, text: "It is not discounted, because the amount is fixed", mistake: { tag: ignores_waiting, fix: "A fixed amount later is still worth less today, because today's money could be earning." } }
      - { id: d, text: "It is made bigger, because it is paid later", mistake: { tag: later_is_bigger, fix: "Waiting makes the payment worth less today, not more." } }
    answer: a
    explanation: >
      Two years at 10% means dividing by 1.10 twice. {{formula:present-value amount=1210 ratePercent=10 years=2}} Dividing by 1.10 only once discounts for one year instead of two.
    source: >
      CFA Institute, Time Value of Money in Finance (refresher reading, 2024): https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2024/time-value-money

  - id: pv-q-rate-rises
    prompt: >
      A payment is due in ten years. If the discount rate rises, what happens to its present value?
    choices:
      - { id: a, text: "It rises", mistake: { tag: rate_direction, fix: "A higher rate shrinks a later payment more, so its worth today falls." } }
      - { id: b, text: "It falls" }
      - { id: c, text: "It does not change", mistake: { tag: ignores_rate, fix: "The rate is the price of waiting. When it changes, the worth today changes." } }
      - { id: d, text: "It depends only on the size of the payment", mistake: { tag: ignores_rate, fix: "The size matters, but so do the rate and the years of waiting." } }
    answer: b
    explanation: >
      Each year of waiting divides the payment by one plus the rate. A higher rate means a bigger divisor every year, so the present value is smaller.
    source: >
      CFA Institute, Time Value of Money in Finance (refresher reading, 2024): https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2024/time-value-money

  - id: pv-q-annuity-total
    prompt: >
      A prize is advertised as the total of 30 yearly payments, the first paid today and the others over the next 29 years. At a positive discount rate, how does its present value compare with the advertised total?
    choices:
      - { id: a, text: "It is more than the total", mistake: { tag: later_is_bigger, fix: "Discounting only ever shrinks a later payment, so the sum can only get smaller." } }
      - { id: b, text: "It equals the total", mistake: { tag: ignores_waiting, fix: "Only the first payment is paid today. Every later one is worth less than its face amount." } }
      - { id: c, text: "It is less than the total" }
    answer: c
    explanation: >
      Every payment after the first is discounted, so each is worth less than its face amount today. The present value of the stream is the sum of the discounted payments, which is below the plain sum.
    source: >
      CFA Institute, Time Value of Money in Finance (refresher reading, 2024): https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2024/time-value-money

  - id: pv-q-five-percent
    prompt: >
      Asha is owed ₹5,000 in two years. Compared with a 10 percent discount rate, what does a lower rate of 5 percent do to what that payment is worth today?
    choices:
      - { id: a, text: "It makes it worth more today: a lower rate shrinks the payment less" }
      - { id: b, text: "It makes it worth less today", mistake: { tag: rate_direction, fix: "A lower rate means a smaller price for waiting, so the payment keeps more of its worth." } }
      - { id: c, text: "It makes no difference", mistake: { tag: ignores_rate, fix: "The rate is the price of waiting, so changing it changes the worth today." } }
      - { id: d, text: "It makes it worth the full ₹5,000", mistake: { tag: ignores_waiting, fix: "Two years of waiting still cost something at 5 percent, so it is worth less than ₹5,000." } }
    answer: a
    explanation: >
      Two years at 5% means dividing by 1.05 twice. {{formula:present-value amount=5000 ratePercent=5 years=2}} At 10% the same payment would shrink more.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 7.3 Methods for Solving Time Value of Money Problems: https://openstax.org/books/principles-finance/pages/7-3-methods-for-solving-time-value-of-money-problems

  - id: pv-q-lingo-annuity
    prompt: >
      The advertised jackpot was offered as 30 yearly instalments. What do finance people call a prize offered that way?
    choices:
      - { id: a, text: "An annuity" }
      - { id: b, text: "A lump sum", mistake: { tag: mixed_up_terms, fix: "A lump sum is one payment, all at once. This prize was offered in 30 instalments." } }
      - { id: c, text: "A discount rate", mistake: { tag: mixed_up_terms, fix: "A discount rate is a yearly percentage used to shrink later payments." } }
      - { id: d, text: "A cash option", mistake: { tag: mixed_up_terms, fix: "The cash option is the lump sum taken instead of the annuity." } }
    answer: a
    explanation: >
      An annuity is a stream of payments made at regular times, here once a year for 30 years.
    source: >
      Mega Millions, Record jackpot won in South Carolina: https://www.megamillions.com/News/2018/Record-Mega-Millions-Jackpot-Won-in-South-Carolina.aspx

  - id: pv-q-lingo-discount-rate
    prompt: >
      What do analysts call the yearly rate used to turn a payment that arrives later into today's money?
    choices:
      - { id: a, text: "The discount rate" }
      - { id: b, text: "The jackpot rate", mistake: { tag: mixed_up_terms, fix: "There is no jackpot rate. The prize size is not a rate." } }
      - { id: c, text: "The lump sum", mistake: { tag: mixed_up_terms, fix: "A lump sum is a single payment, not a rate." } }
      - { id: d, text: "The annuity", mistake: { tag: mixed_up_terms, fix: "An annuity is the stream of payments. The rate is what shrinks each of them." } }
    answer: a
    explanation: >
      The discount rate is the price of waiting, per year. Each year of waiting divides a payment by one plus that rate.
    source: >
      CFA Institute, Time Value of Money in Finance (refresher reading, 2024): https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2024/time-value-money

  - id: pv-q-lingo-cash-option
    prompt: >
      The lottery let the winner take one smaller payment today instead of the 30 yearly ones. What is that choice called?
    choices:
      - { id: a, text: "The cash option" }
      - { id: b, text: "The annuity", mistake: { tag: mixed_up_terms, fix: "The annuity is the 30 yearly payments. The cash option is the one-off alternative." } }
      - { id: c, text: "The discount rate", mistake: { tag: mixed_up_terms, fix: "The discount rate is a percentage. The cash option is a payment." } }
      - { id: d, text: "The present value", mistake: { tag: mixed_up_terms, fix: "Present value is a worth in today's money. The cash option is the offer itself." } }
    answer: a
    explanation: >
      The cash option is a lump sum offered in place of the annuity. It is smaller because it is paid now.
    source: >
      Mega Millions, Record jackpot won in South Carolina: https://www.megamillions.com/News/2018/Record-Mega-Millions-Jackpot-Won-in-South-Carolina.aspx


checks:
  - id: pv-quiz-discounting
    kind: quiz
    questions:
      - pv-q-today-vs-later
      - pv-q-one-year
      - pv-q-two-years
      - pv-q-rate-rises
      - pv-q-annuity-total
      - pv-q-five-percent
      - pv-q-lingo-annuity
      - pv-q-lingo-discount-rate
      - pv-q-lingo-cash-option
    perAttempt: 3
    passRule:
      correct: 2
  - id: pv-jackpot-choice
    kind: conversation
    prompt: >
      The jackpot was advertised as $1.537 billion, yet the cash option was about
      $877.8 million. Explain, using present value, why the two can describe the same prize,
      and what would make the annuity the better choice for the winner.
    passCriteria: >
      The Learner explains that the $1.537 billion adds up payments spread over 29 years, that
      each later payment is worth less today once discounted at an interest rate, and that the
      cash option is roughly the present value of those payments. They identify that the
      annuity looks better if the winner could only earn a lower return than the rate the
      lottery used (or values the forced saving), and worse if they could earn more.
