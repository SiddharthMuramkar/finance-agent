# Spine Topic 11 (spec 2026-11-12, C4): how a story becomes numbers, taught on Damodaran's Uber of 2014 and Uber's
# first public filing of 2019. Drawn from fol-uber-2014, jud-narrative-numbers and val-young (Appendix D).
# Facts: docs/research/verify-uber-2014.json (fol-uber-2014-crowd, jud-nn-uber-2014-post, jud-nn-uber-s1-2019,
# uber-vc-narrative-2014) and the outline's Case entries. Every other number is the valuation engine's.
id: spine-11-story-to-numbers
title: "How does a story become numbers?"
# Stage, place on the Spine and length agree with course/outline.yaml.
minutes: 14
exampleCurrency: USD
goal: Turn a story about a young company into lever settings, and check that the settings fit together.
# Why it matters (spec 2026-11-12 A6): how this Topic helps value a company, for the Tutor to say in its own words.
why: "Every valuation is a story set as numbers; turning a story into lever settings, and checking they fit, is how you value a company honestly."
youllLearn:
  - "Turn each part of a company's story into the lever it sets."
  - "Find the difference in story behind two values that sit far apart."
  - "Check that a story's settings fit together, and say what later facts can and cannot test."

cases:
  - id: s11-uber-2014-inputs
    title: "The inputs behind Damodaran's Uber valuation exercise"
    asOf: 2014-12-02
    story: >
      December 2014. Uber is five years old and still private. It says it runs in 51 countries and
      about 230 cities. In June the valuation professor Aswath Damodaran told Uber's story as a city
      car service: a $100 billion market growing 6% a year, a 10% share of it, and 20% of each fare
      kept as revenue. He valued that Uber at about $6 billion, while venture investors had just put in $1.2
      billion at $17 billion. In July the investor Bill Gurley argued the market could be many times
      bigger, because cheaper, quicker rides bring in new riders and some people might one day give
      up their cars; Damodaran counted giving up cars apart, as a chance worth $10 billion or more.
      He summed up the rest of Gurley's
      story as bringing in mass-transit riders and suburban people who never took taxis, and ran it
      through his own spreadsheet: a $300 billion market growing 3% a year, a 40% share and the
      same 20% slice gave $53.4 billion. Only the market and the share had changed. Now, on 2
      December, he hands readers the controls. A leaked document projects $10 billion of fares for
      2015; he assumes $3.5 billion for 2014, so about $700 million of revenue. Readers choose the
      market ($100 billion for city cars, up to $285 billion for all mobility), how fast it grows,
      Uber's share (5% to 40%, by how strongly more riders draw more drivers) and its slice (5% to 20%).
      His spreadsheet opens on one sample story: all car services ($150 billion), a 25% share
      and a 15% slice. His sample stories run from $799 million to $90.5 billion, and talk of $40
      billion and more is in the news.
    reveal: >
      Two days later, on 4 December 2014, Uber said it had raised $1.2 billion, and Bloomberg
      reported the round valued it at $40 billion. In the post Damodaran declined to reveal his own choices. In April
      2019 Uber's first public filing let some of the post's inputs be tested. It gave 2014 revenue
      of $495 million, below the post's $700 million, but that column is unaudited, kept under the
      accounting rules then in force and leaves out the China business sold in 2016, so the two are
      not like for like. The filing gives no Gross Bookings for 2014, so the $3.5 billion and the 20%
      slice cannot be checked directly. Its 2015 revenue of $1,995 million is almost exactly 20% of
      the leaked $10 billion, which is consistent with the leak but only an inference. In 2019
      Damodaran listed his June 2014 post as his "first and fatally flawed valuation of Uber".
      Filings can test a story's inputs, one at a time; they cannot declare a story right.
    # The December 2014 spreadsheet's opening reader story (A2 all car service, B3, C4 25% share, D3 15% slice), not a
    # Damodaran valuation. Valued whole (per: company, one share): Uber was private and the sheet takes cash and debt as nil,
    # so the value is the company's, in $ millions, against the $40bn talk of 2 Dec 2014. The block, with its tax path, is
    # written once in fol-uber-2014.yaml; its price.label "talk" makes the Workbench and the computed questions say "the
    # $40bn talk", never "the $40bn price" (ADR 0010).
    valuationFrom: fol-uber-2014-crowd

  - id: s11-uber-s1-2019
    title: "Uber's first public filing, April 2019"
    asOf: 2019-04-11
    story: >
      On 11 April 2019 Uber makes public its registration statement (Form S-1) for a share listing;
      the price is left blank. For 2018 it reports revenue of $11,270 million on Gross Bookings, the
      total value of its rides, deliveries and freight, of $49,799 million. Its loss from operations
      is $3,033 million. It says its core platform's Take Rate is 20%. It now describes its market
      as personal mobility worth $5.7 trillion, against the $100 billion of city cars in Damodaran's
      2014 story. The filing also gives 2014
      revenue of $495 million and 2015 revenue of $1,995 million, both unaudited and kept under the
      accounting rules of the time.
    reveal: >
      Four days later Damodaran valued Uber's shares from the filing at about $61.7 billion in all, with
      the same kind of market, share and slice spreadsheet, now telling a story of a $400 billion
      global logistics market and a 30% share. Uber priced its shares at $45 on 9 May 2019, near the
      bottom of its $44 to $50 range, at about $82.4 billion counting options and restricted stock,
      and raised $8.1 billion; its last private round, in August 2018, had valued it at $76 billion.
      On the first day the shares closed at $41.57, about 7.6% below the offer price. It lost $8.6
      billion on its operations in 2019; by 2025 it sold $52 billion and made $5.6 billion from its
      operations. These can be set beside the 2014 post's range
      of reader values, $799 million to $90.5 billion, but they do not decide which story was right:
      a price is the market's judgement in one week, and the filings test the inputs one at a time.

concept: >
  A young company has little history to project, so its value starts as a story about what it
  becomes. Each part of the story sets one number. How big the market is, how fast it grows, what
  share the company wins and what slice of each sale it takes together set how big it gets. The
  slice is revenue, so it sits inside how big it gets; its edge over rivals sets what it keeps,
  the profit left after costs. What growth costs and how risky the business is
  set the rest. Two careful people with the same spreadsheet can land far apart because they tell
  different stories, so the useful argument is about the story, not the arithmetic. A story also
  has to hold together: a local edge does not win a global share, and a market where rivals fight
  harder on price does not leave the same slice of each sale.

principle: >
  Tell the story first, set each lever from it, and check that the settings fit together. When two
  values sit far apart, look for the two stories behind them. Later facts can test a story's inputs
  one at a time; they cannot declare a story right.

dailyLife: "A friend opening a third shop shows you a sales forecast: ask for the story behind it first, how many customers and what each spends, then check the numbers fit that story."

# Go deeper (H1): beyond the Topic's Checks, for a Learner who asks. No Check, Skill or Lingo term tests it.
goDeeper: >
  Behind the share sits what economists call a network effect: a service gets better for each user as more
  people use it, which helps the biggest player win more. More drivers in one city mean shorter waits for riders in
  that city, which brings in more riders, which brings in more drivers. The argument in 2014 was whether Uber's network
  effect was local, city by city, or global. A local one helps Uber win a city, but a rival can still win the next
  city; only a global one could carry a dominant share of the whole world's market, which is why a 40% global share
  from a local edge is a story that does not hold together.

terms:
  - term: narrative
    means: The story of what the company becomes, which every number in its valuation should follow from.
    pro: His narrative is a car service that stays mostly in cities.
    example: "A baker who plans three more shops has a narrative before she has a sales forecast."
    emoji: story
    inStory: In the story, Damodaran and Gurley tell two narratives about the same Uber.
  - term: total market
    means: What all customers spend on the kind of service the company sells, counting every seller.
    pro: How big is the total addressable market?
    example: "Every fare paid to every taxi in a city is that city's taxi market."
    emoji: globe-showing-americas
    inStory: In the story, readers pick a market from city cars up to all mobility.
  - term: market share
    means: The part of the total market that one company wins.
    pro: They expect a dominant share in five years.
    example: "If one shop sells a quarter of the town's bread, its share is a quarter."
    emoji: bar-chart
    inStory: In the story, the share Uber wins depends on how strongly more riders draw more drivers.
  - term: revenue slice
    means: The part of each fare the company takes as its own revenue; the rest goes to the driver.
    pro: The take rate slipped as competition grew.
    example: "A booking app that takes $2 of a $10 fare has a slice of a fifth."
    emoji: receipt
    inStory: In the story, Uber takes a slice of each fare and the driver gets the rest.

skills:
  - id: s11-story-levers
    rule: "Each part of a story sets one lever: market, share and slice set how big the company gets."
  - id: s11-story-holds
    rule: "A story holds only when its settings fit together, and a price someone paid is no proof that they do."

insight:
  question: "Push every lever to the end that makes Uber worth the most. Is what you built still a story about one company?"
  written: "The best case on every lever at once is a wish, not a story: the settings pull against each other."
  foundWhen: >
    The Learner moves the levers toward the best end together, sees the flag on the settings, and says the
    result is a wish rather than a story because the settings cannot all hold at once (for example a huge
    market won with little investment and little risk).
  hints:
    - "Move every lever to the end that raises the value, and read the flag under the stories."
    - "Ask whether one company could grow that big while needing so little money and carrying so little risk."

explore:
  before: s11-check
  workbench:
    recipe: value_levers
    case: s11-uber-2014-inputs
    inputs:
      caseStory: "The sheet's opening story"
      mode:
        kind: two_stories
        stories:
          # His June story's revenue in year 10, $3,582m (ubervaluation.xls Valuation!L5); his other inputs (40% margin,
          # sales to capital 5, 12% falling to 8%, a 10% chance of failure) are the December sheet's opening ones.
          - label: "Damodaran's June story"
            levers: { revenue: 3.58 }
          # The post's grid row A1/B4/C5/D4: a $100bn market growing 10.39% a year, a 40% share, a 20% slice (published
          # $31,952m; the engine gives $31,973m). Revenue in year 10 by the sheet's rule, market x share x slice: $21.5bn.
          - label: "Market grows fast, Uber wins 40%"
            levers: { revenue: 21.5 }

connections:
  - text: "How big the market is and what share of it a company wins set how big it gets."
    topics: [spine-04-growth]
  - text: "Setting a writer's inputs beside the company's later filing tests a story one input at a time."
    topics: [jud-narrative-numbers]
  - text: "Reading a price back as a set of beliefs is the same translation run the other way."
    topics: [spine-13-price-assumes]

questions:
  - id: s11-q-lever
    kind: which_lever
    prompt: "From the sheet's opening story, which one change lifts the value most?"
    skill: s11-story-levers
    explanation: "A change to the story's size moves the value far more than a change to what growth costs, to the risk or to the chance of failure."
    computed:
      case: s11-uber-2014-inputs
      changes:
        - { id: share, label: "Share in year 10 25% to 40%", levers: { revenueYear10: 18139 } }
        - { id: reinvest, label: "Sales to capital 5 to 10", levers: { salesToCapital: 10 } }
        - { id: risk, label: "Cost of capital 12% to 10% while it grows", levers: { costOfCapitalGrowing: 10 } }
        - { id: survive, label: "Chance of failure 10% to none", levers: { failureChance: 0 } }

  - id: s11-q-price
    kind: price_assumes
    prompt: "The talk is of $40 billion. Which story gets there?"
    skill: s11-story-holds
    explanation: "The story that reaches the talk takes the full slice in moving and delivery, where Damodaran expected rivals to force a smaller one."
    computed:
      case: s11-uber-2014-inputs
      changes:
        # Revenue in year 10 = market x growth over ten years x share x slice, by the sheet's rule.
        # logistics: $205bn growing 10.39%, 25% share, 20% slice. city40: $100bn growing 10.39%, 40%, 20%.
        # allcar15: $150bn growing 7.26%, 40%, 15%. june: his June story ($100bn growing 6%, 10%, 20%).
        - { id: logistics, label: "Uber moves into moving and delivery, a market that doubles, wins a quarter of it and still takes its full slice", levers: { revenueYear10: 27544 } }
        - { id: city40, label: "Uber stays a city car service in a market that doubles, and wins 40% of it", levers: { revenueYear10: 21497 } }
        - { id: allcar15, label: "Uber wins 40% of all car services but takes a smaller slice", levers: { revenueYear10: 18139 } }
        - { id: june, label: "Damodaran's June story: a city car service with a modest share", levers: { revenueYear10: 3582 } }

  - id: s11-q-predict
    kind: predict
    prompt: "If {change}, the value against the sheet's opening story will be:"
    skill: s11-story-levers
    explanation: "The value moves roughly in step with revenue in a future year: a slightly smaller share trims it, a city-only story with a small share cuts it deeply, and the best story on every count lifts it far."
    computed:
      case: s11-uber-2014-inputs
      changes:
        # city: $100bn growing 7.26%, a 10% share, a 20% slice. best: $285bn growing 10.39%, a 40% share, a 20% slice.
        # share20: the opening story with a 20% share (revenue in year 10 four fifths of 11,337).
        - { id: city, label: "Uber stays a city car service with a small share", levers: { revenueYear10: 4031 } }
        - { id: best, label: "Uber wins big in all of mobility", levers: { revenueYear10: 61268 } }
        - { id: share20, label: "Uber's share in year 10 is 20% instead of 25%", levers: { revenueYear10: 9070 } }
      bands:
        - { id: under-half, label: "Less than half", max: 0.5 }
        - { id: between, label: "Between half and double", min: 0.5, max: 2 }
        - { id: over-double, label: "More than double", min: 2 }

  - id: s11-q-riders
    kind: direction
    prompt: "July 2014: Damodaran sums up Gurley's story: Uber brings in mass-transit riders and suburban people who never took taxis. Which lever moves, and which way?"
    skill: s11-story-levers
    choices:
      - { id: size-up, text: "How big it gets, up" }
      - id: keeps-up
        text: "What it keeps, up"
        mistake: { tag: lever_mixup, fix: "New riders change how much Uber sells, not its profit on each sale." }
      - id: risk-down
        text: "How risky it is, down"
        mistake: { tag: lever_mixup, fix: "More riders make the market bigger, which is size; risk is a separate lever." }
    answer: size-up
    explanation: "New kinds of riders widen the market Uber can win, so its revenue in a future year can be bigger."
    source: >
      Gurley, How to Miss By a Mile (11 Jul 2014), https://abovethecrowd.com/2014/07/11/how-to-miss-by-a-mile-an-alternative-look-at-ubers-potential-market-size/ ;
      Damodaran, Possible, Plausible and Probable (16 Jul 2014), https://aswathdamodaran.blogspot.com/2014/07/possible-plausible-and-probable-big.html

  - id: s11-q-slice
    kind: direction
    prompt: "December 2014: Damodaran says that if Uber moves into moving and local delivery, rivals there fight harder on price. Which way does the slice of each fare Uber takes move?"
    skill: s11-story-levers
    choices:
      - { id: down, text: "Down: harder rivals leave Uber a smaller slice" }
      - id: up
        text: "Up: a bigger market brings a bigger slice"
        mistake: { tag: size_for_slice, fix: "A bigger market is size. Rivals fighting on price shrink the slice of each sale." }
      - id: fixed
        text: "It stays the same whatever the market"
        mistake: { tag: slice_fixed, fix: "The slice is a choice in the story; where rivals are stronger, it is smaller." }
    answer: down
    explanation: "A wider market and the slice taken pull against each other: entering logistics means accepting a smaller slice of each sale."
    source: >
      Damodaran, Up, up and away! A crowd-valuation of Uber! (2 Dec 2014),
      https://aswathdamodaran.blogspot.com/2014/12/up-up-and-away-crowd-valuation-of-uber.html

  - id: s11-q-hold
    kind: cannot_hold
    prompt: "Which story contradicts itself?"
    skill: s11-story-holds
    choices:
      - { id: local-global, text: "Uber's edge is local, city by city, yet it wins 40% of the whole world's market" }
      - id: city-modest
        text: "Uber stays mostly a city car service and wins a significant but modest share"
        mistake: { tag: dull_is_fine, fix: "A modest story can still hold together. A global share from a local edge cannot." }
      - id: delivery-smaller
        text: "Uber moves into delivery and accepts a smaller slice of each fare"
        mistake: { tag: fit_as_clash, fix: "A smaller slice where rivals fight harder is the story holding together." }
    answer: local-global
    explanation: "Shorter waits and denser coverage help Uber one city at a time; a dominant global share needs an edge that crosses cities."
    source: >
      Damodaran, Possible, Plausible and Probable (16 Jul 2014), on local against global networking effects,
      https://aswathdamodaran.blogspot.com/2014/07/possible-plausible-and-probable-big.html

  - id: s11-q-pricevalue
    kind: price_or_value
    prompt: "June 2014: venture investors put $1.2 billion into Uber at $17 billion before the new money. Is the $17 billion about a price or a value?"
    skill: s11-story-holds
    choices:
      - { id: price, text: "A price" }
      - id: value
        text: "A value"
        mistake: { tag: price_for_value, fix: "What investors paid in a deal is a price. A value is argued from Uber's own story and its future cash." }
    answer: price
    explanation: "A funding round is what buyers paid for a piece of the company, which is a price, however careful the buyers are."
    source: >
      Uber blog, 4 Years In (6 Jun 2014), http://web.archive.org/web/20140606180823/http://blog.uber.com/4years

checks:
  - id: s11-check
    kind: quiz
    questions: [s11-q-lever, s11-q-price, s11-q-predict, s11-q-riders, s11-q-slice, s11-q-hold, s11-q-pricevalue]
    perAttempt: 4
    passRule: { correct: 3 }
    card:
      title: "A story sets the numbers"
      lines:
        - "A valuation starts as a story about what the company becomes."
        - "The market, the share it wins and the slice of each fare it takes set how big it gets."
        - "Its edge sets what it keeps; what growth costs and how risky it is set the rest."
        - "A price is what investors pay; a value is argued from the story's numbers."
      writeDown: "Story first, then numbers, and every number must fit the story."
      skills: [s11-story-levers, s11-story-holds]
    quickTries:
      - id: s11-try-levers-half
        skill: s11-story-levers
        ask: "December 2014: Uber now runs a delivery service in New York. Which lever moves?"
        halfDone: "First step, done for you: parcels are a new kind of sale, so the market Uber can serve grows."
        kind: choice
        answer: size
        choices:
          - { id: size, text: "How big it gets" }
          - { id: risk, text: "How risky it is", mistake: { tag: lever_mixup, fix: "A new kind of sale widens the market: that is size, not risk." } }
      - id: s11-try-levers-slice
        skill: s11-story-levers
        ask: "Drivers are paid more of each fare, so Uber takes a smaller slice. Which lever moves, and which way?"
        kind: choice
        answer: size-down
        choices:
          - { id: size-down, text: "How big it gets, down: a smaller slice is less revenue" }
          - { id: risk-up, text: "How risky it is, up", mistake: { tag: lever_mixup, fix: "The slice is part of revenue: a smaller slice of the same fares is less revenue." } }
          - { id: keeps-down, text: "What it keeps, down", mistake: { tag: slice_for_margin, fix: "The slice is revenue, so it sits in how big it gets; what it keeps is the profit left after costs." } }
      - id: s11-try-levers-computed
        skill: s11-story-levers
        kind: which_lever
        ask: "From the sheet's opening story, which change lifts the value most?"
        computed:
          case: s11-uber-2014-inputs
          changes:
            - { id: slice, label: "Slice 15% to 20%", levers: { revenueYear10: 15116 } }
            - { id: reinvest, label: "Sales to capital 5 to 10", levers: { salesToCapital: 10 } }
            - { id: risk, label: "Cost of capital 12% to 10% while it grows", levers: { costOfCapitalGrowing: 10 } }
      - id: s11-try-holds-half
        skill: s11-story-holds
        ask: "Uber's edge is local, city by city. A reader sets a 40% share of the whole world's market. Does that story hold?"
        halfDone: "First step, done for you: a local edge helps Uber win one city at a time."
        kind: choice
        answer: no-hold
        choices:
          - { id: no-hold, text: "No: a global share needs an edge that crosses cities" }
          - { id: holds, text: "Yes: enough strong cities add up to the world", mistake: { tag: local_as_global, fix: "Each city is a separate fight with local rivals; winning one does not win the next." } }
      - id: s11-try-holds-slice
        skill: s11-story-holds
        ask: "Which story holds together?"
        kind: choice
        answer: smaller-slice
        choices:
          - { id: smaller-slice, text: "Uber moves into delivery and takes a smaller slice of each fare" }
          - { id: full-slice, text: "Uber moves into moving and delivery and still takes 20% of every fare", mistake: { tag: slice_kept, fix: "Where rivals fight harder on price, the slice shrinks; taking it whole pulls against the bigger market." } }
      - id: s11-try-holds-value
        skill: s11-story-holds
        ask: "Damodaran runs Gurley's story through his spreadsheet and gets $53.4 billion. Is that a price or a value?"
        kind: choice
        answer: value
        choices:
          - { id: value, text: "A value" }
          - { id: price, text: "A price", mistake: { tag: value_for_price, fix: "Nobody paid $53.4 billion: it is argued from a story, so it is a value." } }

  - id: s11-talk
    kind: conversation
    prompt: >
      July 2014: Bill Gurley's story is that Uber's market is many times bigger than city cars, because cheaper,
      quicker rides bring in new riders. Judge it in two or three sentences: which lever does his story move, which
      of its settings is the least sure, and does it still hold together if Uber's edge stays local, city by city?
    passCriteria: >
      Names the market as the lever Gurley's story moves and ties it to a part of the story (new
      riders, cheaper and quicker rides); says which setting is the least sure or pulls against
      another, with a reason (for example a local, city-by-city edge against a big share of a world
      market); treats a value far from the talk of the day as a different story, not as an error in
      the arithmetic.
    skills: [s11-story-levers, s11-story-holds]
