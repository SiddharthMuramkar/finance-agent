# Valuing Indian companies, currency and country risk: a foundation Topic taught through Coffee Day's IPO price in 2015.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
# Case sources (checked): Coffee Day Enterprises prospectus (SEBI-hosted, 19 Oct 2015): https://www.sebi.gov.in/sebi_data/attachdocs/1446117779846.pdf ; Reuters in Business Standard (21 Oct 2015): https://www.business-standard.com/article/markets/coffee-day-prices-ipo-at-upper-end-of-range-115102101210_1.html ; Reuters, Indian FX/debt factors to watch (23 Oct 2015); US Treasury daily par yield curve 2015; Business Standard (13 Oct 2015, CPI); Hindustan Times, Times of India and Bloomberg (2 Nov 2015); Damodaran, January 2016 Data Update 3: Country Risk and Pricing; Damodaran, Country Risk (Library): https://www.stern.nyu.edu/~adamodar/pdfiles/papers/CountryRisk.pdf
id: val-india
title: Valuing Indian companies, currency and country risk

cases:
  - id: coffee-day-rupee-valuation-2015
    title: Coffee Day's IPO, in rupees and in dollars
    data:
      - issue-price
      - post-issue-shares
      - revenue-fy15
      - finance-costs-fy15
      - net-loss-fy15
      - india-10-year-yield
      - us-10-year-yield
      - rupee-per-dollar
      - india-cpi-inflation
    asOf: 2015-10-22
    story: >
      On 21 October 2015 Coffee Day Enterprises, the company behind Cafe Coffee Day, priced its
      initial public offering at Rs 328 a share, the top of its Rs 316 to 328 range, raising Rs
      1,150 crore. After the issue it will have 206,001,719 shares, so at the issue price the
      company is worth about Rs 6,757 crore, roughly 1 billion dollars. In the year to 31 March
      2015 its consolidated revenue was Rs 2,549 crore, it paid Rs 326 crore in finance costs and
      it made a net loss of Rs 87 crore. Everything it earns is in rupees. Two funds are
      considering the shares. A Mumbai fund thinks in rupees. A fund in New York thinks in dollars.
      On 22 October the rupee is at 65.12 to the dollar and the 10-year Indian government bond
      yields 7.58 percent, against 2.04 percent on a 10-year US Treasury (21 October). India's
      consumer price inflation in September was 4.41 percent. Moody's rates India's government
      debt Baa3, the lowest investment grade. Each fund wants a value for the shares and has to
      choose a discount rate. It is 22 October 2015. You are asked how each should do it, and whether they can agree.
    reveal: >
      The shares listed on 2 November 2015 at Rs 313 on the BSE and Rs 317 on the NSE, below the
      Rs 328 issue price, and closed at Rs 270.15 and Rs 270.45, down 17.6 percent. Whichever
      currency a fund had used, the market's first-day price was well below the issue price. The
      currency question did play out. The gap between the two bond yields (1.0758 / 1.0204,
      about 5.4 percent a year) pointed to a rupee falling from 65.12 to roughly 68.7 to the dollar
      within a year. By 20 January 2016 it had reached about 68. In his January 2016 update Damodaran gave
      India a Baa3 default spread of 2.44 percent, multiplied it by 1.34, the relative volatility of
      emerging market equities against bonds, for a country risk premium of 3.28 percent, and added
      it to a mature market premium of 6 percent. Rupee cash flows, a rupee discount rate and a
      country risk premium belong together; a dollar investor who ignores any of them will
      mis-price an Indian company.

concept: >
  A valuation is only consistent if the currency of the cash flows matches the currency of the
  discount rate. Rupee cash flows contain expected Indian inflation, so they must be discounted at
  a rupee rate, built from a rupee riskfree rate (the Indian government bond yield, if that
  government is treated as default free) plus a premium for risk. To value the same cash flows in
  dollars, convert them at the exchange rates the market expects and discount at a dollar rate. If
  riskless returns differ between two currencies because expected inflation differs, the
  currency with the higher rate is expected to lose value by about (1 + rupee rate) / (1 + dollar
  rate) - 1 a year. Done consistently, the two approaches give the same value. Country risk
  is a separate matter: investing in India carries risks of default, regulation and political
  change that a mature market does not. One common way to add it is a country risk premium
  (CRP): the country's default spread, taken from its sovereign rating, scaled up by the
  extra volatility of equities relative to bonds. The cost of equity is then riskfree rate +
  beta x (mature market premium + CRP). Choose where to put the risk (in the cash flows as
  probabilities of bad outcomes, or in the discount rate) but not in both.

principle: >
  Match currency to currency: rupee cash flows with a rupee discount rate, dollar with dollar,
  so inflation is counted once. Put country risk in one place only, and measure it, rather than
  adding a vague extra percentage.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Match rupee cash flows with a rupee discount rate, and dollar with dollar."
  - "See how a gap in expected inflation shows up in the expected path of the exchange rate."
  - "Measure country risk and put it in one place only."

questions:
  - id: vi-q-consistency
    prompt: >
      You forecast a company's cash flows in rupees, with prices rising at the rate you expect in India. Which discount rate is consistent with those cash flows?
    choices:
      - { id: a, text: "A rupee rate, built on the rupee riskfree rate, which includes expected Indian inflation" }
      - { id: b, text: "A dollar rate, built on the US Treasury yield", mistake: { tag: wrong_currency, fix: "A dollar rate carries US inflation, which does not match rupee cash flows." } }
      - { id: c, text: "Either one; the currency does not matter", mistake: { tag: currency_ignored, fix: "Currency matters: each rate carries its own country's inflation." } }
      - { id: d, text: "A rate of zero, because inflation is already in the cash flows", mistake: { tag: zero_rate, fix: "Money still has a time value. Match a rupee rate to rupee cash flows." } }
    answer: a
    explanation: >
      Rupee cash flows already include expected Indian inflation. A rupee rate includes the same inflation, so the two match. A dollar rate has US inflation in it, and mixing the currencies counts inflation wrongly.
    source: >
      Damodaran, Country Risk (Library), on consistency of currency in valuation: https://www.stern.nyu.edu/~adamodar/pdfiles/papers/CountryRisk.pdf

  - id: vi-q-depreciation
    prompt: >
      One-year riskless rates are 9 percent in rupees and 4 percent in dollars. Traders say the two investments are only equally attractive if the rupee is expected to do what over the year?
    choices:
      - { id: a, text: "Weaken against the dollar, by roughly the gap between the two rates" }
      - { id: b, text: "Strengthen against the dollar, because rupee interest is higher", mistake: { tag: rupee_strengthens, fix: "Higher rupee interest is paid because the rupee is expected to weaken, not strengthen." } }
      - { id: c, text: "Stay exactly flat", mistake: { tag: flat_rupee, fix: "If flat, rupee savers would simply win. The rate gap should be offset by expected weakening." } }
      - { id: d, text: "Weaken by the whole 9 percent rupee rate", mistake: { tag: used_whole_rate, fix: "Only the gap between the two rates matters, not the rupee rate alone." } }
    answer: a
    explanation: >
      The extra rupee interest is paid because the rupee is expected to fall. The expected fall is (1.09 / 1.04) - 1, about 4.8 percent. If the rupee fell less, the rupee investment would be better; if more, worse.
    source: >
      Damodaran, Country Risk (Library), on riskfree rates in different currencies and inflation differentials: https://www.stern.nyu.edu/~adamodar/pdfiles/papers/CountryRisk.pdf

  - id: vi-q-crp
    prompt: >
      An analyst values an Indian stock in rupees. Besides the rupee riskfree rate, she has a mature market equity risk premium of 5.5 percent and a country risk premium of 3.0 percent. How do the two premiums enter the cost of equity?
    choices:
      - { id: a, text: "The country premium replaces the mature one", mistake: { tag: replaced_premium, fix: "The country premium is an extra layer on top of the mature one, not a replacement." } }
      - { id: b, text: "Both sit on top of the riskfree rate, scaled by the stock's beta, so country risk raises the cost of equity" }
      - { id: c, text: "The country premium is taken off, because India is growing fast", mistake: { tag: subtracted_country_risk, fix: "Country risk is extra danger, so it raises the cost of equity and never lowers it." } }
      - { id: d, text: "Neither: the riskfree rate alone is the cost of equity", mistake: { tag: riskfree_only, fix: "The riskfree rate is only the floor. Premiums add the reward for risk." } }
    answer: b
    explanation: >
      Cost of equity = riskfree rate + beta x (mature premium + country risk premium). With a beta of 1 that is 7.5% + 5.5% + 3.0% = 16.0 percent: country risk is added on top, in one place only.
    source: >
      Damodaran, Country Risk (Library), the country risk premium approach: https://www.stern.nyu.edu/~adamodar/pdfiles/papers/CountryRisk.pdf

  - id: vi-q-crp-method
    prompt: >
      In the scaled default spread method, analysts start from a country's sovereign default spread of 2.0 percent. Its equities are 1.5 times as volatile as its government bonds. How do they turn the spread into a country risk premium for equities?
    choices:
      - { id: a, text: "Use the spread as it stands, since it already measures country risk", mistake: { tag: unscaled_spread, fix: "Equities swing more than bonds, so the spread is scaled up for them." } }
      - { id: b, text: "Scale it down, because shares are less risky than bonds", mistake: { tag: scaled_down, fix: "Shares are riskier than bonds, so the spread is scaled up, not down." } }
      - { id: c, text: "Scale it up, because equities are more volatile than government bonds" }
      - { id: d, text: "Add the stock market's past average return to it", mistake: { tag: added_history, fix: "No history is added. The spread is only scaled by relative volatility." } }
    answer: c
    explanation: >
      Country risk premium = default spread x (volatility of equities / volatility of bonds). With a 2.0 percent spread and equities 1.5 times as volatile, the premium works out to 3.0 percent.
    source: >
      Damodaran, Country Risk (Library): https://www.stern.nyu.edu/~adamodar/pdfiles/papers/CountryRisk.pdf

  - id: vi-q-consistent
    prompt: >
      An analyst converts rupee cash flows into dollars using the exchange rates implied by the two currencies' riskfree rates, then discounts them at a dollar rate. Compared with discounting the rupee cash flows at a rupee rate, the value should be:
    choices:
      - { id: a, text: "About the same, if both are done consistently" }
      - { id: b, text: "Much higher, because dollar rates are lower", mistake: { tag: ignored_conversion, fix: "The lower dollar rate is offset by cash flows that shrink as the rupee is expected to fall." } }
      - { id: c, text: "Much lower, because the rupee is expected to fall", mistake: { tag: double_counted_fall, fix: "The expected fall is already offset by the lower dollar rate. Count it once." } }
      - { id: d, text: "Impossible to compare", mistake: { tag: cannot_compare, fix: "Both routes can be compared, and consistent ones agree." } }
    answer: a
    explanation: >
      The lower dollar rate is offset by the lower value of the converted cash flows as the rupee is expected to fall, in proportion to the difference between the two riskfree rates. Both routes give the same value; mixing the routes is the mistake.
    source: >
      Damodaran, Country Risk (Library): https://www.stern.nyu.edu/~adamodar/pdfiles/papers/CountryRisk.pdf

checks:
  - id: vi-quiz-india
    kind: quiz
    questions:
      - vi-q-consistency
      - vi-q-depreciation
      - vi-q-crp
      - vi-q-crp-method
      - vi-q-consistent
    perAttempt: 3
    passRule:
      correct: 2
  - id: vi-two-funds
    kind: conversation
    prompt: >
      A Mumbai fund values an Indian company in rupees and a New York fund values it in dollars.
      On 22 October 2015 the rupee riskfree rate is about 7.6 percent and the dollar rate about
      2.0 percent. Explain how each should choose its discount rate, why they can still reach the
      same value, and where country risk should go.
    passCriteria: >
      The Learner explains that cash flows and discount rate must be in the same currency: rupee
      flows with a rupee rate, dollar flows with a dollar rate. They say the rate difference
      mostly reflects expected inflation, so a dollar investor converting rupee flows should
      expect the rupee to weaken, and done consistently both funds reach about the same value. They
      say country risk is an extra premium on the cost of equity (or an adjustment to the cash
      flows) but should be counted in one place only, not both, and not by adding an unexplained
      percentage.
