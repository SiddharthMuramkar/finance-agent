questions:
  - id: fl-q-credit-sale
    prompt: >
      A company makes a sale on credit, to be paid next quarter. What do the statements show this quarter?
    choices:
      - { id: a, text: "Revenue and receivables go up; operating cash flow is unchanged" }
      - { id: b, text: "Revenue and cash both go up", mistake: { tag: credit_sale_cash_now, fix: "On credit, the customer has not paid yet, so no cash has come in." } }
      - { id: c, text: "Only the balance sheet changes, with cash up", mistake: { tag: only_balance_sheet, fix: "The sale is revenue now, so the income statement changes too, and cash has not moved." } }
      - { id: d, text: "Nothing, until the customer pays", mistake: { tag: wait_for_cash, fix: "That is cash accounting. Accrual accounting records the sale when it is earned." } }
    answer: a
    explanation: >
      Under accrual accounting the sale is revenue now. The customer owes the money, so receivables rise; no cash has arrived, so operating cash flow does not rise.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 4.1 Cash versus Accrual Accounting: https://openstax.org/books/principles-finance-2e/pages/4-1-cash-versus-accrual-accounting

  - id: fl-q-cash-change
    prompt: >
      Cash at the start and the end of a year both sit on the balance sheet. Which three kinds of cash flow on the cash flow statement explain the change?
    choices:
      - { id: a, text: "Operating, investing and financing" }
      - { id: b, text: "Revenue, costs and tax", mistake: { tag: income_lines_for_cash, fix: "Those are income statement lines. The cash flow statement groups cash into operating, investing and financing." } }
      - { id: c, text: "Assets, liabilities and equity", mistake: { tag: balance_sheet_for_cash, fix: "Those are the balance sheet's three parts, not the cash flow statement's sections." } }
      - { id: d, text: "Receivables, inventory and payables", mistake: { tag: adjustments_for_sections, fix: "Those are adjustments inside operating cash flow, not the three sections." } }
    answer: a
    explanation: >
      The change in cash is the total of operating, investing and financing cash flows. The ending cash must equal the cash on the balance sheet.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.5 The Statement of Cash Flows: https://openstax.org/books/principles-finance-2e/pages/5-5-the-statement-of-cash-flows

  - id: fl-q-addback
    prompt: >
      On the indirect method, which of these is added back to net income to reach operating cash flow?
    choices:
      - { id: a, text: "Depreciation expense" }
      - { id: b, text: "Dividends paid", mistake: { tag: dividends_in_operating, fix: "Dividends are financing, not an add-back in operating cash flow." } }
      - { id: c, text: "Purchases of equipment", mistake: { tag: capex_in_operating, fix: "Equipment purchases are investing outflows." } }
      - { id: d, text: "Repayment of a loan", mistake: { tag: loan_in_operating, fix: "Loan repayments are financing outflows." } }
    answer: a
    explanation: >
      Depreciation reduced net income but cost no cash in the period, so it is added back. Dividends and loan repayments are financing; equipment purchases are investing.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.5 The Statement of Cash Flows, operating activities: https://openstax.org/books/principles-finance-2e/pages/5-5-the-statement-of-cash-flows

  - id: fl-q-error-all-three
    prompt: >
      By mistake, a clerk leaves out a real cash sale, paid for in full that day. Which statement is true as a result?
    choices:
      - { id: a, text: "All three statements are off: profit, cash and operating cash flow are each too low" }
      - { id: b, text: "Only the income statement is affected", mistake: { tag: error_in_one_statement, fix: "The left-out sale also leaves retained earnings and cash too low on the balance sheet, and operating cash flow too low." } }
      - { id: c, text: "Only the balance sheet is affected", mistake: { tag: error_balance_only, fix: "The left-out revenue also leaves profit too low on the income statement." } }
      - { id: d, text: "Only the cash flow statement is affected", mistake: { tag: error_cash_only, fix: "The left-out revenue also leaves profit too low, and the cash it brought in is left off the balance sheet." } }
    answer: a
    explanation: >
      The left-out revenue leaves net income too low (income statement). Retained earnings and cash in assets are too low by the same profit and cash (balance sheet). Operating inflows are too low by that cash (cash flow statement). One left-out entry spreads through the whole system.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 5.3 The Relationship between the Balance Sheet and the Income Statement: https://openstax.org/books/principles-finance-2e/pages/5-3-the-relationship-between-the-balance-sheet-and-the-income-statement

  - id: fl-q-depreciation
    prompt: >
      A company pays cash for a machine with a five-year life, using straight-line depreciation. In the first year, which statement is true?
    choices:
      - { id: a, text: "Depreciation lowers net income but costs no cash that year; the purchase is an investing outflow" }
      - { id: b, text: "The whole price lowers net income in the first year", mistake: { tag: all_expensed_year_one, fix: "Depreciation spreads the price over the machine's life, one share each year." } }
      - { id: c, text: "Depreciation lowers operating cash flow each year", mistake: { tag: depreciation_costs_cash, fix: "Depreciation costs no cash that year. The cash went out at purchase, under investing." } }
      - { id: d, text: "Nothing changes on the income statement", mistake: { tag: no_income_effect, fix: "Depreciation is an expense each year, so it lowers net income." } }
    answer: a
    explanation: >
      Straight-line depreciation spreads the price evenly over the machine's life, an expense that lowers net income. It costs no cash in the year, so it is added back in operating cash flow. The cash was paid at purchase and shows under investing activities.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 4.4 When Should a Company Capitalize or Expense an Item: https://openstax.org/books/principles-finance-2e/pages/4-4-when-should-a-company-capitalize-or-expense-an-item and 5.5 The Statement of Cash Flows.

  - id: fl-q-accrual
    prompt: >
      What do accountants call recording revenue when it is earned, even if the cash comes later?
    choices:
      - { id: a, text: "Accrual accounting" }
      - { id: b, text: "Cash accounting", mistake: { tag: cash_for_accrual, fix: "Cash accounting records revenue only when the money arrives." } }
      - { id: c, text: "Depreciation", mistake: { tag: depreciation_for_accrual, fix: "Depreciation spreads the price of a big purchase over its life." } }
      - { id: d, text: "Operating margin", mistake: { tag: margin_for_accrual, fix: "Operating margin is operating profit as a share of revenue, not a way of recording sales." } }
    answer: a
    explanation: >
      Accrual accounting records revenue when it is earned and costs when they are incurred, whether or not cash moves.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 4.1 Cash versus Accrual Accounting: https://openstax.org/books/principles-finance-2e/pages/4-1-cash-versus-accrual-accounting

  - id: fl-q-receivables
    prompt: >
      A customer buys on credit and will pay later. What do analysts call the money owed?
    choices:
      - { id: a, text: "Receivables, or debtors" }
      - { id: b, text: "Payables", mistake: { tag: payables_for_receivables, fix: "Payables are what the company owes its suppliers." } }
      - { id: c, text: "Retained earnings", mistake: { tag: retained_for_receivables, fix: "Retained earnings is profit kept in the business, not money owed by a customer." } }
      - { id: d, text: "Revenue", mistake: { tag: revenue_for_receivables, fix: "Revenue is the sale itself. The unpaid amount sits on the balance sheet as a receivable." } }
    answer: a
    explanation: >
      Money customers owe for sales already made is a receivable, which Indian companies often call debtors. It is a current asset.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 4.1 Cash versus Accrual Accounting: https://openstax.org/books/principles-finance-2e/pages/4-1-cash-versus-accrual-accounting

  - id: fl-q-cooked
    prompt: >
      What do analysts call operating profit as a share of revenue?
    choices:
      - { id: a, text: "Operating margin" }
      - { id: b, text: "Accrual accounting", mistake: { tag: accrual_for_margin, fix: "Accrual accounting is about when revenue and costs are recorded, not how much of the revenue is profit." } }
      - { id: c, text: "Depreciation", mistake: { tag: depreciation_for_margin, fix: "Depreciation is an ordinary expense that spreads out a big purchase." } }
      - { id: d, text: "Capital spending", mistake: { tag: capex_for_margin, fix: "Capital spending is money spent on long-term assets such as machines." } }
    answer: a
    explanation: >
      Operating margin is operating profit as a share of revenue: how much of each rupee of sales is left after running costs. A profit reported on the income statement should also show up on the balance sheet and the cash flow statement.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 6.6 Profitability Ratios and the DuPont Method: https://openstax.org/books/principles-finance-2e/pages/6-6-profitability-ratios-and-the-dupont-method

checks:
  - id: fl-quiz-links
    kind: quiz
    questions:
      - fl-q-credit-sale
      - fl-q-cash-change
      - fl-q-addback
      - fl-q-error-all-three
      - fl-q-depreciation
      - fl-q-accrual
      - fl-q-receivables
      - fl-q-cooked
      - bank:eab:MBA-ACC-FA-0024
    perAttempt: 3
    passRule:
      correct: 2
  - id: fl-satyam-trace
    kind: conversation
    prompt: >
      A company reports an operating profit of Rs 649 crore for a quarter on revenue of Rs 2,700
      crore. Explain how that profit should appear on the income statement, the balance sheet and
      the cash flow statement. Then name two places you would look for a mismatch if the profit
      were not real.
    passCriteria: >
      The Learner says the profit is the bottom of the income statement; on the balance sheet it
      increases retained earnings and shows up as higher cash or higher receivables; and on the
      cash flow statement net income is the starting line, adjusted for non-cash items and for
      changes in receivables, with ending cash equal to the balance sheet cash. They name two
      mismatches, for example: profit not turning into operating cash flow (growing receivables
      or low cash conversion), ending cash that does not tie across the statements, or profit
      and balances that independent evidence does not support.
