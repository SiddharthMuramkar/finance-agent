# How the three statements link (accrual accounting): a foundation Topic taught through a short Case.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
id: fs-links
title: How the three statements link (accrual accounting)
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: satyam-links-2008
    title: Satyam's reported profit and cash (December 2008)
    data: [q2-revenue-reported, q2-operating-profit-reported, q2-revenue-actual, q2-operating-profit-actual]
    asOf: 2008-12-31
    story: >
      Satyam Computer Services, a Hyderabad software services company, reported for the quarter
      ended 30 September 2008 revenue of Rs 2,700 crore and an operating profit of Rs 649 crore,
      an operating margin of 24 per cent. Its balance sheet at that date showed cash and bank
      balances of Rs 5,361 crore and debtors (money owed by customers) of Rs 2,651 crore. In
      December 2008 investors force it to call off a planned purchase of two construction
      companies partly owned by its founders. As of 31 December 2008, you are asked a single
      question: if those profit figures were real, how would they have to show up on all three
      statements, and where would you look for a mismatch if they were not?
    reveal: >
      On 7 January 2009 the chairman, B. Ramalinga Raju, wrote that for the September quarter the
      company had reported revenue of Rs 2,700 crore and operating profit of Rs 649 crore (a 24 per
      cent margin), against actual revenue of Rs 2,112 crore and an actual operating profit of Rs 61
      crore (a 3 per cent margin). The difference of Rs 588 crore (649 - 61) was shown as cash: "artificial
      cash and bank balances going up by Rs 588 crore in Q2 alone". The US SEC later said Satyam's
      managers created more than 6,000 phony invoices and bogus bank statements, giving more than
      1 billion dollars of fictitious cash, about half of total assets; Satyam paid a 10 million
      dollar penalty to settle. A single false profit had to appear in the general ledger and the
      financial statements, which is also why the fraud needed false bank statements to hold it together.

concept: >
  The three statements are one system. Under accrual accounting, revenue is recorded when it is
  earned and expenses when they are incurred, whether or not cash moves. A sale on credit raises
  revenue (income statement) and receivables (balance sheet), and brings no cash until the customer
  pays. Net income flows into retained earnings in equity on the balance sheet, and it is the first
  line of the cash flow statement, which then adjusts it for non-cash items (such as depreciation)
  and changes in receivables, inventory and payables. The ending cash on the cash flow statement
  must equal the cash on the balance sheet. So a profit has to turn up in more than one place.

principle: >
  Follow every profit around the loop. If the income statement says money was earned, then
  receivables or cash must have grown on the balance sheet and the cash flow statement must
  agree. A number that appears on one statement and not on the others, or that never turns into
  collected cash, deserves suspicion.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "See how the income statement, balance sheet and cash flow statement fit together."
  - "Follow a profit around all three statements."
  - "Spot a profit that never turns into collected cash."

# Written for the story-first spec (E6b): terms, a Running example and scenes, and questions that ask about the story and the words (ADR 0009).
exampleCurrency: INR
runningExample:
  text: "A tailor sells ₹8,000 of suits on credit this month."
  numbers: [8000]
  scene:
    cast:
      - { id: ravi, emoji: man, name: Ravi, role: tailor }
      - { id: asha, emoji: woman, name: Asha, role: customer }
    beats:
      - { who: narrator, says: "Ravi sews suits for Asha and writes ₹8,000 of sales today.", emoji: receipt }
      - { who: asha, says: "I will pay you next month.", emoji: calendar }
      - { who: narrator, says: "Sales are up and receivables are up. No cash has come in yet.", emoji: hourglass-not-done }

terms:
  - term: accrual accounting
    means: Recording revenue when it is earned and costs when they are incurred, whether or not cash moves.
    pro: Companies report on an accrual basis.
    example: "You teach a class in March; the ₹5,000 fee arrives in April, but March still counts it."
    emoji: calendar
    inStory: Satyam's quarter showed revenue of Rs 2,700 crore and debtors of Rs 2,651 crore.
  - term: receivables
    means: Money customers owe the company for sales already made but not yet paid.
    pro: Indian companies call receivables debtors.
    example: "A tailor's ₹8,000 of suits that customers will pay for next month."
    emoji: receipt
    inStory: Satyam's balance sheet showed debtors of Rs 2,651 crore.
  - term: the three statements
    means: "The income statement, balance sheet and cash flow statement: three views of one set of accounts."
    pro: Analysts check that the three statements tie together.
    example: "Your marks, attendance and fee receipt must all tell one story about you."
    emoji: notebook
    inStory: The analyst asks where Satyam's profit would show up on all three statements.
  - term: operating margin
    means: Operating profit as a share of revenue, showing how much of each rupee of sales is left after running costs.
    pro: Analysts compare operating margins across companies.
    example: "A tea stall keeps ₹20 of every ₹100 of sales after paying for milk, tea and rent."
    emoji: bar-chart
    inStory: Satyam reported an operating margin of 24 per cent for the September quarter.
  - term: general ledger
    means: The company's master record of every entry, from which the three statements are built.
    pro: Everything flows from the general ledger.
    example: "A household notebook where every rupee in and out is written down once."
    emoji: ledger
    inStory: Any profit Satyam reported would be written in its ledger first.

