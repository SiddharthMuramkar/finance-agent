# Analyse: decide between writers, taught by sorting the claims in a published two-writer debate.
# Case sources (checked 2 Nov 2026): Forbes, 12 Jun 2000, 'Henry Blodget Debates Jeremy Grantham' (copy on Damodaran's site);
# Yahoo! first-quarter 2000 release, 5 Apr 2000 (SEC EDGAR exhibit 99.1); Nasdaq year-end 1999 release; NPR, WSJ and Reuters, 23 Apr 2015;
# Reuters 21 May 2007 and CNBC 13 Jul 2007 for the S&P 500; SEC press release 2003-56 and Litigation Release 18115.
# The same debate is also the Case of the foundation Topic mkt-efficiency, which asks a different question (is the market efficient?). This Topic never asks it again.
# No Case Data: the Case is a set of claims, not a chart.
id: ana-decide-between
title: "Analyse: decide between writers, facts versus framing"

cases:
  - id: forbes-claims-sorted-2000
    title: Two investors, one market, and what each claim is made of
    asOf: 2000-06-12
    story: >
      On 12 June 2000 Forbes published an edited debate that it had staged in early May between
      two investors. Henry Blodget, 34, was the lead internet analyst at the investment bank Merrill
      Lynch. Jeremy Grantham, 61, was at the Boston money manager Grantham, Mayo, Van Otterloo and
      was described by Forbes as value-oriented. The Nasdaq Composite, the index of mostly technology
      shares, had closed 1999 at 4,069.31, a rise of 85.59% on the year according to the Nasdaq
      itself. It had set a record close of 5,048.62 on 10 March 2000 and had fallen sharply since.
      Here is what each man said, in the order a reader meets it.
      Blodget. (B1) The Nasdaq rose 83% in 1999 and is still up 40% over the past year.
      (B2) Valuation matters less while an industry is young and more as it matures, and the
      internet is maturing. (B3) Probably 75% of the new internet companies will disappear, but the
      best, such as Yahoo, will keep growing for ten years. (B4) Yahoo is now a $70 billion company
      selling at 340 times earnings; it was cheap when it listed. (B5) A fund manager measured
      against the S&P 500 index risks the job by not owning Yahoo and AOL, which have just joined
      it, so one cannot judge each stock purely on discounted cash flow.
      Grantham. (G1) At the end of February the combined stock-market value of the internet
      sector, defined to include Cisco and AOL, was $1.2 trillion against negative earnings of $2.5
      billion. (G2) The S&P 500 index is at about 30 times earnings, and stories about Yahoo and AOL
      are used to excuse that price for the whole market, which is a fallacy of composition. (G3) 80%
      of these companies will cease to exist. (G4) From their highs the S&P 500 will fall 50%, the
      Nasdaq 70% and the Nasdaq shares without earnings 80%, sooner or later. (G5) Excuses for high
      prices follow bubbles, not the other way round.
      Two more facts were public by 12 June. On 5 April 2000 Yahoo reported first-quarter net income
      of $77.9 million, $0.13 a share diluted, which included a one-off $40.7 million gain from
      exchanging investments. It also reported a pro forma net income of $63.3 million, $0.10 a
      share, which leaves out that gain and several charges. Both figures are on 613.1 million
      diluted shares.
      Your job today is to decide between the two writers' arguments using only what was known on 12
      June 2000, never to guess what happened afterwards. Sort B1 to B5 and G1 to G5 into checkable
      facts, definitions that need pinning down, forecasts, and framing. Say where each checkable
      claim could be looked up. Then say which argument is better supported and what you
      still could not know.
    reveal: >
      The Nasdaq Composite closed at 1,114.11 on 9 October 2002 by one count (an intraday low of 1,108.49 is also quoted),
      more than 75% below its March 2000 record, and did not close above that record again until 23
      April 2015, when it ended at 5,056.06. The S&P 500 went from its record close of 1,527.46 on 24
      March 2000 to a closing low of 776.76 on 9 October 2002, a fall of about 49%. So Grantham's sizes
      (S&P 500 down 50%, Nasdaq down 70%) landed close to the result, and the Nasdaq fell somewhat
      more than he said; his 'sooner or later' turned out to be two and a half years, not an instant.
      The reveal does not settle every claim. The share of new internet companies that disappeared (B3,
      G3) was not counted for this Case, so it stays untested here. Blodget's 83% (B1) was within three points of the
      Nasdaq's own 85.59%, and his 340 times (B4) could not be reproduced from Yahoo's April release (about 225 times
      on reported earnings and about 277 times on pro forma earnings, annualised, at $70 billion), so
      its gap lay in the price date and the earnings definition, which a careful reader could
      have asked about on the day. B5 was an observation about incentives, which index levels
      neither prove nor disprove. A separate fact is that on 28 April 2003 Blodget settled SEC and
      industry charges, without admitting or denying them, that some of his research on other
      internet companies (the SEC named GoTo.com) expressed views inconsistent with what he said
      privately; he was barred from the securities industry and paid $4 million. That concerned
      particular reports, not the Forbes debate, but it shows why a reader asks what a writer's
      employer gains from a view. The lesson is the order of the work: check the facts and the
      definitions first, judge the forecasts by their reasoning, notice the framing, and only then
      let the outcome grade the forecasts, not the whole man.

concept: >
  Deciding between writers is not picking a side. Take each piece apart into four kinds of
  statement. A fact can be checked against a named source at a stated date (an index level, a
  reported profit). A definition says which measure is meant: 'earnings' may be reported, adjusted or
  pro forma, 'up 40%' depends on the start date, and a 'times earnings' figure depends on both
  the price date and the earnings used, so the first job is to check it against a stated
  definition. A forecast says what will happen; it cannot be checked today, so judge its reasoning,
  whether it gives a size and a time, and whether the writer says what would prove them wrong. Framing is
  the choice of which true facts to show and how: the starting point of a percentage change, a
  sum shown without its parts, a comparison that flatters one side, and the writer's own
  incentives (an analyst at a bank that earns fees from the companies covered, or a fund
  that sells caution, may each lean one way). Professional codes ask exactly this of analysts:
  to distinguish fact from opinion and to keep independence and objectivity. When two writers
  disagree, mark where they dispute facts, where they use different definitions, and where they
  only forecast differently; most of a debate is usually in the last two. Then compare the
  arguments, not the reputations, and write down what you would need to see to change your mind.
  Only later does the outcome grade the forecasts, and even then a forecast can be right for the
  wrong reason or right on size and wrong on time.

principle: >
  Before choosing between two writers, sort every claim into fact, definition, forecast and
  framing. Check the numbers against a stated definition, judge forecasts by their reasoning,
  notice what each writer gains from the view, and let the outcome grade the forecasts afterwards,
  not the writer.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Sort a writer's claims into fact, definition, forecast and framing."
  - "Check a disputed number against a stated definition."
  - "Compare arguments rather than reputations, and notice what each writer gains from a view."

# Claude-written quiz questions; each answer was checked against the cited source (see docs/architecture.md).
questions:
  - id: adb-q-checkable
    prompt: >
      Which of these statements can a reader check against a published source on the day it is made?
    choices:
      - { id: a, text: "A company's latest quarterly release states a net income of $50 million" }
      - { id: b, text: "Most of the companies in this industry will be gone within five years", mistake: { tag: forecast_as_fact, fix: "A five-year forecast cannot be checked today; it is graded later." } }
      - { id: c, text: "Investors who ignore this sector are being reckless", mistake: { tag: judgement_as_fact, fix: "Calling investors reckless is a judgement, not something a source can confirm." } }
      - { id: d, text: "This index will be lower in three years than it is today", mistake: { tag: forecast_as_fact, fix: "A three-year forecast cannot be checked on the day." } }
    answer: a
    explanation: >
      A reported figure can be looked up in the company's own release. The other three are a forecast, a judgement about people and another forecast: each can be argued about now, but none can be checked against a source on the day.
    source: >
      CFA Institute, Code of Ethics and Standards of Professional Conduct, Standard V(B) (distinguish between fact and opinion in the presentation of investment analysis): https://www.cfainstitute.org/standards/professionals/code-ethics-standards/standards-of-practice-v-b

  - id: adb-q-forecast
    prompt: >
      A writer says a whole sector will be worth less in fifteen years than it is today, and gives a figure. How should a reader treat this on the day it is written?
    choices:
      - { id: a, text: "As a fact, if the writer is well known", mistake: { tag: fame_as_proof, fix: "Fame does not turn a forecast into a fact." } }
      - { id: b, text: "As a forecast: judge the reasoning, the size, the time and what would prove it wrong, and let the outcome grade it later" }
      - { id: c, text: "As framing only, so ignore it", mistake: { tag: forecast_as_framing, fix: "A forecast is a real claim to judge, not framing to ignore." } }
      - { id: d, text: "As a false statement, because the future cannot be known", mistake: { tag: future_as_false, fix: "A forecast is not false today; the outcome grades it later." } }
    answer: b
    explanation: >
      A forecast is an opinion about the future. It cannot be marked true or false on the day, but its reasoning, its specificity and its stated limits can be judged, and later events grade it.
    source: >
      CFA Institute, Code of Ethics and Standards of Professional Conduct, Standard V(B) (distinguish between fact and opinion in the presentation of investment analysis): https://www.cfainstitute.org/standards/professionals/code-ethics-standards/standards-of-practice-v-b

  - id: adb-q-pe-arithmetic
    prompt: >
      Blodget said Yahoo sold at '340 times earnings'. Take a simpler share: it sells for $60, and the company earned $0.50 a share over the last four quarters. Traders set the price against those past four quarters of earnings and quote it as one 'times earnings' figure. What do they call it?
    choices:
      - { id: a, text: "The dividend yield", mistake: { tag: wrong-ratio, fix: "Dividend yield sets the payout against the price, not the earnings." } }
      - { id: b, text: "The trailing price-to-earnings ratio, or trailing P/E" }
      - { id: c, text: "The forward price-to-earnings ratio", mistake: { tag: forward-vs-trailing, fix: "Forward P/E uses expected earnings; trailing uses the last four quarters." } }
      - { id: d, text: "The book value per share", mistake: { tag: wrong-ratio, fix: "Book value is what the accounts say the owners hold, not price against earnings." } }
    answer: b
    explanation: >
      Price per share set against earnings per share over the last four quarters is the trailing P/E. Here it works out at 120 times, the share price divided by $0.50.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 6.5 Market Value Ratios: https://openstax.org/books/principles-finance/pages/6-5-market-value-ratios

  - id: adb-q-which-earnings
    prompt: >
      Yahoo's April 2000 release gave two earnings figures, one with a one-off gain and one without. Here is the same puzzle in small: a share sells for $60. Reported earnings per share were $0.50, but $0.10 of that came from a one-off gain, so a writer quotes 'adjusted' earnings of $0.40. One writer says the stock sells at 120 times earnings and another says 150 times. What explains the difference?
    choices:
      - { id: a, text: "One of them has made an arithmetic error", mistake: { tag: blames-arithmetic, fix: "Both figures are right; each divides the same price by a different earnings number." } }
      - { id: b, text: "They divide the same price by different earnings: reported ($0.50) against adjusted ($0.40)" }
      - { id: c, text: "They use different prices", mistake: { tag: different-price, fix: "Both use the same $60 price; the earnings figure is what differs." } }
      - { id: d, text: "150 times is always the correct figure because adjusted earnings are cleaner", mistake: { tag: adjusted-always-right, fix: "Adjusted earnings are the company's choice; ask what was left out and why." } }
    answer: b
    explanation: >
      60 / 0.50 = 120 and 60 / 0.40 = 150. Both are correct arithmetic on different definitions of earnings. A reader asks which earnings were used, and why the writer chose them, before comparing two multiples.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 6.5 Market Value Ratios (P/E is market price divided by earnings per share, on trailing or forward earnings): https://openstax.org/books/principles-finance/pages/6-5-market-value-ratios

  - id: adb-q-reconcile
    prompt: >
      A US public company issues a press release quoting 'adjusted' earnings that leave out certain charges. Under the SEC's Regulation G, which of these must the release also contain?
    choices:
      - { id: a, text: "The most directly comparable GAAP measure and a reconciliation of the adjusted figure to it" }
      - { id: b, text: "An audit opinion on the adjusted figure", mistake: { tag: audit_for_reconcile, fix: "Regulation G asks for the GAAP measure and a reconciliation, not an audit opinion." } }
      - { id: c, text: "Nothing more, because adjusted figures are exempt", mistake: { tag: adjusted_exempt, fix: "Adjusted figures are not exempt: Regulation G covers them." } }
      - { id: d, text: "A forecast of next year's adjusted earnings", mistake: { tag: forecast_for_reconcile, fix: "The rule is about showing the GAAP figure now, not a forecast." } }
    answer: a
    explanation: >
      Regulation G requires a public company that releases a non-GAAP measure to present the most directly comparable GAAP measure and a reconciliation of the two. That lets a reader see exactly what was left out.
    source: >
      SEC, Conditions for Use of Non-GAAP Financial Measures (Release 33-8176, 2003): https://www.sec.gov/rules-regulations/2003/03/conditions-use-non-gaap-financial-measures

  - id: adb-q-multiple-fall
    prompt: >
      A market index sells at 30 times earnings. Earnings stay the same, but investors decide it deserves only 20 times. Which headline gets it right?
    choices:
      - { id: a, text: "The index falls, because its level moves in step with the multiple" }
      - { id: b, text: "The index stays put, because earnings did not change", mistake: { tag: ignores-multiple, fix: "The level is the multiple times earnings, so a lower multiple lowers it." } }
      - { id: c, text: "The index rises, because a smaller multiple means cheaper shares", mistake: { tag: reverses-multiple, fix: "A lower multiple means investors pay less for the same earnings, so the level falls." } }
      - { id: d, text: "The index cannot move unless earnings move first", mistake: { tag: earnings-only, fix: "Earnings are only one half of the level; the multiple is the other." } }
    answer: a
    explanation: >
      The index level is the multiple times earnings. With earnings fixed, a smaller multiple means a lower level: from 30 times to 20 times is a fall of about a third.
    source: >
      Own arithmetic on price = P/E x earnings per share; definition of P/E from OpenStax, Principles of Finance (CC BY-NC-SA), 6.5 Market Value Ratios: https://openstax.org/books/principles-finance/pages/6-5-market-value-ratios

  - id: adb-q-multiple-and-earnings
    prompt: >
      An index sells at 30 times earnings. A writer argues that the multiple will return to 20 times and, at the same time, that earnings will be a quarter lower. If both happen, how do the two changes combine?
    choices:
      - { id: a, text: "They stack: the level falls by more than either change would cause alone" }
      - { id: b, text: "Only the bigger change counts, and the smaller one is lost in it", mistake: { tag: ignores-second-change, fix: "Both changes act on the level, because it is the multiple times earnings." } }
      - { id: c, text: "They cancel, because a lower multiple makes up for lower earnings", mistake: { tag: cancels, fix: "Both push the level down, so each one deepens the other instead of offsetting it." } }
      - { id: d, text: "Only the multiple counts, because earnings are already in the price", mistake: { tag: earnings-priced-in, fix: "The level is multiple times earnings, so lower earnings lower it as well." } }
    answer: a
    explanation: >
      The level is the multiple times earnings, so the two changes multiply: both push the level down, and together they take it to about half of where it started. The example uses round hypothetical numbers.
    source: >
      Own arithmetic on price = P/E x earnings per share; definition of P/E from OpenStax, Principles of Finance (CC BY-NC-SA), 6.5 Market Value Ratios: https://openstax.org/books/principles-finance/pages/6-5-market-value-ratios

  - id: adb-q-starting-point
    prompt: >
      Blodget told Forbes the Nasdaq was 'still up 40%' over the past year, while it had also slid sharply from its March record. Picture one index that is up 40% on the year and down 20% from its peak two months ago. One writer says 'still up 40%'; another says 'down 20%'. Which best describes how the two writers differ?
    choices:
      - { id: a, text: "One of them is stating something false", mistake: { tag: both-true, fix: "Both figures are true; they just count from different starting dates." } }
      - { id: b, text: "Both are true and they choose different starting points, which is framing" }
      - { id: c, text: "The 40% is a forecast and the 20% is a fact", mistake: { tag: fact-vs-forecast, fix: "Both figures describe the past, so neither is a forecast." } }
      - { id: d, text: "They must be using different indices", mistake: { tag: same-index, fix: "One index can show both numbers, depending on the start date." } }
    answer: b
    explanation: >
      A percentage change depends on its starting date. Twelve months back and the last peak give different, equally true numbers. A reader asks which start date was chosen and why before treating either as the whole picture.
    source: >
      CFA Institute, Code of Ethics and Standards of Professional Conduct, Standard V(B) (use reasonable judgment in identifying the factors that are important and include them in communications): https://www.cfainstitute.org/standards/professionals/code-ethics-standards/standards-of-practice-v-b

  - id: adb-q-incentive
    prompt: >
      Two writers disagree about a market. Which question best helps a reader judge the framing of each view, as opposed to its facts?
    choices:
      - { id: a, text: "Which writer is more famous?", mistake: { tag: fame_for_framing, fix: "Fame says nothing about which facts a writer chose to show." } }
      - { id: b, text: "What does each writer's job and employer gain from this view, and which true facts would they have left out if the view were wrong?" }
      - { id: c, text: "Which writer predicts the bigger move?", mistake: { tag: size_for_framing, fix: "A bigger forecast tells you nothing about selection of facts." } }
      - { id: d, text: "Which writer uses more numbers?", mistake: { tag: numbers_for_framing, fix: "More numbers can still be a selected set; ask what the author gains." } }
    answer: b
    explanation: >
      Framing is the selection and presentation of true facts. Asking what a view is worth to its author, and what would count against it, exposes selection. Fame, the size of a forecast and the count of numbers say nothing about it. Professional codes treat independence and objectivity as a duty for this reason.
    source: >
      CFA Institute, Code of Ethics and Standards of Professional Conduct, Standard I(B) Independence and Objectivity: https://www.cfainstitute.org/standards/professionals/code-ethics-standards/standards-of-practice-i-b

checks:
  - id: adb-quiz-sorting
    kind: quiz
    questions:
      - adb-q-checkable
      - adb-q-forecast
      - adb-q-pe-arithmetic
      - adb-q-which-earnings
      - adb-q-reconcile
      - adb-q-multiple-fall
      - adb-q-multiple-and-earnings
      - adb-q-starting-point
      - adb-q-incentive
      - bank:eab:MBA-FIN-VAL-0014
    perAttempt: 3
    passRule:
      correct: 2
  - id: adb-writers-sorted
    kind: conversation
    prompt: >
      On 12 June 2000, which writer looked better supported to you, and which one claim would you
      check first? At $70 billion, Yahoo's first-quarter earnings (released 5 April), annualised, give
      about 225 times reported earnings and about 277 times pro forma earnings, against the quoted 340.
    passCriteria: >
      The Learner picks at least one checkable fact from each writer (for example the Nasdaq's 1999
      rise against its published year-end figures, Yahoo's earnings against its April release, or
      the S&P 500's multiple) and says where it would be checked. They see that Yahoo's 'times earnings'
      figure depends on the first-quarter earnings used (about 225 times reported or about 277 times
      pro forma, as the prompt gives) and that neither matches the quoted 340, so the gap needs a stated
      price date and definition before it can be called an error. They name a forecast (such as the share of companies that disappear
      or the size of a fall) and judge it by its reasoning, size, time and stated limits, not as a
      fact. They name a framing device (a starting point for a percentage, the sum of a sector shown
      without its parts, benchmark pressure or the writer's own incentives). They prefer an argument
      rather than a person, say what remains unknown, and name evidence that would change their mind.
      They make no forecast of their own and no buy, sell or hold call. The prompt gives both
      multiples, so no figure needs to be worked out.
