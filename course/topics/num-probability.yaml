    check: pr-quiz-expected-value
    recipe: myth_or_fact
    title: Expected value, myth or fact
    inputs:
      cards:
        - claim: A bet that wins most of the time is a safe bet.
          isFact: false
          why: One rare, huge loss can outweigh many small wins.
          emoji: warning
        - claim: Expected value is the average result if you repeat a bet many times.
          isFact: true
          why: Repeat it often enough and the average settles there.
          emoji: balance-scale
        - claim: A good average means you cannot be wiped out.
          isFact: false
