questions:
  - id: pr-q-expected-value
    prompt: >
      A bet wins ₹300 four times in ten and loses ₹100 six times in ten. A trader calls it a bet with "positive expected value". What does she mean?
    choices:
      - { id: a, text: "Repeated many times, it makes money on average" }
      - { id: b, text: "It wins more often than it loses", mistake: { tag: ignored_sizes, fix: "It wins only four times in ten. Expected value also weighs how big each win and loss is." } }
      - { id: c, text: "It never loses money", mistake: { tag: sure_thing, fix: "It loses ₹100 six times in ten. Expected value is an average, not a promise." } }
      - { id: d, text: "It makes money on every single try", mistake: { tag: sure_thing, fix: "Single tries still lose. The average only shows up over many repeats." } }
    answer: a
    explanation: >
      Expected value weighs each result by how likely it is. Here the rare big wins outweigh the common small losses, so the average is a gain of ₹60 a try, even though six tries in ten lose.
    source: >
      OpenStax, Principles of Finance (CC BY-NC-SA), 13.5 Probability Distributions, calculating expected values: https://openstax.org/books/principles-finance-2e/pages/13-5-probability-distributions

  - id: pr-q-at-least-once
    prompt: >
      A fund makes ten independent trades. Each has a small chance of a large loss. As the fund adds more trades, what happens to the chance that at least one of them blows up?
    choices:
      - { id: a, text: "It grows, and can be much bigger than one trade's chance" }
      - { id: b, text: "It stays the same as one trade's chance", mistake: { tag: risks_do_not_add, fix: "Each extra trade is another chance for a loss, so the chance of at least one grows." } }
      - { id: c, text: "It shrinks, because trades cancel each other out", mistake: { tag: diversified_away, fix: "Independent trades do not cancel a loss. Each one can blow up on its own." } }
      - { id: d, text: "It is zero, because each trade is small", mistake: { tag: small_means_safe, fix: "Small chances add up. Many small chances make a real chance of at least one loss." } }
    answer: a
    explanation: >
      The chance that none of the trades goes wrong shrinks with every trade added, so the chance that at least one does grows. For ten trades at 5 percent each it is about 40 percent. Small risks add up when you take many of them.
    source: >
      CFA Institute, Probability Trees and Conditional Expectations (refresher reading, 2026): https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/probability-trees-and-conditional-expectations ; the complement rule is the same one used in the Question Bank item MBA-STAT-0006.

  - id: pr-q-leverage-wipeout
    prompt: >
      A fund holds about 30 dollars of debt for every dollar of its own money. What does that borrowing do to a fall in the value of its assets?
    choices:
      - { id: a, text: "A small fall can wipe out all of its own money" }
      - { id: b, text: "Lenders share the fall, so the fund's money is safe", mistake: { tag: lenders_share_loss, fix: "Lenders must be repaid in full. The fund's own money takes the loss first." } }
      - { id: c, text: "Borrowing shrinks the fall", mistake: { tag: borrowing_shrinks_loss, fix: "Borrowing makes a fall hurt more, not less, because the fund's own money is a thin slice of its assets." } }
      - { id: d, text: "Only a fall of half the assets can hurt it", mistake: { tag: needs_big_fall, fix: "With so little of its own money, a fall of only a few percent is enough." } }
    answer: a
    explanation: >
      Its own money is 1 of 31 in assets. A fall of 1 in 31, about 3 percent, removes that dollar, and the debt must still be repaid in full.
    source: >
      Federal Reserve History, Near Failure of Long-Term Capital Management (about 30 dollars of debt for every dollar of capital at the end of 1997): https://www.federalreservehistory.org/essays/ltcm-near-failure ; the 1 in 31 is own arithmetic.

  - id: pr-q-lose-everything
    prompt: >
      A strategy earns a small gain 95 times out of 100 and loses all of its capital the other 5 times. Why is its average gain per trade a poor guide to whether you should use it with all your money?
    choices:
      - { id: a, text: "Because a total loss ends the game: you cannot earn the later gains the average assumes" }
      - { id: b, text: "Because averages are always wrong", mistake: { tag: averages_useless, fix: "Averages are useful. This one just hides a loss that ends the game." } }
      - { id: c, text: "Because 95% is not a high enough probability to count", mistake: { tag: small_means_safe, fix: "A 5 percent chance of losing everything is large when the loss cannot be recovered." } }
      - { id: d, text: "Because gains and losses cannot be multiplied by probabilities", mistake: { tag: wrong_method, fix: "Weighing each result by its probability is exactly how expected value works." } }
    answer: a
    explanation: >
      Expected value is a long-run average over many repeats. If one outcome wipes out your capital, you cannot repeat the bet afterwards, so the average is never collected.
    source: >
      Federal Reserve History, Near Failure of Long-Term Capital Management: https://www.federalreservehistory.org/essays/ltcm-near-failure ; OpenStax, Principles of Finance, 13.5 Probability Distributions: https://openstax.org/books/principles-finance-2e/pages/13-5-probability-distributions

  - id: pr-q-lingo-tail-risk
    prompt: >
      What do risk managers call a rare, very large loss that sits far out at the edge of the odds?
    choices:
      - { id: a, text: "Tail risk" }
      - { id: b, text: "A hedge", mistake: { tag: mixed_up_terms, fix: "A hedge is protection against a loss, not the loss itself." } }
      - { id: c, text: "Leverage", mistake: { tag: mixed_up_terms, fix: "Leverage is borrowing. It makes a rare loss bigger, but it is not the loss." } }
      - { id: d, text: "Expected value", mistake: { tag: mixed_up_terms, fix: "Expected value is the average result, which can hide a rare big loss." } }
    answer: a
    explanation: >
      The unlikely outcomes sit in the "tail" of the odds, far from the usual results. Tail risk is the chance of one of them.
    source: >
      Federal Reserve History, Near Failure of Long-Term Capital Management: https://www.federalreservehistory.org/essays/ltcm-near-failure ; CFA Institute, Probability Trees and Conditional Expectations (refresher reading, 2026): https://www.cfainstitute.org/insights/professional-learning/refresher-readings/2026/probability-trees-and-conditional-expectations

  - id: pr-q-lingo-leverage
    prompt: >
      What do analysts call using borrowed money to hold bigger positions, so that gains and losses both grow?
    choices:
      - { id: a, text: "Leverage" }
      - { id: b, text: "Diversification", mistake: { tag: mixed_up_terms, fix: "Diversification spreads money over many bets. It does not use borrowed money." } }
      - { id: c, text: "A probability", mistake: { tag: mixed_up_terms, fix: "A probability is how likely something is, a number from 0 to 1." } }
      - { id: d, text: "Expected value", mistake: { tag: mixed_up_terms, fix: "Expected value is the average result of a bet, not borrowing." } }
    answer: a
    explanation: >
      Leverage means holding more than your own money buys, by borrowing. It makes gains bigger, and it makes losses bigger too.
    source: >
      Federal Reserve History, Near Failure of Long-Term Capital Management: https://www.federalreservehistory.org/essays/ltcm-near-failure

  - id: pr-q-lingo-hedge-fund
    prompt: >
      LTCM looked for small price gaps between similar securities and borrowed heavily to earn more from them. What do finance people call a private fund like that?
    choices:
      - { id: a, text: "A hedge fund" }
      - { id: b, text: "A savings account", mistake: { tag: mixed_up_terms, fix: "A savings account is a bank deposit. A hedge fund is a private fund that trades actively." } }
      - { id: c, text: "A central bank", mistake: { tag: mixed_up_terms, fix: "A central bank steers interest rates. LTCM was a private fund." } }
      - { id: d, text: "A lottery", mistake: { tag: mixed_up_terms, fix: "A lottery pays by chance. A hedge fund trades on purpose, using borrowed money." } }
    answer: a
    explanation: >
      A hedge fund is a private investment fund for wealthy investors that trades actively and often borrows. LTCM was one, founded in February 1994.
    source: >
      Federal Reserve History, Near Failure of Long-Term Capital Management: https://www.federalreservehistory.org/essays/ltcm-near-failure

checks:
  - id: pr-quiz-expected-value
    kind: quiz
    questions:
      - pr-q-expected-value
      - pr-q-at-least-once
      - pr-q-leverage-wipeout
      - pr-q-lose-everything
      - pr-q-lingo-tail-risk
      - pr-q-lingo-leverage
      - pr-q-lingo-hedge-fund
    perAttempt: 3
    passRule:
      correct: 2
  - id: pr-ltcm-ev
    kind: conversation
    prompt: >
      As of 1 August 1998, LTCM's trades have a positive expected profit and a long record of
      small gains, and it holds about 30 dollars of debt per dollar of capital. Explain why that
      positive expected value does not by itself make the fund safe, using probability and
      leverage in your answer. What would you want to know about its losses before trusting it?
    passCriteria: >
      The Learner explains that expected value is a probability-weighted long-run average that
      hides the size of the rare bad outcome, and that a loss big enough to wipe out the capital
      ends the game so the average is never collected. They use leverage: with about 30 to 1
      debt a fall in asset values of only about 3% (one part in thirty-one) removes all of the fund's capital.
      They say they would want to know how large and how likely the bad outcomes are, how
      correlated the trades are (the small risks may not be independent), and how much
      borrowing sits behind them. They do not need to cite the fund's actual outcome.
