    recipe: myth_or_fact
    title: Myth or fact, return on equity
    inputs:
      cards:
        - claim: Two companies with the same return on equity are equally safe.
          isFact: false
          why: One may earn it from borrowing, which is riskier than earning it from margin.
          emoji: balance-scale
        - claim: Leverage makes a loss bigger as well as a profit.
          isFact: true
          why: Debt multiplies good years and bad years alike, measured on the owners' money.
          emoji: high-voltage
        - claim: A thin margin can never give a good return on equity.
          isFact: false
          why: High asset turnover or heavy borrowing can lift it, as they do for a supermarket.
