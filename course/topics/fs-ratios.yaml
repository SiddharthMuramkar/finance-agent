# Ratios, return on equity and DuPont: a foundation Topic taught through a short Case.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
id: fs-ratios
title: Ratios, return on equity and DuPont
# Stage, place on the default path and prerequisites live in course/outline.yaml.

cases:
  - id: coffee-day-2015
    title: Coffee Day Enterprises at its IPO
    data: [fy15-revenue, fy15-net-result, net-worth-jun15, total-debt-jun15, total-assets, cash-and-bank, ipo-and-listing-price]
    asOf: 2015-10-13
    story: >
      Coffee Day Enterprises runs Cafe Coffee Day, an Indian coffee chain, and owns other
      businesses including coffee estates and an IT park. On 14 October 2015 it opens an initial public offering (IPO,
      the first sale of its shares to the public) to raise up to Rs 1,150 crore, at a price
      between Rs 316 and Rs 328 a share, which would value the company at up to Rs 6,750 crore
      (about 1 billion dollars). The prospectus gives restated consolidated figures. For the
      2014-15 financial year (to 31 March 2015) revenue from operations was Rs 2,479 crore, the
      loss before tax Rs 147 crore and the net loss Rs 87 crore (the year before: revenue Rs
      2,287 crore, net loss Rs 77 crore). At 31 March 2015 total assets were Rs 6,014 crore,
      shareholders' funds (the owners' equity) Rs 532 crore, borrowings about Rs 3,550 crore and
      cash and bank balances Rs 743 crore. As of this date, you are deciding what the ratios say about the return the owners earn and how much of it is built on
      borrowing.
    reveal: >
      The IPO was priced at Rs 328, the top of the range, and subscribed 1.64
      times. On listing on 2 November 2015 the shares opened at Rs 313 on the BSE, below the issue
      price, and closed at Rs 270.15, 17.63 per cent below it. Buyers had paid up for a business
      that earned a net loss on a thin base of equity and a large load of debt. In July 2019 the
      founder, V. G. Siddhartha, was found dead after a letter dated 27 July that cited pressure
      from lenders. The 2015 prospectus itself had warned that the promoter had given personal
      guarantees and share pledges for group loans and that lenders could take the pledged
      shares. The ratios in 2015 had shown the combination (a net loss, low equity, high
      debt) that makes a company fragile.

concept: >
  Return on equity (ROE) is net income divided by equity: the profit earned for each unit the
  owners have put in. The DuPont method splits it into three parts that multiply:
  ROE = net profit margin x asset turnover x equity multiplier. Net profit margin is net income
  divided by sales (how much of each sale is kept). Asset turnover is sales divided by total
  assets (how hard the assets work). The equity multiplier is total assets divided by equity
  (how much borrowing sits under the owners' money); it equals 1 plus liabilities divided by
  equity. Two companies with the same ROE can have very different risk: one from high margins,
  the other from high leverage. Leverage multiplies a loss as well as a profit.

principle: >
  Before trusting a return on equity, break it into margin, turnover and leverage. High ROE
  built mainly on a high equity multiplier is borrowed, and the same leverage turns a small loss
  into a large negative return on thin equity.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Read return on equity as the owners' profit on their own money."
  - "Split it into margin, asset turnover and leverage."
  - "Tell a return earned by the business from one borrowed through leverage."


exampleCurrency: INR
runningExample:
  text: A juice-shop owner puts in Rs 5 lakh of her own money and borrows Rs 15 lakh more.
  numbers: [5, 15]
  scene:
    cast:
