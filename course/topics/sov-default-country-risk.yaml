# Sovereign default and country risk: a foundation Topic taught through Argentina in December 2001.
# Case Data (the sourced figures) lives in the database; see docs/architecture.md.
# Case sources (checked): Heaphy, "Argentina: National Bank Holidays, 2001", Journal of Financial Crises 7(2) (Yale): https://elischolar.library.yale.edu/journal-of-financial-crises/vol7/iss2/3 ; US State Department, 2006 Investment Climate Statement, Argentina: https://2001-2009.state.gov/e/eeb/ifd/2006/61959.htm ; The New York Times, 24 Dec 2001; The Washington Post, 24 Dec 2001; WSJ review of Makoff, Default (2024): https://wsj.com/world/americas/default-review-when-a-nation-goes-bust-046db2c7
id: sov-default-country-risk
title: Sovereign default and country risk

cases:
  - id: argentina-default-2001
    title: Argentina on 1 December 2001
    asOf: 2001-12-01
    story: >
      Since 1991 Argentina has run a currency board: by law the central bank guarantees one peso for
      one US dollar. The arrangement ended the hyperinflation of the 1980s and for most of the 1990s
      brought stability, investment and growth. But the fixed rate has made Argentine exports dear, the
      country has been borrowing heavily abroad to cover its deficits, and it has been in recession
      since late 1998. The IMF has lent Argentina about US$14 billion and promised another US$8 billion
      in August 2001. More than two-thirds of Argentine bank deposits are in dollars. All through
      2001 depositors, doubting that the peso can stay at par with the dollar, have pulled money out of banks; by November
      peso deposits were down by more than a third and dollar deposits by a tenth. On 28 November the
      run on the banks accelerated, and today, 1 December, the authorities have limited withdrawals
      from current accounts to 250 pesos or dollars a week per account holder. The government owes
      lenders abroad and at home a very large sum in dollars, which it can pay only by borrowing
      again or by squeezing spending. A company that cannot pay can be put into bankruptcy and its assets
      sold; no court can do that to a country. What are Argentina's choices, and what would each
      cost the government, bondholders and ordinary depositors?
    reveal: >
      The choices ran out within weeks. On 5 December 2001 the IMF said it would not release the next
      tranche of its loan, about US$1.3 billion. Riots followed, at least 29 people died, and President Fernando de la Rua
      resigned on 20 December. On Sunday 23 December the new caretaker president, Adolfo Rodriguez Saa, told Congress that
      Argentina would suspend payments on its foreign debt; lawmakers cheered. It was the largest sovereign
      default to that date. Estimates of the debt in default differ by what is counted: US$88 billion (US
      State Department), about US$100 billion (Wall Street Journal), US$132 billion (New York Times) and US$141
      billion (Yale Journal of Financial Crises). On 6 January 2002 Congress ended convertibility, and
      the peso went first to a dual and then to a floating rate. Dollar deposits were converted to pesos at 1.4 pesos per dollar by
      government order, though courts later ordered banks to pay out dollars at the market rate. In February 2005, after
      years of talks with creditors, holders of 76% of the defaulted principal accepted an offer worth
      roughly 30 cents on the dollar. The economy grew 8.7% in 2003 and 9.0% in 2004. The episode
      showed what a sovereign borrower can do that a company cannot: choose to stop paying; and what it cannot
      do: borrow again cheaply for years afterwards.

concept: >
  A sovereign government can default on its debt, and unlike a company it cannot be liquidated: creditors
  cannot seize its territory, and there is no bankruptcy court with power over it, so repayment depends on
  its ability and its willingness to pay. Default risk is measured in the market by the default spread:
  the yield on the government's bonds minus the yield on a default-free bond in the same currency
  (for dollar bonds, the US Treasury). Rating agencies grade sovereign credit from AAA down to default.
  Sovereign risk differs by the currency of the debt. A government that owes money in its own currency
  can print it, but at the price of inflation and a falling currency; one that owes in a foreign
  currency, as Argentina did, cannot, so its borrowing is limited by the reserves it can find and by
  creditors' trust. A fixed exchange rate and large foreign-currency debt together are especially
  fragile. When a country defaults the usual outcome is a restructuring in which creditors take a haircut:
  they swap old bonds for new ones worth less than the face value of the old. Country risk also reaches beyond
  government bonds: companies in a risky country face higher borrowing costs, controls on moving
  money out, and a higher return demanded by equity investors (a country risk premium, estimated for example
  from the sovereign default spread). Convertibility and transfer risk, the chance that a government will
  not let you swap local currency for dollars or send money abroad, is a separate part of country risk.

principle: >
  A government's promise to pay is only as good as its ability and its willingness to pay. Country risk shows
  up first in what lenders charge and in what they let you take out.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Measure a government's default risk by the extra yield lenders charge over a default-free bond."
  - "See why debt in a foreign currency is riskier for a government than debt in its own."
  - "Carry country risk into what companies and shareholders in that country must earn."

questions:
  - id: sd-q-spread
    prompt: >
      Ana is choosing between two 10-year dollar bonds: one from a young emerging country, one from the US Treasury. The emerging country's bond pays far more, and her broker warns that the extra comes with a catch. Why does that bond pay so much more?
    choices:
      - { id: a, text: "The coupon: the interest printed on the bond", mistake: { tag: spread_is_coupon, fix: "The coupon is the bond's own interest rate. The gap between two yields is the spread." } }
      - { id: b, text: "The haircut: the cut in value after a default", mistake: { tag: spread_is_haircut, fix: "A haircut comes after a default. The spread is the extra yield priced in beforehand." } }
      - { id: c, text: "The reserve ratio: how much the central bank holds back", mistake: { tag: spread_is_reserves, fix: "Reserves are a central bank's holdings. They are not a gap between two yields." } }
      - { id: d, text: "The default spread: the extra yield asked for the risk of not being repaid" }
    answer: d
    explanation: >
      The default spread is the extra yield a country pays over a default-free bond in the same currency. If Ana's emerging-country bond yields 9.5% and the Treasury 4.5%, the spread is 5 percentage points, or 500 basis points: her pay for the risk of not being repaid.
    source: >
      Damodaran, Country Risk (Measuring Country Risk Premiums, country bond default spreads): https://www.stern.nyu.edu/~adamodar/pdfiles/papers/CountryRisk.pdf

  - id: sd-q-implied-prob
    prompt: >
      A government's one-year bond offers 12% while a default-free one-year bond offers 4%. A friend says the 12% bond is simply the better deal. What does the gap between the two yields tell a bond trader?
    choices:
      - { id: a, text: "The government bond will return more, since its yield is higher", mistake: { tag: yield_is_return, fix: "A high yield is only a promise. If default comes, the investor is paid less." } }
      - { id: b, text: "Investors are being paid to carry the chance of default" }
      - { id: c, text: "The government bond is expected to be held for longer", mistake: { tag: wrong_maturity, fix: "Both are one-year bonds. The wider yield pays for risk, not for length." } }
      - { id: d, text: "The safe bond must be tax-free, so it can pay less", mistake: { tag: tax_catch, fix: "Tax is not what explains a wide gap. The extra yield is the price of default risk." } }
    answer: b
    explanation: >
      A bond that pays 12% if repaid, compared with 4% for a safe bond, only makes sense to investors if there is a real chance of default. The extra yield is what investors ask for to cover that chance.
    source: >
      Yale ECON 251 (Financial Theory), Lecture 16, Chapter 2 (the gap between a risky borrower's rates and the safe rate is the default probability): https://oyc.yale.edu/economics/econ-251/lecture-16

  - id: sd-q-haircut
    prompt: >
      Carlos's grandmother held bonds from a government that defaulted. A letter arrives: she can swap them for new bonds worth 40 cents for every dollar she was owed. Carlos's banker friend winces: "That is a deep one." What has she been asked to accept?
    choices:
      - { id: a, text: "The loss of the interest payments the old bonds used to pay (a coupon)", mistake: { tag: haircut_is_coupon, fix: "A coupon is a bond's interest payment, not the loss taken in a restructuring." } }
      - { id: b, text: "A fall in the extra yield investors asked for before the default (a spread)", mistake: { tag: haircut_is_spread, fix: "A spread is the extra yield before a default. The loss taken in the swap is the haircut." } }
      - { id: c, text: "A cut in what she is owed, taken to settle the debt (a haircut)" }
      - { id: d, text: "A promise to keep the exchange rate fixed (a peg)", mistake: { tag: haircut_is_peg, fix: "A peg fixes an exchange rate. It has nothing to do with writing down debt." } }
    answer: c
    explanation: >
      An investor holding old bonds with a face value of $50,000 gets new bonds worth 0.40 x 50,000 = $20,000, giving up 60% of face value. That 60% is the haircut: the part of the debt that the creditor gives up.
    source: >
      US State Department, 2006 Investment Climate Statement, Argentina (restructuring offer measured in cents per dollar of face value of old debt): https://2001-2009.state.gov/e/eeb/ifd/2006/61959.htm

  - id: sd-q-board
    prompt: >
      A country operates a currency board that guarantees one unit of its currency equals one US dollar. What is the main risk to holders of the currency if the country's finances weaken?
    choices:
      - { id: a, text: "That the guarantee is abandoned and the currency falls below one dollar" }
      - { id: b, text: "That the currency rises above one dollar", mistake: { tag: wrong_direction, fix: "A weak economy pushes the currency down, not up above one dollar." } }
      - { id: c, text: "That the central bank prints too little currency to keep the rate", mistake: { tag: too_little_money, fix: "The danger is running out of dollars to back the promise, not printing too little." } }
      - { id: d, text: "There is no risk, because the rate is guaranteed by law", mistake: { tag: law_as_guarantee, fix: "A law holds only while reserves can honour it; markets can test it." } }
    answer: a
    explanation: >
      A guarantee holds only while the authorities can and will honour it. If markets doubt it, holders sell or convert into dollars, which drains the reserves that back the promise.
    source: >
      Heaphy, "Argentina: National Bank Holidays, 2001", Journal of Financial Crises 7(2) (Yale): https://elischolar.library.yale.edu/journal-of-financial-crises/vol7/iss2/3

  - id: sd-q-spread-widens
    prompt: >
      The yield spread of a country's dollar bonds over US Treasuries widens sharply. What does it most directly signal?
    choices:
      - { id: a, text: "Investors see a higher chance of default or restructuring" }
      - { id: b, text: "Investors see a lower chance of default", mistake: { tag: spread_backwards, fix: "A wider spread means investors want more pay for more risk, so default looks likelier." } }
      - { id: c, text: "US Treasury yields have fallen to zero", mistake: { tag: treasury_moved, fix: "Treasury moves can nudge the gap, but a sharp widening is the market pricing default fear." } }
      - { id: d, text: "The country's currency has been fixed to the dollar", mistake: { tag: peg_for_spread, fix: "A spread over Treasuries prices default fear, not the exchange rate regime." } }
    answer: a
    explanation: >
      Investors demand a bigger premium over the safe rate when they fear losing part of their money. A wider default spread is the market's price of that fear.
    source: >
      Damodaran, Country Risk (country bond default spreads): https://www.stern.nyu.edu/~adamodar/pdfiles/papers/CountryRisk.pdf

checks:
  - id: sd-quiz-default
    kind: quiz
    questions:
      - sd-q-spread
      - sd-q-implied-prob
      - sd-q-haircut
      - sd-q-board
      - sd-q-spread-widens
      - bank:eab:MBA-INTL-0005
    perAttempt: 3
    passRule:
      correct: 2
  - id: sd-default-choices
    kind: conversation
    prompt: >
      A government has borrowed heavily in dollars, fixed its exchange rate to the dollar and faces a
      bank run. Explain how default on sovereign debt differs from a company's default, and what each
      way out (cut spending, drop the peg, ask for more outside money, default) would cost.
    passCriteria: >
      The Learner says that a sovereign cannot be liquidated and its creditors cannot seize its assets,
      so repayment depends on ability and willingness to pay. They name costs for each option: spending
      cuts and tax rises hurt growth and the budget; abandoning the peg makes dollar debts and dollar deposits dearer in local
      currency; more outside money comes with conditions and may not arrive; default costs creditors a haircut
      and shuts the country out of borrowing for years.
