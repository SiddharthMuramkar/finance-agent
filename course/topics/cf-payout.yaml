      - po-q-tax
      - po-q-invest-first
      - bank:eab:MBA-FIN-CF-0042
      - bank:eab:MBA-FIN-CF-0044
      - bank:eab:MBA-FIN-CF-0045
    perAttempt: 3
    passRule:
      correct: 2
  - id: po-payout-explain
    kind: conversation
    prompt: >
      A cash-rich software company must choose between raising its regular dividend, a share buyback
      and a one-off special dividend. Explain what happens to the share price and to each
      shareholder's wealth in a frictionless market, and which real-world factors would make you
      prefer one of the three.
    passCriteria: >
      The Learner says that in a frictionless market wealth is unchanged: the share price falls by
      about the cash paid per share, and a buyback raises earnings per share without adding value.
      They name real-world factors such as tax treatment of dividends and capital gains, the signal
      and commitment of a regular dividend, the flexibility of a special dividend or buyback, and
      whether the firm has projects that earn more than their cost of capital.
