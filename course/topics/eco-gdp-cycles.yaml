# GDP, growth and business cycles: a foundation Topic taught through India before the 1991 crisis.
# Stage, place on the default path and prerequisites live in course/outline.yaml.
id: eco-gdp-cycles
title: GDP, growth and business cycles

cases:
  - id: india-pre-1991
    title: India before the 1991 crisis
    asOf: 1990-06-30
    story: >
      At the end of June 1990 India's economy looks strong. During the Seventh Five Year Plan (1985 to
      1990) output grew by 6.0 per cent a year on average, faster than in earlier decades, helped by
      loosened controls on trade, industry and taxes. But the growth is being paid for. The gross fiscal
      deficit, the amount the government borrows each year, has averaged 8.2 per cent of GDP over 1985 to
      1990, up from 6.3 per cent in the first half of the 1980s, and a large part is financed by the
      Reserve Bank lending directly to the government. Imports are growing faster than exports. The
      current account deficit hit a record 2.7 per cent of GDP in 1988-89, against a Plan target of
      1.6 per cent, and about 30 per cent of export earnings now go to servicing external debt. Foreign
      exchange reserves have fallen from about five months of imports in the mid-1980s to a little over two
      months at the end of 1989-90. The Reserve Bank has written to the government several times, most
      recently in February 1990, warning that the deficits cannot be financed for long. The government is
      politically unsettled. The question for anyone looking at India's growth: how long can this last?
    reveal: >
      It did not last. In August 1990 Iraq invaded Kuwait, oil prices jumped and remittances from Indians in
      the Gulf fell, weakening the current account by about $1.5 billion in 1990-91. The planned cut in the
      fiscal deficit did not happen: it reached 9.4 per cent of GDP in 1990-91, and the current account
      deficit widened to about 3.0 per cent of GDP. Inflation rose to 12.0 per cent. Growth had averaged
      7.6 per cent a year over the three years to 1990-91, but it was fuelled by expansionary fiscal
      policy. By end-March 1991 gross official reserves were $5.8 billion, only 1.3 months of imports,
      even after $1.8 billion bought from the IMF in January. In July 1991 India faced an imminent default
      on its external debt. The rupee was devalued in two steps on 1 and 3 July 1991, about 9 per cent and
      11 per cent, a cumulative fall of about 18 per cent in dollar terms according to the RBI. On 27 August
      1991 the government asked the IMF for a 20-month stand-by arrangement of SDR 1,656 million, approved
      on 31 October 1991, and began the reforms of 1991.

concept: >
  Gross domestic product (GDP) is the value of all final goods and services produced in a country in a
  year. It can be added up from the spending side, GDP = consumption + investment + government spending +
  exports - imports, or from the output side. Nominal GDP uses current prices; real GDP removes inflation,
  and growth is quoted in real terms. Output does not rise in a straight line: the business cycle moves
  from a peak down to a trough (a recession) and back up in an expansion. A recession was historically
  defined as two consecutive quarters of falling real GDP; agencies today look at a broader set of
  indicators such as employment, income and industrial production. Some indicators lead the cycle (new
  orders, building permits); others lag it (unemployment, inflation). Growth is only as sound as its
  financing: an economy that grows by borrowing from its government's budget and from abroad depends on
  lenders continuing to lend.

principle: >
  Read growth together with its financing. Ask who is borrowing, from whom and in which currency; a
  boom paid for with deficits and foreign debt looks the same as a healthy one until the lenders stop.

# You'll learn: shown on the Topic Start card and the Welcome. Drafted from the concept and principle only, for the owner to review.
youllLearn:
  - "Know what GDP measures and how real growth differs from nominal."
  - "Read the business cycle and the indicators that lead or lag it."
  - "Ask how growth is being financed, and by whom."

questions:
  - id: gdp-q-components
    prompt: >
      An economy has consumption of Rs 60 lakh crore, investment of Rs 20 lakh crore, government spending of
      Rs 15 lakh crore, exports of Rs 10 lakh crore and imports of Rs 5 lakh crore. What is GDP by the
      spending approach?
    choices:
      - { id: a, text: "Rs 100 lakh crore" }
      - { id: b, text: "Rs 110 lakh crore" }
      - { id: c, text: "Rs 105 lakh crore" }
      - { id: d, text: "Rs 95 lakh crore" }
    answer: a
    explanation: >
      GDP = C + I + G + (X - M) = 60 + 20 + 15 + (10 - 5) = 100. Adding imports instead of subtracting
      them would give 110.
    source: >
      OpenStax, Principles of Macroeconomics 2e (CC BY 4.0), 6.1 Measuring the Size of the Economy: Gross Domestic Product: https://openstax.org/books/principles-macroeconomics-2e/pages/6-1-measuring-the-size-of-the-economy-gross-domestic-product

  - id: gdp-q-recession
    prompt: >
      Historically, how was a recession defined in the United States?
    choices:
      - { id: a, text: "Two consecutive quarters of declining real GDP" }
      - { id: b, text: "Any year in which prices fall" }
      - { id: c, text: "Unemployment above 10%" }
    answer: a
    explanation: >
      Historically a recession was two consecutive quarters of declining GDP. Today the NBER declares one
      when there is a significant decline in economic activity spread across the economy, using income,
      employment, industrial production and sales as well as GDP.
    source: >
      OpenStax, Principles of Finance (CC BY 4.0), 3.3 Business Cycles and Economic Activity: https://openstax.org/books/principles-finance/pages/3-3-business-cycles-and-economic-activity

checks:
  - id: eco-gdp-quiz-cycles
    kind: quiz
    questions:
      - bank:eab:MBA-ECON-0055
      - bank:eab:MBA-ECON-0058
      - gdp-q-components
      - gdp-q-recession
    perAttempt: 3
    passRule:
      correct: 2
  - id: eco-gdp-growth-financing
    kind: conversation
    prompt: >
      India grew faster in the late 1980s than before. Using the figures from the Case, judge whether that
      growth looks sustainable, and explain what could go wrong even while GDP is rising.
    passCriteria: >
      The Learner explains that growth was financed by large fiscal deficits (around 8 to 9 per cent of GDP),
      partly funded by the central bank, and by external borrowing, so imports and the current account deficit
      grew faster than exports and reserves ran down to a little over two months of imports. They say that
      this leaves the economy exposed to an external shock or a loss of lender confidence. They conclude that
      GDP growth alone does not show whether it can be sustained.
