          - https://www.business-standard.com/article/markets/markets-likely-to-open-weak-tracking-asian-cues-115101300127_1.html
          - https://www.hindustantimes.com/business/coffee-day-shares-open-below-issue-price-down-4-5/story-Gk0pIIaOJE0MRfS7uqcmfN.html
          - https://www.bloomberg.com/news/articles/2015-11-02/starbucks-india-rival-coffee-day-falls-in-mumbai-trading-debut
          - https://www.stern.nyu.edu/~adamodar/pdfiles/papers/CountryRisk.pdf
        verified: true
  - id: cf-venture
    title: "Venture finance and private rounds"
    stage: foundation
    subject: "Valuation & corporate finance"
    prerequisites: [val-young, cf-capital-structure]
    cases:
      - title: "WeWork's $47 billion private round"
        asOf: 2019-01-08
        outcome: "In Aug 2019 WeWork's parent filed to go public and its private valuation was tested: by late September advisers said it would fetch about a quarter of $47bn and reports put the IPO valuation as low as $10bn. WeWork withdrew its IPO filing on 30 Sep. On 22 Oct 2019 SoftBank agreed a rescue that took its stake to about 80% and valued WeWork at less than $8bn, a fall of more than 80% from January; SoftBank, which had committed more than $13bn in equity, held a company now worth a fraction of what it had paid in. The $47bn had been the price of the newest shares times every share in the company, never a price at which the whole company could be sold for cash."
        sources:
          - https://cnbc.com/2019/01/08/wework-rebranding-as-the-we-company-softbank-invests-2-billion.html
          - https://reuters.com/article/markets/asia/wework-gets-2-billion-after-softbank-cuts-planned-investment-idUSKCN1P21OG
          - https://www.nytimes.com/2019/01/07/business/softbank-wework.html
          - https://www.reuters.com/article/us-wework-ipo-neumann-newsmaker/wework-ipo-spells-rough-landing-for-ceo-neumann-idUSKBN1W009Z/
          - https://reuters.com/article/technology/softbank-clinches-wework-takeover-deal-bailing-out-co-founder-idUSKBN1X11JN
        verified: true
  - id: mkt-ipo-float
    title: "IPOs, book building and float"
    stage: foundation
    subject: "Markets & investing"
    prerequisites: [cf-venture, eq-markets]
    cases:
      - title: "How Coffee Day sold its shares to the public"
        asOf: 2015-10-21
        outcome: "The shares began trading on 2 Nov 2015, opening at Rs 313 on the BSE and Rs 317 on the NSE against the Rs 328 issue price, and closed at Rs 270.15 and Rs 270.45, down 17.6%. At the NSE close the company was worth about Rs 5,571 crore against Rs 6,757 crore at the issue price. Only the 17.02% sold in the issue could be traded in the following days; most of the company, including the promoters' 52.56%, was locked in. The issue price had been set by book building before trading began; the first day showed what the open market, with its small float, would pay."
        sources:
          - https://www.sebi.gov.in/sebi_data/attachdocs/1446117779846.pdf
          - https://www.business-standard.com/article/markets/coffee-day-prices-ipo-at-upper-end-of-range-115102101210_1.html
          - https://www.hindustantimes.com/business/coffee-day-shares-open-below-issue-price-down-4-5/story-Gk0pIIaOJE0MRfS7uqcmfN.html
          - https://timesofindia.indiatimes.com/business/india-business/cold-debut-for-ccd-stock-plunges-18/articleshow/49637562.cms
          - https://www.bloomberg.com/news/articles/2015-11-02/starbucks-india-rival-coffee-day-falls-in-mumbai-trading-debut
        verified: true
  - id: der-forwards
    title: "Forwards and futures"
    stage: foundation
    subject: "Derivatives"
    prerequisites: [bond-pricing, fx-basics, eq-markets]
    cases:
      - title: "Metallgesellschaft's stack-and-roll hedge"
        asOf: 1993-09-30
        outcome: "In late 1993 OPEC members could not agree on production quotas and the oil price fell. The market moved from backwardation to contango, so rolling the futures now cost money; daily margin calls had to be paid in cash, while the gains on the customers' fixed prices would arrive only as oil was delivered over ten years. In Dec 1993 MG disclosed that its energy business had lost about $1.5bn (other sources say $1.3bn); Deutsche Bank ousted the chief executive and cut off the credit line. More than 100 creditor banks mounted a rescue of about $1.9bn ($2.2bn in some accounts) in 1994, and in Jul 1995 MG agreed to a $2.25m fine to the CFTC."
        sources:
          - https://sk.sagepub.com/ency/edvol/encyclopedia-of-white-collar-and-corporate-crime-2e/chpt/metallgesellschaft
          - https://sk.sagepub.com/ency/edvol/sage-encyclopedia-of-business-ethics-and-society-2e/chpt/metallgesellschaft-ag
          - https://www.wsj.com/articles/the-ceo-at-the-center-of-a-controversial-1993-commodity-hedge-1465178461
          - https://www.nytimes.com/1995/07/28/business/metallgesellschaft-to-pay-fine-to-us.html
          - https://www.uni-trier.de/fileadmin/fb4/studium/FFA/Downloads/Risk_Management/CASE3_Metallgesellschaft_AG_1.pdf
        verified: true
        note: "Losses and rescue are ranges by source: $1.3bn (Sage) or $1.5bn (NYT, Reuters); rescue $1.9bn (Sage) to $2.2bn (NYT). As-of is 30 Sep 1993 because the loss was disclosed in Dec 1993."
  - id: der-options
    title: "Options and payoffs"
    stage: foundation
    subject: "Derivatives"
    prerequisites: [der-forwards, num-probability]
    cases:
      - title: "Portfolio insurance as a home-made put"
        asOf: 1987-10-16
        outcome: "On Monday 19 Oct 1987 the S&P 500 fell about 20% in a single day and the S&P 500 futures contract fell 29%, so futures traded at a deep discount to the shares they track. Roughly 40% of futures sales by traders other than market-makers came from portfolio insurers; one large institution sold thirteen instalments of just under $100m each ($1.1bn in all), and Wells Fargo alone sold $1.6bn of futures. The Fed said on 20 Oct that it was ready to supply liquidity. The Fed paper says the insurers' selling 'may have contributed' to the futures discount; because the models sell more as prices fall, the selling could feed on itself."
        sources:
          - https://www.federalreserve.gov/pubs/feds/2007/200713/200713pap.pdf
          - https://time.com/archive/6711376/the-culprits-behind-the-crash
        verified: true
  - id: der-option-pricing
    title: "Binomial and Black-Scholes"
    stage: foundation
    subject: "Derivatives"
    prerequisites: [der-options, num-statistics]
    cases:
      - title: "LTCM and the men who priced options"
        asOf: 1998-08-01
        outcome: "By the end of Aug 1998 LTCM had lost about half its capital: the Fed History essay says it lost 44% of its value in August alone, and the President's Working Group reports capital of $4.1bn on 31 Jul falling to $2.3bn during August. The losses came in markets all over the world at once, far beyond what the fund's risk models, estimated in calm periods, said was probable; the report concluded that LTCM's models underestimated the risk. On 23 Sep 1998 fourteen banks and brokerages put in $3.625bn for 90% of the fund, an arrangement the New York Fed organised without lending its own money."
        sources:
          - https://www.nobelprize.org/prizes/economic-sciences/1997/press-release/
          - https://www.federalreservehistory.org/essays/ltcm-near-failure
          - https://www.cftc.gov/sites/default/files/tm/tmhedgefundreport.htm
          - https://www.federalreserve.gov/boarddocs/testimony/1998/19981001.htm
          - https://www.nytimes.com/1998/11/14/business/when-theory-met-reality-special-report-teachings-two-nobelists-also-proved-their.html
        verified: true
  - id: der-rates-fx
    title: "Interest-rate and currency derivatives, swaps"
    stage: foundation
    subject: "Derivatives"
    prerequisites: [der-forwards, bond-duration]
    cases:
      - title: "The RBI's FCNR(B) swap window"
        asOf: 2013-09-03
        outcome: "On the afternoon of 4 Sep 2013 the RBI announced a package that included the swap window; its circular of 6 Sep set the terms: a dollar-rupee swap for fresh FCNR(B) deposits of three years or more, open from 10 Sep to 30 Nov 2013, at a fixed rate of 3.5% a year. The scheme drew in $26bn, more than anyone expected. Confidence returned, the rupee kept strengthening (partly because global investor mood and Indian election forecasts also changed) and the RBI covered its forward promises cheaply. Rajan said three years later: 'We are fully covered for outflows today and have made money on the deal', adding that the scheme was 'a measured risk'."
        sources:
          - https://bis.org/review/r160905b.htm
          - https://www.rbi.org.in/scripts/NotificationUser.aspx?Id=8388&Mode=0
        verified: true
        note: "RBI opened a new FCNR(B) swap facility in June 2026; keep that 2026 material out of this Case."
  - id: der-hedging
    title: "Hedging and risk management"
    stage: foundation
    subject: "Derivatives"
    prerequisites: [der-option-pricing, der-rates-fx, cf-capital-structure]
    cases:
      - title: "Orange County's investment pool, a hedge or a bet?"
        asOf: 1994-09-30
        outcome: "In early Dec 1994 the county announced that the pool's $20.6bn portfolio had lost about $1.5bn in market value; it was built on only $7.6bn of deposits, so the leverage multiplied the loss. On 6 Dec 1994 the county filed for Chapter 9 protection. After the portfolio was sold, the county realised a loss of about $600m on its own investment and lost a further $157m of expected interest earnings. In Jan 1996 the SEC found that the official statements for the county's bond offerings had material misstatements and omissions about the risks of the pools. The structure raised, rather than reduced, the pool's exposure to a rise in interest rates, while reports to the Board of Supervisors said there was no risk of losing principal."
        sources:
          - https://sec.gov/files/litigation/admin/3436761.txt
          - https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/1994/all?type=daily_treasury_yield_curve&field_tdr_date_value=1994&page&_format=csv
        verified: true
  - id: bank-regulation
    title: "Bank regulation, capital and liquidity"
    stage: foundation
    subject: "Banks, crises & the system"
    prerequisites: [eco-money-banking, fs-ratios]
    cases:
      - title: "Silicon Valley Bank, passing every test"
        asOf: 2022-12-31
        outcome: "SVB was closed by regulators on 10 Mar 2023. The Fed's review of 28 Apr 2023 found that SVBFG had 31 open supervisory findings when it failed, about triple the number at peer firms, in areas such as governance and risk management, liquidity and interest-rate risk. It had met its capital requirements every year from 2017 to 2022, but the requirements did not cover what failed: under the pre-2019 rules it would have had a shortfall of about 9% in high-quality liquid assets in Dec 2022 (about 17% in Feb 2023), and counting its AFS losses would have cut regulatory capital by $1.9bn, taking the CET1 ratio from 12.1% to 10.4%. The Fed concluded that the tailoring approach 'impeded effective supervision'."
        sources:
          - https://www.federalreserve.gov/publications/files/svb-review-20230428.pdf
          - https://www.federalreserve.gov/newsevents/pressreleases/bcreg20230428a.htm
          - https://data.sec.gov/api/xbrl/companyconcept/CIK0000719739/us-gaap/HeldToMaturitySecuritiesAccumulatedUnrecognizedHoldingLoss.json
        verified: true
        note: "Supervisory findings were confidential at the time, so the 31 open findings appear only in the reveal. The Topic calls them 'open supervisory findings', not 'warnings'."
  - id: crisis-bank-runs
    title: "Bank runs and interest-rate risk in banks"
    stage: foundation
    subject: "Banks, crises & the system"
    prerequisites: [bank-regulation, bond-duration]
    cases:
      - title: "Silicon Valley Bank on 8 March 2023"
        asOf: 2023-03-08
        outcome: "Uninsured depositors read the 8 Mar announcement as a sign of distress. On 9 Mar SVB lost over $40bn of deposits in a day, and management told supervisors it expected to lose over $100bn more on 10 Mar, roughly 85% of its deposit base; for scale, Wachovia lost about $10bn over eight days in 2008 and Washington Mutual $19bn over 16 days. SVB did not have enough cash or collateral to meet the outflows and had not tested its ability to borrow at the Fed's discount window in 2022. The California regulator closed the bank on the morning of 10 Mar 2023 and appointed the FDIC as receiver."
        sources:
          - https://www.federalreserve.gov/publications/files/svb-review-20230428.pdf
          - https://www.federalreserve.gov/newsevents/pressreleases/bcreg20230428a.htm
          - https://data.sec.gov/api/xbrl/companyconcept/CIK0000719739/us-gaap/HeldToMaturitySecurities.json
        verified: true
  - id: struct-securitisation
    title: "Securitisation, MBS and CDOs"
    stage: foundation
    subject: "Banks, crises & the system"
    prerequisites: [bond-credit-spreads, bank-regulation]
    cases:
      - title: "From a subprime loan to a AAA tranche"
        asOf: 2006-12-31
        outcome: "The Philadelphia Fed counted 727 publicly traded structured-finance CDOs issued between 1999 and 2007, worth $641bn, and estimated write-downs of $420bn, 65% of the issuance; $64bn of BBB-rated subprime bonds became $140bn of CDO collateral. A-rated subprime bonds had on average only 8% of subordination, so subprime losses of 8% would wipe out the BBB layer; with consensus losses of 3-5% in early 2007, losses needed to reach only about 1.5 to 2.5 times the expected level for mezzanine CDOs to become worthless, against 5 to 8 times for AAA subprime bonds to lose anything. The senior CDO layers' ratings assumed the BBB bonds would not all go wrong at once; they all depended on US house prices. The FCIC published its report on 27 Jan 2011."
        sources:
          - https://www.philadelphiafed.org/-/media/frbp/assets/working-papers/2011/wp11-30R.pdf
          - https://govinfo.gov/content/pkg/GPO-FCIC/pdf/GPO-FCIC.pdf
        verified: true
        note: "The four-tranche pool in the story is an illustration, labelled hypothetical; the real figures are the Philadelphia Fed's. The FCIC's rating counts (such as 45,000 AAA ratings) and '83% downgraded' were left out as unchecked."
  - id: private-credit
    title: "Shadow banks, private credit and SPVs"
    stage: foundation
    subject: "Banks, crises & the system"
    prerequisites: [struct-securitisation, credit-analysis]
    cases:
      - title: "IL&FS and the mutual funds that held its debt"
        asOf: 2018-09-12
        outcome: "In Sep 2018 mutual fund industry assets fell 12.5%, to Rs 22 lakh crore from Rs 25.2 lakh crore, with a net outflow of Rs 2.3 lakh crore (liquid funds Rs 2.1 lakh crore, income funds Rs 30,504 crore). Not all of it was fear (advance tax and GST payments, one large SBI redemption), but fund officials said the IL&FS default led to redemptions. The Rs 2,800 crore of IL&FS paper was only about 0.11% of industry assets. On 1 Oct 2018 the government asked the NCLT to replace IL&FS's board, saying the defaults caused 'redemption pressure on the mutual funds', quality papers sold at steep discounts and a sell-off in non-bank lenders' shares."
        sources:
          - https://www.thehindubusinessline.com/markets/investors-jittery-over-2800-crore-mutual-fund-investments-in-ilfs/article24937207.ece
          - https://timesofindia.indiatimes.com/business/india-business/ilfs-default-tax-dues-suck-rs-2-3l-cr-out-of-mfs-in-sept/articleshow/66126785.cms
          - https://pib.gov.in/PressReleasePage.aspx?PRID=1548093&lang=2&reg=3
        verified: true
  - id: funds-passive
    title: "Mutual funds, ETFs and passive investing (incl. India AIFs)"
    stage: foundation
    subject: "Markets & investing"
    prerequisites: [risk-portfolio, mkt-efficiency]
    cases:
      - title: "Warren Buffett bets an index fund against hedge funds"
        asOf: 2007-12-19
        outcome: "Berkshire's 2017 letter gives the result. Over the ten years the index fund gained 125.8% (8.5% a year); the five funds of funds gained 21.7, 42.3, 87.7, 2.8 and 27.0% (2.0, 3.6, 6.5, 0.3 and 2.4% a year), an average of about 36% (own arithmetic from the letter's table). Each beat the index fund in 2008 (it fell 37%, they fell 16.5% to 30.1%), but the average of the five trailed it in each of the next nine years. Buffett puts the fixed fees at about 2.5% of assets a year. In 2012 the two sides had swapped the bonds for Berkshire B shares, and the charity, Girls Inc. of Omaha, received $2,222,279."
        sources:
          - https://www.berkshirehathaway.com/letters/2017ltr.pdf
          - https://longbets.org/362/
        verified: true
        note: "Replaces the earlier candidate (IL&FS paper in mutual funds), which was a credit event, not a passive-versus-active Case. Berkshire's site bars reproduction, so only the letter's figures are used, with credit."
  - id: ins-risk-transfer
    title: "Insurance and risk transfer"
    stage: foundation
    subject: "Banks, crises & the system"
    prerequisites: [fs-balance, num-probability]
    cases:
      - title: "AIG and the credit protection it sold"
        asOf: 2008-09-12
        outcome: "On Monday 15 Sep 2008 all three rating agencies cut AIG (to A- at S&P, A2 at Moody's, A at Fitch). Collateral calls on the multi-sector swaps jumped by $8.6bn in a day, to $32.0bn, and the gap between calls and what AIG had posted peaked at $12.4bn. On 16 Sep the Fed authorised the New York Fed to lend AIG up to $85bn in return for a 79.9% equity interest held for the Treasury; the US government's total commitment later came to $182.3bn. AIG lost $99.3bn in 2008. By Dec 2012 the Treasury and the Fed had recovered the whole $182.3bn plus an additional $22.7bn, so taxpayers ended with a profit."
        sources:
          - https://www.chicagofed.org/-/media/publications/working-papers/2014/wp2014-07-pdf.pdf
          - https://www.newyorkfed.org/aboutthefed/aig
          - https://home.treasury.gov/news/press-releases/tg1805
        verified: true
        note: "Added to cover insurance, a gap in the first draft."
  - id: real-assets
    title: "Real estate and commodities"
    stage: foundation
    subject: "Markets & investing"
    prerequisites: [present-value, eq-markets]
    cases:
      - title: "Seven years of rising US house prices"
        asOf: 2006-12-31
        outcome: "The FHFA purchase-only index (Jan 1991 = 100) peaked in April 2007 at 224.47, only about 0.8% above its Dec 2006 level of 222.68, then fell for four years to 176.67 in May 2011, 21.3% below the peak though still above its Jan 2000 level of 136.89; it was 199.86 in Dec 2013. With 3% down, a fall of just 3% in the house price wipes out the buyer's deposit, and a fall of 21% leaves the loan larger than the house."
        sources:
          - https://www.fhfa.gov/hpi/download/monthly/hpi_master.csv
          - https://oyc.yale.edu/economics/econ-251/lecture-1
        verified: true
        note: "FHFA revises the series, so the Topic uses the 2026 vintage of the data and says so."
  - id: hist-macro-regimes
    title: "Inflation regimes and stagflation"
    stage: foundation
    subject: "Economics & policy"
    prerequisites: [eco-inflation-real, eco-fiscal-debt]
    cases:
      - title: "The Saturday meeting of 6 October 1979"
        asOf: 1979-10-06
        outcome: "The funds rate, which averaged 13.77% in Oct 1979, climbed to 17.19% in Mar 1980 and 19.10% in Jun 1981, the highest monthly average in the data shown (the Fed History essay says it reached a record of about 20% in late 1980). The 10-year Treasury yield rose from 10.30% in Oct 1979 to 15.32% in Sep 1981. Inflation first rose further, peaking at 11.6% in Mar 1980. The economy fell into recession from Jul 1981 to Nov 1982 and unemployment reached 10.8% in late 1982; by Oct 1982 inflation had fallen to about 5%, and the funds rate was 12.37% in Dec 1981 and 9.20% in Nov 1982."
        sources:
          - https://www.federalreservehistory.org/essays/anti-inflation-measures
          - https://www.federalreservehistory.org/essays/recession-of-1981-82
          - https://www.federalreserve.gov/releases/h15/
        verified: true
  - id: gov-ethics
    title: "Governance, ethics and fraud"
    stage: foundation
    subject: "Banks, crises & the system"
    prerequisites: [fs-earnings-quality, eq-markets]
    cases:
      - title: "A software company's board approves a deal with the chairman's family firms"
        asOf: 2008-12-16
        outcome: "Satyam's American shares fell $6.85, or 55%, to $5.70 on the NYSE that day, the biggest percentage fall on the exchange, and late the same day Satyam called the deal off. The board minutes reported a month later showed that the five independent directors had voiced concerns about the valuation, the related-party nature of the deal and the board being used as a 'rubber stamp', yet the resolution passed unanimously. On 7 Jan 2009 Raju wrote that Satyam's accounts had been inflated for years and that the Maytas deal was 'the last attempt to fill the fictitious assets with real ones'. The SEC later said the company had overstated cash and revenue by more than $1bn, and Satyam paid a $10m penalty."
        sources:
          - https://www.reuters.com/article/business/media-telecom/indias-satyam-to-acquire-stake-in-maytas-infra-idUSBMA002023/
          - https://www.reuters.com/article/marketsNews/idINN1628370020081216/
          - https://www.indiatoday.in/latest-headlines/story/satyam-calls-off-16-bn-maytas-deal-35355-2008-12-17
          - https://sec.gov/Archives/edgar/data/1106056/000114554909000025/u00107exv99w2.htm
          - https://www.sebi.gov.in/sebi_data/attachdocs/1441894262377.pdf
          - https://www.sec.gov/enforcement-litigation/litigation-releases/lr-21915
        verified: true
  - id: crisis-leverage
    title: "Leverage, liquidity spirals and systemic risk"
    stage: foundation
    subject: "Banks, crises & the system"
    prerequisites: [struct-securitisation, der-hedging, crisis-bank-runs]
    cases:
      - title: "The lenders to a heavily borrowed fund"
        asOf: 1998-09-01
        outcome: "In Aug 1998 the fund lost $1.8bn, bringing its loss of capital for the year to over 50% and its capital to $2.3bn. It told its investors on 2 Sep and began seeking new capital, but found selling hard while firms across the market were pulling back from risk. On 23 Sep 1998 fourteen banks and brokerage firms put up $3.625bn for 90% of the fund; the Fed arranged the meeting but lent nothing, worried that a fire sale by LTCM's many counterparties could harm the wider economy. The same chain ran on a far larger scale a decade later: the Philadelphia Fed counted 727 subprime-linked CDOs ($641bn issued) with $420bn of write-downs (65%), and in Mar 2008 the Fed lent to help JPMorgan Chase buy Bear Stearns."
        sources:
          - https://www.cftc.gov/sites/default/files/tm/tmhedgefundreport.htm
          - https://www.federalreservehistory.org/essays/ltcm-near-failure
          - https://www.philadelphiafed.org/-/media/frbp/assets/working-papers/2011/wp11-30R.pdf
          - https://fcic-static.law.stanford.edu/cdn_media/fcic-docs/2009-12-28%20FRB%20Report%20on%20Acquisition%20of%20Bear%20Stearns%20by%20JPMorgan.pdf
        verified: true
  - id: fol-uber-2014
    title: "Follow: Damodaran, crowd valuation of Uber (Dec 2014)"
    stage: follow
    prerequisites: [val-young]
    cases:
      - title: "Damodaran hands readers the controls of an Uber valuation"
        asOf: 2014-12-02
        outcome: "Uber priced its IPO at $45 on 9 May 2019, near the bottom of its range, valuing it at about $82.4bn fully diluted and raising $8.1bn; its last private round, in Aug 2018, had valued it at $76bn. On its first day the stock closed at $41.57, about 7.6% below the offer price, and Uber had lost about $3bn from operations in 2018. Against the post, whose grid of reader stories ran from under $1bn to about $90bn, the listing landed inside the range, near the upper end. Which story was right remains a judgement; the post's point was that gaps between values are gaps between stories."
        sources:
          - https://aswathdamodaran.blogspot.com/2014/12/up-up-and-away-crowd-valuation-of-uber.html
          - https://www.nytimes.com/2019/05/09/technology/uber-ipo-stock-price.html
          - https://theguardian.com/business/2019/may/09/uber-value-wall-street-ipo-friday
        verified: true
  - id: fol-twitter-ipo
    title: "Follow: Damodaran, Twitter IPO valuation (Oct 2013)"
    stage: follow
    prerequisites: [val-young, mkt-ipo-float]
    cases:
      - title: "Damodaran explains why an IPO is a pricing event, not a valuation event"
        asOf: 2013-10-28
        outcome: "Twitter priced its offering at $26 on 6 Nov 2013, well above the $17-20 range, raising about $1.8bn and valuing the company at over $18bn; Reuters reported subscriptions of about 30 times the shares on offer. On 7 Nov the shares opened near $45, reached $50 and closed at $44.90, up 73% on the offer price, a market value of about $25bn. They peaked above $73 around the end of Dec 2013, closed at exactly $26 on 20 Aug 2015, the first time they fell to the offer price, and Twitter was taken private at $54.20 a share, about $44bn, in a deal that closed on 27 Oct 2022. Against the post: his $17.84 was about 31% below the offer price and the close about 2.5 times his value; his guess that bankers saw a fair price near $25 was close to the $26 they set, but his first-day jump of 20-25% fell far short of 73%."
        sources:
          - https://aswathdamodaran.blogspot.com/2013/10/the-twitter-ipo-thoughts-on-ipo-end-game.html
          - https://www.npr.org/sections/thetwo-way/2013/11/06/243583735/twitter-sets-ipo-price-hopes-to-raise-1-8-billion
          - https://www.reuters.com/article/technology/twitter-shares-soar-in-frenzied-nyse-debut-idUSBRE99N1AE/
          - https://wired.com/2015/08/twitter-stock-falls-ipo-price-first-time
          - https://www.bloomberg.com/news/articles/2022-10-28/musk-completes-44-billion-twitter-deal-ending-months-of-enmity
        verified: true
        note: "The December 2013 peak above $73 and the $54.20 take-private price come from press reports, not filings."
  - id: fol-tesla-2020
    title: "Follow: Damodaran, Tesla valuation (Feb 2020)"
    stage: follow
    prerequisites: [val-young]
    cases:
      - title: "Damodaran lets readers choose their own Tesla story"
        asOf: 2020-02-06
        outcome: "Tesla split its shares 5-for-1 (Aug 2020) and 3-for-1 (Aug 2022), so one February 2020 share became 15 and Damodaran's $427 is about $28.47 on today's basis. On 25 Oct 2021, after Hertz announced an order for 100,000 cars, Tesla closed at a record $1,024.86, a market value just over $1tn (about $341.62 on the basis after both splits). The stock then lost about 65% in 2022 and closed the year at $123.18 after losing more than $700bn of market value, still about four times his $427 on the same basis. The post's four stories ran from about $106 to $2,106 a share before the splits; a value follows from a story you can name, and a price can sit far from a value for years in either direction."
        sources:
          - https://aswathdamodaran.blogspot.com/2020/02/a-do-it-yourself-diy-valuation-of-tesla.html
          - https://cnbc.com/2022/08/24/tesla-stock-set-for-3-for-1-split-after-market-close.html
          - https://www.reuters.com/business/autos-transportation/tesla-shares-limelight-3-1-stock-split-kicks-2022-08-25/
          - https://www.nytimes.com/2021/10/25/business/hertz-tesla-electric-vehicles.html
          - https://www.wsj.com/articles/tesla-stock-is-headed-for-its-biggest-ever-annual-decline-11672374248
        verified: true
  - id: fol-roe
    title: "Follow: Damodaran, ROE, earnings yield and efficiency (Feb 2025)"
    stage: follow
    prerequisites: [val-multiples, fs-ratios]
    cases:
      - title: "Damodaran goes back to basics on return on equity"
        asOf: 2025-02-18
        outcome: "Damodaran returned to the same ground in a post on 6 Oct 2025 about US stocks: the earnings yield was 4% in Sep 2025, 0.16 percentage points below the ten-year Treasury rate, a gap some analysts treat as a sign that stocks are overpriced. He replied that comparing an earnings yield with a bond rate treats shares as bonds and ignores growth and reinvestment, and noted the gap's spotty record as a timing tool. What the Feb 2025 post settled is a definition, not a forecast: return on equity is profit over the book value of equity and measures the quality of a business, while the earnings yield is profit over market value and is a pricing ratio. In its toy case two companies earn 25% and 5% on book but the same 10% on price."
        sources:
          - https://aswathdamodaran.blogspot.com/2025/02/return-on-equity-earnings-yield-and.html
        verified: true
        note: "The 6 Oct 2025 follow-up post is cited by date; its URL was not kept."
  - id: fol-sov-ratings
    title: "Follow: Damodaran, sovereign ratings and default risk (Jun 2025)"
    stage: follow
    prerequisites: [sov-default-country-risk]
    cases:
      - title: "Damodaran on what a sovereign rating change does and does not change"
        asOf: 2025-06-02
        outcome: "Moody's cut the US from Aaa to Aa1 on 16 May 2025, and the post was written about the first two weeks. US Treasury par yields afterwards: the 10-year was 4.41% on 30 May 2025 and 4.46% on 2 Jun, reached its low for the year of 3.97% on 22 Oct and ended 2025 at 4.18%; the 30-year went from 4.92% to 4.84% and the 2-year from 3.89% to 3.47% over the same dates. Yields did not climb to a lasting higher level, which fits Damodaran's reading that the move was small, expected and mostly about pride. The data cannot prove it, since many other things moved yields through 2025."
        sources:
          - https://aswathdamodaran.blogspot.com/2025/06/sovereign-ratings-default-risk-and.html
          - https://www.reuters.com/markets/us/moodys-downgrades-us-aa1-rating-2025-05-16/
          - https://www.cnbc.com/2025/05/16/moodys-downgrades-united-states-credit-rating-on-increase-in-government-debt.html
          - https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2025/all?type=daily_treasury_yield_curve&field_tdr_date_value=2025&page&_format=csv
        verified: true
  - id: fol-subprime-ai
    title: "Follow: Zitron, The Subprime AI Crisis (Sep 2024)"
    stage: follow
    prerequisites: [bond-credit-spreads, fs-revenue-runrate]
    cases:
      - title: "Zitron argues that cheap AI prices hide a funding problem"
        asOf: 2024-09-16
        outcome: "OpenAI closed $6.6bn on 2 Oct 2024 at a $157bn valuation, as convertible notes whose conversion depended on its restructuring into a for-profit company, and announced a $4bn bank credit line. On 31 Mar 2025 it announced $40bn at a $300bn valuation, with SoftBank's $30bn share paid in stages and cut to $20bn if the restructuring was not done by the end of 2025. On 10 Jun 2025 it cut the price of its o3 model by 80%, so the tenfold-to-hundredfold price rise the piece used as a hypothetical had not arrived. Unsettled: whether prices cover cost, because the cost side is not public; a falling price cannot tell competition from subsidy."
        sources:
          - https://www.wheresyoured.at/subprimeai/
          - https://www.nbcchicago.com/news/business/money-report/openai-closes-funding-at-157-billion-valuation-as-microsoft-nvidia-softbank-join-round/3563420/
          - https://www.reuters.com/technology/artificial-intelligence/openai-raise-40-billion-softbank-led-new-funding-2025-03-31/
        verified: true
        note: "The o3 price cut rests on VentureBeat and Neowin reports (URLs not kept); the piece's own as-of figures were not re-fetched."
  - id: fol-systemic-risk
    title: "Follow: Zitron, OpenAI Is A Systemic Risk (Apr 2025)"
    stage: follow
    prerequisites: [fs-leases-debt, fs-cashflow]
    cases:
      - title: "Zitron maps who depends on whom around one AI company"
        asOf: 2025-04-14
        outcome: "The funding condition the essay stressed was met: SoftBank said it completed a further $22.5bn on 26 Dec 2025, fully funding its commitment to OpenAI at $41bn including $11bn from other investors, for a stake of about 11%. OpenAI completed its conversion into a for-profit public benefit corporation on 28 Oct 2025, valued at $500bn, with Microsoft holding about 27%. The first Stargate site, in Abilene, Texas, was running on Oracle's cloud by Sep 2025. One link did break: CoreWeave's $9bn purchase of Core Scientific was voted down and ended on 30 Oct 2025, a failed deal rather than a failure to pay. The essay's other claims, such as OpenAI's revenue against its commitments and what a failure would do to its suppliers, were not tested by these events."
        sources:
          - https://www.wheresyoured.at/openai-is-a-systemic-risk-to-the-tech-industry-2/
          - https://group.softbank/en/news/press/20251231
