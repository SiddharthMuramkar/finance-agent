# The Course Map outline: every planned Topic, in default-path order (a Topic's place is its position here).
# Written Topics live in course/topics/<id>.yaml and take their Stage, place and prerequisites from this file.
# A Topic whose file does not exist yet is Coming. `verified: false` means the Case's facts must be checked before the Topic is written.
# docs/course-map.md is generated from this file (npm run course:doc); npm run course:check fails if it is stale.
topics:
  - id: num-percent-bps
    title: "Percent, percentage points and basis points"
    stage: foundation
    prerequisites: []
    cases:
      - title: "The Fed raises its target rate by 25 basis points"
        asOf: 1994-02-03
        outcome: "The 25 bp rise in the overnight rate triggered an immediate 40 bp rise in the 30-year rate; by early May, 75 bp of hikes and 140 bp on long bonds. The funds rate averaged 3.05% in Jan 1994 and 5.45% in Dec 1994."
        sources:
          - https://fortune.com/article/the-great-bond-massacre-fortune-1994
          - https://fred.stlouisfed.org/graph/fredgraph.csv?id=GS2,GS10,TB3MS,FEDFUNDS&cosd=1993-12-01&coed=1995-01-01
          - https://www.federalreserve.gov/econresdata/notes/feds-notes/2015/effects-of-fomc-communications-before-policy-tightening-in-1994-and-2004-20150924.html
        verified: true
  - id: num-compounding
    title: "Growth, compounding and logs"
    stage: foundation
    prerequisites: [num-percent-bps]
    cases:
      - title: "The Sensex from base 100 (1979) to 1992"
        asOf: 1992-03-31
        outcome: "Base 100 on 1 Apr 1979; 1,001 on 25 Jul 1990; 4,091 on 30 Mar 1992; 4,467 in Apr 1992, about 34% a year compound (own arithmetic). Then 1,980 by Apr 1993."
        sources:
          - https://en.wikipedia.org/wiki/BSE_SENSEX
          - https://www.rediff.com/business/special/spec1/20071009.htm?print=true
          - https://livemint.com/market/stock-market-news/bears-vs-bulls-harshad-mehta-scam-to-covid-19-top-7-biggest-stock-market-crashes-in-indias-financial-market-history-11740843716063.html
        verified: true
        note: "Secondary sources; fetch the BSE history before writing."
  - id: num-probability
    title: "Probability and expected value"
    stage: foundation
    prerequisites: [num-percent-bps]
    cases:
      - title: "Long-Term Capital Management, before the loss"
        asOf: 1998-08-01
        outcome: "About $30 of debt per $1 of capital at end-1997; lost half its capital by end Aug 1998; 14 firms put in $3.6bn for control on 23 Sep 1998. Teach leverage and loss, not the risk-model inputs (unverified)."
        sources:
          - https://www.federalreservehistory.org/essays/ltcm-near-failure
          - https://www.federalreserve.gov/boarddocs/testimony/1998/19981001.htm
          - https://www.cftc.gov/sites/default/files/tm/tmhedgefundreport.htm
        verified: true
  - id: present-value
    title: "Time value and present value"
    stage: foundation
    prerequisites: [num-compounding]
    cases:
      - title: "The $1.537 billion Mega Millions jackpot"
        asOf: 2018-10-24
        outcome: "The winner took the $877,784,124 cash option on 4 Mar 2019, roughly the present value of the 30-payment annuity. Written Topic."
        sources:
          - https://www.megamillions.com/
          - https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve
        verified: true
      - title: "Webvan's first-day value"
        asOf: 1999-11-05
        outcome: "IPO at $15 raised $375m; first-day close $24.875, market value $7.9bn (not $11bn). Chapter 11 filed 9 Jul 2001; shares half a cent on 10 Jul 2001."
        sources:
          - https://www.nytimes.com/1999/11/06/business/webvan-stock-price-closes-65-above-initial-offering.html
          - https://latimes.com/archives/la-xpm-2001-jul-10-mn-20432-story.html
          - https://www.nytimes.com/2001/07/09/technology/online-grocer-webvan-to-file-for-chapter-11.html
        verified: true
  - id: fs-income
    title: "The income statement"
    stage: foundation
    prerequisites: [num-percent-bps]
    cases:
      - title: "WeWork's S-1"
        asOf: 2019-08-14
        outcome: "H1 2019 revenue $1.54bn, net loss over $900m. IPO withdrawn Sep 2019; Chapter 11 on 6 Nov 2023."
        sources:
          - https://www.cnbc.com/2019/08/14/wework-releases-s-1-filing-for-ipo.html
          - https://www.forbes.com/sites/samanthasharf/2019/08/14/wework-ipo-sec-s1/
          - https://bloomberg.com/news/articles/2023-11-07/wework-goes-bankrupt-capping-co-working-company-s-downfall
        verified: true
  - id: fs-balance
    title: "The balance sheet"
    stage: foundation
    prerequisites: [fs-income]
    cases:
      - title: "Satyam's balance sheet"
        asOf: 2008-09-30
        outcome: "Reported cash inflated by Rs 5,040 crore; the chairman's confession on 7 Jan 2009 admitted it."
        sources:
          - https://sec.gov/Archives/edgar/data/1106056/000114554909000025/u00107exv99w2.htm
          - https://www.sec.gov/enforcement-litigation/litigation-releases/lr-21915
        verified: true
  - id: fs-cashflow
    title: "The cash flow statement"
    stage: foundation
    prerequisites: [fs-balance]
    cases:
      - title: "Webvan's cash burn"
        asOf: 2001-03-31
        outcome: "Burned about $480m by Mar 2001 (Time); lost more than $800m since Dec 1996; shut down Jul 2001. The draft's 'raised $1.2bn' is unconfirmed."
        sources:
          - https://time.com/archive/6904080/webvans-last-desperate-hope
          - https://latimes.com/archives/la-xpm-2001-jul-10-mn-20432-story.html
          - https://www.nytimes.com/2001/07/09/technology/online-grocer-webvan-to-file-for-chapter-11.html
        verified: true
  - id: fs-links
    title: "How the three statements link (accrual accounting)"
    stage: foundation
    prerequisites: [fs-cashflow]
    cases:
      - title: "Satyam's forged invoices and bank statements"
        asOf: 2008-12-31
        outcome: "Over 6,000 fake invoices and forged bank statements ran through all three statements; the SEC settled an action in 2011 with a $10m penalty."
        sources:
          - https://www.sec.gov/enforcement-litigation/litigation-releases/lr-21915
          - https://sec.gov/Archives/edgar/data/1106056/000114554909000025/u00107exv99w2.htm
          - https://www.sebi.gov.in/sebi_data/attachdocs/1441894262377.pdf
        verified: true
  - id: fs-ratios
    title: "Ratios, return on equity and DuPont"
    stage: foundation
    prerequisites: [fs-links]
    cases:
      - title: "Coffee Day Enterprises at its IPO"
        asOf: 2015-10-07
        outcome: "Net loss widened from Rs 21 crore (FY13) to Rs 87 crore (FY15); IPO at 21 to 21.5 times EV/EBITDA; founder died Jul 2019 under lender pressure."
        sources:
          - https://www.business-standard.com/article/markets/coffee-day-makes-tamest-debut-in-three-years-115110201108_1.html
          - https://www.businesstoday.in/markets/stocks/story/coffee-day-enterprises-fixes-rs-316-328-price-band-for-ipo-57513-2015-10-07
          - https://www.businesstoday.in/markets/company-stock/story/cafe-coffee-day-stock-falls-20-to-hit-historic-low-after-death-of-founder-vg-siddhartha-215792-2019-07-31
        verified: false
        note: "Press level only; the DuPont inputs need the prospectus from SEBI/BSE."
  - id: fs-revenue-runrate
    title: "Revenue recognition, run rates, gross vs net"
    stage: foundation
    prerequisites: [fs-links]
    cases:
      - title: "WeWork's run-rate boast"
        asOf: 2019-08-14
        outcome: "The S-1 said run-rate revenue reached $3bn in six months; first-half revenue was $1.54bn with a $905m loss."
        sources:
          - https://www.cnbc.com/2019/08/14/wework-releases-s-1-filing-for-ipo.html
          - https://www.forbes.com/sites/samanthasharf/2019/08/14/wework-ipo-sec-s1/
        verified: true
  - id: fs-capex-dep
    title: "Capex, depreciation, amortisation and EBITDA"
    stage: foundation
    prerequisites: [fs-links]
    cases:
      - title: "Webvan's warehouse and fleet build-out"
        asOf: 1999-11-05
        outcome: "Planned 26 distribution centres, ran seven markets; $143 spent per $100 of food sold; closed Jul 2001."
        sources:
          - https://www.sfgate.com/food/article/rise-fall-bay-area-startup-webvan-19829522.php
          - https://time.com/archive/6904080/webvans-last-desperate-hope
          - https://latimes.com/archives/la-xpm-2001-jul-10-mn-20432-story.html
        verified: false
        note: "Press scale facts only; asset-level 10-K figures not fetched."
  - id: fs-leases-debt
    title: "Leases, commitments and debt-like items"
    stage: foundation
    prerequisites: [fs-links, present-value]
    cases:
      - title: "WeWork's lease obligations"
        asOf: 2019-06-30
        outcome: "Long-term lease obligations of about $17bn in the S-1; $19bn liabilities in the Nov 2023 filing; leases rejected in restructuring."
        sources:
          - https://www.cnbc.com/2019/08/14/wework-releases-s-1-filing-for-ipo.html
          - https://bloomberg.com/news/articles/2023-11-07/wework-goes-bankrupt-capping-co-working-company-s-downfall
          - https://straitstimes.com/business/wework-cleared-to-exit-bankruptcy-shedding-adam-neumann-legacy
        verified: true
  - id: fs-filings
    title: "Reading filings: S-1, 10-K, Indian annual report and Ind AS"
    stage: foundation
    prerequisites: [fs-ratios]
    cases:
      - title: "WeWork's governance clause"
        asOf: 2019-08-14
        outcome: "The S-1 gave the CEO profits interests at a $90bn cap; the IPO was pulled."
        sources:
          - https://fortune.com/2019/08/15/wework-ipo-stock-valuation-softbank-ge-rebekah-neumann
          - https://www.cnbc.com/2019/08/14/wework-releases-s-1-filing-for-ipo.html
        verified: true
      - title: "Coffee Day's IPO prospectus (an Indian DRHP)"
        asOf: 2015-10-07
        outcome: "Filed with SEBI for Rs 1,150 crore, band Rs 316-328, priced Rs 328 on 21 Oct 2015, subscribed 1.81 times; listed below issue price."
        sources:
          - https://www.business-standard.com/article/markets/coffee-day-prices-ipo-at-upper-end-of-range-115102101210_1.html
          - https://timesofindia.indiatimes.com/business/india-business/cold-debut-for-ccd-stock-plunges-18/articleshow/49637562.cms
        verified: false
        note: "Fetch the prospectus from SEBI before writing."
  - id: fs-earnings-quality
    title: "Earnings quality and accounting fraud"
    stage: foundation
    prerequisites: [fs-ratios, fs-capex-dep]
    cases:
      - title: "Satyam, the day before the confession"
        asOf: 2009-01-06
        outcome: "Raju's letter of 7 Jan 2009 admitted inflated profits and cash; SEC order followed."
        sources:
          - https://sec.gov/Archives/edgar/data/1106056/000114554909000025/u00107exv99w2.htm
          - https://www.sec.gov/enforcement-litigation/litigation-releases/lr-21915
        verified: true
  - id: fs-tax
    title: "Corporate tax and after-tax cash flows"
    stage: foundation
    prerequisites: [fs-links]
    cases:
      - title: "India cuts corporate tax to 22%"
        asOf: 2019-09-19
        outcome: "Announced 20 Sep 2019: base rate 30% to 22% (effective 34.94% to 25.17%), 15% for new manufacturers; Rs 1.45 lakh crore revenue foregone; the Sensex had its biggest single-day gain in a decade."
        sources:
          - https://www.dnaindia.com/business/report-finance-minister-nirmala-sitharaman-announces-corporate-tax-cut-to-spur-growth-2791283
          - https://cio.economictimes.indiatimes.com/news/government-policy/sitharamans-tax-cut-move-why-it-matters-so-much-for-india-inc-economy-and-modi-govt/71229310
        verified: true
        note: "Added in this outline to cover tax, a gap in the first draft."
  - id: num-statistics
    title: "Statistics: mean, variance, correlation, regression"
    stage: foundation
    prerequisites: [num-probability]
    cases:
      - title: "The 1987 crash"
        asOf: 1987-10-16
        outcome: "On 19 Oct 1987 the S&P 500 fell about 20% and S&P futures 29%; a tail event far outside normal-distribution odds."
        sources:
          - https://www.federalreserve.gov/pubs/feds/2007/200713/
          - https://time.com/archive/6711376/the-culprits-behind-the-crash
        verified: true
  - id: eco-supply-demand
    title: "Supply, demand and prices"
    stage: foundation
    prerequisites: [num-percent-bps]
    cases:
      - title: "Indian onion price shocks"
        asOf: 2019-09-01
        outcome: "An RBI working paper (Aug 2024) says tomato, onion and potato prices drive volatility of Indian food inflation."
        sources:
          - https://rbidocs.rbi.org.in/rdocs/Publications/PDFs/08WPS031020249D7A858AE5674ACF934C3EB9865794A2.PDF
        verified: false
        note: "No dated price move extracted yet; pick one from the paper before writing."
  - id: eco-micro-competition
    title: "Competition, market structure and pricing power"
    stage: foundation
    prerequisites: [eco-supply-demand]
    cases:
      - title: "Reliance Jio's free launch"
        asOf: 2016-09-01
        outcome: "Announced 1 Sep 2016: free voice and cheap data. Airtel and Idea shares fell up to 9% that day; a price war followed in a market with over $50bn of telecom debt."
        sources:
          - https://bbc.com/news/business-37273073
          - https://timesofindia.indiatimes.com/business/india-business/idea-airtel-shares-tank-on-rel-jios-lower-tariff-offers/articleshow/53958653.cms
          - https://www.theguardian.com/world/2016/sep/05/reliance-jio-launches-cheap-4g-services-in-india
        verified: true
        note: "Added to cover the economics of firms; later consolidation not yet sourced."
  - id: eco-money-banking
    title: "Money, banks and credit creation"
    stage: foundation
    prerequisites: [fs-balance, eco-supply-demand]
    cases:
      - title: "The 1992 securities scam"
        asOf: 1992-02-01
        outcome: "Ready-forward deals and fake bank receipts moved bank money into shares. Fraud size disputed: about Rs 1,000 crore siphoned (Forbes India) to over Rs 4,000 crore (Mint). Mehta arrested 9 Nov 1992."
        sources:
          - https://www.indiatoday.in/business/story/harshad-mehta-securities-scam-india-legacy-of-bank-fraud-1733374-2020-10-20
          - https://www.moneycontrol.com/news/business/markets/harshad-mehta-scam-10-key-points-of-the-scam-that-jolted-india-in-1992-5939931.html
          - https://www.forbesindia.com/article/independence-day-special/economic-milestone-stock-market-scam-(1992)/38457/1
          - https://livemint.com/market/stock-market-news/bears-vs-bulls-harshad-mehta-scam-to-covid-19-top-7-biggest-stock-market-crashes-in-indias-financial-market-history-11740843716063.html
        verified: true
  - id: eco-central-banks
    title: "Central banks and monetary policy"
    stage: foundation
    prerequisites: [eco-money-banking]
    cases:
      - title: "The 1994 Fed tightening"
        asOf: 1994-02-03
        outcome: "Little prior guidance; markets surprised, bond funds saw outflows; funds rate rose to 5.45% by Dec 1994."
        sources:
          - https://www.federalreserve.gov/econresdata/notes/feds-notes/2015/effects-of-fomc-communications-before-policy-tightening-in-1994-and-2004-20150924.html
          - https://www.federalreserve.gov/monetarypolicy/files/fomc19940706bluebook19940630.pdf
          - https://fred.stlouisfed.org/graph/fredgraph.csv?id=GS2,GS10,TB3MS,FEDFUNDS&cosd=1993-12-01&coed=1995-01-01
        verified: true
  - id: eco-inflation-real
    title: "Inflation, nominal vs real rates"
    stage: foundation
    prerequisites: [eco-central-banks, num-compounding]
    cases:
      - title: "India's near double-digit inflation"
        asOf: 2013-12-31
        outcome: "CPI inflation near 10% in Dec 2013, 8.0% excluding food and fuel; the RBI tightened under Rajan."
        sources:
          - https://rbi.org.in/Scripts/PublicationsView.aspx?id=15709
          - https://bis.org/review/r160905b.htm
        verified: true
  - id: eco-gdp-cycles
    title: "GDP, growth and business cycles"
    stage: foundation
    prerequisites: [eco-supply-demand]
    cases:
      - title: "India before the 1991 crisis"
        asOf: 1990-06-30
        outcome: "Growth of 7.6% a year for the three years to 1990-91, fiscally fuelled; external payments crisis in July 1991."
        sources:
          - http://rbidocs.rbi.org.in/rdocs/content/PDFs/Chapter11_04122018.pdf
        verified: true
  - id: eco-fiscal-debt
    title: "Fiscal policy and government debt"
    stage: foundation
    prerequisites: [eco-gdp-cycles]
    cases:
      - title: "The UK mini-budget and gilt crisis"
        asOf: 2022-09-23
        outcome: "Pound fell to $1.03; the Bank of England bought up to 65bn pounds of gilts from 28 Sep 2022 to stop pension-fund LDI selling. A credibility and leverage Case."
        sources:
          - https://theguardian.com/business/2022/sep/28/bank-of-england-in-65bn-scramble-to-avert-financial-crisis
          - https://www.cnbc.com/2022/09/29/pension-fund-panic-led-to-bank-of-englands-emergency-intervention.html
        verified: true
      - title: "India's fiscal expansion before 1991"
        asOf: 1991-03-31
        outcome: "Fiscal expansion in 1990-91 ended in the July 1991 payments crisis and IMF support."
        sources:
          - http://rbidocs.rbi.org.in/rdocs/content/PDFs/Chapter11_04122018.pdf
          - http://rbidocs.rbi.org.in/rdocs/content/PDFs/Chapter12_04122018.pdf
        verified: true
  - id: num-econometrics
    title: "Reading empirical claims: causation, data and spreadsheet errors"
    stage: foundation
    prerequisites: [num-statistics, eco-fiscal-debt]
    cases:
      - title: "Reinhart and Rogoff's 90% debt threshold"
        asOf: 2010-05-01
        outcome: "Published 2010; in Apr 2013 Herndon, Ash and Pollin found an omitted-rows spreadsheet error, selective exclusions and odd weighting; growth above 90% debt was about 2.2%, not -0.1%. Reinhart and Rogoff admitted the slip."
        sources:
          - https://www.cnbc.com/2013/04/17/reinhartrogoff-error-sparks-austerity-debate.html
          - https://www.theatlantic.com/business/archive/2013/04/forget-excel-this-was-reinhart-and-rogoffs-biggest-mistake/275088/
          - https://www.bloomberg.com/news/articles/2013-04-17/7-data-disasters-more-embarrassing-than-reinhart-and-rogoff-s
        verified: true
        note: "Added to cover econometrics beyond basics."
  - id: in-rbi-policy
    title: "India: RBI, repo rate, liquidity and inflation targeting"
    stage: foundation
    prerequisites: [eco-central-banks, eco-inflation-real]
    cases:
      - title: "The RBI's package of 4 September 2013"
        asOf: 2013-09-03
        outcome: "The FCNR(B) swap window drew in dollars; the rupee stabilised and forward cover became cheap."
        sources:
          - https://bis.org/review/r160905b.htm
          - https://rbidocs.rbi.org.in/rdocs/PressRelease/PDFs/IEPR1294FSR1213.pdf
        verified: true
  - id: bond-pricing
    title: "Bond basics and pricing"
    stage: foundation
    prerequisites: [present-value, eco-inflation-real]
    cases:
      - title: "The 1994 bond sell-off"
        asOf: 1994-01-31
        outcome: "10-year yield (monthly average) 5.75% in Jan 1994 to 7.96% in Nov 1994, up 221 bp; use a price calculation as the exercise."
        sources:
          - https://fred.stlouisfed.org/graph/fredgraph.csv?id=GS10&cosd=1993-10-01&coed=1995-02-01
          - https://www.federalreserve.gov/monetarypolicy/files/fomc19940706bluebook19940630.pdf
          - https://fortune.com/article/the-great-bond-massacre-fortune-1994
        verified: true
  - id: bond-yield
    title: "Yield to maturity, coupon and current yield"
    stage: foundation
    prerequisites: [bond-pricing]
    cases:
      - title: "Orange County's leveraged pool"
        asOf: 1994-06-30
        outcome: "A $20.6bn leveraged portfolio lost about $1.5bn (not $1.7bn); Chapter 9 petition on 6 Dec 1994."
        sources:
          - https://sec.gov/files/litigation/admin/3436761.txt
          - https://sec.gov/files/litigation/litreleases/lr15160.txt
        verified: true
  - id: bond-yield-curve
    title: "Yield curve and term structure"
    stage: foundation
    prerequisites: [bond-yield]
    cases:
      - title: "The 1994 curve flattening"
        asOf: 1994-02-03
        outcome: "Two-year yield 4.14% (Jan) to 7.59% (Dec 1994); the 10s-2s gap shrank from 1.61 to 0.22 percentage points."
        sources:
          - https://fred.stlouisfed.org/graph/fredgraph.csv?id=GS2,GS10,TB3MS,FEDFUNDS&cosd=1993-12-01&coed=1995-01-01
          - https://fred.stlouisfed.org/graph/fredgraph.csv?id=GS10&cosd=1993-10-01&coed=1995-02-01
        verified: true
  - id: bond-duration
    title: "Duration and convexity"
    stage: foundation
    prerequisites: [bond-yield]
    cases:
      - title: "Silicon Valley Bank's securities portfolio"
        asOf: 2022-12-31
        outcome: "Unrealised losses grew as rates rose; the bank failed on 10 Mar 2023."
        sources:
          - https://www.federalreserve.gov/publications/files/svb-review-20230428.pdf
          - https://www.federalreserve.gov/newsevents/pressreleases/bcreg20230428a.htm
        verified: true
  - id: bond-credit-spreads
    title: "Credit spreads, ratings and default"
    stage: foundation
    prerequisites: [bond-yield, fs-leases-debt]
    cases:
      - title: "LTCM's spread trades"
        asOf: 1998-08-01
        outcome: "Spread-convergence trades lost as spreads widened; private rescue by 14 firms on 23 Sep 1998."
        sources:
          - https://www.federalreservehistory.org/essays/ltcm-near-failure
          - https://www.cftc.gov/sites/default/files/tm/tmhedgefundreport.htm
        verified: true
  - id: in-gsec
    title: "India: G-secs, T-bills, SDLs and the corporate bond market"
    stage: foundation
    prerequisites: [bond-yield-curve, in-rbi-policy]
    cases:
      - title: "The securities scam's SGL fraud"
        asOf: 1992-04-01
        outcome: "Rs 500 crore missing from SBI's account at the RBI's public debt office exposed the scam in April 1992."
        sources:
          - https://www.indiatoday.in/business/story/harshad-mehta-securities-scam-india-legacy-of-bank-fraud-1733374-2020-10-20
          - https://www.moneycontrol.com/news/business/markets/harshad-mehta-scam-10-key-points-of-the-scam-that-jolted-india-in-1992-5939931.html
        verified: false
        note: "Draft source only; confirm the SGL detail in the Janakiraman report."
  - id: fx-basics
    title: "Exchange rates and parity"
    stage: foundation
    prerequisites: [eco-inflation-real]
    cases:
      - title: "The 1991 rupee devaluation"
        asOf: 1991-06-30
        outcome: "Two steps on 1 and 3 Jul 1991 (about 9% and 11%), about 18% cumulative in dollar terms (RBI); the IMF's 19% is the same event under other arithmetic."
        sources:
          - https://rbi.org.in/scriptS/chro_1991.aspx
          - https://rbi.org.in/history/Brief_Chro1991to2000.html
          - https://livemint.com/Money/08f2pqhy1c2Yh2OYTItwDL/Indias-tryst-with-currency-devaluation.html
          - http://www.elibrary.imf.org/display/book/9781557755391/ch03.xml
        verified: true
  - id: eco-trade
    title: "Trade and globalisation"
